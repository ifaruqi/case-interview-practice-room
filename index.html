extension of the building, which costs money but does not bring new customers. The operations manager says: drop a low-value activity instead and free the space. The board meets in two weeks. You are on the Inverto team. How would you help the managing director decide?","clarifying":[{"q":"How has service changed?","a":"On-time in-full orders fell from 98% to 91% in 12 months, while occupancy grew from 90% to 98%."},{"q":"At what occupancy did service work well?","a":"Up to about 85%. Above that, picking paths and dock slots get congested. Give this if asked."},{"q":"What are the four activities and their economics?","a":"Fast-moving consumer goods, electronics distribution, spare parts storage and returns and kitting. Numbers are in the exhibit when you ask for the activity data."},{"q":"What are the fixed costs?","a":"THB 80m a year: rent, depreciation, supervisors, systems and security. They do not change if one activity leaves. Give this if asked."},{"q":"How long can the client use the site?","a":"The land lease has 8 years left. Renewal is not certain. Give this if asked."},{"q":"Is there demand for new space?","a":"Sales has no firm requests at present. Give this if asked."},{"q":"How long does the extension take, and how fast could we drop spare parts?","a":"The extension takes about 12 months to build. The spare parts contract can end with six months' notice. (Give if asked.)"}],"structure":{"notes":"Good structure: first understand why service is slipping (occupancy), then options to get occupancy below 85% (build, free, optimise), then the economics of each, then risks and a decision. The key idea: compare the capex with the yearly margin lost, and use variable cost only.","branches":[{"name":"Diagnosis","points":["Occupancy vs service level","Which activities use the space","Margin earned per pallet position","Is the problem space or process"]},{"name":"Option 1: extend the building","points":["Capex and running cost","Time to build","No new revenue","Lease length and payback"]},{"name":"Option 2: free space by dropping an activity","points":["Which activity","Revenue and variable cost lost","Fixed cost stays","Customer and contract impact"]},{"name":"Other levers","points":["Stock clearance and slotting","Density and layout","Off-site overflow","Pricing and contract terms"]}]},"stages":[{"id":"s1","title":"Structure the problem","timer":"structure","minutes":5,"question":"How would you structure the work for the managing director?","notes":"Listen for: link between occupancy and service. Options: extend, free space, use space better. Economics based on contribution, not on allocated profit. A time frame. Give clarifying answers as asked. Do not hand over exhibits yet.","exhibits":[],"hints":["What is the cause of the late shipments?","Which ways exist to get the occupancy down?"],"solution":"I would do four blocks.\nOne. Diagnosis. Is the cause the occupancy? Which activities take the space, and how much money does each earn per pallet position?\nTwo. Option 1, build the extension. Capex, running cost, build time, and the lease length, because it brings no new revenue.\nThree. Option 2, free the space by dropping a low-value activity or customer. What is the profit effect? Only variable cost goes away, fixed cost stays.\nFour. Other ways to free space, and then the decision with risks.\nI would start with the activity data, because both options depend on it.","answers":{"standard":"Service is slipping because the warehouse is 98 percent full. So I would look at the cause, then the options to bring occupancy down: build more space, or free space by dropping an activity. For each I look at the money. I would start with the data on the four activities.","great":"First I confirm that occupancy causes the service problem, and find the level where service worked. Then I list the ways to free space: extend, drop a low-value activity, or use space better. I compare them by yearly profit effect and by cost, using the contribution of each activity and not allocated profit. I would add the lease length, since the extension brings no new revenue. I would start with the activity data, since both options need it.","best":"The question is how to get occupancy back to the level where service worked, at the lowest cost and risk. I would check the diagnosis first: service fell as occupancy rose from 90 to 98 percent, and I want to know the tipping point. Then three paths: build, free space, and use space better. For each I want the yearly profit effect and the payback, tested against the lease. The key is to compare on contribution per scarce pallet position and not on allocated profit. I also want to know if there is demand for new space, since an extension that brings no revenue has to earn its keep from avoided loss. I would ask for the activity data first."},"probes":[{"ask":"What would you check to be sure space is the cause of the service problem?","listen":"Service fell as occupancy rose; there is a level above which it gets crowded."},{"ask":"Why does the lease length matter?","listen":"The extension needs years to pay back, and the lease may end first."},{"ask":"What is the scarce thing in a warehouse?","listen":"Pallet positions: the space for storing pallets."},{"ask":"The MD says: build, it is the obvious answer. Respond.","listen":"They agree to test it: costs, payback, and the alternatives first."}]},{"id":"s2","title":"Which activity is low value?","timer":"math","minutes":10,"question":"Here are the four activities. Which one is the low-value one? Work out the numbers you need to say so, and tell me how you would rank them.","notes":"Compute revenue per position, contribution (revenue minus variable cost), and contribution per position. C spare parts: revenue per position THB 10,000, contribution per position THB 2,667. D returns and kitting has the lowest contribution margin at 25% but a high revenue per position (THB 20,000) and contribution per position of 5,000. Fixed cost THB 80m allocated by positions is THB 4,082 per position. Fully loaded, C shows a loss of 4.2 and D a profit of 1.8. Do not let the candidate conclude that C loses money: that is the allocation. Let them get to the next stage on their own. Total: positions 19,600, revenue 320, variable cost 204, contribution 116, fixed 80, EBIT 36.","exhibits":["e1"],"hints":["The scarce resource is pallet positions. What does each activity earn per position?","Contribution is revenue minus variable cost only."],"solution":"The scarce resource is pallet positions, so I compare earnings per position.\nTotals: 19,600 positions (98% of 20,000). Revenue 320. Variable cost 204. Contribution 116. Fixed cost 80. Operating profit = 36 THB million a year, 11% of revenue.\nPer activity (THB million, then per position):\nA FMCG: contribution 150 - 90 = 60. Per position: revenue 16,700, contribution 6,700.\nB Electronics: 100 - 62 = 38. Per position: revenue 17,900, contribution 6,800.\nC Spare parts: 30 - 22 = 8. Per position: revenue 10,000, contribution 2,700.\nD Returns and kitting: 40 - 30 = 10. Per position: revenue 20,000, contribution 5,000.\nC is lowest on both measures and uses 3,000 positions. D has the lowest margin, 25%, but earns well per position and uses only 2,000.\nFully loaded view: allocate THB 80m by positions, THB 4,082 per position. C gets 12.2 and shows a loss of 4.2. D shows 1.8. A and B show 23.3 and 15.1.\nBe careful with that last view. The fixed cost is allocated, not caused by C. C earns a positive contribution of 8.\nSo-what: C is the low-value activity, but not because it loses money. It earns the least per scarce position.","answers":{"standard":"The scarce thing is pallet positions, so I look at contribution per position. Contribution is revenue minus variable cost. Spare parts earn THB 2,700 per position, the lowest. The others earn 5,000 to 6,800. So spare parts is the low-value activity.","great":"I rank by contribution per position. Spare parts earns about THB 2,700, returns and kitting 5,000, FMCG 6,700 and electronics 6,800. Returns and kitting has the lowest margin in percent, 25, but a high revenue per position, so it is not the weakest. Spare parts is the weakest, and it uses 3,000 positions. If I allocate fixed cost of 80 million by position, spare parts shows a loss of 4.2 million, but that is only an allocation. It actually earns a positive 8 million.","best":"Spare parts is the low-value activity, because it earns the least per pallet position: about THB 2,700 against 5,000 to 6,800. It is not the one with the worst margin in percent, which is returns and kitting at 25 percent, but returns earn well per position. The loss that spare parts shows after allocated fixed cost is an accounting result. The fixed cost of THB 80 million does not go away if spare parts leaves. So I would not say it loses money. It earns 8 million, but uses space that is worth more elsewhere. I would check whether the 3,000 positions are really used by this customer all year, and whether the revenue is tied to other business."},"probes":[{"ask":"Why do you divide by pallet positions?","listen":"Space is the scarce resource; compare earnings per unit of space."},{"ask":"Which activity has the lowest margin in percent, and is it the one to drop?","listen":"Returns and kitting, 25 percent, but it earns 5,000 per position, so no."},{"ask":"Does spare parts lose money?","listen":"No. It earns a positive contribution of 8 million; the loss only appears after allocating fixed cost."},{"ask":"The finance team says: spare parts shows a loss of 4.2 million, drop it. Respond.","listen":"The fixed cost is allocated and stays if the activity leaves, so profit would fall."}]},{"id":"s3","title":"Profit effect of dropping spare parts","timer":"math","minutes":8,"question":"Suppose the client drops the spare parts activity. What happens to operating profit, and what happens to occupancy and service? Compare this with what the operations manager expects, who says profit goes up because the activity shows a loss.","notes":"Revenue falls by 30. Only variable cost falls: 22. Fixed cost stays at 80. Profit goes from 36 to 28, down 8. Wrong view: removing the allocated 12.2 of fixed cost gives 40.2 and an increase of 4.2. Occupancy: 16,600 / 20,000 = 83%, below 85%. Room to refill: 17,000 - 16,600 = 400 positions. Dropping D instead leaves 88% and still above 85%, and costs 10 of contribution.","exhibits":[],"hints":["Which costs go away when the activity leaves?","What is the new occupancy?"],"solution":"Only variable costs go away. Fixed costs stay: rent, depreciation, supervisors, systems.\nBefore: revenue 320, variable cost 204, fixed 80. Profit 36.\nAfter dropping C: revenue 320 - 30 = 290. Variable cost 204 - 22 = 182. Fixed cost 80.\nProfit = 290 - 182 - 80 = 28 THB million.\nProfit falls by 8 a year. That is exactly C's contribution. Margin goes from 11% to 10% (9.7%).\nThe operations manager is wrong. He removes the allocated fixed cost of 12.2 too and gets 40.2, an increase of 4.2. That fixed cost does not leave.\nOccupancy: 19,600 - 3,000 = 16,600 positions, 16,600 / 20,000 = 83%. That is below the 85% limit, so service should recover.\nDropping D instead leaves 17,600 positions, 88%. That is still above 85%, and it costs 10 a year. So C is the only single activity that does the job.\nSo-what: dropping C restores service and costs THB 8m of profit a year.","answers":{"standard":"If we drop spare parts, revenue falls by 30 and variable cost by 22. Fixed cost stays at 80. So profit falls by 8, from 36 to 28 million. Occupancy goes to 83 percent, below the 85 percent limit, so service should recover. The operations manager is wrong that profit rises.","great":"Only variable cost leaves. Revenue is down 30, variable cost down 22, fixed cost unchanged at 80. Profit falls from 36 to 28 million, a loss of 8, which is exactly spare parts' contribution. The manager removes the allocated fixed cost of 12.2 too and gets 40.2, but that cost does not go away. Occupancy goes from 98 to 83 percent, below the 85 percent limit. Dropping returns and kitting instead only gets to 88 percent, so spare parts is the only single activity that does the job.","best":"Dropping spare parts cuts profit by THB 8 million, from 36 to 28, because fixed cost stays. The manager's claim of a rise to 40 comes from also removing 12.2 of allocated fixed cost, which is not cash that leaves. Occupancy goes to 83 percent. I would check how much headroom that gives: the limit is 17,000 positions and we would be at 16,600, so only 400 positions to refill. This is a trade: 8 million a year for service recovery. I would ask what the service problem costs, such as lost customers and penalties, since that benefit is not in the 8 million. I would also check that no other activity depends on spare parts."},"probes":[{"ask":"Which costs go away when the activity leaves?","listen":"Only variable cost: 22 million. Fixed cost of 80 stays."},{"ask":"Why is the manager's number wrong?","listen":"He removes allocated fixed cost 12.2 which does not leave: gets 40.2 instead of 28."},{"ask":"What does dropping C do to service?","listen":"Occupancy goes to 83 percent, below the 85 percent limit."},{"ask":"Could we drop returns and kitting instead?","listen":"It gets only to 88 percent, still above 85, and costs 10 a year."},{"ask":"How much new business could we add after dropping C?","listen":"About 400 positions before we reach 85 percent again."}]},{"id":"s4","title":"Extension versus lost margin","timer":"exhibit","minutes":9,"question":"Now compare the two options side by side. What is the payback of the extension against the margin you lose by dropping the activity, and what does this mean given the lease?","notes":"Extension: capex THB 60m, running cost THB 2m a year, 3,500 positions added, occupancy 19,600 / 23,500 = 83.4%, no revenue. Drop C: no capex, lost margin 8 a year, occupancy 83.0%. Annual advantage of the extension: 8 - 2 = 6. Payback 60 / 6 = 10 years. Simple payback 60 / 8 = 7.5 years if the candidate ignores the running cost: accept it as a first cut, then add running cost. Lease: 8 years. Over 8 years: drop costs 64, the extension costs 60 + 16 = 76. The extension does not pay back within the lease. Ignore discounting, but mention it.","exhibits":["e2"],"hints":["What does the extension save you each year compared with dropping C?","Compare the payback with the 8 years left on the lease."],"solution":"Both options bring occupancy to about 83%. Neither adds revenue. So I compare cost.\nExtension: capex THB 60m once, plus THB 2m a year of running cost. Occupancy 19,600 / 23,500 = 83.4%.\nDrop C: no capex. Margin lost THB 8m a year. Occupancy 83.0%.\nThe extension saves THB 8m of lost margin a year, but costs THB 2m a year to run. Net advantage = 8 - 2 = THB 6m a year.\nPayback = 60 / 6 = 10 years. If I forget the running cost it is 60 / 8 = 7.5 years. Either way it is long.\nThe lease has 8 years left and renewal is not sure. Over 8 years, dropping C costs 8 x 8 = THB 64m. The extension costs 60 + 8 x 2 = THB 76m.\nSo the extension is THB 12m more expensive over the lease and has not paid back. I have ignored discounting, which makes the extension look even worse.\nSo-what: the extension only wins with a long lease and a plan to fill the new space. Today there is no demand for it. Dropping C is cheaper and can be reversed.","answers":{"standard":"Both options bring occupancy to about 83 percent. The extension costs THB 60 million plus 2 million a year to run. Dropping spare parts costs 8 million of margin a year. The extension saves 6 million a year net, so payback is 10 years. The lease has only 8 years, so the extension does not pay back.","great":"The extension saves 8 million of lost margin a year but costs 2 million a year to run, so a net 6 million. Payback is 60 over 6, which is 10 years. If I forget the running cost it is 7.5, but that is wrong. The lease has 8 years left, with renewal not certain. Over 8 years, dropping spare parts costs 64 million and the extension costs 60 plus 16, so 76. The extension is 12 million worse and has not paid back. I have ignored discounting, which would make it worse still.","best":"Over the 8-year lease, the extension costs THB 76 million and dropping spare parts costs 64 million, so the extension loses by 12 million. Payback is 10 years against 8 on the lease, and that is before discounting. The extension also has an issue of its own: it adds space but no revenue, and sales has no request for new space, so the new space may stay empty. Dropping spare parts can be reversed if demand returns, while the extension cannot. The extension would make sense with a lease of 15 years or more, or with a signed large new customer. Both options also take time: 12 months to build, six months' notice to end spare parts. So I would not wait for the build, and I would start the cheap levers now."},"probes":[{"ask":"Why include the 2 million running cost?","listen":"The extension has a yearly cost, so the true yearly gain is 8 minus 2: 6 million."},{"ask":"What does the lease mean for the payback?","listen":"Payback 10 years is longer than the 8 years left; extension would not pay back."},{"ask":"What would change your mind?","listen":"A longer lease, around 15 years or more, or a large new customer for the space."},{"ask":"The MD says: the extension is an asset, it keeps its value. Respond.","listen":"It sits on leased land, so it does not belong to us after the lease, and renewal is not certain."},{"ask":"Is 7.5 years or 10 years the right payback?","listen":"10: it includes the running cost."}]},{"id":"s5","title":"Other levers and recommendation","timer":"recommendation","minutes":13,"question":"What other ways are there to free space, before or instead of giving up the activity? Then give your recommendation to the managing director.","notes":"Expected levers: clear aged and dead stock, slotting by turn rate, higher racking or narrow aisles or a raised platform floor for small items, move slow stock to cheap off-site storage, more cross-docking, contract terms (maximum storage days, pallet minimum), reprice the slow customer. Reprice calculation: to earn what D earns per position (THB 5,000), C must give 3,000 x 5,000 = THB 15m of contribution, which is 7 more than today. That is a price rise of 7 / 30 = 23%. Recommendation: do not build. First use the cheap levers and reprice C. If C does not accept, exit C over a notice period. Check that we are not left with space we cannot fill: only 400 positions of room to refill up to 85%.","exhibits":[],"hints":["Which of the levers cost almost nothing?","What price rise would make C worth keeping?"],"solution":"Other ways to free space.\nOne. Clear dead and aged stock. Ask customers to remove stock older than a set number of days, and charge for it.\nTwo. Slotting. Put fast movers near the dock and slow movers high in the racks. This helps service as well as space.\nThree. Density. Narrow aisles, higher racking, or a raised platform floor for small items. Needs some capex but much less than THB 60m.\nFour. Move slow stock off-site to a cheaper warehouse. The spare parts customer is the obvious candidate.\nFive. Contract terms. A maximum storage time and a minimum price per pallet position.\nSix. Reprice C. To earn the same as D per position, C needs 3,000 x 5,000 = THB 15m of contribution. Today it gives 8. A price rise of 7 on revenue of 30 is 23%. If C accepts, we keep the customer and get the same profit as returns and kitting. If not, C leaves.\nRecommendation: do not build the extension.\nFirst, clear dead stock and fix slotting, which costs little. Second, offer C a 23% price rise or a move to off-site storage. Third, if C does not agree, give notice and exit C.\nIf C leaves, profit falls by THB 8m a year, from 36 to 28, but occupancy falls from 98% to 83% and service recovers. The extension would cost THB 60m and takes 10 years to pay back against a lease of 8.\nRisks. Losing the customer could hurt the relationship if C is also a customer for other services. Refilling the space is limited to about 400 positions before we are back at 85%. Next steps: talk to C, run a stock ageing report, and brief the board.\nA caveat: if the client wins a large new customer, or renews the lease for 15 years or more, the extension should be looked at again.","answers":{"standard":"I recommend not building the extension. We first clear dead stock and fix slotting, which cost little. Then we offer spare parts a 23 percent price rise or a move off-site. If they say no, we exit spare parts. That costs 8 million of profit a year but brings occupancy to 83 percent and service recovers.","great":"I do not recommend the extension: it costs THB 60 million, pays back in 10 years and the lease is 8. First I would use cheap levers: clear dead and aged stock, slot fast movers near the dock, and move slow stock off-site. Second, offer spare parts a price rise of 23 percent, which would give it the same earnings per position as returns and kitting, or an off-site move. If they refuse, we exit and accept 8 million less profit. Risks are the relationship and refilling the space, which has room for only 400 positions. Next steps are to talk to the customer and run a stock ageing report.","best":"My advice is to not build, and to go in steps from cheap to costly. Step one is stock clearance and slotting. Step two is to reprice spare parts: 23 percent more would take it to 5,000 per position, which is the level of returns and kitting, and then we would be happy to keep it. Step three is exit with six months' notice. That costs 8 million a year but takes occupancy to 83 percent, and service should recover. The extension is the wrong tool: 60 million, 10 years to pay back, 8 years of lease. I would reconsider it only with a lease of 15 years or more or a firm new customer. The risks are that spare parts is linked to other business, and the freed space refills past 85 percent, as there is room for only 400 positions. I would also track on-time in-full each month, to show the board that service is moving back toward the earlier 98 percent."},"probes":[{"ask":"In one sentence, what is your advice?","listen":"Do not build; free space by repricing or exiting spare parts, and use cheap levers first."},{"ask":"Why 23 percent?","listen":"It raises spare parts from 8 to 15 million, which is 5,000 per position like returns and kitting."},{"ask":"What if the customer refuses the price rise?","listen":"Exit: profit falls by 8 million a year, occupancy goes to 83 percent."},{"ask":"The MD says: we will lose a customer. Is it worth it?","listen":"They compare 8 million a year against service level losses and the 60 million capex; keep relationship in mind."},{"ask":"What would make you look at the extension again?","listen":"A longer lease, around 15 years, or a firm large new customer."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: The four activities in the warehouse (last 12 months)","chart":"bar","columns":["Activity","Pallet positions used","Revenue (THB m per year)","Variable cost (THB m per year)"],"rows":[["A: FMCG fast movers",9000,150,90],["B: Electronics distribution",5600,100,62],["C: Spare parts storage",3000,30,22],["D: Returns and kitting",2000,40,30],["Total",19600,320,204]],"note":"Warehouse capacity: 20,000 pallet positions. Fixed cost: THB 80m a year (rent, depreciation, supervisors, systems, security). Variable cost: labour hours, handling equipment use, packaging, power.","series":[2,3],"rowsUsed":[0,1,2,3]},{"id":"e2","title":"Exhibit 2: The two options","chart":"table","columns":["Option","Capex (THB m)","Extra running cost (THB m per year)","Pallet positions added or freed","Occupancy after (%)","Revenue change (THB m per year)","Variable cost change (THB m per year)"],"rows":[["Extend the building",60,2,3500,83.4,0,0],["Drop spare parts storage (C)",0,0,3000,83.0,-30,-22]],"note":"The extension adds 3,500 positions and brings no new customers. Land lease: 8 years left. Ignore discounting."}],"recommendation":"I recommend that the client does not build the extension. Service is slipping because occupancy is 98% and service worked up to 85%. The cheapest way back is to free about 3,000 positions. Reason one: spare parts storage is the low-value activity. It earns THB 2,700 of contribution per position against 5,000 to 6,800 for the others. Dropping it cuts profit by THB 8m a year, from 36 to 28, because only THB 22m of variable cost goes away and the fixed cost stays. Reason two: occupancy falls to 83% and service should recover. Reason three: the extension costs THB 60m plus THB 2m a year, and pays back in 10 years against 8 years of lease. Over the lease, it costs THB 76m against 64. Before we exit, we offer the spare parts customer a price rise of 23% or a move to off-site storage, and we clear dead stock and fix slotting. Risks: the customer relationship, and refilling the freed space, which has room for only 400 positions. Next steps: talk to the customer, run a stock ageing report, and take the numbers to the board.","good":["Links the service problem to occupancy and sets a target of 85%","Ranks activities by contribution per pallet position, not by fully loaded profit","Says that dropping C cuts profit by THB 8m because only variable cost goes away","Compares capex with the yearly margin lost and uses the lease length"],"great":["Explains why the allocated loss of C is misleading and why the manager's THB 4m gain is wrong","Includes the running cost in the payback: 10 years, not 7.5, and states the 8-year cost of THB 76m against 64","Checks that dropping D would not reach 85%, so C is the only single activity that works","Offers a 23% reprice or off-site move before an exit, plus low-cost space levers"],"mistakes":["Dropping the activity with the biggest fully loaded loss and assuming fixed cost goes with it","Ranking activities by contribution margin in percent, which points to returns and kitting","Comparing the capex with revenue lost instead of margin lost","Forgetting the extension's running cost and the lease length","Not checking that the space freed is enough to get below 85%"],"inspiredBy":{"title":"Bookl","url":"https://www.preplounge.com/en/management-consulting-cases/interviewer-led/intermediate/bookl-33","author":"PrepLounge","skills":"A warehouse at capacity, capex extension against freeing space by dropping a low-value activity, the profit effect using fixed and variable cost drivers, payback of capex against yearly margin lost, and other ways to free space."},"glossary":[{"term":"Pallet position","meaning":"One storage slot in the warehouse that holds one pallet of goods."},{"term":"Occupancy","meaning":"The share of pallet positions in use; here 98 percent."},{"term":"Contribution","meaning":"Revenue minus variable cost: the money an activity adds toward fixed cost and profit."},{"term":"Fixed and variable cost","meaning":"Fixed cost stays the same if an activity leaves; variable cost goes away with it."},{"term":"FMCG","meaning":"Fast-moving consumer goods, such as food and household products."},{"term":"Kitting","meaning":"Putting several items together into one pack or set for shipping."},{"term":"Slotting","meaning":"Choosing where in the warehouse each product is stored, so fast sellers are close to the dock."},{"term":"Capex","meaning":"A large one-off spend on buildings or equipment."}]},{"id":"coating-make-or-buy","title":"Coating: make or buy (Kinabalu Circuit Systems)","client":"Kinabalu Circuit Systems Sdn Bhd, a Malaysian electronics maker with an in-house PCB conformal coating line.","country":"Malaysia","type":"operations","difficulty":"Advanced","format":"Candidate-led","minutes":45,"summary":"Should the maker outsource conformal coating at a quoted price per unit, or keep it in-house?","prompt":"Kinabalu Circuit Systems makes industrial control boards in Malaysia. It coats about 1.2 million boards a year with a protective layer, called conformal coating, on its own line. A coating specialist has quoted MYR 4.20 per board. The operations director shows you a sheet: in-house variable cost is MYR 3.00 per board, so buying is 40% more expensive and she wants to stop the talks. The CPO is not sure. You are on the Inverto team and the CPO meets you tomorrow. You lead the case. Tell me how you want to approach it.","clarifying":[{"q":"What is the contract length and volume?","a":"Three years, 1.2 million boards per year. The supplier is in Penang, 40 km away."},{"q":"Does the quote include transport?","a":"No. It is ex-works, which means we collect the boards and pay for transport ourselves. Round-trip logistics costs MYR 0.20 per board. (Give if asked.)"},{"q":"Is there a fixed cost behind the in-house line?","a":"Yes. Show Exhibit 2 only if the candidate asks for fixed cost or overhead."},{"q":"What is the supplier's quality record?","a":"First-pass yield is 98% at the supplier, 99% in-house. A failed board costs about MYR 40 to rework or scrap. (Give if asked.)"},{"q":"Is the coating process proprietary?","a":"The coating spec is standard. But the supplier sees the board designs of two key customers. (Give if asked.)"},{"q":"Could the client sell the line or use the freed space for something else?","a":"No firm plan today. The line is old and would sell for little. The space could be used only if the client decides to add a new product, and nothing is planned. (Give if asked.)"},{"q":"Can the supplier handle peaks in volume?","a":"Yes, up to about 20% above the contract volume, with two weeks notice. In-house, the line is full at 1.2 million boards. (Give if asked.)"}],"structure":{"notes":"A good candidate frames make-or-buy as strategic fit, economics, capability and risk, then says that economics must use relevant cost, not the sheet shown. They ask for fixed cost and avoidability.","branches":[{"name":"Strategic fit","points":["Is coating core to the product","Customer or IP sensitivity","Flexibility and volume swings"]},{"name":"Economics","points":["Variable cost vs quote plus logistics","Fixed cost: which part goes away","Break-even avoidable share"]},{"name":"Capability","points":["Supplier process and certification","Capacity at peak","Yield and rework"]},{"name":"Risk","points":["Single supplier dependence","IP and data","Lead time and inventory","Exit cost if we want to come back"]}]},"stages":[{"id":"s1","title":"Set the approach","timer":"structure","minutes":5,"question":"Tell me how you would decide between making and buying the coating. What do you want to know first?","notes":"Candidate-led. Do not give data until asked. Listen for: relevant cost (avoidable cost), not full cost; what the sheet leaves out; strategic and risk factors. If they ask for fixed cost, give Exhibit 2 in s3. If not asked by the end of s2, say: 'What does the sheet not show?'","exhibits":[],"hints":["The sheet shows only part of the cost of making. Which part is missing?","What would actually stop if we outsourced?"],"solution":"I would split it into four: strategic fit, economics, capability and risk.\nFor economics, the key is relevant cost: the cost that changes if we decide to buy. Not the cost on a sheet.\nSo I need: variable cost per board, fixed cost behind the line and which part is avoidable, the quote and what it excludes such as logistics, and volume.\nThen I compare cost that goes away if we buy with the price we pay.\nI would also check yield, capacity, IP and how hard it is to come back if the supplier fails.","answers":{"standard":"I would look at four areas: strategic fit, economics, capability and risk. For economics I want the cost that actually goes away if we buy, not the full cost. So I need variable cost, fixed cost and which part of it is avoidable, and the quote with transport.","great":"Four areas: strategic fit, economics, capability and risk. In economics, the key idea is relevant cost: only the cost that changes with the decision. That means I need the fixed cost behind the line and what would really stop. I also want the quote on a delivered basis. Then I weigh in yield, capacity and the risk of sharing board designs with a supplier.","best":"I would split into strategic fit, economics, capability and risk, and start with economics because it can end the discussion fast. The sheet shows only variable cost, so I will ask for fixed cost and what is avoidable, and for the quote's delivery terms. Then I want the break-even: how much fixed cost must go away for buying to win. After that, quality, capacity at peak and intellectual property. My hypothesis is that the full-cost view misleads and the answer depends on how much fixed cost is avoidable. I would also ask what the freed space and people could do."},"probes":[{"ask":"Why do you want the fixed cost? The sheet already has a cost per board.","listen":"The sheet only shows variable cost. Need to know what changes if the line stops."},{"ask":"What does relevant cost mean in your own words?","listen":"Only the cost that changes with the decision. Costs that stay either way are ignored."},{"ask":"The operations director says the quote is 40% higher, so stop. What is your reply?","listen":"Polite but firm: the comparison is incomplete (transport, fixed cost). Do not agree yet."},{"ask":"Which non-cost factors could change the answer?","listen":"Quality, capacity at peak, sharing designs with a supplier, depending on one supplier."}]},{"id":"s2","title":"Management's comparison","timer":"exhibit","minutes":7,"question":"Here is the cost sheet management used. Is their conclusion right? Choose what you want to check or ask next.","notes":"Hand over Exhibit 1. Candidate-led. Good moves: ask whether the quote includes logistics (add MYR 0.20 per board: buy = 4.40), ask for fixed cost, ask what is avoidable. If they just agree with management, push: 'What costs are not on the sheet?' Do not give Exhibit 2 until they ask. Quote vs variable is 40% higher only if logistics are ignored; with logistics it is 47% higher.","exhibits":["e1"],"hints":["Compare like with like: is the quote delivered?","What costs would still exist if we stopped coating tomorrow?"],"solution":"Management compares MYR 3.00 variable cost with MYR 4.20. That is +40%.\nBut the quote is ex-works. Add MYR 0.20 logistics: buying costs MYR 4.40 per board, which is +47% on variable cost.\nThat is still only part of the picture. The in-house line also has fixed cost, and some of it would go away if we stopped.\nSo the sheet is not wrong, it is incomplete. I need the fixed cost and what is avoidable.","answers":{"standard":"The sheet compares 3.00 with 4.20, which is 40% more. But the quote is ex-works, so I add 0.20 transport. Buying is 4.40, which is 47% more than variable cost. The sheet is incomplete, because it leaves out fixed cost.","great":"Management is comparing 3.00 and 4.20. The quote excludes transport, so the right buy price is 4.40, 47% above variable cost. The sheet is not wrong, but it is incomplete, since the in-house line also has fixed cost. I would ask for it and for what stops if we outsource. I would not agree or disagree with management before I see that.","best":"The like-for-like comparison is 3.00 against 4.40, so buying is 47% more, not 40%. But the sheet also leaves the fixed cost of the line out, so it only tells us the variable side. Fixed cost can push the answer either way: if it all goes away, making costs 5.00 and buying looks cheaper. If none goes away, making is much cheaper. So the answer depends on what is avoidable, and I need that next. I would also ask whether anything else is missing from the quote, such as setup or tooling charges."},"probes":[{"ask":"Is the quote comparable with the in-house cost? What is different?","listen":"No. The quote excludes transport. Add 0.20 to get 4.40."},{"ask":"Why does the percentage change from 40% to 47%?","listen":"4.40 divided by 3.00 is 1.47. The 0.20 transport was left out."},{"ask":"The operations director says that settles it. Does it?","listen":"No. Fixed cost is missing, so the sheet is incomplete. It could go either way."},{"ask":"What would you ask the client next?","listen":"The fixed cost behind the line and which part would stop if outsourced."}]},{"id":"s3","title":"Relevant cost","timer":"math","minutes":11,"question":"Here is the fixed cost of the line. Work out the right comparison. Decide how you want to do it.","notes":"Hand over Exhibit 2 only now (if asked or after s2). Candidate-led. Expected: full cost per board 5.00 (3.00 + 2.00) looks worse than buying at 4.40: a trap. Avoidable fixed cost = supervisor 0.60 + maintenance 0.24 = MYR 0.84m (MYR 0.70 per board). Relevant make cost = 3.00 + 0.70 = 3.70 vs 4.40 buy. Make is cheaper by MYR 0.84m a year. Depreciation, space and QA allocation stay either way.","exhibits":["e2"],"hints":["Look at the last column: which items stop if we outsource?","Add the avoidable fixed cost per board to the variable cost."],"solution":"Fixed cost is MYR 2.4m a year, or MYR 2.00 per board (1.2m boards).\nFull cost view: 3.00 + 2.00 = MYR 5.00 per board. Buying at 4.40 looks MYR 0.60 cheaper. That is wrong, because most of the fixed cost stays.\nAvoidable fixed cost = supervisor and engineer 0.60 + maintenance contract 0.24 = MYR 0.84m a year = MYR 0.70 per board.\nUnavoidable = depreciation 0.84 + space 0.48 + QA allocation 0.24 = MYR 1.56m. It stays if we buy.\nRelevant cost to make = 3.00 + 0.70 = MYR 3.70 per board, or MYR 4.44m a year.\nCost to buy = 4.40 x 1.2m = MYR 5.28m a year.\nMaking is cheaper by MYR 0.70 per board, or MYR 0.84m a year.\nSo management is right in the end, but for the wrong reason.","answers":{"standard":"Fixed cost is 2.4 million ringgit, or 2.00 a board. But only the supervisor and maintenance, 0.84 million, would go away. That is 0.70 a board. So making costs 3.70 relevant, against 4.40 to buy. Making is cheaper by 0.84 million a year.","great":"The full cost is 5.00 a board, which would say buy at 4.40. That is the trap, because depreciation, space and the QA share stay if we buy. Avoidable cost is the supervisor and maintenance, 0.84 million a year, or 0.70 a board. Relevant cost to make is 3.70, so 4.44 million a year, against 5.28 million to buy. Making is cheaper by 0.84 million. I would check that the supervisor roles really end and are not just moved.","best":"Full cost, 3.00 plus 2.00, is 5.00 and looks worse than the 4.40 quote. That is the wrong comparison, since 1.56 million of the 2.4 million fixed cost stays whatever we decide. Avoidable is 0.84 million, so 0.70 a board. Relevant make cost is 3.70, which is 4.44 million a year, against 5.28 million to buy. Making wins by 0.84 million. Sanity check: the gap per board is 0.70, so it is robust to small errors in the transport estimate. What would change it: if more of the cost proves avoidable, for example staff redeployed or space re-let. Next I would test exactly that, and add quality."},"probes":[{"ask":"Why is 5.00 per board the wrong number to compare with 4.40?","listen":"It includes fixed cost that stays if we buy: depreciation, space and QA share. Only avoidable cost counts."},{"ask":"Which fixed cost items would stop, and what is their total?","listen":"Supervisor and engineer 0.60 and maintenance 0.24: 0.84 million a year, 0.70 per board."},{"ask":"The finance manager says depreciation is a real cost and must be in. Reply?","listen":"It is real but unavoidable here: the machine has no other use, so it stays whichever way we decide."},{"ask":"What is the annual saving from making, and how sure are you?","listen":"0.84 million a year (4.44 versus 5.28). Should mention checking that the roles really end."},{"ask":"How would you check the 4.40 figure?","listen":"Quote 4.20 plus 0.20 transport. Perhaps ask for other charges."}]},{"id":"s4","title":"Break-even and risk","timer":"brainstorm","minutes":11,"question":"What would have to be true for buying to win? And what else would you check before you advise the CPO? Choose your order.","notes":"Candidate-led. Break-even: avoidable fixed must reach (4.40 - 3.00) x 1.2m = MYR 1.68m, which is 70% of the MYR 2.4m fixed pool vs 35% today. Needs an extra MYR 0.84m, e.g. selling the line, re-letting the space, redeploying QA. Risks to cover: quality (give 98% vs 99% yield, MYR 40 per failure: 12,000 boards x 40 = MYR 0.48m a year against buying), IP (supplier sees two customer designs), capacity/peak, dependence, logistics lead time and inventory, exit cost. Opportunity: freed space and engineers.","exhibits":[],"hints":["Find the avoidable fixed cost at which both options cost the same.","Think of quality, IP and capacity. Which can be put in ringgit?"],"solution":"Break-even: buy cost = variable cost + avoidable fixed cost.\nAvoidable fixed cost needed = (4.40 - 3.00) x 1.2m = 1.40 x 1.2m = MYR 1.68m a year.\nThat is 1.68 / 2.40 = 70% of fixed cost. Today only 0.84 / 2.40 = 35% is avoidable.\nWe would need another MYR 0.84m to go away, for example by selling the line and re-letting the space.\nQuality: 1 point lower yield = 12,000 boards x MYR 40 = MYR 0.48m a year. This adds to the make case: advantage MYR 0.84m + 0.48m = MYR 1.32m.\nOther risks: IP, because the supplier sees two customers' designs; capacity at peak; single supplier; logistics lead time that adds stock; exit cost if we want to come back.\nSo cost does not support buying, and risk adds to it.","answers":{"standard":"Buying wins only if avoidable fixed cost reaches 1.68 million a year. That is 70% of fixed cost, against 35% today. Quality also matters: the supplier's yield is 1 point lower, which costs 0.48 million a year. The supplier would also see two customers' designs.","great":"Break-even: buying wins if avoidable fixed cost is 1.68 million, which is 1.40 per board times 1.2 million. That is 70% of the pool, against 35% now. We need another 0.84 million to go away, by selling the line or re-letting the space. Quality adds to the make side: 12,000 more failed boards at 40 ringgit is 0.48 million, so the make advantage is 1.32 million. Other risks are IP, peak capacity and single-supplier dependence.","best":"Break-even is 1.68 million of avoidable fixed cost, 70% of the pool against 35% today. We would need 0.84 million more to disappear. Quality moves it further away: the yield gap costs 0.48 million, so making is ahead by 1.32 million. To close that we would need roughly 1.3 million more of fixed cost removed, which is most of the pool, and there is no plan for the space. Qualitative risks point the same way: two customers' designs go to the supplier, and there is one supplier. I would still keep the supplier qualified for peaks. Next step: test whether the line and space have any alternative use."},"probes":[{"ask":"What does break-even mean here, and what is the number?","listen":"The point where both options cost the same: avoidable fixed cost of 1.68 million, which is 70% of the pool."},{"ask":"Why do you care about quality if cost already favours making?","listen":"A lower yield at the supplier costs money: 12,000 boards times 40 is 0.48 million, and it strengthens making."},{"ask":"The CPO says the supplier price will fall next year, so buy anyway. Respond.","listen":"Test it: the supplier would need to cut its quote below about 3.50 (3.70 minus 0.20 transport) to win. Hold the backup option instead."},{"ask":"Which risk worries you most and why?","listen":"A reasoned choice. For example sharing two customers' designs, or dependence on one supplier."},{"ask":"What could the client do to move toward buying?","listen":"Sell the line, re-let or reuse the space, redeploy staff, to lift avoidable cost from 35% toward 70%."}]},{"id":"s5","title":"Recommendation","timer":"recommendation","minutes":6,"question":"The CPO is waiting. What is your recommendation?","notes":"Looking for: answer first (keep in-house for now), the relevant cost numbers, the break-even and a condition that would change it. Good extras: use the quote as a benchmark to negotiate internal cost down, keep the supplier as a qualified backup for peaks, test sale of the line and re-use of space.","exhibits":[],"hints":["Say what you recommend, then the numbers, then what would change your mind."],"solution":"See the model recommendation.","answers":{"standard":"I recommend keeping coating in-house for now. Relevant cost to make is 3.70 a board against 4.40 to buy, so making is cheaper by 0.84 million ringgit a year. Buying would only win if 70% of the fixed cost went away.","great":"Keep coating in-house. Relevant cost is 3.70 against 4.40, so 0.84 million a year in favour of making, about 1.3 million with the supplier's lower yield. The full cost of 5.00 would wrongly say buy. The risks of buying are the two customers' designs and relying on one supplier. Next, I would use the quote to push down in-house cost, and keep the supplier qualified as a backup for peaks.","best":"My answer is to keep it in-house. Management is right, but for the wrong reason. Relevant make cost is 3.70 against 4.40 to buy, 0.84 million ringgit a year, and 1.32 million with quality. Buying wins only if 70% of fixed cost is avoidable, against 35% today. I would change my view if the client finds a use for the space or the line, or if the supplier cuts its quote below about 3.50, which is 3.70 minus the 0.20 transport. Risks of buying are IP and one supplier. Next steps: test alternative uses of the space, negotiate the quote as a benchmark, and qualify the supplier as backup for peaks, which it can cover up to 20% extra."},"probes":[{"ask":"Give me your answer in one sentence.","listen":"Keep in-house, with the main number: 3.70 against 4.40."},{"ask":"Why do you think management was right for the wrong reason?","listen":"Their sheet ignored transport and fixed cost, but the result of keeping it in-house holds on relevant cost."},{"ask":"What would make you change your recommendation?","listen":"Avoidable fixed cost at 70% or more, or a much lower supplier price."},{"ask":"What would you do in the first month?","listen":"Test alternative uses of space and line, use the quote as benchmark, qualify the backup."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Management cost sheet and supplier quote","chart":"hbar","columns":["Item","MYR per board"],"rows":[["In-house material",1.4],["In-house labour",1.1],["In-house energy and consumables",0.5],["In-house variable cost",3.0],["Supplier quote",4.2]],"note":"Annual volume 1.2 million boards. The quote is ex-works from the supplier's plant in Penang.","series":[1]},{"id":"e2","title":"Exhibit 2: Fixed cost of the coating line","chart":"pie","columns":["Fixed cost item","MYR m/year","MYR per board","If coating stops in-house"],"rows":[["Line depreciation",0.84,0.7,"Charge stays. The machine has no other use"],["Line supervisor and process engineer",0.6,0.5,"Roles end"],["Maintenance contract",0.24,0.2,"Contract can be cancelled"],["Factory space allocation",0.48,0.4,"Space stays, no other tenant planned"],["Shared QA lab and admin allocation",0.24,0.2,"Cost stays"],["Total",2.4,2.0,""]],"note":"MYR per board is based on 1.2 million boards a year.","series":[1],"rowsUsed":[0,1,2,3,4]}],"recommendation":"My answer is to keep coating in-house for now. Management looks right, but for the wrong reason. The sheet compares variable cost to the quote. The quote needs MYR 0.20 for logistics, so buying costs MYR 4.40. In-house, only MYR 0.84m of the MYR 2.4m fixed cost goes away if we stop, which is MYR 0.70 per board. So the relevant cost of making is MYR 3.70 against MYR 4.40 to buy. That is MYR 0.84m a year in favour of making, and about MYR 1.3m once we count the lower supplier yield. The full cost view of MYR 5.00 per board would wrongly say buy. Buying wins only if 70% of the fixed cost is avoidable, against 35% today. That could happen if the client can sell the line and use the space. Risks of buying are IP on two customers' designs and a single supplier. Next steps: test whether the space and equipment have an alternative use, use the quote to push for in-house savings, and keep the supplier qualified as a backup for peaks.","good":["Notes the quote excludes logistics and compares at MYR 4.40.","Asks for fixed cost and separates avoidable from unavoidable.","Computes relevant make cost MYR 3.70 vs 4.40 buy.","Covers quality, IP and capacity risk."],"great":["Names the break-even avoidable share (70% vs 35% today) and what could close the gap.","Avoids the full cost trap (MYR 5.00 per board) and explains why.","Puts quality in money: 1 point of yield = MYR 0.48m a year.","Proposes a split: in-house with a qualified backup supplier, and use the quote as a benchmark."],"mistakes":["Using full cost (MYR 5.00) and recommending to buy.","Treating all fixed cost as avoidable, or all as sunk.","Forgetting logistics on the quote.","Staying at management's sheet and not asking for fixed cost.","Ignoring IP and dependence because the cost case already looks clear."],"glossary":[{"term":"Conformal coating","meaning":"A thin protective layer sprayed on an electronic circuit board against dust and moisture."},{"term":"Ex-works","meaning":"The price covers goods at the supplier's door. The buyer pays and arranges transport."},{"term":"Relevant cost","meaning":"Only the cost that changes because of the decision. Costs that stay either way do not count."},{"term":"Avoidable fixed cost","meaning":"A fixed cost that would really disappear if the activity stopped, such as a cancelled contract."},{"term":"Full cost","meaning":"All costs of a unit, including shared fixed costs charged to it. It can mislead decisions."},{"term":"First-pass yield","meaning":"The share of boards that are good the first time, without rework."},{"term":"Break-even","meaning":"The point at which two options cost the same."},{"term":"Make or buy","meaning":"The choice between doing an activity in-house or paying a supplier to do it."}]},{"id":"offshoring-knife-edge","title":"Offshoring flasks: a knife-edge call (Tanjung Flaskware)","client":"Tanjung Flaskware Sdn Bhd, a Malaysian maker of premium insulated steel flasks sold under a 'Made in Malaysia' label.","country":"Malaysia","type":"operations","difficulty":"Advanced","format":"Candidate-led","minutes":45,"summary":"Should the flask maker close its Johor line and source from a plant in Central Java?","prompt":"Tanjung Flaskware makes premium insulated flasks in Johor and sells 200,000 a year at MYR 100 each. A contract manufacturer in Central Java, Indonesia, has offered to make the same flask at a much lower cost. The CEO is tempted to close the Johor line. The CFO worries about the 'Made in Malaysia' label and about the supplier's minimum order size. You are on the Inverto team and the CEO wants a view in the board pack tomorrow. You lead the case. Tell me how you want to approach it.","clarifying":[{"q":"What does it cost to make a flask in Johor today?","a":"MYR 60 per flask, all variable or avoidable if the line closes. About 2% of flasks fail final inspection and are remade at the same cost. (Give if asked.)"},{"q":"What is the offer from Central Java?","a":"MYR 45 per flask ex-works. Freight, duty and handling add MYR 7. About 5% of flasks fail inspection on arrival. A failed flask is scrapped and a new one costs the full landed cost again. (Give if asked.)"},{"q":"Is there a minimum order quantity?","a":"Yes. 50,000 flasks per quarterly order. Show Exhibit 3 only if the candidate asks about order size or MOQ."},{"q":"How does the label matter to customers?","a":"The sales team ran a survey. Show Exhibit 2 only if the candidate asks about customers or demand."},{"q":"What are the lead times and payment terms?","a":"Home: two weeks from order to shelf. Offshore: ten weeks, including sea freight and customs. Same payment terms at both. The company's cost of capital is 10%. (Give if asked.)"},{"q":"Are there one-off costs, such as closing the Johor line?","a":"Ignore them for now, and ignore currency moves too. The board wants the run-rate view first. (Give if asked.)"},{"q":"Can the Central Java plant handle our volume, and does the selling price stay the same?","a":"Yes, it has the capacity. The price stays MYR 100 in every case. (Give if asked.)"}],"structure":{"notes":"A good candidate frames this as unit economics, demand effect, supply risk and working capital, and says the answer could be close, so they will look for the one assumption that decides it.","branches":[{"name":"Unit economics","points":["Price less landed cost, home vs offshore","Defects and remake cost","Freight, duty, handling"]},{"name":"Demand","points":["Customers who value local production","Which segments leave","Price or label response"]},{"name":"Supply terms","points":["MOQ vs real demand","Holding cost of leftover stock","Supplier quality and capacity"]},{"name":"Cash and risk","points":["Lead time and pipeline stock","Cost of capital","Forecast risk and currency","One-off closure cost"]}]},"stages":[{"id":"s1","title":"Set the approach","timer":"structure","minutes":5,"question":"Tell me how you would decide whether to move production to Central Java. What do you want to know first?","notes":"Candidate-led. Do not give data until asked. Listen for: profit per unit, not just cost; demand risk from the label; MOQ; lead time. If they only talk about cost per unit, ask: 'What else would change if we leave Johor?'","exhibits":[],"hints":["Compare profit per flask, not just production cost.","What happens to sales if the label changes?"],"solution":"I would look at four things: unit economics, demand, supply terms and cash.\nUnit economics: price less landed cost, including defects and remakes, home against offshore.\nDemand: some customers pay for local production. I need to know how many would leave.\nSupply terms: the MOQ may be above what we sell, and leftover stock costs money.\nCash: a ten-week pipeline ties up working capital.\nThe gap per unit looks big, so I expect the answer to be close once demand and cash are in. I would look for the one assumption that decides it.","answers":{"standard":"I would look at unit economics, demand, supply terms and cash. Unit economics means profit per flask at both sites, with freight and defects. Demand means how many customers leave if the label changes. Supply terms means the minimum order size. Cash means the longer lead time. I would start with profit per flask.","great":"The cost gap looks large, so the question is what eats it. I would split the work into profit per flask, the demand effect of losing the Made in Malaysia label, the supplier's minimum order, and the cash tied up in a ten-week supply line. I expect the answer to be close, so I would look for the one assumption that decides it. I would start with unit profit and then test demand, because demand is the biggest risk.","best":"My hypothesis is that the cost gap is big but the real gain is small once demand and cash are in. So I would build a bridge from the headline gain down to the real gain: freight and defects, then demand loss, then minimum order holding cost, then cash. At each step I want to know which assumption is soft. I expect the demand loss to be the one, because it comes from a survey. I would aim for a break-even on that number, and for an option that limits the risk, such as moving only part of the volume. I would ask for the cost, price, defect rates, survey and lead times, and I would start with profit per flask."},"probes":[{"ask":"Why not just compare the 45 and the 60?","listen":"Freight, duty and defects reduce the gap; also demand and cash change."},{"ask":"Why does the label matter?","listen":"Some customers pay for local production and may stop buying, which cuts volume and profit."},{"ask":"What do you expect the answer to look like?","listen":"Close call; they name an assumption that will decide it."},{"ask":"The CEO says: the saving is obvious, skip the rest. Respond.","listen":"The headline gap shrinks after freight, lost sales, minimum order and cash; show why before closing a plant."}]},{"id":"s2","title":"Unit profit, home vs offshore","timer":"math","minutes":9,"question":"Here is the cost per flask at both sites. Work out the profit per flask for each. Decide how you want to do it.","notes":"Hand over Exhibit 1. Candidate-led. Trap: comparing 45 vs 60 and stopping, or ignoring freight, or ignoring remake cost. Expected: home 60 + 2% x 60 = 1.20 remake, profit 38.80. Offshore landed 52 + 5% x 52 = 2.60, profit 45.40. Gap MYR 6.60 per flask, MYR 1.32m a year at 200,000. If the candidate stops here and says 'offshore', ask: 'Does volume stay the same?'","exhibits":["e1"],"hints":["Add freight and duty to the ex-works price first.","A failed flask costs a full unit cost again. Multiply defect rate by cost."],"solution":"Home: cost 60. Remake = 2% x 60 = MYR 1.20. Profit = 100 - 60 - 1.20 = MYR 38.80 per flask.\nOffshore: landed cost = 45 + 7 = MYR 52. Remake = 5% x 52 = MYR 2.60. Profit = 100 - 52 - 2.60 = MYR 45.40 per flask.\nGap = 45.40 - 38.80 = MYR 6.60 per flask.\nAt 200,000 flasks that is MYR 1.32m a year.\nSo offshore wins by 6.60 per flask if volume stays flat. The headline cost gap is MYR 15, but freight, duty and defects eat more than half of it. Next: does volume stay flat?","answers":{"standard":"At home, a flask costs 60 and 2 percent are remade, which adds 1.20. So profit is 100 minus 61.20, which is MYR 38.80. In Java the landed cost is 45 plus 7, so 52, and 5 percent failures add 2.60. Profit is MYR 45.40. Offshore is better by MYR 6.60 a flask, or MYR 1.32 million a year.","great":"Home profit is MYR 38.80 a flask and offshore profit is MYR 45.40. The quoted cost gap is MYR 15, but freight, duty and the higher defect rate take more than half of it, so the real gap is 6.60. On 200,000 flasks that is MYR 1.32 million a year. This assumes volume stays flat, which I doubt, so the next question is demand. I would check whether the 5 percent failure rate is a promise or a guess.","best":"Home profit per flask is 100 minus 60 minus 1.20 remake, so 38.80. Offshore is 100 minus 52 minus 2.60, so 45.40. The gap is MYR 6.60, about 7 percent of the price, or 1.32 million a year at current volume. Of the MYR 15 headline gap, 7 goes on freight and duty and 1.40 on the extra defects. So only 6.60 is left. This is the maximum gain, not the expected one, since it assumes no lost sales. Defect rate is a lever too: each point of failures costs 0.52 per flask. My next question is what happens to volume."},"probes":[{"ask":"Why did you add 7 to the 45?","listen":"Freight, duty and handling are part of the real cost of getting the flask to the shelf."},{"ask":"How do you handle failed flasks?","listen":"They are scrapped and replaced at full landed cost: rate times cost, 2.60 offshore and 1.20 at home."},{"ask":"Is the gain of 1.32 million certain?","listen":"No. It assumes volume stays at 200,000."},{"ask":"The CEO says: Java is 15 cheaper, so the gain is 15 times 200,000. Respond.","listen":"That ignores freight, duty and defects. The real gap is 6.60."}]},{"id":"s3","title":"Demand loss and order size","timer":"exhibit","minutes":13,"question":"Offshore profit per flask is higher. What else changes the picture? Choose which to look at first.","notes":"Candidate-led. Good moves: ask about the label and customers (give Exhibit 2), ask about MOQ (give Exhibit 3). Do not hand over either until asked; if the candidate has asked for neither after two minutes, say 'What could stop us selling 200,000?' Expected demand: weighted loss = 50% x 0% + 30% x 20% + 20% x 20% = 10%, so 180,000 flasks. Profit offshore = 180,000 x 45.40 = MYR 8.172m vs home 7.76m, a gain of MYR 0.412m. MOQ: quarterly demand after loss is 40,000 / 45,000 / 50,000 with 25 / 50 / 25% probability. Leftover vs MOQ 50,000 = 10,000 / 5,000 / 0. Expected leftover = 5,000 per quarter. At MYR 4 per leftover flask per quarter = MYR 20,000 a quarter, MYR 80,000 a year. Net advantage = 0.412 - 0.080 = MYR 0.332m. Accept either order.","exhibits":["e2","e3"],"hints":["Weight each segment's loss by its share of volume.","Expected leftover = sum of probability x leftover in each scenario."],"solution":"Demand loss: weighted loss = 50% x 0% + 30% x 20% + 20% x 20% = 0 + 6% + 4% = 10%.\nFlasks sold = 200,000 x 90% = 180,000.\nOffshore profit = 180,000 x 45.40 = MYR 8.172m. Home profit = 200,000 x 38.80 = MYR 7.760m.\nGain after demand loss = MYR 0.412m, down from 1.32m.\nMOQ: we must order 50,000 a quarter. Demand after loss is 40,000, 45,000 or 50,000.\nLeftover = 10,000 (25%), 5,000 (50%), 0 (25%).\nExpected leftover = 0.25 x 10,000 + 0.50 x 5,000 + 0 = 5,000 flasks a quarter.\nHolding cost = 5,000 x MYR 4 = MYR 20,000 a quarter = MYR 80,000 a year.\nNet gain = 0.412 - 0.080 = MYR 0.332m a year.\nSo the MYR 1.32m gain has shrunk to MYR 0.33m, about 4% of home profit. It is positive but thin.","answers":{"standard":"Weighted loss is 50 percent times 0, plus 30 percent times 20, plus 20 percent times 20, which is 10 percent. So we sell 180,000 flasks, and offshore profit is 180,000 times 45.40, MYR 8.17 million, against 7.76 million at home. For the minimum order, expected leftover is 5,000 flasks a quarter. At MYR 4 each that costs 80,000 a year. The net gain is MYR 0.33 million.","great":"The survey gives a 10 percent volume loss, so 180,000 flasks, and offshore profit of MYR 8.17 million against 7.76 at home. That cuts the gain from 1.32 million to 0.41. The minimum order is 50,000 and demand is 40,000, 45,000 or 50,000. So the leftover is 10,000, 5,000 or 0, and the probability-weighted average is 5,000 a quarter. That costs MYR 80,000 a year, so the gain is MYR 0.33 million, about 4 percent of home profit. It is positive but thin. I would note the survey is stated intent, not real behaviour.","best":"After demand loss the gain falls from MYR 1.32 million to 0.41 million. After the holding cost of leftovers, it is 0.33 million, around 4 percent of home profit. I use the expected leftover of 5,000 a quarter, not the worst case of 10,000, because I am valuing a typical year. All the loss sits in two segments and none in distributors, which suggests a partial move. The 20 percent figures come from a survey of what people say they would do, so they could be wrong either way. This is now a thin positive, so the next step is to find how far demand loss can move before the answer flips, and what the longer pipeline costs in cash."},"probes":[{"ask":"Why do you weight the loss instead of using 20 percent?","listen":"Only half of the volume is at risk; segments have different shares."},{"ask":"Why use 5,000 leftover and not 10,000?","listen":"5,000 is the probability-weighted average; 10,000 is only the worst case, 25 percent likely."},{"ask":"What does the minimum order do to cost?","listen":"Forces buying more than needed in low demand quarters; leftover costs MYR 4 each."},{"ask":"The sales director says: customers love the label, the loss will be 30 percent. Respond.","listen":"They should say the gain turns negative and offer to test the number; the break-even is near 12 percent."}]},{"id":"s4","title":"The knife-edge and cash","timer":"math","minutes":12,"question":"The gain is thin. What is the one assumption that decides this, how far can it move before the answer flips, and what does the longer lead time do to cash? Choose your order.","notes":"Candidate-led. Hand over Exhibit 4 when they ask about lead time or cash. Expected: demand loss is the swing assumption. Each 1 point of loss costs about MYR 91k (2,000 flasks x 45.40). Break-even loss before cash: (7.76m + 0.08m) / 45.40 = 172,687 flasks, or 13.7% loss. Working capital: landed cost 180,000 x 52 = MYR 9.36m a year = MYR 180,000 a week. Extra 8 weeks = MYR 1.44m stock. At 10% = MYR 144k a year. Gain falls to MYR 0.188m. All-in break-even: (7.76m + 0.08m + 0.144m) / 45.40 = 175,859 flasks = 12.1% loss. Survey says 10%. Headroom is only 2 points. Survey answers are stated intent, so the real loss could be higher or lower. If they miss the break-even, ask: 'How wrong can the survey be?'","exhibits":["e4"],"hints":["Ask: what loss makes profit equal to home profit?","Pipeline stock = weekly landed cost x extra weeks."],"solution":"The swing assumption is demand loss. The survey says 10%.\nEach 1 point of loss = 2,000 flasks x 45.40 = about MYR 91k a year.\nBreak-even before cash: offshore needs the same profit as home plus holding cost = 7.76m + 0.08m = MYR 7.84m.\nFlasks needed = 7.84m / 45.40 = 172,687. That is a loss of 13.7%.\nCash: landed cost = 180,000 x 52 = MYR 9.36m a year = MYR 180,000 a week.\nLead time goes from 2 to 10 weeks, so 8 extra weeks = MYR 1.44m more stock.\nCapital cost at 10% = MYR 144k a year.\nGain falls to 0.332 - 0.144 = MYR 0.188m, or 2.4% of home profit.\nAll-in break-even = (7.76m + 0.08m + 0.144m) / 45.40 = 175,859 flasks. That is a loss of 12.1%.\nSo the answer flips if loss goes from 10% to 12%. Two points of headroom on a survey answer is a knife-edge. Longer lead time also means a worse forecast and less room to react.","answers":{"standard":"Demand loss decides it. Each point of loss costs about MYR 91,000. Without cash, break-even is 172,687 flasks, a 13.7 percent loss. The extra eight weeks of stock is MYR 1.44 million, which costs MYR 144,000 a year at 10 percent. So the gain falls to MYR 0.19 million, and the all-in break-even loss is 12.1 percent against the survey's 10.","great":"The swing is demand loss. Each point is 2,000 flasks at 45.40, about MYR 91,000. Offshore has to match the home profit plus holding cost, which needs 172,687 flasks, so a 13.7 percent loss. Cash adds more: landed cost is MYR 9.36 million a year, so 180,000 a week. Eight extra weeks is MYR 1.44 million of stock, costing 144,000 at 10 percent. The gain is then MYR 0.19 million, about 2.4 percent of home profit, and the break-even loss is 12.1 percent. We have only two points of headroom on a survey answer.","best":"Demand loss is the assumption, and the headroom is only 2.1 points: all-in break-even is 12.1 percent against a survey of 10. Every point costs MYR 91,000, so being two points wrong removes the whole gain of MYR 0.19 million. The survey is stated intent, which can be too high or too low, so I treat it as a range. Cash is the second effect: eight more weeks is MYR 1.44 million of stock and 144,000 a year in capital cost. A longer lead time also means a worse forecast and less room to react, which this does not price. Another lever is the defect rate: the offshore failure rate would need to be roughly 7 percent to wipe out the gain at 10 percent loss. So this is a knife-edge. I would not decide on it, but I would test the demand number with a pilot."},"probes":[{"ask":"Why is demand loss the one that matters?","listen":"It has the biggest effect per point, and it is a survey guess."},{"ask":"How much can it move before you change your mind?","listen":"About 12 percent all-in, against 10 in the survey: roughly 2 points."},{"ask":"What does the longer lead time do?","listen":"More stock in transit and on the shelf: MYR 1.44 million tied up, costing 144,000 a year."},{"ask":"The CFO disagrees: it is still positive, so do it. Respond.","listen":"The gain is 0.19 million, 2.4 percent of home profit, and a small miss on demand turns it negative."},{"ask":"What other number could break it?","listen":"Defect rate or freight; accept a reasoned answer."}]},{"id":"s5","title":"Recommendation","timer":"recommendation","minutes":6,"question":"The CEO walks in. What do you recommend, and what would you do next?","notes":"Look for: answer first, not 'it depends'; a split or a test rather than all-in; the break-even named; risks. Good answer: do not close Johor on this case alone. Test the offshoring on the segment that does not leave. Distributors are 50% of volume and 0% loss: 100,000 flasks x 6.60 = MYR 0.66m, less capital cost on MYR 0.8m extra stock = MYR 80k, MYR 0.58m before MOQ. But quarterly demand of 25,000 is half the MOQ, so the MOQ must be renegotiated first.","exhibits":[],"hints":["Is there a part of the volume where nobody leaves?","What must the supplier change for a split to work?"],"solution":"Do not close Johor now. The case is a knife-edge: a gain of MYR 0.19m a year, which is 2.4% of home profit, and it flips if the demand loss goes above 12%.\nThe loss number comes from a survey, and the downside is bigger than the upside.\nInstead, move only distributor volume and keep making the other half in Johor. Distributors are half of sales and said nobody would leave.\n100,000 flasks x MYR 6.60 = MYR 0.66m, less MYR 80k capital cost on MYR 0.8m extra stock = about MYR 0.58m.\nCondition: the MOQ of 50,000 a quarter is double that volume. We must cut it to 25,000 first.\nNext steps: negotiate the MOQ and a quality guarantee on the 5% defect rate, test the label with the department stores and gift shops before any decision on them, and cost the one-off closure and the currency risk.","answers":{"standard":"I would not close Johor now. The gain is only MYR 0.19 million a year, and it disappears if demand loss goes above 12 percent. Instead I would move only the distributor volume, where nobody said they would leave. That is about MYR 0.58 million a year. First we must cut the minimum order.","great":"I recommend not closing Johor. The all-in gain is MYR 0.19 million, 2.4 percent of home profit, and it flips at 12 percent demand loss. The downside is bigger than the upside. I would move only the distributors, which are half of sales, with no lost customers. That is 100,000 flasks at 6.60, less 80,000 for the extra stock, so about MYR 0.58 million. The condition is that the supplier cuts the minimum order from 50,000 to 25,000 a quarter. Next steps: negotiate that and a quality guarantee, and test the label with the other customers.","best":"My advice is a partial move: do not close Johor, and offshore only the distributor volume. The full move gains 0.19 million with 2 points of headroom on a survey. The partial move gains about 0.58 million, because distributors have no demand risk. It keeps Johor running for the other half, which also keeps the option to go back. The main condition is the minimum order, since 25,000 a quarter is half of 50,000 and would leave us holding stock. Risks are the 5 percent defect rate, currency and one-off closure costs, which we have not included. Next steps: negotiate the minimum order and a quality guarantee, run a label test with department stores and gift shops, and come back to the board with the real demand number."},"probes":[{"ask":"In one sentence, what do you tell the CEO?","listen":"Do not close Johor; move only the distributor volume."},{"ask":"Why distributors?","listen":"They said nobody would leave: no demand risk."},{"ask":"What has to be true for this to work?","listen":"The minimum order must be cut from 50,000 to about 25,000 a quarter."},{"ask":"The CEO says: half-measures are the worst of both. Why not all in?","listen":"The full gain is thin, 0.19 million, and flips at 12 percent loss; a partial move captures more with less risk."},{"ask":"What would you do next?","listen":"Negotiate minimum order and quality guarantee; test the label with other customers; add closure cost and currency."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Cost per flask by site","chart":"table","columns":["Item","Johor, Malaysia (MYR per flask)","Central Java, Indonesia (MYR per flask)"],"rows":[["Selling price",100,100],["Production cost (ex-works)",60,45],["Freight, duty and handling",0,7],["Landed cost",60,52],["Failed inspection (% of flasks)","2%","5%"]],"note":"A failed flask is scrapped and replaced at the full landed cost. Annual volume today: 200,000 flasks."},{"id":"e2","title":"Exhibit 2: Customer survey by segment","chart":"bar","columns":["Segment","Share of volume (%)","Would stop buying if made offshore (%)"],"rows":[["Distributors",50,0],["Department stores",30,20],["Gift and tourist shops",20,20]],"note":"Source: company sales survey, stated intent. Not tested in the market.","series":[1,2]},{"id":"e3","title":"Exhibit 3: Quarterly demand after any demand loss, vs supplier MOQ","chart":"table","columns":["Scenario","Quarterly demand (flasks)","Probability (%)"],"rows":[["Low",40000,25],["Medium",45000,50],["High",50000,25]],"note":"MOQ: 50,000 flasks per quarterly order. A leftover flask is held for one quarter at MYR 4 (storage, capital, damage)."},{"id":"e4","title":"Exhibit 4: Order-to-shelf time","chart":"stacked","columns":["Step","Johor (weeks)","Central Java (weeks)"],"rows":[["Production and queue",1,4],["Sea freight and customs",0,5],["Inland and receiving",1,1],["Total",2,10]],"note":"Cost of capital: 10% a year. Pipeline stock is valued at landed cost.","series":[1,2],"rowsUsed":[0,1,2],"transpose":true}],"recommendation":"Do not close Johor on this case. Offshoring pays MYR 6.60 more per flask, but after a 10% demand loss, MOQ holding cost and ten weeks of extra stock, the gain is only MYR 0.19m a year. That is 2.4% of home profit. It flips if demand loss goes above 12%, and the 10% is only a survey answer. My advice is to offshore the distributor volume only. Those customers said nobody would leave, and the gain is about MYR 0.58m a year. Before that, we must cut the MOQ to 25,000 a quarter and get a quality guarantee. Next steps: negotiate with the supplier, test the label on the department stores and gift shops, and add the one-off closure cost and currency risk.","good":["Computes profit per flask at both sites, with freight and remake cost, and gets MYR 6.60","Applies the weighted demand loss and the probability-weighted MOQ holding cost correctly","Finds that the result is thin and names demand loss as the swing assumption","Mentions lead time and working capital"],"great":["States the break-even loss (about 12% all-in) and compares it with the survey's 10%","Quantifies the cash cost of the extra eight weeks of stock","Proposes a split or a test, not an all-in move, and links the MOQ to the split","Questions the survey: stated intent is not behaviour, and the downside is larger than the upside"],"mistakes":["Stopping at the MYR 15 ex-works gap and saying offshore wins","Leaving out freight, duty or the remake cost of failed flasks","Using the maximum leftover (10,000) instead of the probability-weighted average (5,000)","Giving a yes or no with no break-even and no next step","Forgetting that lost volume also lowers the offshore profit, not just the home comparison"],"inspiredBy":{"title":"MBB Second Round - TitanTrail - \"Made in the USA\" Operations Outsourcing","url":"https://www.preplounge.com/en/management-consulting-cases/candidate-led/advanced/mbb-second-round-titantrail-made-in-the-usa-operations-outsourcing-345","author":"Coach-authored","skills":"Unit profit home vs offshore with defect and remake cost, demand loss from local-production customers, MOQ holding cost as a probability-weighted average, a knife-edge result with break-even, lead time and working capital."},"glossary":[{"term":"Offshoring","meaning":"Moving production to a plant in another country."},{"term":"Ex-works price","meaning":"The factory's price for the goods, before freight, duty and handling."},{"term":"Landed cost","meaning":"The full cost of a flask once it is in the client's warehouse: price plus freight, duty and handling."},{"term":"Minimum order quantity (MOQ)","meaning":"The smallest number of flasks the supplier will make in one order, here 50,000 a quarter."},{"term":"Working capital","meaning":"Cash tied up in stock that is paid for but not yet sold."},{"term":"Pipeline stock","meaning":"Stock that is paid for but still on the road or on the ship."},{"term":"Break-even","meaning":"The value of an assumption at which two options give the same profit."},{"term":"Contract manufacturer","meaning":"An outside factory that makes products for a brand to its specification."}]},{"id":"coffee-chain-profit","title":"Profit falls as sales grow (Saigon Bean House)","client":"Saigon Bean House JSC, a Vietnamese chain of coffee shops with about 120 stores.","country":"Vietnam","type":"general","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"Why did profit fall 22% while revenue grew 10%, and what should the chain do?","prompt":"Saigon Bean House is a Vietnamese coffee chain with around 120 stores. Last year revenue grew 10%, but operating profit fell by more than a fifth. The CEO does not understand why. She asked Inverto to find the cause and propose a plan. The CPO is also in the meeting tomorrow. We will go step by step. To start, how would you structure the problem?","clarifying":[{"q":"Did the number of stores change?","a":"No. The same stores in both years. Growth came from more cups per store."},{"q":"What happened to price and product mix?","a":"Average price per cup was flat at VND 20,000. Mix was stable. Cups sold went from 40 million to 44 million. (Give if asked.)"},{"q":"What is in cost of sales?","a":"Coffee beans, milk, cups and packaging, and barista labour. Rent, HQ and marketing, and other store costs are separate."},{"q":"How are beans and milk bought?","a":"Beans are imported and priced in USD per kg by one supplier. The contract has no index clause and no price cap. Milk comes from one local dairy on a price list. (Give if asked.)"},{"q":"Is there anything unusual in the year, such as one-offs?","a":"No one-offs in either year."},{"q":"What are competitors doing on price, and how do customers react?","a":"Two main competitors raised prices by about 3% to 5% this year. The chain has no data yet on how customers react to price changes. (Give if asked.)"}],"structure":{"notes":"A good candidate starts from profit = revenue - cost, splits revenue into volume x price x mix and cost by line, and says which line they want to see first. They also ask what is within the client's control.","branches":[{"name":"Revenue","points":["Volume (cups, stores, traffic)","Price per cup","Product mix"]},{"name":"Cost","points":["Cost of sales: beans, milk, cups, labour","Rent and utilities","HQ and marketing","Other store costs"]},{"name":"External factors","points":["Commodity prices","FX (VND vs USD)","Wage inflation"]},{"name":"Levers","points":["Price and mix","Recipe and spec","Procurement: tender, contract terms, hedging"]}]},"stages":[{"id":"s1","title":"Structure","timer":"structure","minutes":5,"question":"How would you structure the analysis to find out why profit fell although revenue grew?","notes":"Look for profit = revenue - cost with volume, price, mix and cost by line. If they ask for data, say you will show the P&L next. Do not give numbers yet.","exhibits":[],"hints":["Start from the profit formula.","Which side first: revenue or cost?"],"solution":"Profit = revenue - cost.\nRevenue = cups x price per cup, adjusted for mix.\nCost = cost of sales (beans, milk, cups, labour) + rent + HQ and marketing + other store costs.\nI would first look at the P&L for two years to see which line grew faster than revenue.\nThen I would break that line down into price and quantity, and into what the client controls and what it does not.","answers":{"standard":"Profit is revenue minus cost. Revenue is cups times price per cup. Cost is cost of sales, rent, head office and other store costs. I would look at the profit and loss for both years and see which line grew faster than revenue.","great":"Profit equals revenue minus cost. On revenue I check cups, price and mix. On cost I check each line: cost of sales, rent, head office, other store costs. I also split drivers into what the client controls, like price and recipe, and what it does not, like bean prices and excha
