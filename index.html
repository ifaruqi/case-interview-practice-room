:"The CPO says: start with our biggest category, electronics. Respond.","listen":"They ask for the numbers first: size by savings, not spend, then agree."}]},{"id":"s2","title":"Rank the categories and pick three","timer":"math","minutes":12,"question":"Here is the category data. Work out the savings range per category in MYR. Which three categories would you take on, and does that reach the MYR 8 million target?","notes":"Method: spend x addressable % x savings %. Do it for low and high, and use the midpoint to rank. Trap: ranking by spend would pick electronics, copper and freight. Ranking by midpoint savings picks plastic housings, freight and packaging. Check the target: the midpoint of the top three is MYR 8.2m, just above the target. The low case is MYR 6.3m, below it. A good candidate says so and names a backup (MRO or electronics). Let them calculate on paper.","exhibits":["e1"],"hints":["Addressable spend first, then the savings %.","Rank by the midpoint of the range, in MYR."],"solution":"Savings = spend x addressable share x savings %. Spend and savings are in MYR million.\nElectronic components: 120 x 40% = 48.0 addressable. Savings 3 to 5% = 1.44 to 2.40. Midpoint 1.92.\nPlastic housings: 45 x 80% = 36.0. Savings 8 to 12% = 2.88 to 4.32. Midpoint 3.60.\nPackaging: 30 x 90% = 27.0. Savings 6 to 10% = 1.62 to 2.70. Midpoint 2.16.\nFreight and logistics: 50 x 70% = 35.0. Savings 5 to 9% = 1.75 to 3.15. Midpoint 2.45.\nCopper and brass contacts: 60 x 50% = 30.0. Savings 4 to 6% = 1.20 to 1.80. Midpoint 1.50.\nMRO and indirect: 25 x 60% = 15.0. Savings 10 to 15% = 1.50 to 2.25. Midpoint 1.88.\nRank by spend: electronics 120, copper 60, freight 50, plastic 45, packaging 30, MRO 25.\nRank by savings midpoint: plastic 3.60, freight 2.45, packaging 2.16, electronics 1.92, MRO 1.88, copper 1.50.\nThe ranking is almost the reverse. Electronics is the largest spend at 36% of the total, but only 40% is addressable and the savings % is low. Copper and brass is second by spend and last by savings.\nFocus categories: plastic housings, freight and logistics, packaging. Together they are 125 of 330 spend, 38%, and give a midpoint of MYR 8.2m, which is 61% of all savings in the midpoint case.\nTarget check: low case 2.88 + 1.75 + 1.62 = 6.25. Midpoint 8.21. High 10.17. The target of 8 is met at the midpoint but not in the low case. I would keep MRO as a quick-win backup, at 1.5 to 2.25.\nSo-what: put the three slots on plastic housings, freight and packaging.","answers":{"standard":"I multiply spend by addressable share by savings percentage, for low and high. The three largest savings are plastic housings at 2.9 to 4.3 million, freight at 1.8 to 3.2 and packaging at 1.6 to 2.7. Together that is MYR 6.3 to 10.2 million, and about 8.2 in the middle. So the target of 8 is just met in the middle case.","great":"Ranking by spend would pick electronics, copper and freight, but ranking by savings picks plastic housings, freight and packaging. Electronics is the biggest at 120 million, but only 40 percent is addressable and the savings rate is low. The three I pick are 38 percent of spend and 61 percent of the middle-case savings. They give 6.3 in the low case, 8.2 in the middle and 10.2 in the high case. So 8 million is met in the middle but not in the low case. I would keep MRO as a backup, worth 1.5 to 2.25 million.","best":"The ranking is nearly the reverse of the spend ranking, which is the main message. Plastic, freight and packaging give MYR 8.2 million at the midpoint, a 2.5 percent saving on total spend. The target is met by only 0.2 million, and the low case is 6.3, so the plan has no safety margin. I would therefore name MRO as a fourth category, since it has the highest savings rate and is cheap to run, and I would ask the CPO if she wants it to start early. The benchmark ranges are assumptions, so I would test plastic first with quotes. I would also ask how fast each category can deliver, since 18 months is short for freight contracts."},"probes":[{"ask":"Why are the three picks not the three biggest spends?","listen":"Big spend can be mostly locked or give low savings; electronics is 36 percent of spend but only 40 percent addressable."},{"ask":"Does your plan reach MYR 8 million?","listen":"Yes at the midpoint, 8.2; no in the low case, 6.3."},{"ask":"What would you do about that gap?","listen":"Backup category such as MRO, or start early on a fourth."},{"ask":"The CFO says: use the high case, 10.2, as the plan. Respond.","listen":"High case is not a plan; commit the middle or low, treat high as stretch."},{"ask":"Why use the midpoint?","listen":"Ranking by a single typical number; ranges are benchmarks."}]},{"id":"s3","title":"Your choice: make the plan safe","timer":"exhibit","minutes":9,"question":"The CPO says the plastic housing suppliers have not changed in nine years. What would you like to do about that? You choose the next step.","notes":"Candidate-led. The expected choice is a supplier risk view. If they propose something else (for example going straight to the RfQ), accept it for one minute, then say the CPO asked for a risk view first. Let them name risks on their own for about two minutes, then hand out Exhibit 2, the CPO's team list. Candidate computes impact x probability, ranks, and proposes mitigations for the top three. Listen for the link to the RfQ: tooling transfer, index clause, second source. Strong candidates note that impact x probability under-ranks the single-site dependency (impact 5, the highest possible, but scored only 10 because it is unlikely), so a severe risk should also be ranked on impact alone.","exhibits":["e2"],"hints":["How would you score each risk so you can rank them?","Which mitigations can the RfQ and the contract deliver?"],"solution":"I would build a simple risk register: each risk gets an impact and a probability from 1 to 5. The score is impact x probability.\nResin price swings with no index clause: 3 x 5 = 15.\nMoulds owned and kept by the main moulder: 4 x 3 = 12.\nMain moulder holds 85% of volume at one site: 5 x 2 = 10.\nLabour shortage at the main moulder: 3 x 3 = 9.\nSmall moulder owner retiring with no successor: 2 x 4 = 8.\nNo ESG audit in nine years: 3 x 2 = 6.\nThe top three are resin price, the moulds and the dependency on one site.\nMitigations.\nOne. Resin: put an index clause in the new contract, linked to a published resin index with a formula, a cap and a floor.\nTwo. Moulds: take ownership of the moulds or get a written right to move them, make copies of the key moulds, and check the mould condition.\nThree. Dependency: qualify a second supplier and give it part of the volume, so no moulder holds more than 60 to 65%.\nAlso. Run an ESG audit now, and make a plan for the small moulder, which is likely to leave.\nSo-what: the two biggest risks can be fixed in the contract, and the third needs a second source. That feeds the RfQ.","answers":{"standard":"I would list the risks in the plastic housing supplier base and score each from 1 to 5 for impact and probability, then multiply. Resin price scores 15, moulds 12 and dependency on one site 10. For the top three I add fixes: a price index clause, mould ownership and a second supplier.","great":"I would build a risk register with impact and probability from 1 to 5, and multiply. The top three are resin price swings with no index clause at 15, moulds owned by the main moulder at 12, and 85 percent of volume at one site at 10. The first two can be fixed in the contract with an index clause and a right to move the moulds. The third needs a second supplier so no one holds more than 60 to 65 percent. I would also run an ESG audit and plan for the small moulder's owner retiring. These points feed straight into the RfQ.","best":"I would score and rank, but I would also challenge the method. Multiplying impact by probability puts the single-site dependency only third at 10, because it is unlikely. Its impact is 5, the highest possible, so if it happens the plant stops. I would rank it first on impact alone and treat it as a must-fix, not a nice-to-have. The resin and mould risks can be handled in the contract. The site risk needs a second source, which is a cost, so I would price it. The scores are the CPO team's own opinion. I would test them with the procurement team and check the mould ownership in the contracts. The RfQ is where all the fixes go in."},"probes":[{"ask":"How do you decide which risk comes first?","listen":"They score impact and probability and multiply, or give a clear rule."},{"ask":"Does multiplying always rank risks well?","listen":"No. A rare but severe risk, like the single site with impact 5, scores only 10 and ranks third; it should be ranked on impact too."},{"ask":"Which risks can the contract fix, and which cannot?","listen":"Resin price and moulds can be fixed in the contract; site dependency needs a second supplier."},{"ask":"The CPO says: the main supplier has never failed us, so why worry? Respond.","listen":"Past performance is not protection: 85 percent at one site, no index clause, nine years untested."},{"ask":"What would you do about the small moulder?","listen":"Its owner is retiring; plan to move its 15 percent to others."}]},{"id":"s4","title":"Check the RfQ scorecard","timer":"exhibit","minutes":11,"question":"The RfQ is done and three suppliers have bid. Your team built this scorecard. The CPO set the weights: qualitative 30%, quantitative 30%, cost 40%. Please check what the scorecard says and whether it does what the CPO wants. What do you conclude?","notes":"Trap: the sheet gives each criterion 10 points. There are 5 qualitative, 3 quantitative and 2 cost criteria, so the effective weights are 50 / 30 / 20, not 30 / 30 / 40. The sheet totals are P 37, R 35, Q 32 out of 50 (74%, 70%, 64%). With the intended group weights the order flips: Q 3.68, P 3.36, R 3.10 out of 5. A good candidate spots it from the number of criteria per group. Let them calculate the group averages. Do not tell them the trap. If the candidate asks where the small moulder is: it did not bid, because it plans to stop within a year (see clarifying answers).","exhibits":["e3"],"hints":["How many criteria are in each group, and what does the sheet give each?","Take the average score per group, then apply 30 / 30 / 40."],"solution":"First check the weights. Each criterion has 10 points. Qualitative has 5 criteria = 50 points. Quantitative has 3 = 30 points. Cost has 2 = 20 points.\nSo the sheet gives 50 / 30 / 20, not the 30 / 30 / 40 that the CPO wants. Cost is under-weighted and quality is over-weighted.\nSheet result (score out of 50): P 37 = 74%. R 35 = 70%. Q 32 = 64%.\nNow apply the intended weights. First the average score per group, out of 5.\nQualitative: P 21 / 5 = 4.2. Q 13 / 5 = 2.6. R 20 / 5 = 4.0.\nQuantitative: P 11 / 3 = 3.67. Q 9 / 3 = 3.0. R 11 / 3 = 3.67.\nCost: P 5 / 2 = 2.5. Q 10 / 2 = 5.0. R 4 / 2 = 2.0.\nWeighted: P = 0.3 x 4.2 + 0.3 x 3.67 + 0.4 x 2.5 = 3.36.\nQ = 0.3 x 2.6 + 0.3 x 3.0 + 0.4 x 5.0 = 3.68.\nR = 0.3 x 4.0 + 0.3 x 3.67 + 0.4 x 2.0 = 3.10.\nThe order flips. The sheet says P, R, Q. The intended weights say Q, P, R.\nSo-what: do not send the sheet. Fix it by weighting the group, not each criterion. P and Q are the two best. R is last on cost and does not add anything the others lack. Q is weak on qualitative points (ESG 2, cooperation 2), which is exactly the risk to manage.","answers":{"standard":"I check the weights first. Each criterion has 10 points, and qualitative has five criteria, quantitative three, cost two. So the sheet gives 50, 30 and 20 percent, not the 30, 30 and 40 the CPO wants. The sheet ranks P, R, Q. With the right weights the order is Q, P, R. So the scorecard needs to be fixed before we use it.","great":"The sheet is wrong because the weight of a group depends on how many criteria it has. Cost has only two criteria, so it counts for 20 percent, not 40. I take the average score per group and apply 30, 30, 40. That gives Q 3.68, P 3.36 and R 3.10 out of 5. The sheet had P at 74 percent, R at 70 and Q at 64, so the order flips. I would not send this sheet to the CPO. Q wins on cost but is weak on ESG and cooperation, each 2, which is the risk to manage.","best":"The scorecard does not do what the CPO asked, because criterion count sets the weights. After fixing it, Q comes first at 3.68, then P at 3.36 and R at 3.10. The gap between Q and P is only 0.3, so I would test how sensitive the order is: if cost were 30 percent instead of 40, would P win? That tells us how much the award depends on the CPO's weights. I also notice that Q wins by being cheap while scoring 2 on ESG and cooperation, so I would not treat Q as a clean winner. A good scorecard should have a minimum on critical criteria such as ESG. The small moulder did not bid, so there are only three bidders. My next step is to fix the sheet, show the CPO both results, and agree conditions for Q."},"probes":[{"ask":"How many criteria are in each group, and what does the sheet give each?","listen":"Five, three and two criteria, each worth 10 points: 50, 30, 20 points."},{"ask":"What should the weights have been?","listen":"30, 30 and 40 percent, as the CPO asked."},{"ask":"Does the winner change after your fix?","listen":"Yes: Q, P, R instead of P, R, Q."},{"ask":"The team lead says: the sheet is already built, just use it. Respond.","listen":"No: it under-weights cost and could lead to the wrong supplier; the fix is easy."},{"ask":"What worries you about the new winner?","listen":"Q is weak on ESG and cooperation, each 2."}]},{"id":"s5","title":"Recommendation: one or two suppliers","timer":"recommendation","minutes":8,"question":"Time to decide. What do you recommend to the CPO for the plastic housing contract, with numbers? You may also add what the team does next.","notes":"Hand over Exhibit 4 (bid prices and capacity). Expected answer: dual source P and Q, with a split that respects Q's cap of 40% in year one. Saving at 60 / 40: blended price index 91.6, saving 8.4% on MYR 36m addressable = MYR 3.0m, inside the benchmark range (2.9 to 4.3). Compare with all Q: 4.3m. The cost of the second source is MYR 1.3m a year. Listen for: why not all to Q (single site risk, ESG 2, not proven, cap of 40%), why not R (last on cost, no additional benefit), conditions on Q (ESG audit, quality gate), and review of the split after 12 months. Good extra: the candidate notes that the small moulder is exiting, so its 15% moves to P and Q, and explains why two suppliers and not three (P and Q cover 100% of volume, R is the dearest at index 96, a third set of moulds adds cost, and volume spread thinner cuts leverage).","exhibits":["e4"],"hints":["How much can Q take in year one?","What do you give up against an all-Q award, and what do you buy for it?"],"solution":"Recommendation: dual source. P and Q, split 60 / 40. Not R.\nNumbers. Addressable plastic spend is MYR 36m.\nP bids index 94, Q bids index 88. Q can take at most 40% in year one.\nBlended index = 0.6 x 94 + 0.4 x 88 = 56.4 + 35.2 = 91.6.\nSaving = 8.4% x 36 = MYR 3.0m a year. That is inside the benchmark range of 2.9 to 4.3, and it is 37% of the MYR 8.2m we need from the three focus categories.\nAll to Q is not possible in year one, and in theory it would give 12% x 36 = MYR 4.3m. So the second source costs MYR 1.3m a year compared with the theoretical best.\nWhere the 15% goes. The small moulder did not bid and is stopping within a year, so all volume moves to P and Q.\nWhy two and not three. P and Q cover 100% of volume between them. R bids index 96, the dearest, and adds nothing P and Q lack. A third source means a third set of moulds and less leverage with each supplier.\nWhy this is right. P and Q are the top two on the intended weights, and they use different sites, so one site problem does not stop all supply. P has the moulds and the quality record. Q has the lowest price. R is last on cost and adds nothing new.\nRisks. Q has weak ESG and cooperation scores. Make the award conditional on an ESG audit and a quality gate with a clear fix plan. Put the resin index clause in both contracts. Take ownership of the moulds at P.\nNext steps. Fix the scorecard weights and re-send. Run the ESG audit at Q. Sign contracts in the next quarter. Review the split after 12 months: if Q passes the gates, move to 50 / 50. Start the freight and packaging projects in parallel.","answers":{"standard":"I recommend a dual source: P and Q, split 60 and 40. Q can take at most 40 percent in year one. The blended price index is 91.6, which saves 8.4 percent of MYR 36 million, about MYR 3.0 million a year. I would not use R, as it is the dearest and adds nothing. Q needs an ESG audit before award.","great":"I recommend P and Q, split 60 and 40, not R. The blended price index is 0.6 times 94 plus 0.4 times 88, so 91.6, a saving of MYR 3.0 million a year on MYR 36 million. All to Q would save 4.3 million, but Q can only take 40 percent and has weak ESG. So the second source costs 1.3 million a year, which is the price of supply security. The small moulder's 15 percent moves to P and Q. Conditions: an ESG audit and quality gate at Q, an index clause in both contracts, and mould ownership at P. Review the split after 12 months.","best":"My recommendation is a dual source with P at 60 percent and Q at 40 percent, saving about MYR 3.0 million a year. That is 37 percent of the 8.2 million we need from the three projects, so plastics carries the plan. All-Q at 4.3 million is not possible in year one and would put us back in a one-site position, so the 1.3 million difference is the cost of avoiding it. R is last on cost and adds nothing P and Q lack. Three suppliers dilute volume and add a third set of moulds. The risks are Q's ESG and quality, so the award depends on an audit and a quality gate with a fix plan. If Q passes, move to 50 and 50 after a year. I would also tell the CPO that the 3.0 million is a bid price, so we should check it is held after the first year. Next steps: fix the scorecard, audit Q, sign next quarter, and start freight and packaging in parallel."},"probes":[{"ask":"Why two suppliers and not one?","listen":"One supplier is a single-site dependency; Q can take only 40 percent anyway."},{"ask":"Why not three?","listen":"P and Q cover 100 percent; R is dearest and adds nothing; a third set of moulds costs more."},{"ask":"What does the second source cost, and what does it buy?","listen":"MYR 1.3 million a year compared with all-Q; it buys supply security."},{"ask":"The CFO disagrees: just give everything to the cheapest bidder. Respond.","listen":"Q cannot take more than 40 percent in year one, has weak ESG, and would be single-site."},{"ask":"What happens to the small moulder's volume?","listen":"It did not bid and is stopping; the 15 percent moves to P and Q."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Spend, addressability and savings range by category","chart":"hbar","columns":["Category","Spend (MYR m per year)","Addressable (% of spend)","Savings, low (% of addressable)","Savings, high (% of addressable)"],"rows":[["Electronic components (PCBA)",120,40,3,5],["Plastic housings",45,80,8,12],["Packaging",30,90,6,10],["Freight and logistics",50,70,5,9],["Copper and brass contacts",60,50,4,6],["MRO and indirect",25,60,10,15]],"note":"Spend is for the last 12 months. Savings ranges are Inverto benchmarks. Total spend is MYR 330m.","series":[1]},{"id":"e2","title":"Exhibit 2: Risks in the plastic housing supplier base, listed by the CPO's team","chart":"scatter","columns":["Risk","Impact (1 low to 5 high)","Probability (1 low to 5 high)"],"rows":[["Resin price swings, no index clause in the contract",3,5],["Moulds owned and kept by the main moulder",4,3],["Main moulder holds 85% of volume at one site",5,2],["Labour shortage at the main moulder",3,3],["Owner of the small moulder is retiring, no successor",2,4],["No ESG audit in nine years",3,2]],"note":"Two moulders today: the main moulder P, and a small moulder with 15% of volume. Neither has changed in nine years.","series":[1,2]},{"id":"e3","title":"Exhibit 3: RfQ scorecard sheet for plastic housings (scores 1 worst to 5 best)","chart":"table","columns":["Criterion","Group","Points","P","Q","R"],"rows":[["Quality system","Qualitative",10,4,3,5],["Tooling and design support","Qualitative",10,5,3,4],["ESG audit result","Qualitative",10,3,2,5],["Financial health","Qualitative",10,4,3,3],["Cooperation and responsiveness","Qualitative",10,5,2,3],["On-time delivery","Quantitative",10,4,3,4],["Defect rate","Quantitative",10,3,4,4],["Lead time","Quantitative",10,4,2,3],["Unit price","Cost",10,2,5,2],["Tooling and set-up cost","Cost",10,3,5,2]],"note":"P is the current main moulder. Q is a moulder in Batam, Indonesia. R is a moulder in Rayong, Thailand. Cost scores are set from the bid prices and tooling quotes. The sheet adds points x score for each bidder. Group weights set by the CPO: qualitative 30%, quantitative 30%, cost 40%."},{"id":"e4","title":"Exhibit 4: Bid prices and capacity for plastic housings","chart":"table","columns":["Bidder","Bid price index (current price = 100)","Maximum share of volume in year one (%)"],"rows":[["P",94,100],["Q",88,40],["R",96,100]],"note":"Addressable plastic housing spend is MYR 36m a year. The benchmark savings range is 8 to 12%."}],"recommendation":"I recommend that we put the three project slots on plastic housings, freight and logistics, and packaging. Together they give a midpoint saving of MYR 8.2 million a year, just above the target of 8. The low case is 6.3, so MRO stays as a backup. For plastic housings, I recommend a dual source: P and Q, split 60 / 40. The first scorecard gave the wrong weights, because quality had five criteria and cost only two. With the right weights, Q and P are the top two. The small moulder is leaving, so its 15% moves to P and Q. The blended bid price is index 91.6, a saving of MYR 3.0 million a year. An all-Q award would give 4.3 million, but Q can only take 40% in year one and has weak ESG scores. So the second source costs MYR 1.3 million a year. That is the price for supply security. Risks are the quality and ESG at Q, resin prices and the moulds. We cover them with an ESG audit before award, a quality gate, an index clause and mould ownership. Next steps: fix the scorecard, audit Q, sign in the next quarter, and start freight and packaging in parallel.","good":["Calculates addressable spend and savings range per category, and ranks by MYR saved, not by spend","Picks plastic housings, freight and packaging, and checks the result against the MYR 8m target","Scores each risk as impact x probability and links the top three to concrete mitigations","Notices that the number of criteria changes the effective weights"],"great":["Points out that the target is met at the midpoint but not in the low case, and names a backup category","Recomputes the scorecard with group averages and shows that the order flips from P, R, Q to Q, P, R","Prices the dual source: MYR 3.0m saving against 4.3m for all-Q, so MYR 1.3m a year for supply security","Sets conditions on the second supplier and a review of the split after 12 months"],"mistakes":["Picking the categories with the largest spend: electronics and copper","Ignoring the addressable share and applying savings to total spend","Giving a risk list with no scores and no mitigations","Adding up the scorecard without checking how many criteria are in each group","Awarding everything to the lowest bidder without the capacity cap or an ESG check","Forgetting the small moulder's 15%: it did not bid and is exiting, so its volume has to move to the new suppliers."],"inspiredBy":{"title":"Inverto Case: VacuLuxe Innovations' Supply Chain Makeover","url":"https://www.preplounge.com/en/management-consulting-cases/candidate-led/intermediate/inverto-case-vaculuxe-innovations-supply-chain-makeover-331","author":"Inverto (company case)","skills":"Spend baseline times addressability times savings range to rank categories by MYR, a supplier risk register for an old supplier base, a weighted RfQ scorecard where the number of criteria per group changes the weights, and a dual-source result."},"glossary":[{"term":"RfQ (request for quote)","meaning":"A formal request sent to suppliers asking them to bid a price and terms for a defined job."},{"term":"Addressable spend","meaning":"The part of spend where we can change the supplier, terms or specification in the next 18 months."},{"term":"MRO and indirect","meaning":"Maintenance, repair and other items the company buys that do not go into the product."},{"term":"Index clause","meaning":"A contract term that moves the price up or down with a published market price, here plastic resin."},{"term":"Moulds (tooling)","meaning":"The steel tools used to form plastic parts. Whoever owns them can move or block production."},{"term":"Dual source","meaning":"Buying the same item from two suppliers at once, so one failure does not stop supply."},{"term":"ESG audit","meaning":"A check of a supplier's environmental, labour and safety practices."},{"term":"Bid price index","meaning":"A bid price shown against today's price set at 100, so 88 means 12 percent cheaper."}]},{"id":"equipment-tco-consolidation","title":"Mekong Packaging: compressor consolidation","client":"Mekong Packaging Group, a Vietnamese maker of plastic and paper packaging with six plants and 60 air compressors to buy over three years","country":"Vietnam","type":"procurement","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"Cut the cost and the carbon of 60 new air compressors by bundling demand, standardising models and designing the RfQ.","prompt":"Our client is Mekong Packaging Group, a Vietnamese packaging maker with six plants. Over the next three years it will buy 60 industrial air compressors, for replacement and for new lines. Today each plant picks its own supplier and model, so the group buys four different models. The CPO wants two things. First, a lower total cost. Second, a plan to cut upstream emissions from these purchases, because two large customers now ask for Scope 3 data, which means the emissions that come from what the group buys. You are on the Inverto team and you meet the CPO tomorrow. How would you approach this?","clarifying":[{"q":"Do all four models meet our technical needs?","a":"Yes. All four fit every plant. Capacity and pressure are the same. Spare parts are not interchangeable between suppliers."},{"q":"What is the electricity price and how long do the machines run?","a":"Electricity is USD 0.10 per kWh. The machines run most of the day, and the yearly energy use per machine is in the exhibit. Give this if asked."},{"q":"How do we compare machines with different lifespans?","a":"Spread the purchase price evenly over the lifespan. Ignore discounting for now. Give this if asked."},{"q":"Are the prices the same for a single plant order and a group order?","a":"The prices in the exhibit are for the full group bundle. Give this if asked."},{"q":"Is the lifespan reliable?","a":"Lifespans are the suppliers' own claims. Only supplier A has a reference site that is 10 years old. Give this if asked."},{"q":"Can any supplier deliver all 60 units?","a":"Yes, in three years. Supplier C needs 6 months of lead time for the first batch."}],"structure":{"notes":"Good structure: cost first (total cost of ownership, not price), then the sourcing strategy (bundle, standardise, second source), then emissions levers, then how the RfQ turns all this into a decision. Cost and carbon are linked here, because energy is both the biggest cost and a large part of emissions.","branches":[{"name":"Total cost of ownership","points":["Purchase price spread over lifespan","Energy cost","Maintenance and consumables","Check lifespan claims"]},{"name":"Sourcing strategy","points":["Bundle volume with one lead supplier","Standardise models and spare parts","Dependency risk and second source","Lead time and service coverage in six plants"]},{"name":"Scope 3 upstream emissions","points":["Product: design, materials, efficiency","Process: how the supplier makes it","Organisation: targets, data, governance"]},{"name":"RfQ design","points":["Criteria and weights: cost, resilience, carbon","Data required from bidders","Contract terms and incentives"]}]},"stages":[{"id":"s1","title":"Structure the approach","timer":"structure","minutes":5,"question":"How would you structure the work for the CPO?","notes":"Listen for: total cost, not price. A sourcing strategy that goes beyond picking the cheapest. Emissions as its own block. An RfQ as the way to run it. Give clarifying answers as asked. Do not hand over the exhibit until the candidate asks how to compare the models or you reach stage 2.","exhibits":[],"hints":["Is the purchase price the real cost of a compressor?","What would you do with the volume of 60 units?"],"solution":"I would work in four blocks.\nBlock 1, total cost of ownership. Compare the four models on a yearly cost: purchase price spread over the lifespan, plus energy, plus maintenance and consumables.\nBlock 2, sourcing strategy. Bundle the 60 units with one lead supplier, standardise the models, and name the dependency risk and the second source.\nBlock 3, Scope 3. Which levers cut upstream emissions: product, process, organisation.\nBlock 4, the RfQ. Weights and data requests that reward both resilience and carbon.\nI would start with block 1, because it sets the base for everything else.","answers":{"standard":"I would work in four blocks: total cost of ownership, sourcing strategy, emissions, and how to run the tender. I would start with total cost, comparing models on cost per year and not on price.","great":"Four blocks. One, total cost of ownership: price spread over life plus energy plus maintenance. Two, sourcing: bundle the 60 machines, standardise the model, keep a second source. Three, upstream emissions levers. Four, the request for quotation, which turns all this into a decision. I start with cost, because energy is probably the biggest part and it links to emissions as well.","best":"I would use four blocks and one hypothesis: for machines that run all day, energy dominates the cost, so the cheapest to buy is not the cheapest to own, and the efficient model also helps carbon. So block one is yearly cost per model. Block two is bundling and standardising, with the dependency risk. Block three is emission levers grouped into product, process and organisation. Block four is the tender design with weights for cost, resilience and carbon. I would check the lifespan claims early, since they drive the ranking."},"probes":[{"ask":"Why is price not enough to compare compressors?","listen":"They run all day, so energy and maintenance over the life matter more than price."},{"ask":"Why bundle the 60 machines?","listen":"More volume gives a better price and fewer models means fewer spare parts."},{"ask":"The CPO says just ask each plant to pick the cheapest. Reply?","listen":"Cheapest to buy may be most expensive to own; and four models mean more spare-parts cost."},{"ask":"Why is emissions its own block?","listen":"Customers ask for data and the efficient machine links cost and carbon."}]},{"id":"s2","title":"Annualised cost per model","timer":"math","minutes":10,"question":"Here are the four models with price, lifespan, energy use and maintenance. Calculate the cost per year for each machine. Which model is the cheapest, and what surprises you?","notes":"Trap: the model with the lowest purchase price (D) has the highest yearly cost. The model with the highest price (C) has the lowest. Energy is about 70% of the yearly cost for every model. Candidate should state the method: price divided by lifespan, plus energy (kWh x USD 0.10), plus maintenance. Let them do it on paper. Then ask what would change the ranking: lifespan is the soft number. Give the 8-year stress test only if they get there.","exhibits":["e1"],"hints":["Divide the price by the lifespan first.","Energy cost = kWh per year x USD 0.10."],"solution":"Yearly cost = price / lifespan + energy + maintenance. Energy = kWh x USD 0.10.\nModel A: 60,000 / 10 = 6,000. Energy 300,000 x 0.10 = 30,000. Maintenance 6,000.\nYearly cost A = 42,000 USD.\nModel B: 45,000 / 8 = 5,625. Energy 330,000 x 0.10 = 33,000. Maintenance 8,000.\nYearly cost B = 46,625 USD.\nModel C: 80,000 / 12 = 6,667. Energy 270,000 x 0.10 = 27,000. Maintenance 5,000.\nYearly cost C = 38,667 USD.\nModel D: 35,000 / 6 = 5,833. Energy 360,000 x 0.10 = 36,000. Maintenance 9,000.\nYearly cost D = 50,833 USD.\nOrder by yearly cost: C 38,667, A 42,000, B 46,625, D 50,833.\nOrder by purchase price is the opposite at the ends: D is cheapest to buy at 35,000, C is the most expensive at 80,000.\nC costs 45,000 more to buy than D, but 12,167 less per year in total. Energy is about 70% of the yearly cost in every case, and the purchase price is only 12 to 17% of the cost over the life.\nStress test: C's lifespan is a claim. At 10 years C costs 40,000 a year. At 8 years it costs 42,000, the same as A. So C stays cheapest unless it lasts 8 years or less.\nSo-what: choose on yearly cost, not on price. C is the lead candidate and A is the next best.","answers":{"standard":"Yearly cost is price divided by lifespan plus energy plus maintenance. Model C is cheapest at 38,667 dollars, then A at 42,000, B at 46,625 and D at 50,833. The surprise is that D, cheapest to buy, is the most expensive per year.","great":"I spread the price over the life, add energy at 10 cents a kilowatt-hour, and add maintenance. C is 38,667 a year, A 42,000, B 46,625 and D 50,833. D has the lowest price, 35,000, but the highest yearly cost. C costs 45,000 more than D to buy, but 12,167 less a year. Energy is about 70% of the yearly cost. The lifespan is the soft number, so I would test it.","best":"Yearly cost: C 38,667, A 42,000, B 46,625, D 50,833 dollars. Price is only 12 to 17% of life cost, energy about 70%. So the ranking by price is nearly upside down. The risk is that lifespans are the suppliers' claims. If C lasts only 10 years it costs 40,000, and at 8 years 42,000, equal to A. So C wins unless it lasts 8 years or less. Only A has a 10-year reference site, so I would ask for warranties and visit reference sites before I rely on 12 years."},"probes":[{"ask":"Why divide the purchase price by the lifespan?","listen":"Machines last different years, so we need a cost per year."},{"ask":"Which model is cheapest to buy and which to own?","listen":"D cheapest to buy, 35,000. C cheapest to own, 38,667 a year."},{"ask":"The plant manager says D is cheapest, 35,000 against 80,000. Reply?","listen":"D costs 50,833 a year against 38,667. Energy dominates."},{"ask":"How reliable is the 12 years for C? What if it is less?","listen":"It is a supplier claim. At 8 years C equals A at 42,000. Ask for a warranty."},{"ask":"What share of the yearly cost is energy?","listen":"About 70%."}]},{"id":"s3","title":"Bundle, standardise, second source","timer":"exhibit","minutes":10,"question":"This is today's plan for the 60 machines by plant. What is the saving if the group standardises on the best model? What is the risk, and what would you do about it?","notes":"The plan mixes all four models. Expected: all 60 on C saves about USD 452,500 a year, 16%. Candidate should name the dependency risk: one supplier, one model, lead time of 6 months, spare parts, price power after the first contract. Good answer: keep a second source, A, for a part of the volume, and say what it costs. Listen for the cash point: all C needs USD 4.8m of purchase money against USD 2.9m in the current plan. Steer the split: 75 / 25 is the model answer, but accept 70 / 30 or 80 / 20 with numbers.","exhibits":["e2"],"hints":["Multiply the units of each model by its yearly cost from before.","What happens if C raises prices in year three, or has a plant stoppage?"],"solution":"Step 1. Current plan, yearly cost for the 60 machines.\nA: 15 x 42,000 = 630,000.\nB: 20 x 46,625 = 932,500.\nC: 5 x 38,667 = 193,333.\nD: 20 x 50,833 = 1,016,667.\nTotal = USD 2,772,500 a year.\nStep 2. All 60 on C: 60 x 38,667 = USD 2,320,000 a year.\nSaving = 452,500 USD a year, 16% of the current plan.\nStep 3. Cash check. All C: 60 x 80,000 = USD 4.8m to buy. Current plan: USD 2.9m. The group pays USD 1.9m more up front and earns it back through energy and maintenance.\nStep 4. Risk. One supplier and one model for all six plants. If C has a plant stoppage, a quality problem or a price push, every plant is exposed. C also needs 6 months of lead time, and spare parts are not interchangeable.\nStep 5. Mitigation. Keep A as the second source for 25% of the volume, which is 15 machines.\n45 x 38,667 = 1,740,000. 15 x 42,000 = 630,000. Total = USD 2,370,000.\nPremium over all C = 50,000 USD a year, 2%.\nSaving against today's plan = 402,500 USD a year, 14.5%. That is 89% of the full saving.\nSo-what: pay about 2% for a second source and keep nearly 90% of the saving. Run two spare parts sets, not four. Use the second supplier as price pressure in the next round.","answers":{"standard":"Today's plan costs 2.77 million dollars a year. All 60 on model C costs 2.32 million, so we save 452,500, which is 16%. The risk is one supplier for everything. So I would keep model A as a second source for part of the volume.","great":"All on C saves 452,500 a year, 16%. But one supplier and one model for six plants is a risk: a stoppage, a price push, and 6 months lead time. I would give 25% to A, which is 15 machines. Cost is 2.37 million, a premium of 50,000 over all C, 2%. We still save 402,500, 14.5%, which is 89% of the full saving. Cash up front is also higher, 4.5 million against 2.9.","best":"All C saves 452,500 a year, 16%, on a base of 2.77 million. I would not go all C: dependency, spare parts and a long lead time. A 75/25 split with A costs 50,000 more than all C, 2%, and keeps 89% of the saving. So the second source is cheap insurance, and it also keeps price pressure on C. It also gives two parts sets instead of four. Cash up front would be 1.6 million higher than today. I would ask whether the second source could instead be 20% or 30%, and let the tender bids decide."},"probes":[{"ask":"Why not give all 60 machines to model C?","listen":"One supplier, one model for six plants: stoppage risk, price push, lead time."},{"ask":"What does the second source cost?","listen":"50,000 a year, 2%, over all C."},{"ask":"The CFO says all C is cheaper by 50,000, so do it. Reply?","listen":"Saving is large either way. The extra 2% is cheap insurance, and keeps price pressure."},{"ask":"What is the cash difference?","listen":"All C needs 4.8 million up front against 2.9 today; 75/25 needs 4.5 million."},{"ask":"How would you decide the split?","listen":"Let the bids and the risk decide; 75/25 is a starting point."}]},{"id":"s4","title":"Scope 3 levers","timer":"brainstorm","minutes":8,"question":"The two big customers want the group to cut the upstream emissions from these purchases. Which levers does the group have? Please group them.","notes":"Expected grouping: product, process, organisation. Product: more efficient design, recycled or low-carbon materials, longer lifespan, less refrigerant or oil, repair and refurbish. Process: renewable power at the supplier plant, efficient production, lower-carbon steel and aluminium, shorter or sea freight. Organisation: supplier targets, emission data per unit, third-party verification, supplier engagement. Great answer notices that energy in use is the client's own Scope 2, not Scope 3 upstream. Upstream Scope 3 here is mainly the carbon inside the machine (capital goods) and the supplier's own operations. Energy-efficient machines still help both cost and Scope 2. Give if asked: no one has asked suppliers for carbon data yet.","exhibits":[],"hints":["Think about the machine itself, how it is made, and who runs the supplier.","Where is upstream Scope 3 here, and where is the client's own Scope 2?"],"solution":"I would group the levers in three.\nProduct. Ask for the carbon footprint per machine. Prefer designs with less material and with recycled steel and aluminium. Prefer a longer life and parts that can be repaired or refurbished, because a machine that lasts 12 years carries less carbon per year than one that lasts 6.\nProcess. Ask suppliers to use renewable power in their plants, cut waste in casting and machining, and use lower-carbon metal. Choose sea over air freight for delivery.\nOrganisation. Ask for a reduction target and a carbon figure per unit, checked by a third party. Make it part of the contract with a yearly review. Share the plan with the supplier, not only the demand.\nTwo points on the client's side. First, the energy the machines use is the client's own Scope 2, not upstream Scope 3. The carbon in the machine itself and in the supplier's plant is the upstream part. Second, the efficient model, C, helps both: 18% less electricity than today's mix, which is cost and Scope 2.\nSo-what: the product and process levers sit with the supplier, so the RfQ is the tool to get them.","answers":{"standard":"I group the levers into product, process and organisation. Product: lower-carbon design and a longer life. Process: renewable power and less waste at the supplier plant. Organisation: carbon targets and data from suppliers in the contract.","great":"Product: ask for the carbon per machine, prefer recycled metal, longer life and repairable parts. Process: renewable power at the supplier, less waste, sea over air freight. Organisation: a target and a carbon figure per unit, checked by a third party, in the contract. One point: the electricity the machines use is the client's own Scope 2, not upstream Scope 3. But the efficient model helps both cost and Scope 2.","best":"Three groups. Product, process, organisation, as above. Important distinction: the electricity in use is Scope 2, the client's own, while the upstream part is the carbon inside the machine and in the supplier plant. So the energy-efficient model cuts cost and Scope 2, but the customers' Scope 3 question needs supplier data. Nobody has asked suppliers for it yet, so I would put it in the tender as a scored criterion and a reporting duty. I would also check what format the two customers want, so we collect it once."},"probes":[{"ask":"What is the difference between Scope 2 and Scope 3 here?","listen":"Scope 2 is the electricity the client uses. Scope 3 upstream is the carbon in the machine and the supplier."},{"ask":"Why group the levers?","listen":"So the list is clear and complete: product, process, organisation."},{"ask":"The customers want a number now. What can the client give?","listen":"Not yet: no supplier carbon data. Ask for it in the tender."},{"ask":"Which lever matters most for the client's own emissions?","listen":"Choosing the efficient model, because electricity is Scope 2."},{"ask":"How would you check that supplier data is reliable?","listen":"Third-party verification, standard format."}]},{"id":"s5","title":"RfQ design and recommendation","timer":"recommendation","minutes":12,"question":"How would you design the RfQ so that it rewards resilience and carbon, not only price? Then give your recommendation to the CPO.","notes":"Listen for: bid on yearly cost, not on price, with energy data guaranteed. Resilience criteria: second plant or spare stock, lead time, service points in Vietnam, spare parts for 12 years, financial health. Carbon criteria: carbon per machine, renewable power share, reduction target, third-party verification. Weights shown in a sensible way, for example cost 50, resilience 25, carbon 25, with a minimum bar for each. Contract: guaranteed energy use with a penalty, price index for metal, split of volume for two awardees. Close with a clear recommendation and next steps.","exhibits":[],"hints":["What data do you need from bidders to compute yearly cost?","How do you make the bidders compete for the 75% and the 25%?"],"solution":"RfQ design.\nOne. Ask for a bid on the whole 60-machine bundle and let bidders also offer a split. Ask for price, lifespan with a warranty, guaranteed energy use per year, and maintenance and consumables cost for 10 years. We then compute the yearly cost ourselves.\nTwo. Score cost at 50%. Use yearly cost, not price.\nThree. Resilience at 25%. Lead time, a second production site or spare stock, service points near our six plants, spare parts for 12 years, financial health.\nFour. Carbon at 25%. Footprint per machine with a third-party check, share of renewable power at the plant, a reduction target with a yearly review.\nFive. Minimum bar on each group, so a very cheap bid with no carbon data cannot win.\nSix. Contract terms. Penalty if energy use is above the guaranteed value. Price index for metal. Right to move volume between the two awardees.\nRecommendation: bundle all 60 machines, standardise on the lowest yearly cost model, and keep a second source.\nWe expect C for about 75% and A for about 25%. The yearly cost is about USD 2.37m against USD 2.77m today. That is a saving of USD 0.4m a year, 14.5%, and about 15% less electricity than today's mix. The extra 2% over all C buys a second source.\nRisks: C's lifespan is a claim. At 8 years its advantage is gone, so we need a warranty. C needs 6 months of lead time, so we start the RfQ now. Cash up front is USD 1.6m higher, USD 4.5m against USD 2.9m today.\nNext steps: send the RfQ in two weeks, verify lifespans at reference sites, align the two customers on the carbon data format.","answers":{"standard":"I would bid on yearly cost, not price, and score cost 50%, resilience 25% and carbon 25%, each with a minimum bar. I recommend bundling all 60 machines, with model C for about 75% and A for about 25%. That costs 2.37 million a year instead of 2.77, a saving of 14.5%.","great":"RfQ: ask bidders for price, lifespan with warranty, guaranteed energy use and maintenance, so we compute yearly cost ourselves. Weights 50% cost, 25% resilience, 25% carbon, with a minimum on each. Contract: a penalty if energy use is above the guarantee, and volume that can move between two winners. Recommendation: C for 75%, A for 25%, saving 0.4 million a year, 14.5%, and about 15% less electricity. Risks: C's lifespan claim and 6 months lead time.","best":"My answer: bundle all 60 machines, award about 75% to C and 25% to A, and run the tender on yearly cost. It saves about 0.4 million dollars a year, 14.5%, with 15% less electricity, and the second source costs only 2%. In the RfQ, I use guaranteed energy use with a penalty, a warranty on lifespan, a metal price index, and carbon data checked by a third party, with minimum bars so a cheap bid with no data cannot win. Risks: C's lifespan is a claim, and at 8 years its edge is gone; 1.6 million more up-front cash. Next steps: send the RfQ in two weeks, visit reference sites, agree the carbon format with the two customers, and start now because C needs 6 months."},"probes":[{"ask":"Why use yearly cost and not price in the RfQ?","listen":"Price misleads: the cheapest price has the highest yearly cost."},{"ask":"Why a minimum bar for each criterion?","listen":"So a very cheap bid with no resilience or carbon data cannot win."},{"ask":"The CFO says carbon weight of 25% costs us money. Reply?","listen":"Carbon is a customer requirement and the efficient model is cheaper anyway."},{"ask":"What would make you change the split?","listen":"Bids show a lifespan below 8 years, or a supplier cannot deliver on time."},{"ask":"What do you do first?","listen":"Send the RfQ, because C needs 6 months of lead time."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Four compressor models in the bundle quote","chart":"table","columns":["Model","Purchase price (USD per machine)","Claimed lifespan (years)","Energy use (kWh per year)","Maintenance and consumables (USD per year)"],"rows":[["A",60000,10,300000,6000],["B",45000,8,330000,8000],["C",80000,12,270000,5000],["D",35000,6,360000,9000]],"note":"Electricity price: USD 0.10 per kWh. Prices are for the full group bundle. Lifespans are claims by the suppliers."},{"id":"e2","title":"Exhibit 2: Planned compressor purchases by plant over three years (units)","chart":"stacked","columns":["Plant","Model A","Model B","Model C","Model D","Total"],"rows":[["Binh Duong",4,5,0,6,15],["Hai Phong",3,4,2,5,14],["Da Nang",2,3,0,3,8],["Long An",3,4,1,2,10],["Dong Nai",2,2,2,2,8],["Can Tho",1,2,0,2,5],["Group total",15,20,5,20,60]],"note":"Each plant picked its own supplier. Spare parts are not interchangeable between the four models.","series":[1,2,3,4],"rowsUsed":[0,1,2,3,4,5]}],"recommendation":"I recommend that the group bundles all 60 machines, standardises on model C, and keeps model A as a second source for about a quarter of the volume. Reason one: the yearly cost of C is USD 38,667 against USD 46,000 to 51,000 for B and D, even though C has the highest price. Reason two: today's mix costs about USD 2.77m a year. The 75 / 25 split costs USD 2.37m. That saves USD 0.4m a year, 14.5%, and the second source costs only 2% over an all-C plan. Reason three: C is also the most energy efficient, so electricity falls by about 15% in the 75 / 25 split, which helps Scope 2 too. For Scope 3 we use the RfQ: weights of 50% cost, 25% resilience and 25% carbon, with a minimum bar on each, and carbon data checked by a third party. Risks: C's lifespan is a supplier claim, and below 8 years its advantage is gone. We ask for a warranty. Up-front cash is USD 1.6m higher. Next steps: issue the RfQ in two weeks, visit reference sites, agree the carbon data format with the two customers.","good":["Compares models on yearly cost, with price spread over lifespan, energy and maintenance","Finds that the cheapest model to buy is the most expensive to own","Sizes the saving of standardising: about USD 450,000 a year, 16%","Groups emission levers into product, process and organisation"],"great":["Stress-tests the lifespan claim and finds the break-even at 8 years for model C","Names the dependency risk, keeps a second source and prices it: USD 50,000 a year, 2%","Separates the client's own Scope 2 (electricity use) from upstream Scope 3 (carbon in the machine and the supplier plant)","Builds the RfQ with yearly cost, guaranteed energy use, minimum bars and a contract penalty"],"mistakes":["Ranking the models by purchase price and picking D","Forgetting to spread the price over different lifespans","Moving all 60 machines to one supplier with no second source","Listing emission ideas with no grouping and no link to the RfQ","Counting electricity use as upstream Scope 3"],"inspiredBy":{"title":"Inverto Case: Fast Dish Restaurant","url":"https://www.preplounge.com/en/management-consulting-cases/interviewer-led/intermediate/inverto-case-fast-dish-restaurant-283","author":"Inverto (company case)","skills":"Yearly total cost of ownership when lifespans differ and running cost beats purchase price, bundling and standardising with a second source, Scope 3 upstream levers grouped as product, process and organisation, and RfQ design for resilience and carbon."},"glossary":[{"term":"Compressor","meaning":"A machine that makes compressed air for factory tools and lines. It runs on a lot of electricity."},{"term":"Total cost of ownership (yearly cost)","meaning":"Everything it costs to own and run a machine, per year: price spread over its life, energy and maintenance."},{"term":"kWh","meaning":"Kilowatt-hour, the unit in which electricity is measured and billed."},{"term":"RfQ","meaning":"Request for quotation: a formal request to suppliers to bid for a defined purchase."},{"term":"Scope 2","meaning":"Emissions from the electricity the client itself uses."},{"term":"Scope 3 (upstream)","meaning":"Emissions from what the client buys, such as the carbon in the machines and the supplier's plant."},{"term":"Standardise","meaning":"Use one model across all plants so parts and service are the same."},{"term":"Second source","meaning":"A second supplier kept for part of the volume to reduce dependency."}]},{"id":"nearshore-vs-lowcost-sourcing","title":"Merlion Mobile: Shenzhen or Johor","client":"Merlion Mobile Pte Ltd, a Singapore online retailer of own-brand phone accessories, selling in six Southeast Asian countries","country":"Singapore","type":"procurement","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"Decide between a Shenzhen supplier and a Johor supplier for two product segments, once forecast error is in the cost.","prompt":"Our client is Merlion Mobile, a Singapore online retailer of own-brand phone accessories. It sells in six countries in Southeast Asia. Today all products come from suppliers in Shenzhen, China. A Malaysian supplier in Johor has made an offer for the same products. Its unit price is higher, but it is closer and can deliver faster. The CFO says: why pay more? The Head of Merchandising says: we keep running out of the products that sell. You are on the Inverto team and the steering meeting is on Friday. The client asks for your recommendation on the sourcing. How would you approach it?","clarifying":[{"q":"Are the products and quality standards the same at both suppliers?","a":"Yes. Same specifications and same brand. Defects and rework are different, and they are in the exhibit."},{"q":"How are the products split?","a":"Two segments. Basics: charging cables, simple cases. Stable demand, 400,000 units a year, price USD 10. Trend: seasonal and licensed designs. Volatile demand, 100,000 units a year, price USD 20."},{"q":"What happens when a product is out of stock?","a":"The sale is lost. We do not backorder. Give the lost margin per unit only when asked, it is also in the exhibits."},{"q":"What happens to unsold stock?","a":"It is cleared at a heavy discount at the end of the season. The loss per unit is in the exhibits. Give this if asked."},{"q":"Who decides, and who holds which view?","a":"The CFO wants the lowest unit price. The Head of Merchandising wants speed and availability. The Head of Sustainability wants no ESG risk in the supply chain. Give this if asked."},{"q":"Is there a contract with Shenzhen, and what does switching cost?","a":"No volume commitment; orders are placed season by season. Johor could take the Trend order from next season, and we count no extra switching cost. (Give if asked.)"},{"q":"Any problems with the current suppliers?","a":"Hold this until the end. Give it if asked about ESG: the latest audit of the Shenzhen supplier for Basics found two issues."},{"q":"Has the Johor supplier been audited for labour and safety?","a":"Not yet. A first audit would be part of qualifying them. (Give if asked.)"}],"structure":{"notes":"Good structure: cost per unit landed (price, freight, duty, rework), then cost of forecast error (shortfall and excess), then the decision by segment, then risks and stakeholders including ESG. The key idea to listen for: unit price is not the whole cost, and the answer may differ by segment.","branches":[{"name":"Landed cost per unit","points":["FOB price","Freight and insurance","Duty and clearance","Defects and rework"]},{"name":"Cost of forecast error","points":["Shortfall: lost margin","Excess: markdown and MOQ","Lead time and flexibility","Fulfilment accuracy"]},{"name":"Decision by segment","points":["Stable vs volatile demand","Volume and margin by segment","Break-even for nearshore","Split sourcing"]},{"name":"Risks and stakeholders","points":["CFO, merchandising, sustainability","ESG and compliance","Supplier dependency","Switching effort and time"]}]},"stages":[{"id":"s1","title":"Structure the decision","timer":"structure","minutes":5,"question":"How would you structure the analysis for Friday's meeting?","notes":"Listen for: cost per unit including freight, duty and rework, not only the price. The cost of being wrong on demand. A segment view. Stakeholders and ESG. Give clarifying answers as asked. Do not give the exhibits yet.","exhibits":[],"hints":["Is the unit price the whole cost of getting a product to the customer?","What does it cost the client when the forecast is wrong?"],"solution":"I would do four blocks.\nOne. Landed cost per unit for each supplier: price, freight, duty, and the cost of defects and rework.\nTwo. The cost of forecast error. Too little stock means lost margin, too much stock means markdowns. The two suppliers differ in lead time and minimum order, so they differ here too.\nThree. The decision by segment. Basics have stable demand and Trend products have volatile demand, so the answer can differ.\nFour. Risks and stakeholders: cost, speed and ESG, and what each executive needs to hear.\nI would start with the landed cost, then add the forecast error on top.","answers":{"standard":"I would look at four things. First, the real cost per unit from each supplier: price, freight, duty and rework. Second, what it costs when the forecast is wrong, with lost sales or leftover stock. Third, whether the answer differs for stable and for trend products. Fourth, risks and what each executive cares about, including ESG.","great":"The CFO looks at price and Merchandising at availability, so the answer is total cost, not unit price. I would build the landed cost per unit first. Then I add the cost of forecast error, because Johor is closer and faster. Then I split by segment, since stable and volatile products behave differently and the answer is probably a split. Last, I cover ESG and the three stakeholders. I would ask for volumes and the lost margin per unit.","best":"The question is what it really costs to put a product in front of a customer, not what it costs to buy it. So I build four blocks: landed cost, cost of forecast error, a split by segment, and risks. For each segment I want a break-even: how much could Johor's price rise before Shenzhen wins again. That tells the CFO how safe the answer is. I expect volatile products to favour the nearer supplier, and stable ones the cheaper supplier. I would also ask about switching terms and whether Johor has been audited, since ESG is part of the brief. I would start with landed cost and add error cost on top."},"probes":[{"ask":"Is the unit price the whole cost of getting a product to the customer?","listen":"No. Freight, duty, defects and rework are added, and so is the cost of running out or having too much."},{"ask":"Why do you want to look at the two product types separately?","listen":"Demand is stable for one and volatile for the other, so the value of a fast supplier differs."},{"ask":"Why does being close to the market matter?","listen":"Shorter lead time means orders can follow demand, so fewer lost sales and less leftover stock."},{"ask":"The CFO says: just compare the quotes. Why is that not enough?","listen":"Quotes leave out freight, duty, rework and the cost of forecast error, which can be larger than the price gap."}]},{"id":"s2","title":"Landed cost per unit, Trend segment","timer":"math","minutes":8,"question":"Start with the Trend segment. Here are the two offers. What is the landed cost per unit for each supplier, and how much more does Johor cost?","notes":"Landed cost = FOB + freight + duty and clearance + defect rate x USD 5 rework. Shenzhen: 8.00 + 0.80 + 0.40 + 6% x 5 = 9.50. Johor: 9.40 + 0.40 + 0.10 + 2% x 5 = 10.00. Johor is USD 0.50 more, 5%, and the FOB gap is 1.40. A good candidate notes that the FOB gap is 1.40 but landed gap is only 0.50. Do not reveal the forecast error yet. At the end ask: is that the end of the story?","exhibits":["e1"],"hints":["Rework cost = defect rate x USD 5 per defective unit.","Add freight, duty and rework to the FOB price."],"solution":"Landed cost = FOB + freight + duty and clearance + rework. Rework = defect rate x USD 5.\nShenzhen: FOB 8.00. Freight 0.80. Duty 0.40. Rework 6% x 5 = 0.30.\nLanded = 8.00 + 0.80 + 0.40 + 0.30 = 9.50 USD per unit.\nJohor: FOB 9.40. Freight 0.40. Duty 0.10. Rework 2% x 5 = 0.10.\nLanded = 9.40 + 0.40 + 0.10 + 0.10 = 10.00 USD per unit.\nJohor is USD 0.50 per unit higher, 5%. On the quote alone the gap is USD 1.40, so freight, duty and rework close most of it.\nOn 100,000 Trend units, Johor is USD 50,000 a year higher on landed cost. That is the view of the CFO.\nSo-what: Johor is still more expensive on landed cost, but not by much. The question is what the long lead time and the minimum order cost Shenzhen.","answers":{"standard":"Landed cost is price plus freight plus duty plus rework. For Shenzhen that is 8.00 plus 0.80 plus 0.40 plus 0.30, so USD 9.50. For Johor it is 9.40 plus 0.40 plus 0.10 plus 0.10, so USD 10.00. Johor is USD 0.50 more per unit, about 5 percent.","great":"Shenzhen lands at USD 9.50 and Johor at USD 10.00, so Johor is 0.50 higher. The quoted price gap is 1.40, but lower freight, duty and rework close most of it. On 100,000 Trend units that is USD 50,000 a year. That is what the CFO sees. But it is not the full picture yet, because the long lead time and large minimum order at Shenzhen cost money too. I want the forecast error next.","best":"Landed cost is USD 9.50 for Shenzhen and USD 10.00 for Johor. The rework is 6 percent times USD 5 for Shenzhen, so 0.30, and 2 percent times 5 for Johor, so 0.10. The premium for Johor is 0.50, or USD 50,000 a year on Trend volume. Of the 1.40 price gap, 0.90 is closed by freight, duty and rework. If I stopped here I would choose Shenzhen, which is why I do not want to stop. I would check the defect rates and the freight terms, since both are quotes. Next I add the cost of getting demand wrong."},"probes":[{"ask":"How did you get rework cost?","listen":"Defect rate times USD 5 per defective unit: 0.30 for Shenzhen, 0.10 for Johor."},{"ask":"Why is the landed gap smaller than the price gap?","listen":"Johor has lower freight, duty and defects: 1.40 gap shrinks to 0.50."},{"ask":"Is that the end of the story?","listen":"No. The cost of forecast error is not in yet."},{"ask":"The CFO says: Johor is 5 percent more expensive, so we stay in Shenzhen. Respond.","listen":"Landed cost alone is not the full cost; forecast error is still missing. Johor may be cheaper in total."}]},{"id":"s3","title":"Cost of forecast error and break-even","timer":"math","minutes":12,"question":"Now add forecast error. The next exhibit shows how well each supplier fulfils demand and how much stock is left over. What is the total cost per unit of demand for each supplier? Then: by how much could Johor's price rise before Shenzhen wins again?","notes":"Per unit of demand. Shortfall cost = (1 - fulfilment accuracy) x USD 10. Excess cost = excess % of demand x USD 4. Shenzhen: 20% x 10 = 2.00 and 10% x 4 = 0.40. Johor: 5% x 10 = 0.50 and 2% x 4 = 0.08. Totals: Shenzhen 11.90, Johor 10.58. Johor is 1.32 cheaper, USD 132,000 a year on 100,000 units. Break-even: Johor can go up by 1.32 per unit to a landed cost of 11.32, which is a FOB of 10.72. Second view: Shenzhen would need a fulfilment accuracy of 93% to match, from 80% today. Excess comes from the Shenzhen MOQ of 20,000 and the long lead time.","exhibits":["e2"],"hints":["Shortfall: what share of demand is not met, times USD 10.","Break-even: how far can Johor's total cost rise until it equals Shenzhen's?"],"solution":"Cost per unit of demand = landed cost + shortfall cost + excess cost.\nShenzhen. Landed 9.50. Shortfall (100% - 80%) x 10 = 2.00. Excess 10% x 4 = 0.40.\nTotal = 9.50 + 2.00 + 0.40 = 11.90 USD per unit.\nJohor. Landed 10.00. Shortfall (100% - 95%) x 10 = 0.50. Excess 2% x 4 = 0.08.\nTotal = 10.00 + 0.50 + 0.08 = 10.58 USD per unit.\nJohor is USD 1.32 cheaper per unit. On 100,000 units that is USD 132,000 a year.\nWhere does it come from? Forecast error costs Shenzhen 2.40 and Johor 0.58. The difference is 1.82. Johor's higher landed cost takes back 0.50. Net 1.32.\nIn units: Shenzhen loses 20,000 sales and clears 10,000 excess units. Johor loses 5,000 and clears 2,000.\nBreak-even. Johor stays cheaper as long as its total cost is below 11.90. It has 1.32 of room. Landed cost can go from 10.00 to 11.32, which means a FOB price of up to 10.72 instead of 9.40.\nThe other way round: if Shenzhen could raise its fulfilment accuracy from 80% to about 93%, it would match Johor. That is not realistic with a 14-week lead time and a 20,000 minimum order.\nSo-what: for the Trend segment Johor wins, because the premium of 0.50 buys a 1.82 reduction in forecast error cost.","answers":{"standard":"Total cost is landed cost plus shortfall cost plus excess cost. Shenzhen is 9.50 plus 2.00 plus 0.40, so USD 11.90 per unit. Johor is 10.00 plus 0.50 plus 0.08, so USD 10.58. Johor is cheaper by USD 1.32 per unit, which is USD 132,000 a year. It can rise by 1.32 before Shenzhen wins again.","great":"Shenzhen's shortfall is 20 percent times USD 10, which is 2.00, and its excess is 10 percent times 4, which is 0.40. Johor's are 0.50 and 0.08. Total is USD 11.90 for Shenzhen and USD 10.58 for Johor. Forecast error costs Shenzhen 2.40 and Johor 0.58, a gap of 1.82. Johor's extra 0.50 landed cost buys that. So on Trend, Johor wins by USD 1.32 per unit, USD 132,000 a year. It could go up to a landed cost of 11.32, which is a FOB of 10.72, before Shenzhen wins.","best":"On Trend, Johor wins by USD 1.32 a unit, which is USD 132,000 a year. The reason is forecast error: it costs 2.40 at Shenzhen and 0.58 at Johor. In units, Shenzhen loses 20,000 sales and clears 10,000, Johor loses 5,000 and clears 2,000. The break-even is robust: Johor's FOB can rise from 9.40 to 10.72 before it loses. The other way, Shenzhen would need a fulfilment accuracy of 93 percent instead of 80. That is not realistic with a 14-week lead time. What I would check is whether the 95 percent accuracy for Johor is proven at scale, so I would pilot. I would also check that the lost margin of USD 10 is right, since it drives the result."},"probes":[{"ask":"What does the 2.00 for Shenzhen mean in plain words?","listen":"20 percent of demand is not met, and each missed unit loses USD 10 of margin: 20% times 10."},{"ask":"Why is Shenzhen's leftover stock higher?","listen":"Large minimum orders and a long lead time: it must order early and in big lots."},{"ask":"How much room does Johor have on price before it loses?","listen":"USD 1.32 per unit: FOB from 9.40 up to 10.72."},{"ask":"The Head of Merchandising says: USD 10 lost margin is too high. What if it is 6?","listen":"Shenzhen shortfall falls to 1.20 and Johor to 0.30, so totals are 11.10 and 10.38. Johor still wins, by about USD 0.72 instead of 1.32. Accept a sound recalculation or the idea that the lead shrinks but stays."}]},{"id":"s4","title":"Split by segment","timer":"math","minutes":8,"question":"Now the Basics segment. Same calculation. Then tell me what you would do for each segment, and what the yearly effect is compared with all-Shenzhen.","notes":"Basics: Shenzhen landed 4.90 (FOB 4.00 + 0.50 + 0.20 + 4% x 5 = 0.20). Johor landed 5.20 (FOB 4.90 + 0.20 + 0.05 + 1% x 5 = 0.05). Note: Johor's FOB 4.90 happens to equal Shenzhen's landed 4.90; do not let the candidate mix them up. Error: Shenzhen 4% x 5 = 0.20 and 3% x 2 = 0.06. Johor 1% x 5 = 0.05 and 1% x 2 = 0.02. Totals: Shenzhen 5.16, Johor 5.27. Shenzhen wins by 0.11, USD 44,000 on 400,000 units. Break-even: Johor FOB would need to be 4.79. Annual: all Shenzhen 3,254,000, all Johor 3,166,000, split 3,122,000. Split saves 132,000 (4.1%) against all Shenzhen and 44,000 against all Johor. Honest message: Johor does not win on Basics.","exhibits":["e3"],"hints":["Use the same four steps as for Trend.","Total annual cost = units x cost per unit, by segment."],"solution":"Basics, per unit of demand.\nShenzhen. Landed = FOB 4.00 + 0.50 + 0.20 + 4% x 5 (0.20) = 4.90. Shortfall 4% x 5 = 0.20. Excess 3% x 2 = 0.06.\nTotal = 4.90 + 0.20 + 0.06 = 5.16 USD per unit.\nJohor. Landed = FOB 4.90 + 0.20 + 0.05 + 1% x 5 (0.05) = 5.20. Shortfall 1% x 5 = 0.05. Excess 1% x 2 = 0.02.\nTotal = 5.20 + 0.05 + 0.02 = 5.27 USD per unit.\nFor Basics Shenzhen is cheaper by USD 0.11 per unit. On 400,000 units that is USD 44,000 a year.\nBreak-even for Johor on Basics: its total must fall by 0.11, so its FOB price must drop from 4.90 to 4.79.\nWhy the difference with Trend: Basics demand is stable, so forecast error is small. The premium of 0.30 on landed cost buys only 0.19 of lower error cost.\nAnnual cost, both segments (400,000 Basics, 100,000 Trend).\nAll Shenzhen: 400,000 x 5.16 + 100,000 x 11.90 = 2,064,000 + 1,190,000 = USD 3,254,000.\nAll Johor: 400,000 x 5.27 + 100,000 x 10.58 = 2,108,000 + 1,058,000 = USD 3,166,000.\nSplit (Basics Shenzhen, Trend Johor): 2,064,000 + 1,058,000 = USD 3,122,000.\nSplit saves USD 132,000 against all Shenzhen, 4.1%, and USD 44,000 against all Johor, 1.4%.\nSo-what: do not move everything. Move Trend to Johor and keep Basics in Shenzhen, unless the Basics risks change.","answers":{"standard":"For Basics, Shenzhen total is 4.90 plus 0.20 plus 0.06, so USD 5.16 per unit. Johor is 5.20 plus 0.05 plus 0.02, so USD 5.27. Shenzhen is cheaper by 0.11, or USD 44,000 a year on 400,000 units. So I would keep Basics in Shenzhen and move Trend to Johor. That is USD 132,000 a year cheaper than all Shenzhen.","great":"Basics demand is stable, so forecast error is small and Johor's speed is not worth much. Shenzhen is USD 5.16 and Johor USD 5.27, so Shenzhen wins by 0.11 per unit. The split costs USD 3,122,000 a year, against USD 3,254,000 for all Shenzhen, a saving of 132,000 or 4.1 percent. All Johor would cost 3,166,000, so the split also beats that by 44,000. So the answer is a split, not one winner.","best":"Johor does not win on Basics. The extra landed cost of 0.30 buys only 0.19 less error cost, so Shenzhen is ahead by USD 0.11, or USD 44,000 a year. For Johor to win on Basics, its FOB would have to fall from 4.90 to 4.79. The best plan is Trend in Johor and Basics in Shenzhen, at USD 3,122,000, which is 4.1 percent below all Shenzhen. Basics is the small prize, since it is only 44,000 either way. So Basics is where I can afford to buy insurance, for example a second source in Johor. I would present the CFO with both views: on landed cost alone all Shenzhen looks USD 170,000 cheaper, in total cost the split is cheaper by USD 132,000."},"probes":[{"ask":"Why does Johor win on one segment and not the other?","listen":"Stable demand has small forecast error, so speed is worth less than the price difference."},{"ask":"What would make Johor win on Basics?","listen":"FOB price down from 4.90 to 4.79, a drop of USD 0.11."},{"ask":"What is the yearly gain of your split?","listen":"USD 132,000, about 4.1 percent, against all Shenzhen."},{"ask":"The CFO disagrees: one supplier is simpler. Why split?","listen":"The split saves USD 44,000 against all Johor and USD 132,000 against all Shenzhen; complexity is small with two suppliers."},{"ask":"What if the Basics demand turns volatile?","listen":"Error cost rises and Johor becomes more attractive; recheck the numbers."}]},{"id":"s5","title":"Stakeholders, ESG and recommendation","timer":"recommendation","minutes":12,"question":"The CFO, the Head of Merchandising and the Head of Sustainability all want something different. In addition, the last audit of the Shenzhen supplier for Basics found unrecorded overtime above the legal limit and a blocked fire exit. How do you handle the three executives and the audit finding? Then give your recommendation.","notes":"Give the audit finding as written. Listen for: the CFO is answered with numbers: the landed-cost view shows Johor higher by USD 170,000 a year on all volume, but total cost shows Johor lower by USD 88,000 on all volume and the split lower by USD 132,000. Merchandising gets speed on Trend. Sustainability: the fire exit is a critical finding, the overtime is major. Expect an immediate fix with a deadline, a re-audit, a stop on new orders if not fixed, a check of the worker side, and Johor qualified as a second source for Basics. Cost of a 20% Basics move to Johor: 80,000 units x 0.11 = USD 8,800 a year. Do not accept 'drop the supplier today' as the only answer.","exhibits":[],"hints":["What number does the CFO care about, and does the split improve it?","What is the cost of keeping a second source for Basics?"],"solution":"Three executives, one answer.\nCFO. On landed cost alone, Johor looks USD 170,000 a year more expensive on all volume. With forecast error included, the split is USD 132,000 cheaper than all Shenzhen, 4.1%. So the CFO gets a lower total cost, not a higher one.\nHead of Merchandising. Trend moves to Johor: lead time of 3 weeks, MOQ of 5,000, accuracy of 95%, and fewer lost sales.\nHead of Sustainability. The audit finding is real and has two levels. The blocked fire exit is a critical finding: fix it within days, and prove it. The unrecorded overtime is major: a corrective plan with a deadline, such as 60 days, and a re-audit by an independent auditor. Check that the fix does not harm the workers, for example by cutting hours with no plan for the orders.\nRule: if the critical issue is not closed on time, stop new orders. Add social compliance and audit rights to the contract.\nSecond source. Qualify Johor for Basics. Moving 20% of Basics, 80,000 units, costs 80,000 x 0.11 = USD 8,800 a year. Moving all Basics costs USD 44,000 a year. That is cheap insurance against an ESG or supply failure at Shenzhen.\nRecommendation.\nMove the Trend segment to Johor. Keep Basics in Shenzhen under a 60-day corrective plan, and qualify Johor as a second source for 20% of Basics.\nTotal cost falls by USD 132,000 a year, 4.1%, against all Shenzhen. If Shenzhen does not fix the critical issue, move all Basics to Johor at a cost of USD 44,000 a year.\nRisks. Johor's lead-time and quality claims are untested at scale, so we start with a pilot season. The Johor price needs to hold: our break-even is a FOB of 10.72 for Trend.\nNext steps: agree the deal with Johor and audit it, send the corrective action request to Shenzhen, and brief the three executives together.","answers":{"standard":"For the CFO, the split is cheaper in total by USD 132,000 a year. For Merchandising, Trend moves to Johor, which delivers in 3 weeks. For Sustainability, we ask Shenzhen to fix the fire exit now and the overtime in 60 days, and we re-audit. I recommend Trend to Johor and Basics stay in Shenzhen under a corrective plan.","great":"I give each executive an answer. The CFO sees total cost: landed cost alone looks USD 170,000 worse, but with forecast error the split is 132,000 better. Merchandising gets a three-week lead time on Trend. For ESG, the blocked fire exit is critical, so fix it within days and prove it. The unrecorded overtime is serious, so a plan with a deadline and an independent re-audit. If the critical issue is not closed, we stop new orders. I also qualify Johor for a share of Basics as a backup. 20 percent costs only USD 8,800 a year.","best":"My recommendation is a split. Trend moves to Johor, which saves USD 132,000 a year or 4.1 percent. Basics stays in Shenzhen under a 60-day corrective plan, and Johor is qualified as a second source for 20 percent of Basics, which costs USD 8,800 a year. If Shenzhen misses the critical fix, all Basics moves to Johor for USD 44,000 a year, so the downside is small and I can set a firm rule. I would not drop Shenzhen today, because there is no tested backup. I would check that the fix does not simply push hours onto workers with no plan. I would also audit Johor first, since we have no ESG evidence on them. The risks are Johor's service at scale and its price, and our break-even FOB for Trend is 10.72. Next steps: pilot season, a corrective action request, and one briefing for all three executives."},"probes":[{"ask":"What is the one thing you tell the CFO?","listen":"Total cost is lower by USD 132,000 a year (4.1 percent), not higher."},{"ask":"Which audit finding is worse, and why?","listen":"The blocked fire exit: a safety risk to life. Fix in days."},{"ask":"Should the client drop the Shenzhen Basics supplier today?","listen":"Not as the only answer: no backup is ready. Corrective plan with deadline, re-audit, stop orders if not fixed, qualify a second source."},{"ask":"The Head of Sustainability says: drop them now. Respond.","listen":"Acknowledge risk; fix on a short deadline, with a trigger to switch. Moving all Basics costs only USD 44,000 a year, so the switch is affordable if needed."},{"ask":"Is Johor free of ESG risk?","listen":"Not known: not audited yet. Audit before placing orders."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Offers for the Trend segment (per unit)","chart":"table","columns":["Item","Shenzhen (China)","Johor (Malaysia)"],"rows":[["FOB price (USD per unit)",8.0,9.4],["Freight and insurance (USD per unit)",0.8,0.4],["Duty and clearance (USD per unit)",0.4,0.1],["Defect rate (% of units)",6,2],["Minimum order quantity (units per order)",20000,5000],["Lead time (weeks)",14,3]],"note":"Rework cost is USD 5 per defective unit. Trend selling price is USD 20. Trend demand is 100,000 units a year."},{"id":"e2","title":"Exhibit 2: Forecast error in the Trend segment","chart":"table","columns":["Item","Shenzhen (China)","Johor (Malaysia)"],"rows":[["Fulfilment accuracy (% of demand met)",80,95],["Excess stock at end of season (% of demand)",10,2],["Lost margin per unmet unit (USD)",10,10],["Loss per excess unit sold at clearance (USD)",4,4]],"note":"Unmet demand is a lost sale. Excess stock comes mostly from the minimum order and the long lead time. Lost margin and clearance loss are set equal for both suppliers to keep the maths simple."},{"id":"e3","title":"Exhibit 3: Offers and forecast error for the Basics segment","chart":"table","columns":["Item","Shenzhen (China)","Johor (Malaysia)"],"rows":[["FOB price (USD per unit)",4.0,4.9],["Freight and insurance (USD per unit)",0.5,0.2],["Duty and clearance (USD per unit)",0.2,0.05],["Defect rate (% of units)",4,1],["Fulfilment accuracy (% of demand met)",96,99],["Excess stock at end of season (% of demand)",3,1],["Lost margin per unmet unit (USD)",5,5],["Loss per excess unit sold at clearance (USD)",2,2]],"note":"Rework cost is USD 5 per defective unit. Basics selling price is USD 10. Basics demand is 400,000 units a year."}],"recommendation":"I recommend a split. Move the Trend segment to the Johor supplier. Keep Basics with Shenzhen, but under a corrective plan, and qualify Johor as a second source for 20% of Basics. Reason one: on Trend, Johor is USD 0.50 more on landed cost, but it cuts the cost of forecast error from 2.40 to 0.58 per unit. Total cost is USD 10.58 against 11.90. Johor would stay cheaper up to a FOB price of USD 10.72. Reason two: on Basics, demand is stable and Shenzhen wins by USD 0.11 per unit, so Johor does not pay there. Reason three: the split saves USD 132,000 a year, 4.1%, against all Shenzhen. The CFO gets a lower total cost, merchandising gets speed on Trend. For ESG, the fire exit must be fixed now and the overtime within 60 days, with a re-audit. If the critical issue is not closed, we move all Basics to Johor for USD 44,000 a year. Risks: Johor's service levels at scale, and the Johor price. Next steps: pilot season with Johor, including a first audit of Johor, corrective action request to Shenzhen, and one briefing for all three executives.","good":["Calculates landed cost per unit with freight, duty and rework, and finds the gap smaller than the quote suggests","Adds the cost of shortfall and excess, and shows Johor wins on Trend by USD 1.32 per unit","States the break-even clearly: Johor's FOB can go up to USD 10.72 for Trend","Notices that Johor does not win on Basics, and splits the decision by segment"],"great":["States honestly that on Basics nearshor
