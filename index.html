<style>
/* Layout: sticky top bar; one working column (max 920px); the interviewer view adds a sticky stage-and-timer strip. */
:root {
  --bg: #f4f7f6; --surface: #ffffff; --sunk: #eaf0ee; --ink: #15211f; --muted: #576865; --line: #d6e0dd;
  --accent: #0d6b62; --accent-ink: #ffffff; --accent-soft: #dcefeb;
  --warn: #9a5800; --warn-soft: #fbecd6; --bad: #b3261e; --good: #2e7d32;
  --s1: #0d6b62; --s2: #c07a12; --s3: #4b5fa8; --s4: #9a4f7b; --s5: #5f7d1f; --s6: #5a6b7a;
  --f-display: "Archivo", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1413; --surface: #151f1d; --sunk: #1b2725; --ink: #e3ebe9; --muted: #9caeaa; --line: #2b3836;
  --accent: #52c3b6; --accent-ink: #062320; --accent-soft: #163733;
  --warn: #e7a44c; --warn-soft: #3a2a12; --bad: #f08a80; --good: #81c784;
  --s1: #52c3b6; --s2: #e7a44c; --s3: #94a6ec; --s4: #d792bd; --s5: #a5c96a; --s6: #a9b8c6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #151f1d; --sunk: #1b2725; --ink: #e3ebe9; --muted: #9caeaa; --line: #2b3836;
  --accent: #52c3b6; --accent-ink: #062320; --accent-soft: #163733;
  --warn: #e7a44c; --warn-soft: #3a2a12; --bad: #f08a80; --good: #81c784;
  --s1: #52c3b6; --s2: #e7a44c; --s3: #94a6ec; --s4: #d792bd; --s5: #a5c96a; --s6: #a9b8c6; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.label { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: 0.75rem; }
nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-weight: 600; }
nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; }
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 20px; }
.notice { border: 1px solid var(--line); background: var(--sunk); border-radius: var(--r); padding: 10px 14px; font-size: 0.9rem; }
.notice.warn { background: var(--warn-soft); border-color: transparent; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
select, input[type="text"], textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { min-height: 70px; resize: vertical; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.type { background: var(--accent-soft); color: var(--accent); }
.src { display: grid; gap: 4px; }
.chip.src-chip { justify-self: start; background: var(--warn-soft); color: var(--warn); }
.chip.live { background: var(--accent); color: var(--accent-ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.read-aloud { border-left: 3px solid var(--accent); padding-left: 14px; white-space: pre-line; font-size: 1.05rem; }
.pre { white-space: pre-line; }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "Show"; font-size: 0.8rem; color: var(--accent); }
details[open] > summary::after { content: "Hide"; }
details > .in { padding: 0 12px 12px; display: grid; gap: 8px; }
details.solution > summary { color: var(--warn); }
ol.probes { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
ol.probes li { display: grid; gap: 2px; }
.probe-ask { font-weight: 600; }
.ans { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 4px; }
.ans-best { border-color: var(--accent); }
.ans-great { border-color: var(--s3); }
dl.glos { margin: 0; display: grid; grid-template-columns: minmax(90px, max-content) minmax(0, 1fr); gap: 6px 14px; }
dl.glos dt { font-weight: 600; } dl.glos dd { margin: 0; }
@media (max-width: 560px) { dl.glos { grid-template-columns: minmax(0, 1fr); gap: 2px; } dl.glos dd { margin-bottom: 8px; } }
.qa { display: grid; gap: 8px; }
.qa div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.qa b { font-weight: 600; }
ul.tight { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

.strip { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 53px); z-index: 5; background: var(--bg); padding-block: 8px; display: grid; gap: 8px; }
.timer-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.clock { font-family: var(--f-mono); font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1; }
.clock.over { color: var(--warn); }
.stages { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.stage-pill { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 0.85rem; display: grid; gap: 0; cursor: pointer; text-align: left; }
.stage-pill .t { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.stage-pill[aria-current="step"] { border-color: var(--accent); background: var(--accent-soft); }
.stage-pill.done .t { color: var(--good); }

.stage { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stage.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.stage-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.notes { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; white-space: pre-line; }

.exhibit { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; background: var(--surface); min-width: 0; }
.exhibit.hiddenx { opacity: 0.75; border-style: dashed; }
.ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.8rem; }
th.n { font-family: var(--f-body); white-space: normal; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.85rem; white-space: nowrap; }
.chart { width: 100%; height: auto; max-width: 100%; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-body); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
ol.legend-list { margin: 4px 0 0; padding-left: 22px; color: var(--muted); display: grid; gap: 2px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.score-grid { display: grid; gap: 12px; }
.score-row { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr); gap: 10px; align-items: start; }
.dots { display: flex; gap: 6px; }
.dots button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--f-mono); }
.dots button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gg { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.bigstat { font-family: var(--f-mono); font-size: 1.6rem; }
.statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; }
.bar-mini { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar-mini > span { display: block; height: 100%; background: var(--accent); }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.watch-q { font-size: 1.15rem; white-space: pre-line; }

@media (max-width: 560px) {
  h1 { font-size: 1.35rem; }
  .score-row { grid-template-columns: minmax(0, 1fr); }
  .clock { font-size: 1.4rem; }
  .strip { top: calc(env(safe-area-inset-top, 0px) + 92px); }
}
body.present .topbar { display: none; }
body.present main { font-size: 1.1rem; }
body.present .wrap { max-width: 1100px; }
.io { display: grid; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script type="application/json" id="case-data">{"cases":[{"id":"cooking-oil-market-sizing","title":"Dapur Nusa Group: cooking oil","client":"Dapur Nusa Group, an Indonesian restaurant chain with 400 outlets across Java, Sumatra and Sulawesi","country":"Indonesia","type":"procurement","difficulty":"Beginner","format":"Interviewer-led","minutes":30,"summary":"How much cooking oil do we and the market buy, and is a national tender with an index-linked price worth it?","prompt":"Our client is Dapur Nusa Group, an Indonesian restaurant chain with fried-food menus. Each outlet buys cooking oil from local distributors, outlet by outlet. The new head of procurement asks three things. How much cooking oil do we buy, and how much does the whole market buy? Do we have any buying power? And is it worth running one national tender, with a price linked to a palm oil index? You meet her tomorrow. Let us start with the sizing.","clarifying":[{"q":"What do you mean by the market?","a":"Commercial food service: restaurants, street stalls, hotels and caterers. Not households and not food factories."},{"q":"How many outlets does the client have, and how much oil does one use?","a":"400 outlets. About 25 litres a day each. Open 360 days a year. Give this if asked."},{"q":"How many food service outlets are there in Indonesia, and how much does the average one use?","a":"About 1.2 million outlets. Most are small. The average uses about 5 litres a day. Give this if asked."},{"q":"What price does the client pay today?","a":"About IDR 16,500 per litre on average over the last two years, delivered. Use 16,500 for the sizing. The exact quarterly prices are in the exhibit later. Give this if asked."},{"q":"How big are the oil suppliers?","a":"A large refiner sells about 250 million litres a year to food service. Give this if asked."},{"q":"What does the index price include?","a":"A reference price for packed cooking oil in IDR per litre, built from the palm oil price plus a fixed refining and packing margin. The market treats it as a fair price. The client has no formula today."},{"q":"What is the population of Indonesia?","a":"About 280 million. Give this only if the candidate wants a cross-check. Food service oil is roughly 8 litres per person per year, which is plausible."},{"q":"What would a supplier charge for delivery on top of the index?","a":"Unknown today. In the first three quarters the client paid exactly the index price, delivered, so treat that as a fair starting point. The real delivery adder only shows up in bids. Give if asked."}],"structure":{"notes":"Top-down sizing with explicit assumptions: outlets times litres per day times days. Then compare the client to the market and to one supplier. Then check price against an index.","branches":[{"name":"Size the volume","points":["Client: outlets x litres per day x days","Market: food service outlets x average litres x days","State assumptions and sanity-check"]},{"name":"Buying power","points":["Client share of the market","Client share of one supplier's volume","Who else is buying, how concentrated are suppliers"]},{"name":"Price and contract","points":["Price paid vs an index","How price follows up and down moves","Tender design: index formula, regional lots, term","Risks: supply, service, small share"]}]},"stages":[{"id":"s1","title":"Approach to the sizing","timer":"structure","minutes":4,"question":"How would you estimate how much oil the client buys and how much the market buys? What would you ask for?","notes":"Looking for top-down: outlets x litres per day x days. Candidate should ask for the numbers, not guess. Give the numbers from the clarifying list when asked. Weaker candidates start from population. That works as a cross-check, but it includes households. Note that the market definition matters.","exhibits":[],"hints":["What does one outlet use in a day?","Which market do we mean, households too?"],"solution":"I would size it bottom-up from outlets.\nVolume = number of outlets x litres per outlet per day x days open.\nFor the client I need the number of outlets and the average use per outlet. For the market I need the number of food service outlets and the average use. I would define the market as food service only, not households.\nThen I would sanity-check the answer against population: a national total of cooking oil per person.","answers":{"standard":"I would size it bottom-up. Volume is the number of outlets times litres per outlet per day times days open. I need that for the client and for all food service outlets in Indonesia. I would leave households out.","great":"Bottom-up: outlets times litres per day times days open, once for the client and once for the market. I would define the market first as food service only, since households and factories buy differently. I would ask for the numbers and not guess them. Then I check the result against population to see if the litres per person make sense.","best":"I would define the market as commercial food service, then use outlets times litres per day times days, for the client and the market. I would ask for outlet counts, average use, price, and the size of a large supplier, so I can compare the client to the market and to a supplier. I would also use a top-down cross-check from population, litres per person. And I would keep units clear, litres against million litres, rupiah against billion rupiah. The sizing is only a step: what matters is buying power and then price."},"probes":[{"ask":"Why only food service and not the whole country's cooking oil?","listen":"The client competes in and buys like food service. Households and factories buy differently."},{"ask":"Why bottom-up and not from population?","listen":"Bottom-up uses the client's own outlet data. Population is a cross-check."},{"ask":"The head of procurement says just use total palm oil production. Reply?","listen":"That is a different thing: it includes exports and industry. Use outlets."},{"ask":"What would you ask for first?","listen":"Outlets, litres per outlet per day, days open, price."}]},{"id":"s2","title":"Size the client and the market","timer":"math","minutes":8,"question":"Please calculate the client's annual volume and spend, the market's annual volume, and the client's share of the market and of one large refiner. What does this say about buying power?","notes":"Numbers: client 400 outlets x 25 L x 360 days. Market 1.2m outlets x 5 L x 360. Price IDR 16,500. Refiner volume 250m L. The client share is tiny: 0.17% of the market, 1.4% of one refiner. So volume leverage is low. The value is in the price mechanism, not in volume discounts. Check units: litres vs million litres, IDR vs IDR billion.","exhibits":[],"hints":["Volume = outlets x litres a day x 360.","Share = client volume / market volume."],"solution":"Step 1. Client volume = 400 outlets x 25 litres x 360 days = 3,600,000 litres a year, 3.6 million litres.\nStep 2. Client spend = 3.6 million litres x IDR 16,500 = IDR 59.4 billion a year.\nStep 3. Market volume = 1,200,000 outlets x 5 litres x 360 days = 2,160,000,000 litres, 2.16 billion litres.\nStep 4. Market spend = 2.16 billion litres x IDR 16,500 = IDR 35.6 trillion.\nStep 5. Client share of market = 3.6 million / 2,160 million = 0.17%.\nStep 6. Client share of one large refiner = 3.6 million / 250 million = 1.4%.\nCheck: the client outlet uses 25 litres, 5 times the average of 5 litres. That fits a fried-food chain.\nSo-what: we are small. 0.17% of the market and 1.4% of one refiner. We will not get a volume discount that moves the price. Our leverage is a single clear contract for 400 outlets, a steady order, and a clean price formula, not size.","answers":{"standard":"Client volume is 400 times 25 times 360, which is 3.6 million litres, costing 59.4 billion rupiah. The market is 1.2 million times 5 times 360, which is 2.16 billion litres. Our share is 0.17%, and 1.4% of one large refiner. So we are small.","great":"Client: 3.6 million litres a year at 16,500 rupiah, so 59.4 billion rupiah. Market: 2.16 billion litres, about 35.6 trillion rupiah. Client share of the market is 0.17%, and of one large refiner 1.4%. Sanity check: our outlets use 25 litres a day, five times the average, which fits fried food. The so-what is that volume gives us little power. Our power is a single clear contract for 400 outlets and a clean price formula.","best":"3.6 million litres, 59.4 billion rupiah for us; 2.16 billion litres, 35.6 trillion for the market. Share is 0.17% of the market and 1.4% of one refiner, so we will not move prices by volume. Sanity checks: 25 against 5 litres per outlet is fine for fried food, and 2.16 billion litres for 280 million people is about 8 litres per head, plausible. So the leverage is not size but contract design: one tender for 400 outlets, steady orders, and a price formula. The next question is whether the price paid is fair, so I would look at price against an index."},"probes":[{"ask":"What do you get for the client's yearly volume, in litres?","listen":"3.6 million litres: 400 times 25 times 360."},{"ask":"Why is the client's share so small and what does it mean?","listen":"0.17% of market. Little volume power. Value is in the contract."},{"ask":"The head says 400 outlets is a lot of buying power. Reply?","listen":"Not by share: 1.4% of one refiner. Power comes from a clean contract."},{"ask":"How do you check that your market number is reasonable?","listen":"Compare to population, about 8 litres per person, or client outlet 25 against average 5."},{"ask":"What is the client's annual spend?","listen":"59.4 billion rupiah, 3.6 million litres times 16,500."}]},{"id":"s3","title":"Price against the index","timer":"exhibit","minutes":10,"question":"Here is the price the client paid over eight quarters next to the index reference price. What do you see? Estimate how much the client overpaid over the eight quarters and what the current yearly run-rate is.","notes":"Pattern: when the index goes up, the price paid goes up by the same amount. When the index goes down, the price paid falls by only half. From Q4 the client pays above the reference. Quarterly volume is a quarter of the annual volume, 0.9 million litres. Gap in Q4 is IDR 500 per litre, then IDR 1,000 from Q5. Overpayment total IDR 4.05 billion, 3.4% of spend. Run-rate IDR 1,000 per litre x 3.6m = IDR 3.6 billion a year, 5.6% of price. Candidate should say it is an estimate: assumes the reference is a fair price and that it was equal to the price paid in Q1 to Q3.","exhibits":["e1"],"hints":["Look at what happens to the price paid in a quarter when the reference falls.","Overpayment per quarter = gap per litre x litres in the quarter."],"solution":"Step 1. Pattern. Reference up 1,000 in Q2, Q3, Q7, Q8: price paid also up 1,000 each time. Reference down 1,000 in Q4 and Q5: price paid down only 500 each time. Pass-through is 100% up and 50% down.\nStep 2. Gap = price paid - reference. Q1 to Q3: 0. Q4: 500. Q5 to Q8: 1,000 each.\nStep 3. Quarterly volume = 3.6 million / 4 = 0.9 million litres.\nStep 4. Overpayment per quarter = gap x 0.9 million litres.\nQ4: 500 x 0.9m = IDR 450 million. Q5 to Q8: 1,000 x 0.9m = IDR 900 million each, 3,600 million for four quarters.\nTotal = IDR 4.05 billion over eight quarters.\nStep 5. Share of spend. Eight-quarter spend = IDR 118.35 billion (average price 16,437 x 7.2m litres). 4.05 / 118.35 = 3.4%.\nStep 6. Run-rate. Gap now IDR 1,000 per litre x 3.6 million litres = IDR 3.6 billion a year. That is 5.6% of the current price of 18,000.\nSo-what: the loss is not from a high margin but from the way the price moves. The client pays full price on the way up and half on the way down, and the gap grows each cycle. This is an estimate. It assumes the reference is fair and that prices were aligned in Q1 to Q3.","answers":{"standard":"When the index rises, the price paid rises by the same amount. When the index falls, the price paid falls by only half. From Q4 we pay more than the index. Overpayment is gap times 0.9 million litres a quarter, so 4.05 billion rupiah over eight quarters. Now it is 3.6 billion a year.","great":"The pattern is full pass-through up and 50% pass-through down. Gap is zero in Q1 to Q3, 500 in Q4 and 1,000 from Q5. Quarterly volume is 0.9 million litres. So overpayment is 450 million in Q4 and 900 million in each of Q5 to Q8, 4.05 billion in total, 3.4% of spend. The run-rate is 1,000 times 3.6 million litres, 3.6 billion a year, 5.6% of price. This is an estimate, assuming the index is fair.","best":"Up moves are passed on 100%, down moves only 50%, so the gap ratchets up: 500 in Q4, 1,000 from Q5. Overpayment is 4.05 billion rupiah over eight quarters, 3.4% of spend, and the run-rate is 3.6 billion a year, 5.6% of the 18,000 price. Careful with units: a quarter is 0.9 million litres, not 3.6 million. It is an estimate: it assumes the index is a fair price and that we were aligned in Q1 to Q3. I would ask the distributors why, and check the contracts for the clause behind half pass-through. If the pattern repeats, the gap grows with every cycle, so the cost of waiting is real."},"probes":[{"ask":"What happens to the price we pay when the index goes down?","listen":"It falls only half as much."},{"ask":"Why is quarterly volume 0.9 million and not 3.6 million?","listen":"The annual volume is divided over four quarters."},{"ask":"The distributor says the price is fair because it follows the index. Reply?","listen":"Only on the way up. On the way down it follows half. The gap is 1,000 per litre."},{"ask":"How sure are you of the 4.05 billion?","listen":"It is an estimate: assumes the index is fair and Q1 to Q3 were aligned."},{"ask":"What is the yearly run-rate and why does it differ from the eight-quarter total?","listen":"3.6 billion a year: current gap times annual volume. The total reflects earlier smaller gaps."}]},{"id":"s4","title":"Recommendation","timer":"recommendation","minutes":8,"question":"The head of procurement asks: is a national tender with an index-linked price worth it? What do you recommend, and how would you design it?","notes":"Look for: clear yes, with numbers (IDR 3.6 billion a year at stake, small cost of a tender), and an understanding that the lever is the formula and not volume. Design: index formula, two-way, quarterly reset, regional lots, two suppliers, 12 to 24 month term, service levels. Risks: small share, suppliers may not bid, distribution to remote outlets, index choice. Ask for a realistic capture: 50% to 100% of the gap.","exhibits":[],"hints":["What is the yearly prize?","What makes the formula fair to both sides?"],"solution":"Yes, run the tender, because of the price formula and not because of volume.\nThe prize: IDR 1,000 per litre x 3.6 million litres = IDR 3.6 billion a year. If we capture half, IDR 1.8 billion.\nDesign: price = index reference + a delivery adder per region, which suppliers bid for. Reset every quarter. Two-way, so it follows the index up and down at 100%. Two suppliers in two regional lots. Term 12 to 24 months.","answers":{"standard":"Yes, run the tender, because of the price formula and not volume. The prize is 1,000 rupiah times 3.6 million litres, which is 3.6 billion a year. The formula should follow the index up and down equally and reset every quarter.","great":"Yes. The prize is 3.6 billion rupiah a year, and half of it is 1.8 billion. We are small, so the value is the formula, not the volume. Design: index price plus a delivery adder per region that suppliers bid on, a quarterly reset, two-way pass-through, two regional lots and a 12 to 24 month term. Risks: refiners may not bid for a small buyer, and remote outlets cost more to serve.","best":"Yes, run it. The upside is 1.8 to 3.6 billion rupiah a year, which is 50% to 100% of the gap, against a small cost to tender. Our volume gives no leverage, so I would sell the client as a clean, steady buyer. Formula: the index plus a bid delivery adder per region, reset quarterly, equal in both directions. Two lots with two suppliers gives backup. Risks: suppliers do not bid, the index is manipulated or discontinued, and remote outlets. I would test the adder with two or three refiners first, confirm the index, and check outlet volumes by region before drafting. If a bid shows an adder above the gap, I would stop and rethink."},"probes":[{"ask":"Why does the tender make sense if our volume is small?","listen":"Value is in the formula, not volume. 3.6 billion a year."},{"ask":"Why two-way pass-through?","listen":"Fair to both sides, and it removes today's 50% on the way down."},{"ask":"The CFO says suppliers will not bid for a small buyer. Respond.","listen":"Test with two or three refiners first; 400 outlets, steady volume; use regional lots."},{"ask":"What is the realistic saving?","listen":"50% to 100% of the gap, 1.8 to 3.6 billion rupiah."},{"ask":"What would stop you from recommending it?","listen":"Bids with an adder above the gap, or no suppliers bidding."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Price paid and index reference price, last 8 quarters","chart":"line","columns":["Quarter","Index reference price (IDR per litre)","Price paid by client (IDR per litre)"],"rows":[["Q1",15000,15000],["Q2",16000,16000],["Q3",17000,17000],["Q4",16000,16500],["Q5",15000,16000],["Q6",15000,16000],["Q7",16000,17000],["Q8",17000,18000]],"note":"Reference price = palm oil based index for packed cooking oil, including a fixed refining and packing margin. Client volume is even through the year: one quarter of the annual volume. Prices delivered, quarterly averages."}],"recommendation":"My answer is yes: run a national tender with an index-linked price. The client buys about 3.6 million litres a year, IDR 59 billion. That is only 0.17% of the market and 1.4% of a large refiner, so size gives us little power. The value is in the price mechanism. Over eight quarters the client paid IDR 4.05 billion above the index, 3.4% of spend. The pattern is clear: full pass-through when the index rises, half when it falls. The gap is now IDR 1,000 per litre, about IDR 3.6 billion a year. I would design a quarterly two-way formula: index reference plus a delivery adder per region, which suppliers bid on, in two regional lots with a 12 to 24 month term. Even if we capture only half, that is IDR 1.8 billion a year. The risks are that suppliers may not bid for a small buyer, and remote outlets cost more to serve. So I would test the adder with two or three refiners before the tender. Next steps: confirm the index, check outlet volumes by region, and draft the tender.","good":["Sizes top-down with outlets, litres per day and days, and states assumptions","Gets 3.6 million litres and IDR 59.4 billion for the client, 2.16 billion litres for the market","Spots that the price follows the index up fully but down only partly","Estimates overpayment of IDR 4.05 billion over eight quarters with gap times volume"],"great":["Says the client's share is small (0.17% of the market, 1.4% of a refiner) and that the lever is the formula, not volume","Gives both the eight-quarter total and the current yearly run-rate (IDR 3.6 billion)","Flags that the estimate assumes the index is fair and prices were aligned early","Designs a two-way formula with regional lots and tests supplier appetite for a small buyer"],"mistakes":["Starting from population and including households in the market","Slipping on units: litres vs million litres, IDR vs IDR billion","Claiming big buying power from the 400 outlets","Using annual volume against a single-quarter gap, which overstates the overpayment fourfold","Recommending an index price that only moves up, not down"],"glossary":[{"term":"Cooking oil index","meaning":"A published reference price for cooking oil, based on the palm oil market plus a fixed refining and packing margin."},{"term":"Index-linked price","meaning":"A contract price that moves with a published index by a set rule."},{"term":"Tender","meaning":"Asking several suppliers for offers and choosing among them."},{"term":"Food service","meaning":"Restaurants, stalls, hotels and caterers, not households or factories."},{"term":"Pass-through","meaning":"How much of an index move shows up in the price paid. 100% means fully."},{"term":"Run-rate","meaning":"The yearly amount if today's situation continues."},{"term":"Regional lot","meaning":"One part of a tender covering one region, so different suppliers can win different regions."},{"term":"Delivery adder","meaning":"A fixed extra amount per litre on top of the index, for delivery to the outlet."}]},{"id":"indirect-tail-spend","title":"Tail spend at a bank (Dalisay Pacific Bank)","client":"Dalisay Pacific Bank, a mid-sized Philippine bank with about 180 branches.","country":"Philippines","type":"procurement","difficulty":"Beginner","format":"Interviewer-led","minutes":30,"summary":"The bank buys from 1,200 suppliers. Where are the savings in indirect spend, and how much cash can better payment terms release?","prompt":"Dalisay Pacific Bank spends about PHP 2 billion a year on indirect goods and services: branch maintenance, IT services, security, printing, office supplies and consulting. It buys from about 1,200 suppliers. Staff often buy outside the approved contracts, and many small suppliers are paid within a week. The new CPO wants a plan. You are on the Inverto team and the CPO meeting is tomorrow. We will go step by step. First, how would you structure the levers for indirect spend?","clarifying":[{"q":"How much of the spend is bought outside approved contracts?","a":"About 20% of spend is maverick buying. (Give if asked.)"},{"q":"What does it cost to process one purchase order?","a":"About PHP 2,500 per PO, covering requisition, approval, PO, receipt and invoice matching."},{"q":"How many purchase orders per year?","a":"About 60,000."},{"q":"What is the bank's payment term policy?","a":"Pay at 45 days, unless a contract says otherwise. Many suppliers are paid earlier than that today."},{"q":"What is the bank's cost of funds?","a":"About 6% a year. (Give if asked.)"},{"q":"Which categories are the biggest, and are the tail suppliers spread across them?","a":"The tail is spread across all categories: small repairs, printing, stationery and one-off consulting. No category data beyond Exhibit 1 is available now. (Give if asked.)"}],"structure":{"notes":"A good structure for indirect spend: demand, specification, supplier base, process (purchase to payment) and commercial terms. Better answers add which levers are quick and which take longer.","branches":[{"name":"Demand","points":["Do we need it","Policy and approval limits","Bundling requests"]},{"name":"Specification","points":["Standard items and service levels","Fewer variants"]},{"name":"Suppliers","points":["Consolidate the tail","Competitive tenders","Preferred supplier lists"]},{"name":"Process and terms","points":["Catalogues and purchase cards","Fewer, larger POs","Payment terms at policy","Reduce maverick buying"]}]},"stages":[{"id":"s1","title":"Lever structure","timer":"structure","minutes":5,"question":"How would you structure the levers to reduce the cost of indirect spend?","notes":"Accept demand, specification, supplier consolidation, process, payment terms. Do not worry about the exact names. If they miss process or payment terms, ask 'what about how we buy and pay?'. Then move to Exhibit 1.","exhibits":[],"hints":["Ask whether we need the item, what exactly we buy, from whom, and how.","Do not forget cost beyond price."],"solution":"I would use five levers.\nDemand: do we need it, and can we reduce it with policy and approval limits.\nSpecification: standard items and service levels instead of many variants.\nSuppliers: fewer suppliers, tenders, preferred lists, with more volume per supplier.\nProcess: catalogues, purchase cards, fewer POs, less maverick buying.\nPayment terms: pay at the policy date, not earlier.\nThe first three reduce price. The last two reduce process cost and release cash.","answers":{"standard":"I would use five levers. Demand: do we need it. Specification: standard items. Suppliers: fewer suppliers and tenders. Process: fewer orders and catalogues. Payment terms: pay on the policy date.","great":"Five levers. Demand, specification and suppliers cut price. Process and payment terms cut process cost and release cash. I would also separate quick levers, like payment terms and cards, from slow ones, like tenders and specification. Maverick buying, outside contracts, cuts across all of them, so I would check how much there is.","best":"I would structure it as demand, specification, suppliers, process, and payment terms, and rank them by speed and size. Process and terms are fast and in the bank's own control. Price levers need tenders and take months. For a bank, branch maintenance and IT services are likely the biggest categories, so I would ask for the split of spend. I would also look at the supplier count, because 1,200 suppliers with many small orders points to a long tail, which is a process cost problem more than a price problem."},"probes":[{"ask":"Why separate quick levers from slow ones?","listen":"The CPO needs results soon. Process and terms are fast; tenders are slow."},{"ask":"What does maverick buying mean and why does it matter?","listen":"Staff buying outside approved contracts, so no negotiated price and more orders. It is 20% of spend."},{"ask":"The CPO asks: just negotiate harder with all suppliers. Reply?","listen":"Price is one lever; process cost and terms matter too, and the long tail is not worth negotiating one by one."},{"ask":"What would you ask the bank first?","listen":"Spend by supplier, number of orders, cost per order, payment terms."}]},{"id":"s2","title":"Define the tail and size process savings","timer":"exhibit","minutes":9,"question":"Exhibit 1 shows suppliers grouped by spend. How would you define the tail? Then: if the bank halves the number of tail POs, at PHP 2,500 per PO, what does it save?","notes":"Hand over Exhibit 1. Expected tail: the last 900 suppliers, 75% of suppliers, 5% of spend (PHP 100m), 50% of POs. Saving: 30,000 x 50% = 15,000 POs x 2,500 = PHP 37.5m. So-what: tail PO cost PHP 75m is 75% of tail spend; average tail PO is PHP 3,333, barely above the cost of processing it (PHP 2,500). Accept other tail definitions if reasoned (e.g. bottom 5% of spend).","exhibits":["e1"],"hints":["Look at where the spend share reaches 95%.","Use POs x cost per PO. Mind the unit: PHP, then PHP m."],"solution":"Spend is 60% in the top 25 suppliers and 85% in the top 100. 95% is reached at 300 suppliers.\nTail = the last 900 suppliers. They are 75% of suppliers but only 5% of spend, PHP 100m.\nThey raise 30,000 of 60,000 POs, which is 50%.\nTail PO cost = 30,000 x PHP 2,500 = PHP 75m. That is 75% of tail spend.\nAverage tail PO = PHP 100m / 30,000 = PHP 3,333. It costs PHP 2,500 to process.\nHalving tail POs = 15,000 x PHP 2,500 = PHP 37.5m a year.\nThis is pure process cost, no price negotiation needed. Tools: catalogues, purchase cards, monthly consolidated orders, and moving tail suppliers to a few preferred suppliers.","answers":{"standard":"The tail is the last 900 suppliers, 75% of suppliers but only 5% of spend, 100 million pesos. They raise half the orders, 30,000. Halving that is 15,000 orders times 2,500 pesos, which saves 37.5 million pesos a year.","great":"Top 100 suppliers are 85% of spend, and 95% is reached at 300. So the tail is the last 900, 5% of spend and 50% of orders. Processing those orders costs 75 million, which is 75% of the 100 million we spend with them. The average tail order is 3,333 pesos and costs 2,500 to process. Halving the orders saves 37.5 million a year, with no price talks. I would use catalogues, purchase cards and monthly consolidated orders.","best":"Tail is the last 900 suppliers: 75% of suppliers, 5% of spend, 50% of orders. Processing the tail costs 75 million pesos for 100 million of purchases, so 75 cents of process per peso bought. Halving the orders saves 37.5 million a year, which is about 1.9% of the 2 billion total spend, large for one lever. Sanity check: the saving is half of the 75 million. Caveat: the 2,500 cost per order is an average, and some of it is fixed, so the real saving may be lower. I would test that with the finance team."},"probes":[{"ask":"How do you define the tail and why 900 suppliers?","listen":"95% of spend is reached at 300 suppliers; the rest are 900, 5% of spend."},{"ask":"Why is the average tail order a problem?","listen":"3,333 pesos order costing 2,500 to process."},{"ask":"The head of IT says tail suppliers are special and needed. Reply?","listen":"Some are, but we only halve orders, not suppliers; consolidate, not remove."},{"ask":"How would you check that the 2,500 cost per order is right?","listen":"It is an average; part is fixed. Ask finance how much would truly go away."},{"ask":"What is the saving if only 20% of orders could be cut?","listen":"6,000 orders times 2,500 is 15 million pesos."}]},{"id":"s3","title":"Payment terms","timer":"math","minutes":8,"question":"Exhibit 2 shows payment terms by group. If the bank pays every group at its 45-day policy, how much cash does it release? What is the risk?","notes":"Hand over Exhibit 2. Expected: spend / 365 x extra days by group: 49.3 + 20.5 + 16.4 + 10.4 = PHP 96.7m (round). Weighted average days to pay moves from 27.35 to 45 days: 2,000 / 365 x 17.65 = 96.7. Risk: small suppliers lose cash; tail suppliers at 7 days may be micro firms; relationships; early-pay discounts. Cash is one-off. Interest saved at 6% = PHP 5.8m a year.","exhibits":["e2"],"hints":["Cash released = spend per day x extra days.","Do it per group, then check with the weighted average."],"solution":"Spend per day = 2,000 / 365 = PHP 5.48m.\nTop 25: 1,200 / 365 x 15 days = PHP 49.3m.\nNext 75: 500 / 365 x 15 days = PHP 20.5m.\nNext 200: 200 / 365 x 30 days = PHP 16.4m.\nTail 900: 100 / 365 x 38 days = PHP 10.4m.\nTotal = PHP 96.7m.\nCheck: weighted average days to pay today = 27.35 days. Gap to 45 = 17.65 days. 5.48 x 17.65 = PHP 96.7m.\nThis is a one-off cash release, not a yearly saving. At 6% cost of funds it is worth about PHP 5.8m a year.\nRisk: small suppliers with 7 or 15 days will push back or raise prices. The tail is only PHP 10m of the cash, so I would not fight over it. Most cash is in the top 25 and next 75.","answers":{"standard":"I calculate cash per group: spend per day times extra days to 45. That gives 49.3, 20.5, 16.4 and 10.4, so 96.7 million pesos in total. It is a one-off release, not a yearly saving. The risk is that small suppliers lose cash.","great":"Cash is spend divided by 365 times extra days. Top 25: 49.3 million. Next 75: 20.5. Next 200: 16.4. Tail: 10.4. Total 96.7 million. Check with the average: today's weighted days to pay is 27.35, so 17.65 extra days times 5.48 million a day is 96.7. This is a one-off, worth about 5.8 million a year at 6%. The risk is small suppliers with 7 or 15 days pushing back, so I would start with the large ones.","best":"Total release is 96.7 million pesos, one time. Check: average days to pay is 27.35, gap 17.65, times 5.48 million a day. Interest value is about 5.8 million a year at 6%. 70 million of the cash sits with the top 100 suppliers, who are already at 30 days, so moving them to 45 is the easy start. The tail is only 10 million of cash, so not worth the fight. Risks: suppliers add the cost to prices, small firms fail, and the bank's reputation. I would check each large contract, since some may have a fixed term, and then agree the policy with finance."},"probes":[{"ask":"How do you get cash released per group?","listen":"Spend divided by 365, times the extra days to 45."},{"ask":"Is the 96.7 million a yearly saving?","listen":"No, one-off. Yearly value is about 5.8 million at 6%."},{"ask":"The CFO says pay everyone at 45 days from next month. Reply?","listen":"Phase it: start with large suppliers, protect small ones."},{"ask":"Which group gives most cash and why?","listen":"Top 25, 49.3 million, because of the large spend and 15 extra days."},{"ask":"What could go wrong with longer terms?","listen":"Suppliers raise prices, small suppliers face cash trouble, relationships suffer."}]},{"id":"s4","title":"Recommendation","timer":"recommendation","minutes":5,"question":"Give the CPO your recommendation: what to do first and what takes longer.","notes":"Looking for: quick wins vs longer levers, numbers, risk. Quick wins: terms to policy for top suppliers (PHP 70m), purchase card or catalogue for tail, ban new tail suppliers without approval. Longer: tenders and specification, demand policy, maverick control. Do not accept PHP 96.7m as a yearly saving.","exhibits":[],"hints":["Split by speed: what can the bank do in 3 months, what in 12 months?","Keep one-off cash and yearly saving apart."],"solution":"See the model recommendation.","answers":{"standard":"I would start with process and payment terms, because they are fast. Moving the top 100 suppliers to 45 days releases about 70 million pesos. Halving tail orders saves 37.5 million a year. Tenders and standard specifications take longer.","great":"Quick wins in three months: move the top 100 suppliers to 45 days, about 70 million of cash, and put the tail on catalogues or cards, 37.5 million a year. Slower, over a year: tenders and standard specs for the main categories, approval rules, and cutting maverick buying, which is 20% of spend. Cash release is one-off, so I say it separately: worth about 6 million a year at 6%. Risk is small suppliers, so I leave the tail on shorter terms for now.","best":"My answer: do process and terms first, price levers in parallel. First three months: top 100 to 45 days for 70 million pesos of one-off cash, worth about 4 million a year; tail orders halved for 37.5 million a year. Next twelve months: tenders and standard specs for the top categories, approval rules, and a ban on new tail suppliers without approval. Maverick buying is 20% of spend, so a contract compliance check is needed. I keep the one-off cash and yearly saving apart, so the CPO does not count 96.7 million as a yearly number. Risks: small supplier pushback, and the cost per order being partly fixed. Next steps: confirm the order cost, list the tail by category, agree the terms policy with finance."},"probes":[{"ask":"What is your first action in the first three months?","listen":"Move top 100 suppliers to 45 days, and set up catalogues or cards for the tail."},{"ask":"Why keep one-off cash apart from yearly saving?","listen":"The cash comes once. Only the interest, about 6 million a year, repeats."},{"ask":"The CPO wants a single yearly saving number. What do you give?","listen":"37.5 million from orders plus about 6 million interest; price levers on top later."},{"ask":"What is the biggest risk?","listen":"Small suppliers pushing back, or the order cost being partly fixed."},{"ask":"What takes longest?","listen":"Tenders, specifications, maverick buying control."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Suppliers by spend rank","chart":"pie","columns":["Supplier group (by spend rank)","Suppliers","Share of spend (%)","Spend (PHP m/year)","Purchase orders (per year)"],"rows":[["Top 25",25,60,1200,6000],["Next 75",75,25,500,10000],["Next 200",200,10,200,14000],["Last 900",900,5,100,30000],["Total",1200,100,2000,60000]],"note":"Indirect spend only. Processing cost is PHP 2,500 per purchase order.","series":[3],"rowsUsed":[0,1,2,3]},{"id":"e2","title":"Exhibit 2: Payment terms by supplier group","chart":"bar","columns":["Supplier group (by spend rank)","Spend (PHP m/year)","Current terms (days)","Policy terms (days)"],"rows":[["Top 25",1200,30,45],["Next 75",500,30,45],["Next 200",200,15,45],["Last 900",100,7,45]],"note":"Terms are the average days from invoice to payment. Use 365 days a year.","series":[2,3]}],"recommendation":"My answer is to start with process and payment terms, because they are fast, and run price levers in parallel. The bank spends PHP 2 billion with 1,200 suppliers. The last 900 are 5% of spend but half of the POs. Processing those POs costs PHP 75 million, which is 75% of what the bank spends with them. Halving them saves PHP 37.5 million a year. Moving all groups to the 45-day policy releases PHP 96.7 million once, and is worth about PHP 6 million a year at 6% cost of funds. I would move the top 100 suppliers first, since they hold PHP 70 million of that cash. Risk is pushback from small suppliers, so I would leave the tail on shorter terms until they are on a card or catalogue. Longer levers: tenders and standard specs for the top categories, approval rules, and stopping maverick buying, which is 20% of spend. Next steps: confirm the PO cost, list tail suppliers by category, and agree the policy with finance.","good":["Gives a clear lever structure: demand, specification, suppliers, process, terms.","Defines the tail with numbers: 900 suppliers, 5% of spend, 50% of POs.","Computes PHP 37.5m from POs x cost per PO.","Computes cash release per group: PHP 96.7m."],"great":["Compares tail PO cost (PHP 75m) with tail spend (PHP 100m) and the average PO value.","Says that cash release is one-off and converts it to about PHP 5.8m a year at 6%.","Splits quick wins (terms for large suppliers, cards, catalogues) from longer levers (tenders, specs, maverick control).","Flags the harm to small suppliers when their payment terms move from days to 45 days."],"mistakes":["Treating PHP 96.7m as a yearly saving.","Calling the tail 'small suppliers' without a number.","Mixing PHP and PHP m in the PO calculation.","Applying a flat number of extra days to all spend instead of calculating each group's own gap to 45 days.","Focusing only on price, ignoring process cost."],"glossary":[{"term":"Indirect spend","meaning":"What a company buys to run the business, not to put in its product: maintenance, IT, security, printing."},{"term":"Tail spend","meaning":"The many small suppliers that together make a small part of the spend but a large part of the work."},{"term":"Purchase order (PO)","meaning":"The formal document asking a supplier to deliver and be paid."},{"term":"Maverick buying","meaning":"Staff buying outside the approved contracts and suppliers."},{"term":"Payment terms","meaning":"The number of days the buyer takes to pay after getting the invoice."},{"term":"Purchase card / catalogue","meaning":"A company card or an approved online list that lets staff buy small items without a full order process."},{"term":"Cost of funds","meaning":"What the bank pays to get money, here 6% a year."},{"term":"One-off cash release","meaning":"Money freed once by paying later, not a repeated yearly saving."}]},{"id":"brake-supplier-selection","title":"Chao Phraya Auto: casting supplier choice","client":"Chao Phraya Auto Components Co., a Thai tier-1 maker of brake systems for passenger cars and pickups","country":"Thailand","type":"procurement","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"Pick the supplier or suppliers for a new cast brake caliper housing, 600,000 units a year.","prompt":"Our client is Chao Phraya Auto Components, a Thai maker of brake systems. It won a new platform from a car maker. Production starts in nine months. The platform needs a cast caliper housing, 600,000 units a year. Three foundries have sent quotes: one in Thailand, one in China and one in India. The head of purchasing wants a recommendation before the sourcing committee next week. The China quote is the lowest. She is not sure it is the right choice. How would you help her decide?","clarifying":[{"q":"Do all three suppliers meet our technical requirements?","a":"Yes. All three passed the technical review and the capacity check at the knock-out stage. Now we compare them."},{"q":"What is the annual volume, and is it stable?","a":"600,000 units a year, steady, for five years."},{"q":"Are the quotes on the same basis?","a":"No. Supplier A quotes delivered to our plant. Supplier B quotes FOB Shanghai. Supplier C quotes CIF Laem Chabang. Details are in the exhibit."},{"q":"What does a defective part cost us?","a":"USD 8 per defective part in rework and scrap. Give this if asked, it is also in the exhibit note."},{"q":"What is the cost of capital?","a":"About 12% a year, so 1% for each 30 days of payment time. Give this if asked, it is also in the exhibit note."},{"q":"Can one supplier deliver the whole volume?","a":"B and C could. Supplier A can supply at most 360,000 units a year, which is 60%. A is the Thai foundry. Its financial health is weak and it has one site. Give this only if asked about risk."}],"structure":{"notes":"Good structure: knock-out criteria first (capability, capacity, certification), then total cost, then a weighted scorecard for non-cost criteria, then a portfolio decision (single or dual source).","branches":[{"name":"Knock-out criteria","points":["Technical capability and tooling","Capacity for 600,000 units","IATF 16949 certification","Financial stability"]},{"name":"Total landed cost","points":["Quote price by Incoterm","Freight and insurance","Duty on CIF value","Quality cost (defects times rework)","Payment terms"]},{"name":"Weighted scoring","points":["Quality","Delivery performance and lead time","Risk and ESG","Check that weights do what we intend"]},{"name":"Portfolio and risk","points":["Single vs dual source","Volume split","Country and logistics risk","Exit and switching cost"]}]},"stages":[{"id":"s1","title":"Structure the supplier selection","timer":"structure","minutes":7,"question":"How would you structure the supplier selection for the head of purchasing?","notes":"Listen for: knock-outs before scoring, cost as total cost not quote, non-cost criteria in a scorecard, and a final portfolio view. Give clarifying answers as asked. The statement that the knock-outs are passed comes from the first clarifying answer.","exhibits":[],"hints":["What must be true before we even compare prices?","Is the quote price the cost to us?"],"solution":"I would do it in four steps.\nStep 1, knock-outs. Can they make the part, do they have the capacity, are they IATF certified, are they financially stable? All three have passed.\nStep 2, total landed cost. Quote price plus freight, duty, quality cost and the cost of payment terms. This is the real cost to us.\nStep 3, a weighted scorecard for what cost does not show: quality, delivery, and risk and ESG. I would check that the weights really do what we intend.\nStep 4, the portfolio. One supplier or two, what split, and what the risks are.\nI would start with landed cost, because the quotes are on different Incoterms.","answers":{"standard":"First I check that each supplier can make the part and has the capacity. Then I compare total cost, not just the quote price. Then I score quality, delivery and risk. Last I decide one supplier or two.","great":"I would use four steps. One, knock-outs: can they make it, do they have the capacity, are they certified. Two, landed cost, because the quotes are on different delivery terms and so not comparable. Three, a scorecard for quality, delivery, and risk and ESG, where I check the weights. Four, a portfolio view: one or two suppliers. The client wants cost, but a supplier failure would stop her whole platform, so risk matters.","best":"Four steps. Knock-outs first, so we do not score suppliers who cannot qualify. Then landed cost, because the quotes use different delivery terms and the lowest quote may not be the lowest cost. Then a scorecard for what cost does not show, and I would check the weights add up and do what the team intended. Last, the portfolio: single or dual source, split, and exit options. I expect the answer to be a split, not one winner, because one site or one country is a risk for a car platform. I would start with landed cost, as it can change the ranking, and I would ask for the failure cost of a stopped line."},"probes":[{"ask":"Why check capacity and certification before price?","listen":"Because a cheap supplier that cannot qualify or deliver is no option. Knock-outs save time."},{"ask":"Is the quote price the cost to us? What else could differ between quotes?","listen":"No. Freight, duty, defects and payment terms differ. They want total cost."},{"ask":"The head of purchasing says: just take the cheapest quote and move on. Do you agree?","listen":"Respectful pushback: the quotes use different delivery terms, so they are not comparable. Wants to check landed cost first."},{"ask":"What would you ask the client before you start?","listen":"Sensible questions on volume, defects cost, payment terms or capacity. Not random."}]},{"id":"s2","title":"Landed cost per unit","timer":"math","minutes":12,"question":"Here are the three quotes. Calculate the landed cost per unit for each supplier. Which is cheapest, and what does that mean for the decision?","notes":"Key traps: duty is charged on the CIF value, which for B is quote plus freight. A and C already include freight. Defect cost is defect rate times USD 8. Payment terms: baseline 60 days, each 30 days shorter costs 1% of the quote price. The cheapest quote (B) is the most expensive landed. Let the candidate do it on paper. A good candidate states the base before multiplying.","exhibits":["e1"],"hints":["Duty is a percent of CIF. What is CIF for B?","Compare terms to a 60-day baseline."],"solution":"Landed cost = quote + freight + duty + defect cost + payment terms cost.\nSupplier A (delivered, no duty):\nQuote 10.20. Freight 0. Duty 0. Defects 1% x USD 8 = 0.08. Terms 60 days = 0.\nLanded = 10.28 USD per unit.\nSupplier B (FOB, I pay freight and duty):\nQuote 9.00. Freight 0.60. CIF = 9.60. Duty 10% x 9.60 = 0.96. Defects 6% x 8 = 0.48. Terms 30 days, 30 days shorter than baseline = 1% x 9.00 = 0.09.\nLanded = 9.00 + 0.60 + 0.96 + 0.48 + 0.09 = 11.13 USD per unit.\nSupplier C (CIF, freight in the price):\nQuote 10.00. Duty 5% x 10.00 = 0.50. Defects 3% x 8 = 0.24. Terms 45 days, 15 days shorter = 0.5% x 10.00 = 0.05.\nLanded = 10.00 + 0.50 + 0.24 + 0.05 = 10.79 USD per unit.\nOrder by landed cost: A 10.28, C 10.79, B 11.13.\nB is the lowest quote at 9.00, but the highest landed cost. B is 0.85 per unit above A. At 600,000 units that is USD 510,000 a year.\nA is 1.20 above B on quote, but 0.85 below B landed.\nSo-what: the quote is the wrong measure. A is cheapest, C is 0.51 above A, B is out on cost.","answers":{"standard":"I add freight, duty, defect cost and payment-terms cost to each quote. Duty is on the quote plus freight. A comes to 10.28, C to 10.79 and B to 11.13 US dollars per unit. So B has the lowest quote but the highest landed cost.","great":"Landed cost is quote plus freight plus duty plus defect cost plus payment-terms cost. For B, duty is 10% of 9.60, which is 0.96. Defects cost 6% times 8, which is 0.48. B lands at 11.13. A is 10.28 and C is 10.79. B is 0.85 above A, so about 510,000 dollars a year. So the cheapest quote is the most expensive supplier. I would still check the defect rates, because B's result depends on them.","best":"Landed cost per unit: A 10.28, C 10.79, B 11.13 dollars. The trap is B: quote 9.00, plus freight 0.60, duty 0.96 on the 9.60 value, defects 0.48 and terms 0.09. That is 0.85 above A, which is 510,000 dollars a year. Sanity check: even with zero defects B would cost 10.65, still above A at 10.28, so freight and duty alone remove its price edge. Next I would ask whether the defect rates are measured or promised, and whether B's quote is firm for five years."},"probes":[{"ask":"Which number do you apply the import duty to, and why?","listen":"Quote plus freight (the CIF value), because customs taxes the goods as delivered to the border. For B this is 9.60, giving 0.96."},{"ask":"Why does B end up the most expensive though it has the lowest quote?","listen":"Freight 0.60, duty 0.96 and defect cost 0.48 add 2.04 on top of 9.00. Also short payment terms."},{"ask":"How do you get the defect cost per unit?","listen":"Defect rate times 8 dollars: 1% gives 0.08, 3% gives 0.24, 6% gives 0.48."},{"ask":"The CFO says defects are the quality team's problem, not a purchasing cost. Remove them. What changes?","listen":"Without defects: A 10.20, C 10.55, B 10.65. The order stays A, C, B but the gaps shrink. A good reply also says defects are a real cost to the client and should stay in the comparison."},{"ask":"A supplier asks to deliver at 90 days of payment instead of 60. How would you value that?","listen":"Longer terms than the baseline are worth money to us, about 1% of the quote for each extra 30 days. Candidate should reason in that direction."}]},{"id":"s3","title":"The scorecard","timer":"exhibit","minutes":13,"question":"The purchasing team scored the three suppliers on non-cost criteria. They agreed group weights of 40% cost, 25% quality, 20% delivery and 15% risk and ESG. Their sheet multiplies each criterion score by its group weight and adds up all rows. What do the totals say? Do you trust this scorecard?","notes":"The sheet applies the group weight to every criterion row, so groups with more criteria get more weight. Row weights add to 190, not 100. Effective weights: cost 40/190 = 21%, quality 50/190 = 26%, delivery 21%, risk and ESG 60/190 = 32%. Cost, the stated top priority, is only 21%. The sheet says C (430) beats A (415). With the intended weights A wins. The candidate must notice that the weights are wrong, and say so. Do not let them silently correct the sheet.","exhibits":["e2"],"hints":["Add up the weights of all the rows. Is it 100?","How many criteria sit in each group?"],"solution":"Step 1. Sheet totals = sum of weight x score over all rows.\nSupplier A: 40x3 + 25x3 + 25x2 + 20x1 + 20x3 + 15x1 + 15x3 + 15x1 + 15x1 = 120 + 75 + 50 + 20 + 60 + 15 + 45 + 15 + 15 = 415.\nSupplier B: 40 + 25 + 50 + 20 + 40 + 45 + 30 + 15 + 30 = 295.\nSupplier C: 80 + 50 + 75 + 40 + 20 + 45 + 30 + 45 + 45 = 430.\nThe sheet ranks C (430), A (415), B (295).\nStep 2. Check the weights. The row weights add to 40 + 25 + 25 + 20 + 20 + 15 + 15 + 15 + 15 = 190, not 100.\nCriteria per group: cost 1, quality 2, delivery 2, risk and ESG 4.\nEffective weight = group weight x number of criteria / 190.\nCost: 40 / 190 = 21%. Quality: 50 / 190 = 26%. Delivery: 40 / 190 = 21%. Risk and ESG: 60 / 190 = 32%.\nWe said cost matters most at 40%. The sheet gives it 21%. Risk and ESG was meant to be 15% but gets 32%.\nStep 3. Fix it. Average the criteria inside each group, then apply the group weight.\nGroup averages (cost, quality, delivery, risk) are A: 3.0, 2.5, 2.0, 1.5. B: 1.0, 1.5, 1.5, 2.0. C: 2.0, 2.5, 1.5, 2.75.\nA = 0.40x3.0 + 0.25x2.5 + 0.20x2.0 + 0.15x1.5 = 2.45.\nB = 1.375.\nC = 0.40x2.0 + 0.25x2.5 + 0.20x1.5 + 0.15x2.75 = 2.14.\nWith the intended weights the order is A (2.45), C (2.14), B (1.38).\nSo-what: the sheet flips A and C. The corrected score agrees with landed cost: A first, C second, B last. B loses on both. A is weak on risk (financial health, one site), which is why a second supplier matters.","answers":{"standard":"The sheet ranks C first with 430, A second with 415 and B last with 295. But I do not trust it. The row weights add to 190, not 100. Groups with more criteria get more weight.","great":"The sheet ranks C at 430, A at 415 and B at 295. The weights add to 190. Risk and ESG has four rows, so it gets 32% in effect, not 15%. Cost has one row and gets 21%, not 40%. If I average inside each group and then apply the agreed weights, A scores 2.45, C 2.14 and B 1.38. So A and C swap places. This agrees with landed cost. I would tell the team before the committee.","best":"The sheet gives C 430, A 415, B 295, but the weights add to 190. So the effective weights are cost 21%, quality 26%, delivery 21%, risk and ESG 32%. That is the opposite of what the team agreed. With averages inside each group, A is 2.45, C 2.14, B 1.38. The ranking flips, and it now matches landed cost. I would not fix the sheet silently. I would show the team and agree the weights. Also, scores of 1 to 3 are coarse, so I would test whether A still wins if risk gets 25%. A's lead over C is about 0.3 points."},"probes":[{"ask":"Why do the row weights matter? What should they add up to?","listen":"Should add to 100. They add to 190, so each criterion's weight is distorted."},{"ask":"Which group is over-weighted and which under-weighted, and why?","listen":"Risk and ESG is over-weighted (4 rows, 32% instead of 15%). Cost is under-weighted (1 row, 21% instead of 40%)."},{"ask":"The team lead says the ranking is fine because C and A are close anyway. Respond.","listen":"The ranking is wrong: with the agreed weights A beats C. It also conflicts with landed cost."},{"ask":"What would you do about the sheet before the committee?","listen":"Show the team the error, recompute with agreed weights, do not fix it silently."},{"ask":"How could you check whether the scores themselves are reliable?","listen":"Ask where the scores come from, for example audits or delivery data, and test how much the ranking moves if weights change."}]},{"id":"s4","title":"Recommendation","timer":"recommendation","minutes":13,"question":"Sourcing committee is next week. What do you recommend: one supplier or two? If two, what volume split, and what is the cost of that choice compared with buying everything from A, the cheapest landed cost? What are the risks?","notes":"Supplier A can supply at most 360,000 units (60%). Expected answer: dual source A and C, 60/40, exclude B. Candidate should compute the volume, the premium over single-sourcing A (0.51 x 240,000), and the saving vs B. Reasoning on risk: A is domestic and cheapest but has weak financial health and one site; C is a second country, ESG strong, but lead time is long. Listen for exit plan and a review of the split after year one.","exhibits":[],"hints":["How much can A supply at most?","What is the extra cost of moving 240,000 units from A to C?"],"solution":"Dual source, A and C. Exclude B.\nStep 1. Volume. A at its maximum 60% of 600,000 = 360,000 units. C takes 40% = 240,000 units.\nStep 2. Annual cost.\nA: 360,000 x 10.28 = USD 3,700,800.\nC: 240,000 x 10.79 = USD 2,589,600.\nTotal = USD 6,290,400.\nStep 3. Compare.\nAll A (not possible, 60% cap): 600,000 x 10.28 = USD 6,168,000. The dual source premium is USD 122,400 a year, 2.0%.\nAll B (cheapest quote): 600,000 x 11.13 = USD 6,678,000. The dual source is USD 387,600 a year cheaper than B.\nSo-what: for a 2% premium over the theoretical best we get a second source in a second country. A has weak financial health and one site. C has the best ESG and financial score. B is out on landed cost and a 6% defect rate.","answers":{"standard":"I recommend dual sourcing: A for 60% and C for 40%, and not B. A can supply at most 360,000 units, so C takes 240,000. This costs about 122,400 dollars a year more than all A, so about 2%. It is 387,600 cheaper than B.","great":"I recommend A for 360,000 units and C for 240,000. B is out on landed cost and its 6% defect rate. The total is 6.29 million dollars a year. That is 2% above all A, which is not possible anyway because of A's cap. It is 387,600 cheaper than all B. A has weak finances and one site, so a second source in another country protects the platform. Risks: C's long lead time, so we hold safety stock, and A's finances, so we check them twice a year.","best":"Dual source, A 60% and C 40%, no B. Cost is 6.29 million dollars a year. The premium over a theoretical all-A is 122,400, about 2%, and it buys a second site and a second country. It is 387,600 below all B. The split is set by A's cap, so I would also test 60/40 against, say, 50/50 once A's finances are checked. The risks are A's weak finances, C's long lead time and its import duty. I would put in a safety stock for year one, a financial check on A every six months, and a clause to move volume if quality slips. Next steps: confirm A's capacity in writing, agree C's quality plan, and review the split after year one."},"probes":[{"ask":"Why not give A all the volume?","listen":"A can supply only 60%, 360,000 units. It also has weak finances and one site."},{"ask":"Why is C the second source and not B?","listen":"B has the highest landed cost and 6% defects. C is 0.51 above A, with better ESG and finances, and in a different country."},{"ask":"What does the dual source cost versus all A?","listen":"122,400 dollars a year, about 2%. Expect it computed as 0.51 times 240,000."},{"ask":"The CFO says: pay 2% more for a second supplier? Just use A. Respond.","listen":"A cannot supply more than 60%. Also, a supplier failure would stop the platform, so the premium is insurance."},{"ask":"What could change your recommendation?","listen":"A's finances worsen, C's quality or lead time disappoints, duty or freight changes, or A's cap rises."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Quotes for the caliper housing","chart":"table","columns":["Supplier (location)","Incoterm","Quote (USD per unit)","Freight to plant (USD per unit)","Import duty (% of CIF value)","Defect rate (%)","Payment terms (days)"],"rows":[["A (Thailand)","DDP plant",10.2,0.0,0,1,60],["B (China)","FOB Shanghai",9.0,0.6,10,6,30],["C (India)","CIF Laem Chabang",10.0,0.0,5,3,45]],"note":"CIF value = quote + freight and insurance to Thailand. For C the freight is already in the quote. Defect cost: USD 8 per defective part. Payment terms: baseline is 60 days; each 30 days shorter costs 1% of the quote price. Annual volume 600,000 units."},{"id":"e2","title":"Exhibit 2: Supplier scorecard (scores 1 to 3, 3 is best)","chart":"table","columns":["Criterion","Group","Group weight on each row (%)","A","B","C"],"rows":[["Landed cost","Cost",40,3,1,2],["Defect rate","Quality",25,3,1,2],["IATF 16949 status","Quality",25,2,2,3],["On-time delivery","Delivery",20,1,1,2],["Lead time","Delivery",20,3,2,1],["Financial health","Risk and ESG",15,1,3,3],["Country and logistics risk","Risk and ESG",15,3,2,2],["ESG audit","Risk and ESG",15,1,1,3],["Site concentration","Risk and ESG",15,1,2,3]],"note":"Group weights agreed by the team: cost 40%, quality 25%, delivery 20%, risk and ESG 15%. The team's sheet multiplies each score by the group weight shown on its row and adds up all rows. Score 2 for IATF means certified with open findings."}],"recommendation":"My recommendation is to dual source: Supplier A for 60% and Supplier C for 40%, and not use B. B has the lowest quote at USD 9.00 but the highest landed cost at 11.13. After freight, 10% duty, 6% defects and short payment terms, it costs 0.85 per unit more than A, USD 510,000 a year. A is cheapest at 10.28. C is 10.79. Note that the purchasing scorecard gives wrong weights: cost counts for 21%, not 40%, and it ranks C above A. With the intended weights, A leads. Because A can only supply 360,000 units, and has weak financials and one site, I would give C 240,000 units. That costs USD 122,400 a year more than an all-A case, about 2%. It is USD 387,600 cheaper than buying from B. The main risks are C's long lead time, so we hold safety stock for the first year, and A's financial health, so we check it every six months. Next steps: confirm A's capacity, agree C's quality plan, and review the split after year one.","good":["Puts knock-outs before scoring and separates quote from landed cost","Calculates duty on CIF value and quality cost as defect rate times USD 8","Finds that B has the lowest quote but the highest landed cost","Recommends a dual source with a volume split that respects A's 60% cap"],"great":["Notices the scorecard weights add to 190 and gives the effective weights (cost 21%, risk and ESG 32%)","Says the sheet flips A and C, and re-runs it with the intended weights instead of silently fixing it","Prices the dual-source premium (USD 122,400, about 2%) and compares it with the all-B case","Names risk reasoning per supplier: A financial health and single site, C lead time, B quality"],"mistakes":["Choosing B because it has the lowest quote","Applying duty to the FOB quote instead of the CIF value","Adding up the scorecard without checking that the weights make 100","Recommending A alone, ignoring its 60% capacity and its weak financial health","Giving a split with no cost number or risk reasoning"],"glossary":[{"term":"Landed cost","meaning":"The full cost per unit once the part is at the client's plant: price plus freight, duty, defects and payment terms."},{"term":"Incoterm (FOB, CIF, DDP)","meaning":"A trade rule saying who pays for transport and risk. FOB: buyer pays freight from the port. CIF: seller pays freight to our port. DDP: seller delivers to our plant, duty paid."},{"term":"Duty","meaning":"A tax charged by customs when goods are imported, as a percent of the CIF value."},{"term":"CIF value","meaning":"Price of the goods plus freight and insurance to the port of arrival. Duty is based on it."},{"term":"IATF 16949","meaning":"A quality certificate that car parts makers must hold."},{"term":"Tier-1 supplier","meaning":"A company that sells parts straight to the car maker."},{"term":"Dual source","meaning":"Buying the same part from two suppliers at the same time to reduce risk."},{"term":"Knock-out criteria","meaning":"Must-have requirements. A supplier that fails one is dropped before any comparison."}]},{"id":"spend-baseline-scorecard","title":"Johor SmartMeter: savings plan and dual source","client":"Johor SmartMeter Sdn Bhd, a Malaysian maker of electricity meters with MYR 330m of yearly purchases","country":"Malaysia","type":"procurement","difficulty":"Intermediate","format":"Candidate-led","minutes":45,"summary":"Find where the savings are across six categories, check the risk in the plastic housing supplier base, and read an RfQ scorecard.","prompt":"Our client is Johor SmartMeter, a Malaysian maker of electricity meters for utilities in Southeast Asia. Yearly purchases are about MYR 330 million across six categories. A new CPO started three months ago. She has a target of MYR 8 million of savings a year within 18 months, and her team can run only three category projects at a time. She also worries that some supplier bases have not changed for years. You are on the Inverto team. She has asked you to propose where to start and to help her with the first project. How would you like to go about it?","clarifying":[{"q":"What do the MYR 330 million cover?","a":"The last 12 months of purchases, in six categories: electronic components, plastic housings, packaging, freight and logistics, copper and brass contacts, and MRO and indirect. The category data is in the first exhibit once you ask for it."},{"q":"What does addressable mean here?","a":"The share of spend where we can change the supplier, the terms or the specification in the next 18 months. The rest is locked by contracts or by customer specifications."},{"q":"Where do the savings ranges come from?","a":"Inverto benchmarks from similar projects. Use the range, and use the midpoint to rank. Give this if asked."},{"q":"Can we use all three team slots for the three largest categories?","a":"That is for you to decide. The team can run three projects at a time. Give this if asked."},{"q":"How many suppliers does the plastic housing category have?","a":"Two moulders. One holds 85% of the volume. Neither has been changed in nine years. Give this if asked."},{"q":"What does the scorecard need to decide?","a":"Which supplier or suppliers get the plastic housing contract. The CPO wants a clear answer, one or two suppliers. Give this if asked."},{"q":"Did the small moulder (15% of volume today) bid in the RfQ?","a":"No. Its owner is retiring and it plans to stop production within a year. Its 15% has to move to the new suppliers. Give this if asked."}],"structure":{"notes":"Candidate-led. A good opening: size the opportunity before choosing, rank categories by savings in MYR, then work on the focus categories. The candidate should also say they want to look at supplier risk and at how to run the sourcing event. Accept any sensible order and steer back with the stage notes.","branches":[{"name":"Where are the savings","points":["Spend baseline by category","Addressable share","Savings range by category","Rank by MYR, not by spend"]},{"name":"Choose the focus","points":["Three category slots","Size against the MYR 8m target","Ease and speed","Backup category"]},{"name":"Supplier risk","points":["Supplier base unchanged for years","Impact and probability","Mitigations and owners"]},{"name":"Run the sourcing event","points":["RfQ and bidders","Scorecard criteria and weights","One or two suppliers"]}]},"stages":[{"id":"s1","title":"Your plan of attack","timer":"structure","minutes":5,"question":"The CPO asks: what would you like to do first, and what would you do after that? Please lay out your approach and tell me what you want to look at first.","notes":"Candidate-led. Do not tell them the order. Listen for: size the savings by category before picking projects, rank by savings in MYR, three focus categories, a look at supplier risk, a structured RfQ. If they ask for data on spend or categories, hand over Exhibit 1 and move to stage 2. If they want to start somewhere else (for example the plastic supplier risk), say that the CPO first wants to know where the money is, and offer Exhibit 1.","exhibits":[],"hints":["How would you decide which categories deserve the three slots?","What data would you ask the client for first?"],"solution":"I would work in four steps.\nStep 1. Build the baseline: spend by category.\nStep 2. For each category, take the addressable share of spend and multiply by a savings range. That gives savings in MYR. I would rank categories by MYR saved, not by spend, and pick three.\nStep 3. For the focus categories, check the supplier risk, especially where the supplier base has not changed for years.\nStep 4. Run the sourcing event with a clear RfQ and a scorecard, and decide on one or two suppliers.\nI would like to start with the spend data by category, to see where the MYR 8 million can come from.","answers":{"standard":"I would start with the spend by category. For each category I take the addressable share and multiply by a savings range, which gives savings in MYR. I rank by MYR saved, not by spend, and pick three categories. Then I look at supplier risk, and then run the sourcing event with a clear scorecard.","great":"The CPO has three project slots and an MYR 8 million target, so the first question is where the money is. I would size each category: spend, the share we can actually change, and a savings range. Then I rank by savings and pick three. I would also check whether the three together reach 8 million, in the low case and not only in the middle case. After that, I look at supplier risk in the categories we pick, since some have not changed for years, and then at how to run the sourcing event.","best":"The decision is which three of six categories get the team's time, so the baseline has to be by category and in MYR. I would build spend times addressable share times savings range, rank on the midpoint, and test whether the top three reach 8 million in the low case too. If they do not, I need a backup. In parallel, I would look at supplier risk where the base has not changed, because a savings project there can also create a risk. Last, I want a scorecard that follows what the CPO values, with weights checked before bids come in. I would ask for the spend data first."},"probes":[{"ask":"Why do you rank by savings and not by spend?","listen":"The biggest spend may be mostly locked or have low savings; the goal is MYR saved."},{"ask":"What does addressable mean?","listen":"The part of spend where we can change supplier, terms or spec in 18 months."},{"ask":"Why only three categories?","listen":"The team can run only three projects at a time."},{"ask"
