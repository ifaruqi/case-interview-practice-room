urrent terms (days)","Proposed terms (days)"],"rows":[["Top 30 local suppliers",3000,45,60],["Brand owners and multinationals",2000,30,30],["Small local suppliers",1000,60,60]],"note":"Brand owner terms are fixed by global contracts. Small suppliers already have 60 days."}],"recommendation":"My answer is that we can release about THB 370 million in cash in 12 months, above the CFO's THB 300 million, but it is a one-off. Stock above target is worth THB 247 million. The biggest lever is order size: MOQ is driving OTC and specialty stock. Extending terms for the top 30 local suppliers from 45 to 60 days adds THB 123 million. For profit, the effect is much smaller: holding cost at 12% on THB 247 million is THB 30 million a year, plus THB 10 million of interest on the longer terms, so about THB 40 million a year. The cash does not repeat. Risks are expiry and fill rate on specialty, and suppliers asking for higher prices. I would break-even test every extension: a price rise above 0.33% kills the payables lever. Next steps: start with MOQ talks on OTC and specialty, set fill-rate guard rails, and trade terms for firm payment dates.","good":["Builds the cash conversion structure: DIO, DPO, DSO, with levers.","Calculates excess stock per group as days over target x COGS / 365 and gets THB 247m.","Uses MOQ and lead time to explain why stock is high.","Computes DPO cash as spend / 365 x days = THB 123m."],"great":["Notes that the cash is one-off and converts it to yearly profit using the holding cost percentage (THB 30m + THB 10m).","Names the break-even price rise (0.33%) that kills the payment terms lever.","Links levers to risk: expiry on cold chain, fill rate, supplier priority in shortages.","Checks DPO with the weighted average: 42.5 to 50 days."],"mistakes":["Calling THB 370m a yearly saving.","Using total COGS with the weighted average DIO and missing group differences.","Extending terms for all suppliers, including those fixed by global contract.","Using months or 12 where the exhibit is in days, or mixing 360 and 365 without saying.","Cutting stock without checking fill rate and expiry."]},{"id":"dc-network-consolidation","title":"Closing a DC (Selatan Minuman)","client":"Selatan Minuman Sdn Bhd, a Malaysian beverage distributor with three distribution centres.","country":"Malaysia","type":"supply chain","difficulty":"Intermediate","format":"Candidate-led","minutes":45,"summary":"Should the distributor close its Penang DC, given a 3-year payback hurdle?","prompt":"Selatan Minuman is a beverage distributor in Malaysia. It runs three distribution centres: Klang Valley, Penang and Johor. The CFO thinks the network is too big and wants to close one DC. The board will only approve a closure that pays back within 3 years. You are on the Inverto team and the steering committee is next week. Your job is to tell the client whether to close a DC, and which one. You lead the case. Tell me how you want to approach it and what you need from me.","clarifying":[{"q":"What does the client sell and to whom?","a":"Bottled and canned drinks, delivered to supermarkets, convenience chains and restaurants across Peninsular Malaysia."},{"q":"Which DC does the client want to look at?","a":"Penang is the weakest on paper. It is the smallest and the oldest. But do not assume it is the right answer."},{"q":"What is the board's hurdle?","a":"A closure must pay back its one-off cost in 3 years or less."},{"q":"Is there spare space in the other DCs?","a":"Klang Valley can take extra volume if it adds racking and some lease space. Johor is nearly full. (Give if asked.)"},{"q":"What do we lose if deliveries get slower?","a":"Some Penang customers may leave. Contribution is MYR 50 per pallet, after handling and delivery. (Give if asked.)"},{"q":"How much of transport cost is fuel?","a":"About 40% on long routes. Diesel prices are volatile. (Give if asked.)"}],"structure":{"notes":"A good candidate sets up the economics first: fixed, handling and transport cost per DC, then what moves where. Then service and capacity. Then risks. They also say what data they need.","branches":[{"name":"Cost today","points":["Fixed cost per DC (lease, staff, equipment)","Handling cost per pallet","Outbound transport per pallet","Volume per DC"]},{"name":"Closure scenario","points":["Which DC closes, where volume goes","Extra transport cost for longer routes","Extra fixed cost at the receiving DC","One-off closure cost and payback vs hurdle"]},{"name":"Service and customers","points":["Delivery lead time","Customers at risk of leaving","Peak season capacity"]},{"name":"Risk","points":["Fuel price","Single-DC dependency (flood, strike)","Execution during transition"]}]},"stages":[{"id":"s1","title":"Set the approach","timer":"structure","minutes":5,"question":"How would you decide whether to close a DC, and which one? Walk me through your approach and say what data you would ask for first.","notes":"Candidate-led. Do not hand over any data until they ask. Listen for: cost per DC split fixed and variable, volume movement, one-off cost, hurdle, service impact. If they jump to Penang, ask why. If they ask for data, give Exhibit 1 in the next stage. If they do not ask for one-off cost and capacity, push once.","exhibits":[],"hints":["Think about what changes if a DC closes: which costs go away and which costs appear elsewhere.","What would you compare the result against?"],"solution":"I would compare the network today with the network after a closure.\nStep 1: cost per DC today. Fixed cost, handling per pallet, outbound transport per pallet, and volume.\nStep 2: the closure scenario. Which volume moves, to which DC, at what handling and transport cost, and what extra fixed cost the receiving DC needs.\nStep 3: annual saving = fixed cost saved + handling saved - extra transport - extra fixed cost.\nStep 4: payback = one-off closure cost / annual saving. Compare with the 3-year hurdle.\nStep 5: what would change the answer: fuel, service loss, capacity.\nSo the first data I need is cost and volume by DC, the closure scenario inputs, and the one-off cost."},{"id":"s2","title":"Closure economics","timer":"math","minutes":12,"question":"Here is the data. Take the Penang closure case and tell me the annual saving and the payback. You decide how to structure the calculation.","notes":"Hand over Exhibit 1 and Exhibit 2 together. Let the candidate decide the steps. Steer only if they apply the new transport rate to all volume, or forget the extra fixed cost at Klang Valley. Check that they state units (MYR m per year). Expected: saving MYR 2.18m, payback 2.75 years. Do not say it is a knife edge. Wait to see if they notice.","exhibits":["e1","e2"],"hints":["Only the Penang volume moves. Work out what it costs at Penang today and what it costs at Klang Valley.","Fixed cost saved is Penang fixed cost minus the extra fixed cost at Klang Valley."],"solution":"Penang volume = 60,000 pallets per year.\nFixed cost saved = 4.5 - 1.0 extra at Klang Valley = MYR 3.5m per year.\nHandling saved = 60,000 x (20 - 18) = MYR 0.12m per year.\nExtra transport = 60,000 x (62 - 38) = 60,000 x 24 = MYR 1.44m per year.\nAnnual saving = 3.5 + 0.12 - 1.44 = MYR 2.18m per year.\nCheck: Penang volume costs 7.98m today (4.5 + 1.2 + 2.28) and 5.8m at Klang Valley (1.0 + 1.08 + 3.72). 7.98 - 5.8 = 2.18.\nPayback = 6.0 / 2.18 = 2.75 years.\nSo it passes the 3-year hurdle, but only just. The saving is 6.4% of the MYR 34.32m network cost, and almost all of it comes from the fixed cost."},{"id":"s3","title":"Test the result","timer":"brainstorm","minutes":10,"question":"You have a payback of 2.75 years. What do you do next before you take it to the steering committee? Pick the next step yourself.","notes":"Candidate-led. The aim is that they see the knife edge. Good next steps: sensitivity on the transport rate, fuel, lost customers, Klang Valley extra fixed cost, one-off cost. If they ask, give: fuel is 40% of the MYR 62 rate; contribution MYR 50 per pallet; Klang Valley capacity is the open question. Ask for the break-even value if they only say 'sensitivity'. Expected: saving must stay at or above MYR 2.0m, headroom MYR 0.18m, break-even rate MYR 65 per pallet (+4.8%), fuel +12%, or 3,600 pallets lost (6% of Penang volume). Also accept: Klang Valley extra fixed cost above MYR 1.18m.","exhibits":[],"hints":["The hurdle is 3 years. What annual saving gives exactly 3 years?","How much room is there between your saving and that number?"],"solution":"Break-even annual saving = 6.0 / 3 = MYR 2.0m per year.\nHeadroom = 2.18 - 2.0 = MYR 0.18m per year.\nTransport rate: 0.18m / 60,000 pallets = MYR 3 per pallet. Break-even rate = 62 + 3 = MYR 65 per pallet, which is +4.8%.\nFuel: fuel is 40% of 62 = MYR 24.8 per pallet. A rise of 3 / 24.8 = 12% in fuel price takes the payback to 3.0 years.\nService loss: 0.18m / MYR 50 contribution = 3,600 pallets, which is 6% of Penang volume.\nKlang Valley extra fixed cost: break-even at MYR 1.18m, only MYR 0.18m above the estimate.\nSo this is a knife edge. A small move in diesel, a few lost customers or a higher racking bill flips the answer. I would not present 2.75 years as a clear pass."},{"id":"s4","title":"Recommendation","timer":"recommendation","minutes":5,"question":"The CFO walks in. What do you tell her?","notes":"Looking for: answer first, honest about the knife edge, break-even stated, conditions and next steps. Good extras: compare closing Johor, reduce risk by locking a transport contract, test with Penang customers, phase the closure.","exhibits":[],"hints":["Say the answer first, then say what has to be true.","Name one next step that reduces the biggest uncertainty."],"solution":"See the model recommendation."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Distribution centres today","chart":"table","columns":["DC","Volume (pallets/year)","Warehouse fixed cost (MYR m/year)","Handling cost (MYR/pallet)","Outbound transport (MYR/pallet)"],"rows":[["Klang Valley",120000,9.0,18,40],["Penang",60000,4.5,20,38],["Johor",80000,5.5,19,42]],"note":"Fixed cost covers lease, staff and equipment. Transport is the average cost to deliver one pallet to the customers each DC serves today."},{"id":"e2","title":"Exhibit 2: Penang closure scenario inputs","chart":"table","columns":["Item","Value","Unit"],"rows":[["Penang volume moves to Klang Valley",60000,"pallets/year"],["Extra fixed cost at Klang Valley (racking, lease)",1.0,"MYR m/year"],["Handling cost at Klang Valley",18,"MYR/pallet"],["Transport, Klang Valley to Penang customers",62,"MYR/pallet"],["One-off closure cost (lease exit, severance, move)",6.0,"MYR m"],["Board payback hurdle",3,"years"]],"note":"Johor volume and cost do not change in this scenario."}],"recommendation":"My answer is that Penang can be closed, but only as a conditional yes. The closure saves about MYR 2.18m a year, 6.4% of network cost. The one-off cost is MYR 6.0m, so payback is 2.75 years against a 3-year hurdle. That is a knife edge. The saving can only fall by MYR 0.18m before we fail. That happens if the Klang Valley to Penang rate goes from MYR 62 to MYR 65 per pallet, if diesel rises about 12%, or if we lose 3,600 pallets, 6% of Penang volume. I recommend we go ahead only if the client locks the long-haul transport rate with a fixed-price or fuel-indexed contract, and checks with its top Penang customers that service will hold. Next steps: confirm the Klang Valley capacity cost, get firm transport quotes, and compare with a Johor closure so the board sees the alternative.","good":["Builds the calculation as fixed saved + handling saved - extra transport - extra fixed cost, with units.","Computes annual saving MYR 2.18m and payback 2.75 years.","Compares payback with the 3-year hurdle and mentions service and capacity risk."],"great":["Spots the knife edge unprompted and names the break-even: MYR 65 per pallet, fuel +12%, or 6% of Penang volume.","Proposes a mitigation that removes the biggest uncertainty, such as a fixed transport contract.","Suggests testing other closure options (Johor) and phasing, and says discounting would worsen a 2.75-year payback."],"mistakes":["Applying the MYR 62 rate to all network volume, not just the Penang volume.","Forgetting the extra fixed cost at Klang Valley.","Saying 'it passes, so close it' without noting the margin is MYR 0.18m.","Mixing MYR m and MYR per pallet without converting.","Asking for no data and giving a view based only on size of the DC."]},{"id":"chip-supply-disruption","title":"Sao Mai Electronics: the sensor fire","client":"Sao Mai Electronics JSC, a contract assembler of consumer and industrial electronics near Hanoi","country":"Vietnam","type":"supply chain","difficulty":"Intermediate","format":"Interviewer-led","minutes":30,"summary":"Fire stops the only sensor supplier for 8 weeks. Which products do we protect, and what do we buy to limit lost margin?","prompt":"Our client is Sao Mai Electronics, an electronics assembler near Hanoi. It builds three product lines that all use one sensor chip. A single supplier makes that chip. Yesterday a fire damaged the supplier's plant. The supplier says it cannot ship for about eight weeks. The COO has called an emergency meeting in two hours. He wants to know how bad it is, what we can do now, and what we should change so this does not happen again. You are the Inverto person on the call.","clarifying":[{"q":"Is the supplier sure about eight weeks?","a":"They say eight weeks. Plan on eight. Treat any extension as a risk, not the base case."},{"q":"Can the sensors be shared across product lines?","a":"Yes. It is the same part. Stock sits in one warehouse and can be moved between lines."},{"q":"Do we have contract penalties if we miss delivery?","a":"Some, but ignore them for the first calculation. Mention them as a risk."},{"q":"What does a sensor normally cost?","a":"USD 5 per sensor. Annual use is 9,000 a week for 50 weeks. Give this if asked, it is also in the stage 4 question."},{"q":"Is there a second supplier?","a":"There is one we know and have not qualified. It needs four weeks to qualify. Details in the options table."}],"structure":{"notes":"Three time horizons: immediate (hours to days), short term (the eight weeks), structural (so it does not repeat). Strong answers start with facts: stock, usage, margin per line.","branches":[{"name":"Immediate (first days)","points":["Confirm stock on hand and in transit","Get the supplier's real recovery date","Freeze orders, tell customers early","Set up a crisis team"]},{"name":"Short term (eight weeks)","points":["Weeks of cover by product line","Reallocate stock to highest-margin lines","Spot buy at a premium","Second supplier (qualification time)","Customer talks, delivery dates, penalties"]},{"name":"Structural","points":["Dual sourcing","Safety stock by criticality","Design for second-source parts","Supplier risk monitoring"]}]},"stages":[{"id":"s1","title":"Structure the response","timer":"structure","minutes":4,"question":"The call starts in two hours. How would you structure the response?","notes":"Listen for time horizons and a first fact step: how much stock, how fast it is used. Give clarifying answers as asked.","exhibits":[],"hints":["What do you need to know in the first hour?","What is the difference between now, the eight weeks, and after?"],"solution":"I would split it into three horizons.\nImmediate: confirm what stock we hold, what is in transit, and how firm the eight weeks are. Warn customers early.\nShort term, the eight weeks: work out how long stock lasts for each product line, then decide where each sensor creates the most margin. Then look at ways to get more sensors: spot buy, a second supplier, or both.\nStructural: a second source and safety stock, sized to what the disruption costs us.\nI would start with stock and margin by line."},{"id":"s2","title":"How bad is it?","timer":"math","minutes":7,"question":"Here is stock and usage by product line. Calculate the weeks of cover for each line and the margin at risk per week. If we do nothing, with each line running only on its own stock, how much margin do we lose over eight weeks? Then, if we move stock to where it earns most, how much do we lose?","notes":"Margin per sensor = margin per unit / sensors per unit. Controllers use 2 sensors per unit, so USD 60 margin is USD 30 per sensor. Ranking by margin per unit would put controllers first, which is wrong. Order by margin per sensor: car modules 35, controllers 30, cameras 20. Total stock 28,000.","exhibits":["e1"],"hints":["Weeks of cover = stock / sensors needed per week.","Which line earns the most per sensor, not per unit?"],"solution":"Step 1. Sensors needed per week = units per week x sensors per unit.\nCameras: 4,000 x 1 = 4,000. Controllers: 1,500 x 2 = 3,000. Car modules: 2,000 x 1 = 2,000. Total = 9,000 per week.\nStep 2. Weeks of cover = stock / need per week.\nCameras: 12,000 / 4,000 = 3.0 weeks. Controllers: 12,000 / 3,000 = 4.0 weeks. Car modules: 4,000 / 2,000 = 2.0 weeks. Total stock 28,000 / 9,000 = 3.1 weeks.\nStep 3. Margin at risk per week = units x margin per unit.\nCameras: 4,000 x 20 = USD 80,000. Controllers: 1,500 x 60 = USD 90,000. Car modules: 2,000 x 35 = USD 70,000. Total = USD 240,000 per week, USD 1.92m over eight weeks.\nStep 4. Do nothing, each line on its own stock. Weeks without sensors = 8 - cover.\nCameras: 5 weeks x 80,000 = USD 400,000. Controllers: 4 x 90,000 = USD 360,000. Car modules: 6 x 70,000 = USD 420,000.\nLost margin = USD 1.18m.\nStep 5. Margin per sensor = margin per unit / sensors per unit.\nCar modules: 35. Controllers: 60 / 2 = 30. Cameras: 20.\nGive stock to the highest first. Car modules need 2,000 x 8 = 16,000 sensors. That protects 16,000 x 35 = USD 560,000. Controllers get the remaining 12,000. That protects 12,000 x 30 = USD 360,000. Cameras get none.\nProtected = USD 920,000. Lost = 1,920,000 - 920,000 = USD 1.0m.\nSo-what: just moving stock to the right lines saves USD 180,000, from 1.18m to 1.0m, at no cost. But USD 1.0m is still lost. We need more sensors."},{"id":"s3","title":"Options to get more sensors","timer":"exhibit","minutes":11,"question":"Here are the two ways to get sensors. Which should we use, and for which lines? What is the lowest lost margin we can reach, and is any of the choices close?","notes":"Air from the second supplier: 3,000 a week for weeks 5 to 8 = 12,000 sensors, premium USD 6, so cost USD 72,000. Each sensor goes to controllers (margin 30 per sensor), so protects 360,000. Net 288,000. After stock and air, car modules and controllers are fully covered (40,000 needed = 28,000 + 12,000). Remaining line: cameras. Spot buy: 2,000 a week for 8 weeks = 16,000 sensors, premium USD 20, equal to the camera margin per sensor (USD 20). The net gain is exactly zero. This is the knife edge. Say so. Decision rests on non-margin factors: customer penalties and relationship, cash (USD 320,000 extra), and the risk that second-supplier qualification slips. Break-even spot premium is USD 20: below that, buy; above, do not. Also timing check: stock covers weeks 1 to 4 for car modules and controllers; air starts in week 5.","exhibits":["e2"],"hints":["Add the second supplier's sensors to stock, then allocate again by margin per sensor.","Compare the spot premium with the margin per sensor of the line that would use it."],"solution":"Step 1. Second supplier by air. Weeks 5 to 8 is four weeks. 4 x 3,000 = 12,000 sensors. Premium 12,000 x USD 6 = USD 72,000.\nStep 2. Allocate. Stock 28,000 + air 12,000 = 40,000 sensors. Car modules and controllers need 16,000 + 24,000 = 40,000. So both are fully covered for eight weeks.\nThe 12,000 air sensors protect controllers: 12,000 x 30 = USD 360,000. Net of the premium: 360,000 - 72,000 = USD 288,000.\nLost margin = 1,000,000 - 360,000 + 72,000 = USD 712,000.\nThat is the cameras: 4,000 x 20 x 8 weeks = USD 640,000, plus the premium USD 72,000.\nStep 3. Spot buy. Up to 2,000 a week x 8 weeks = 16,000 sensors. Premium USD 20 per sensor, so USD 320,000.\nOnly the cameras could use them. Margin per camera sensor is USD 20. Margin recovered = 16,000 x 20 = USD 320,000.\nNet = 320,000 - 320,000 = 0. Lost margin stays at USD 712,000.\nThis is a knife edge. At a premium of USD 20 the spot buy neither gains nor loses margin. Below USD 20 it pays. Above, it loses.\nStep 4. Decide. I would use the second supplier and reallocate. For the spot buy, margin is neutral, so it comes down to other things: the camera customers, possible penalties, and USD 320,000 more cash out. I would buy only a part, as insurance in case the second supplier is late.\nSo-what: the lowest lost margin is USD 712,000, down from 1.18m."},{"id":"s4","title":"Recommendation and structural fix","timer":"recommendation","minutes":8,"question":"Give the COO your recommendation for the eight weeks. Then propose a structural fix and estimate its yearly cost. Assume: sensor price USD 5, use 9,000 a week for 50 weeks, a second supplier would take 30% of volume at 8% higher price, safety stock of four weeks of use, and 15% yearly cost of holding stock.","notes":"Check the candidate gives the answer first, names the USD 712,000 residual, and states the knife edge on spot buy. Structural cost: second source premium = 450,000 x 30% x USD 5 x 8% = USD 54,000. Safety stock = 9,000 x 4 = 36,000 sensors x USD 5 = USD 180,000, holding cost 15% = USD 27,000. Total about USD 81,000 a year. Compare with USD 712,000 for one event: the fix pays if such an event happens more often than about once in nine years. Ask for other exposure: single-source parts elsewhere.","exhibits":[],"hints":["What does the second source cost per year?","How do you compare a yearly cost with a one-off loss?"],"solution":"Short term: reallocate stock to car modules and controllers, qualify the second supplier now and fly in 3,000 a week from week 5, and accept that cameras stop. Lost margin about USD 712,000. The spot buy is margin-neutral, so buy a part of it only as insurance.\nStructural, yearly cost.\nAnnual volume = 9,000 x 50 = 450,000 sensors, spend USD 2.25m.\nDual source: 450,000 x 30% x USD 5 x 8% = USD 54,000 a year.\nSafety stock: 9,000 x 4 weeks = 36,000 sensors x USD 5 = USD 180,000 of stock. Holding cost 15% = USD 27,000 a year.\nTotal = about USD 81,000 a year.\nCompare: one event like this costs USD 712,000 even with a good response. The fix costs 11% of that each year. It pays back if an event like this happens once in nine years or less."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Sensor stock and usage by product line","chart":"table","columns":["Product line","Sensors per unit","Output (units per week)","Sensor stock on hand (units)","Margin per unit (USD)"],"rows":[["Home cameras",1,4000,12000,20],["Industrial controllers",2,1500,12000,60],["Car modules",1,2000,4000,35]],"note":"Stock is in one warehouse and can be moved between lines. Outage: 8 weeks, no sensors from the current supplier. Lost margin = margin of units not built."},{"id":"e2","title":"Exhibit 2: Options for extra sensors","chart":"table","columns":["Option","Available (sensors per week)","From week","Price premium over normal USD 5 (USD per sensor)","Note"],"rows":[["Spot buy from brokers",2000,1,20,"Available all 8 weeks"],["Second supplier, air freight",3000,5,6,"Needs 4 weeks to qualify, then ships by air"]],"note":"Premium is the extra cost per sensor above the normal price of USD 5, including air freight where relevant. Weeks are numbered 1 to 8 from the fire."}],"recommendation":"My recommendation: protect car modules and controllers, accept that home cameras stop for eight weeks, and fix the single source after. Stock covers 3.1 weeks across all lines. Do nothing and we lose USD 1.18 million of margin. Moving the stock to the lines with the highest margin per sensor cuts that to USD 1.0 million. Qualifying the second supplier now and flying in 3,000 sensors a week from week 5 brings it down to USD 712,000, after paying USD 72,000 in premium. The spot buy is a knife edge. At USD 20 premium it recovers exactly what it costs, so it adds no margin. I would buy only a part as insurance, and decide on customer penalties and cash. For the long term, a second source at 30% of volume and four weeks of safety stock cost about USD 81,000 a year. One event like this costs USD 712,000. The risks are the second supplier missing its qualification date, and the outage running past eight weeks. Next steps: start qualification today, call the camera customers this week, and check which other parts are single-sourced.","good":["Splits the response into immediate, short term and structural","Computes weeks of cover and margin at risk by line with correct units","Ranks lines by margin per sensor, not per unit, and reallocates stock","Compares options by net margin, premium against margin earned"],"great":["Finds the knife edge: spot premium of USD 20 equals camera margin per sensor, and says so instead of picking a winner","Gives the break-even premium and says what else decides it (penalties, cash, qualification slip)","Prices the structural fix (about USD 81,000 a year) and compares it with the USD 712,000 event loss","Flags the risk that the outage runs past eight weeks and asks about other single-source parts"],"mistakes":["Ranking lines by margin per unit and favouring controllers over car modules","Forgetting that controllers use two sensors per unit","Buying all spot sensors without comparing the premium with the margin per sensor","Ignoring the four-week qualification time of the second supplier","Recommending dual source with no cost number"]},{"id":"coating-make-or-buy","title":"Coating: make or buy (Kinabalu Circuit Systems)","client":"Kinabalu Circuit Systems Sdn Bhd, a Malaysian electronics maker with an in-house PCB conformal coating line.","country":"Malaysia","type":"operations","difficulty":"Advanced","format":"Candidate-led","minutes":45,"summary":"Should the maker outsource conformal coating at a quoted price per unit, or keep it in-house?","prompt":"Kinabalu Circuit Systems makes industrial control boards in Malaysia. It coats about 1.2 million boards a year with a protective layer, called conformal coating, on its own line. A coating specialist has quoted MYR 4.20 per board. The operations director shows you a sheet: in-house variable cost is MYR 3.00 per board, so buying is 40% more expensive and she wants to stop the talks. The CPO is not sure. You are on the Inverto team and the CPO meets you tomorrow. You lead the case. Tell me how you want to approach it.","clarifying":[{"q":"What is the contract length and volume?","a":"Three years, 1.2 million boards per year. The supplier is in Penang, 40 km away."},{"q":"Does the quote include transport?","a":"No. It is ex-works. Round-trip logistics costs MYR 0.20 per board. (Give if asked.)"},{"q":"Is there a fixed cost behind the in-house line?","a":"Yes. Show Exhibit 2 only if the candidate asks for fixed cost or overhead."},{"q":"What is the supplier's quality record?","a":"First-pass yield is 98% at the supplier, 99% in-house. A failed board costs about MYR 40 to rework or scrap. (Give if asked.)"},{"q":"Is the coating process proprietary?","a":"The coating spec is standard. But the supplier sees the board designs of two key customers. (Give if asked.)"}],"structure":{"notes":"A good candidate frames make-or-buy as strategic fit, economics, capability and risk, then says that economics must use relevant cost, not the sheet shown. They ask for fixed cost and avoidability.","branches":[{"name":"Strategic fit","points":["Is coating core to the product","Customer or IP sensitivity","Flexibility and volume swings"]},{"name":"Economics","points":["Variable cost vs quote plus logistics","Fixed cost: which part goes away","Break-even avoidable share"]},{"name":"Capability","points":["Supplier process and certification","Capacity at peak","Yield and rework"]},{"name":"Risk","points":["Single supplier dependence","IP and data","Lead time and inventory","Exit cost if we want to come back"]}]},"stages":[{"id":"s1","title":"Set the approach","timer":"structure","minutes":5,"question":"Tell me how you would decide between making and buying the coating. What do you want to know first?","notes":"Candidate-led. Do not give data until asked. Listen for: relevant cost (avoidable cost), not full cost; what the sheet leaves out; strategic and risk factors. If they ask for fixed cost, give Exhibit 2 in s3. If not asked by the end of s2, say: 'What does the sheet not show?'","exhibits":[],"hints":["The sheet shows only part of the cost of making. Which part is missing?","What would actually stop if we outsourced?"],"solution":"I would split it into four: strategic fit, economics, capability and risk.\nFor economics, the key is relevant cost: the cost that changes if we decide to buy. Not the cost on a sheet.\nSo I need: variable cost per board, fixed cost behind the line and which part is avoidable, the quote and what it excludes such as logistics, and volume.\nThen I compare cost that goes away if we buy with the price we pay.\nI would also check yield, capacity, IP and how hard it is to come back if the supplier fails."},{"id":"s2","title":"Management's comparison","timer":"exhibit","minutes":7,"question":"Here is the cost sheet management used. Is their conclusion right? Choose what you want to check or ask next.","notes":"Hand over Exhibit 1. Candidate-led. Good moves: ask whether the quote includes logistics (add MYR 0.20 per board: buy = 4.40), ask for fixed cost, ask what is avoidable. If they just agree with management, push: 'What costs are not on the sheet?' Do not give Exhibit 2 until they ask. Quote vs variable is 40% higher only if logistics are ignored; with logistics it is 47% higher.","exhibits":["e1"],"hints":["Compare like with like: is the quote delivered?","What costs would still exist if we stopped coating tomorrow?"],"solution":"Management compares MYR 3.00 variable cost with MYR 4.20. That is +40%.\nBut the quote is ex-works. Add MYR 0.20 logistics: buying costs MYR 4.40 per board, which is +47% on variable cost.\nThat is still only part of the picture. The in-house line also has fixed cost, and some of it would go away if we stopped.\nSo the sheet is not wrong, it is incomplete. I need the fixed cost and what is avoidable."},{"id":"s3","title":"Relevant cost","timer":"math","minutes":11,"question":"Here is the fixed cost of the line. Work out the right comparison. Decide how you want to do it.","notes":"Hand over Exhibit 2 only now (if asked or after s2). Candidate-led. Expected: full cost per board 5.00 (3.00 + 2.00) looks worse than buying at 4.40: a trap. Avoidable fixed cost = supervisor 0.60 + maintenance 0.24 = MYR 0.84m (MYR 0.70 per board). Relevant make cost = 3.00 + 0.70 = 3.70 vs 4.40 buy. Make is cheaper by MYR 0.84m a year. Depreciation, space and QA allocation stay either way.","exhibits":["e2"],"hints":["Look at the last column: which items stop if we outsource?","Add the avoidable fixed cost per board to the variable cost."],"solution":"Fixed cost is MYR 2.4m a year, or MYR 2.00 per board (1.2m boards).\nFull cost view: 3.00 + 2.00 = MYR 5.00 per board. Buying at 4.40 looks MYR 0.60 cheaper. That is wrong, because most of the fixed cost stays.\nAvoidable fixed cost = supervisor and engineer 0.60 + maintenance contract 0.24 = MYR 0.84m a year = MYR 0.70 per board.\nUnavoidable = depreciation 0.84 + space 0.48 + QA allocation 0.24 = MYR 1.56m. It stays if we buy.\nRelevant cost to make = 3.00 + 0.70 = MYR 3.70 per board, or MYR 4.44m a year.\nCost to buy = 4.40 x 1.2m = MYR 5.28m a year.\nMaking is cheaper by MYR 0.70 per board, or MYR 0.84m a year.\nSo management is right in the end, but for the wrong reason."},{"id":"s4","title":"Break-even and risk","timer":"brainstorm","minutes":11,"question":"What would have to be true for buying to win? And what else would you check before you advise the CPO? Choose your order.","notes":"Candidate-led. Break-even: avoidable fixed must reach (4.40 - 3.00) x 1.2m = MYR 1.68m, which is 70% of the MYR 2.4m fixed pool vs 35% today. Needs an extra MYR 0.84m, e.g. selling the line, re-letting the space, redeploying QA. Risks to cover: quality (give 98% vs 99% yield, MYR 40 per failure: 12,000 boards x 40 = MYR 0.48m a year against buying), IP (supplier sees two customer designs), capacity/peak, dependence, logistics lead time and inventory, exit cost. Opportunity: freed space and engineers.","exhibits":[],"hints":["Find the avoidable fixed cost at which both options cost the same.","Think of quality, IP and capacity. Which can be put in euros or ringgit?"],"solution":"Break-even: buy cost = variable cost + avoidable fixed cost.\nAvoidable fixed cost needed = (4.40 - 3.00) x 1.2m = 1.40 x 1.2m = MYR 1.68m a year.\nThat is 1.68 / 2.40 = 70% of fixed cost. Today only 0.84 / 2.40 = 35% is avoidable.\nWe would need another MYR 0.84m to go away, for example by selling the line and re-letting the space.\nQuality: 1 point lower yield = 12,000 boards x MYR 40 = MYR 0.48m a year. This adds to the make case: advantage MYR 0.84m + 0.48m = MYR 1.32m.\nOther risks: IP, because the supplier sees two customers' designs; capacity at peak; single supplier; logistics lead time that adds stock; exit cost if we want to come back.\nSo cost does not support buying, and risk adds to it."},{"id":"s5","title":"Recommendation","timer":"recommendation","minutes":6,"question":"The CPO is waiting. What is your recommendation?","notes":"Looking for: answer first (keep in-house for now), the relevant cost numbers, the break-even and a condition that would change it. Good extras: use the quote as a benchmark to negotiate internal cost down, keep the supplier as a qualified backup for peaks, test sale of the line and re-use of space.","exhibits":[],"hints":["Say what you recommend, then the numbers, then what would change your mind."],"solution":"See the model recommendation."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Management cost sheet and supplier quote","chart":"table","columns":["Item","MYR per board"],"rows":[["In-house material",1.4],["In-house labour",1.1],["In-house energy and consumables",0.5],["In-house variable cost",3.0],["Supplier quote",4.2]],"note":"Annual volume 1.2 million boards. The quote is ex-works from the supplier's plant in Penang."},{"id":"e2","title":"Exhibit 2: Fixed cost of the coating line","chart":"table","columns":["Fixed cost item","MYR m/year","MYR per board","If coating stops in-house"],"rows":[["Line depreciation",0.84,0.7,"Charge stays. The machine has no other use"],["Line supervisor and process engineer",0.6,0.5,"Roles end"],["Maintenance contract",0.24,0.2,"Contract can be cancelled"],["Factory space allocation",0.48,0.4,"Space stays, no other tenant planned"],["Shared QA lab and admin allocation",0.24,0.2,"Cost stays"],["Total",2.4,2.0,""]],"note":"MYR per board is based on 1.2 million boards a year."}],"recommendation":"My answer is to keep coating in-house for now. Management looks right, but for the wrong reason. The sheet compares variable cost to the quote. The quote needs MYR 0.20 for logistics, so buying costs MYR 4.40. In-house, only MYR 0.84m of the MYR 2.4m fixed cost goes away if we stop, which is MYR 0.70 per board. So the relevant cost of making is MYR 3.70 against MYR 4.40 to buy. That is MYR 0.84m a year in favour of making, and about MYR 1.3m once we count the lower supplier yield. The full cost view of MYR 5.00 per board would wrongly say buy. Buying wins only if 70% of the fixed cost is avoidable, against 35% today. That could happen if the client can sell the line and use the space. Risks of buying are IP on two customers' designs and a single supplier. Next steps: test whether the space and equipment have an alternative use, use the quote to push for in-house savings, and keep the supplier qualified as a backup for peaks.","good":["Notes the quote excludes logistics and compares at MYR 4.40.","Asks for fixed cost and separates avoidable from unavoidable.","Computes relevant make cost MYR 3.70 vs 4.40 buy.","Covers quality, IP and capacity risk."],"great":["Names the break-even avoidable share (70% vs 35% today) and what could close the gap.","Avoids the full cost trap (MYR 5.00 per board) and explains why.","Puts quality in money: 1 point of yield = MYR 0.48m a year.","Proposes a split: in-house with a qualified backup supplier, and use the quote as a benchmark."],"mistakes":["Using full cost (MYR 5.00) and recommending to buy.","Treating all fixed cost as avoidable, or all as sunk.","Forgetting logistics on the quote.","Staying at management's sheet and not asking for fixed cost.","Ignoring IP and dependence because the cost case already looks clear."]},{"id":"coffee-chain-profit","title":"Profit falls as sales grow (Saigon Bean House)","client":"Saigon Bean House JSC, a Vietnamese chain of coffee shops with about 120 stores.","country":"Vietnam","type":"general","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"Why did profit fall 22% while revenue grew 10%, and what should the chain do?","prompt":"Saigon Bean House is a Vietnamese coffee chain with around 120 stores. Last year revenue grew 10%, but operating profit fell by more than a fifth. The CEO does not understand why. She asked Inverto to find the cause and propose a plan. The CPO is also in the meeting tomorrow. We will go step by step. To start, how would you structure the problem?","clarifying":[{"q":"Did the number of stores change?","a":"No. The same stores in both years. Growth came from more cups per store."},{"q":"What happened to price and product mix?","a":"Average price per cup was flat at VND 20,000. Mix was stable. Cups sold went from 40 million to 44 million. (Give if asked.)"},{"q":"What is in cost of sales?","a":"Coffee beans, milk, cups and packaging, and barista labour. Rent, HQ and marketing, and other store costs are separate."},{"q":"How are beans and milk bought?","a":"Beans are imported and priced in USD per kg by one supplier. The contract has no index clause and no price cap. Milk comes from one local dairy on a price list. (Give if asked.)"},{"q":"Is there anything unusual in the year, such as one-offs?","a":"No one-offs in either year."}],"structure":{"notes":"A good candidate starts from profit = revenue - cost, splits revenue into volume x price x mix and cost by line, and says which line they want to see first. They also ask what is within the client's control.","branches":[{"name":"Revenue","points":["Volume (cups, stores, traffic)","Price per cup","Product mix"]},{"name":"Cost","points":["Cost of sales: beans, milk, cups, labour","Rent and utilities","HQ and marketing","Other store costs"]},{"name":"External factors","points":["Commodity prices","FX (VND vs USD)","Wage inflation"]},{"name":"Levers","points":["Price and mix","Recipe and spec","Procurement: tender, contract terms, hedging"]}]},"stages":[{"id":"s1","title":"Structure","timer":"structure","minutes":5,"question":"How would you structure the analysis to find out why profit fell although revenue grew?","notes":"Look for profit = revenue - cost with volume, price, mix and cost by line. If they ask for data, say you will show the P&L next. Do not give numbers yet.","exhibits":[],"hints":["Start from the profit formula.","Which side first: revenue or cost?"],"solution":"Profit = revenue - cost.\nRevenue = cups x price per cup, adjusted for mix.\nCost = cost of sales (beans, milk, cups, labour) + rent + HQ and marketing + other store costs.\nI would first look at the P&L for two years to see which line grew faster than revenue.\nThen I would break that line down into price and quantity, and into what the client controls and what it does not."},{"id":"s2","title":"Where did margin go","timer":"exhibit","minutes":8,"question":"Here is the P&L for two years. What is going on? Quantify it in margin points.","notes":"Hand over Exhibit 1. Expected: revenue +10%, profit 112 to 86.8 (-22.5%), margin 14.0% to 9.9% (-4.1 points). Cost of sales rose from 40.0% to 46.5% of revenue (+6.5 points). Other lines gained 2.4 points from scale. Bonus: price flat and volume +10%, so the whole issue is cost per cup.","exhibits":["e1"],"hints":["Compute each cost line as a % of revenue for both years.","Which line moved most, in points?"],"solution":"Revenue: 800 to 880 = +10%.\nOperating profit: 112 to 86.8 = -25.2, or -22.5%.\nMargin: 112 / 800 = 14.0%. 86.8 / 880 = 9.9%. Change = -4.1 points.\nCost of sales: 320 / 800 = 40.0%. 409.2 / 880 = 46.5%. Change = +6.5 points.\nRent: 20.0% to 19.1% (-0.9 points). HQ and marketing: 15.0% to 14.1% (-0.9). Other store costs: 11.0% to 10.5% (-0.5).\nSo fixed-type costs gained 2.4 points from scale. Cost of sales lost 6.5 points. Net = -4.1 points.\nPrice was flat, so the cause is cost of sales per cup, not demand."},{"id":"s3","title":"Cost per cup","timer":"exhibit","minutes":9,"question":"Exhibit 2 shows the cost of one cup. Which component drives the increase, and how much profit did it cost last year?","notes":"Hand over Exhibit 2. Expected: cost per cup 8,000 to 9,300 (+1,300, +16.3%). Beans +720 (55% of the rise, +30%), milk +400 (31%, +20%), cup +60, labour +120. Beans and milk are 86% of the rise. Profit effect: 44m cups x 1,300 = VND 57.2bn. Good candidates link this to the profit change: without it, profit would have been 144bn.","exhibits":["e2"],"hints":["Compute the change and the percentage for each component.","Multiply the change per cup by the cups sold in year 2."],"solution":"Cost per cup: 8,000 to 9,300 = +1,300 VND, or +16.3%.\nBeans: +720 (+30%). That is 720 / 1,300 = 55% of the rise.\nMilk: +400 (+20%). That is 31% of the rise.\nCups and packaging: +60 (+5%). Labour: +120 (+5%).\nBeans and milk together = 1,120 / 1,300 = 86% of the rise.\nProfit effect = 44 million cups x 1,300 = VND 57.2bn.\nThat is more than twice the VND 25.2bn fall in profit. Volume growth added VND 48bn of margin and fixed costs grew VND 16bn. Bridge: 112 + 48 - 16 - 57.2 = VND 86.8bn.\nSo input prices for beans and milk are the root cause."},{"id":"s4","title":"Beans: price or FX","timer":"math","minutes":8,"question":"Beans are imported and priced in USD. Exhibit 3 has the inputs. Split the VND 720 increase per cup into the part from the USD price and the part from the exchange rate. Tell me your method.","notes":"Hand over Exhibit 3. The method must add up exactly. Standard: price effect at old FX, then FX effect at the new price. Price effect = (6 - 5) x 24,000 x 0.02 = 480. FX effect = 6 x (26,000 - 24,000) x 0.02 = 240. Total 720. If the candidate uses price at new FX (6-5)x26,000x0.02 = 520 and FX at old price 5 x 2,000 x 0.02 = 200, also 720: accept it if they state the method. The mistake is mixing methods and leaving a cross term.","exhibits":["e3"],"hints":["Bean cost per cup = USD per kg x VND per USD x kg per cup.","Change one input at a time, and keep the order consistent."],"solution":"Bean cost per cup = USD price x FX x 0.02 kg.\nYear 1: 5.00 x 24,000 x 0.02 = VND 2,400. Year 2: 6.00 x 26,000 x 0.02 = VND 3,120. Change = VND 720.\nMethod: first change the USD price at the old exchange rate, then change the exchange rate at the new price.\nPrice effect = (6.00 - 5.00) x 24,000 x 0.02 = VND 480.\nFX effect = 6.00 x (26,000 - 24,000) x 0.02 = VND 240.\nCheck: 480 + 240 = 720.\nSo two thirds is the USD price (+20%), one third is the weak dong (+8.3%).\nIn money: 480 x 44m cups = VND 21.1bn and 240 x 44m = VND 10.6bn a year.\nThe contract has no index clause or cap, so the chain carries both fully."},{"id":"s5","title":"Recommendation","timer":"recommendation","minutes":6,"question":"Give the CEO your recommendation. What should she do, in which order?","notes":"Looking for a mix: pricing, recipe and spec, procurement. Procurement: tender milk, index or hedge beans, renegotiate contract. Number: a VND 1,000 price rise (+5%) brings 44bn if volume holds, 77% of the VND 57.2bn cost hit. Good candidates mention elasticity and test in a few stores. Accept sensible numbers on other levers if stated as assumptions.","exhibits":[],"hints":["Think about price, product and purchasing.","Which lever is fastest and which needs more time?"],"solution":"See the model recommendation."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Profit and loss, last two years","chart":"table","columns":["Line","Year 1","Year 2"],"rows":[["Cups sold (million)",40,44],["Average price per cup (VND)",20000,20000],["Revenue (VND bn)",800,880],["Cost of sales (VND bn)",320,409.2],["Rent and utilities (VND bn)",160,168],["HQ and marketing (VND bn)",120,124],["Other store costs (VND bn)",88,92],["Operating profit (VND bn)",112,86.8]],"note":"Cost of sales includes beans, milk, cups and packaging, and barista labour."},{"id":"e2","title":"Exhibit 2: Cost of sales per cup","chart":"table","columns":["Component","Year 1 (VND/cup)","Year 2 (VND/cup)"],"rows":[["Coffee beans",2400,3120],["Milk",2000,2400],["Cups and packaging",1200,1260],["Barista labour",2400,2520],["Total",8000,9300]],"note":"Average over all drinks. Mix is stable between the two years."},{"id":"e3","title":"Exhibit 3: Coffee bean cost inputs","chart":"table","columns":["Input","Year 1","Year 2"],"rows":[["Bean price (USD/kg)",5.0,6.0],["Exchange rate (VND/USD)",24000,26000],["Beans used per cup (kg)",0.02,0.02]],"note":"Beans are bought in USD from one supplier. The contract has no index clause and no price cap."}],"recommendation":"My answer is that the profit drop is a cost problem, not a demand problem. Revenue grew 10% with flat prices, but cost of sales per cup rose 16%, from VND 8,000 to 9,300. That cost the chain VND 57 billion, more than the VND 25 billion fall in profit. Beans and milk are 86% of the rise. For beans, two thirds came from the USD price and one third from the weaker dong. I would act on three fronts. First, price: a VND 1,000 rise per cup, 5%, brings VND 44 billion if volume holds, so I would test it in a set of stores for elasticity, with smaller rises on core drinks. Second, recipe and spec: review bean blend and milk portion, and the cup size mix, without hurting taste. Third, procurement: tender the milk with at least two dairies, and renegotiate the bean contract with an index clause and a cap, and hedge part of the USD need. Risks are customer loss from price and supplier push-back. Next step: a two-week pilot on price and a milk tender.","good":["Structures profit as revenue - cost, and finds cost of sales as the driver in margin points (+6.5).","Computes cost per cup change and the 57.2bn effect.","Identifies beans and milk as 86% of the rise.","Gives a recommendation across price, spec and procurement."],"great":["Splits the bean increase into USD price (480) and FX (240) with a method that adds up exactly.","Links the bridge to profit: volume +48, fixed -16, cost per cup -57.2.","Points to the contract: no index clause, no cap, single supplier, and proposes index plus partial hedge.","Sizes the pricing lever (44bn, 77% of the hit) and names the elasticity risk."],"mistakes":["Blaming volume or price when price is flat and volume rose.","Splitting price and FX with two different bases so the parts do not add to 720.","Reporting cost of sales change in VND bn only, without margin points.","Recommending only a price rise.","Forgetting that labour and cups also rose, and ignoring the scale benefit on fixed costs."]}]}</script>
<script>
(() => {
"use strict";
const CASES = JSON.parse(document.getElementById("case-data").textContent).cases;
const CASE = Object.fromEntries(CASES.map(c => [c.id, c]));
