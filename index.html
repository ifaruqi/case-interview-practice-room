<style>
/* Layout: sticky top bar; one working column (max 920px); the interviewer view adds a sticky stage-and-timer strip. */
:root {
  --bg: #f4f7f6; --surface: #ffffff; --sunk: #eaf0ee; --ink: #15211f; --muted: #576865; --line: #d6e0dd;
  --accent: #0d6b62; --accent-ink: #ffffff; --accent-soft: #dcefeb;
  --warn: #9a5800; --warn-soft: #fbecd6; --bad: #b3261e; --good: #2e7d32;
  --s1: #0d6b62; --s2: #c07a12; --s3: #4b5fa8; --s4: #9a4f7b;
  --f-display: "Archivo", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1413; --surface: #151f1d; --sunk: #1b2725; --ink: #e3ebe9; --muted: #9caeaa; --line: #2b3836;
  --accent: #52c3b6; --accent-ink: #062320; --accent-soft: #163733;
  --warn: #e7a44c; --warn-soft: #3a2a12; --bad: #f08a80; --good: #81c784;
  --s1: #52c3b6; --s2: #e7a44c; --s3: #94a6ec; --s4: #d792bd; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #151f1d; --sunk: #1b2725; --ink: #e3ebe9; --muted: #9caeaa; --line: #2b3836;
  --accent: #52c3b6; --accent-ink: #062320; --accent-soft: #163733;
  --warn: #e7a44c; --warn-soft: #3a2a12; --bad: #f08a80; --good: #81c784;
  --s1: #52c3b6; --s2: #e7a44c; --s3: #94a6ec; --s4: #d792bd; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.label { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: 0.75rem; }
nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-weight: 600; }
nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; }
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 20px; }
.notice { border: 1px solid var(--line); background: var(--sunk); border-radius: var(--r); padding: 10px 14px; font-size: 0.9rem; }
.notice.warn { background: var(--warn-soft); border-color: transparent; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
select, input[type="text"], textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { min-height: 70px; resize: vertical; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.type { background: var(--accent-soft); color: var(--accent); }
.chip.live { background: var(--accent); color: var(--accent-ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.read-aloud { border-left: 3px solid var(--accent); padding-left: 14px; white-space: pre-line; font-size: 1.05rem; }
.pre { white-space: pre-line; }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "Show"; font-size: 0.8rem; color: var(--accent); }
details[open] > summary::after { content: "Hide"; }
details > .in { padding: 0 12px 12px; display: grid; gap: 8px; }
details.solution > summary { color: var(--warn); }
.qa { display: grid; gap: 8px; }
.qa div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.qa b { font-weight: 600; }
ul.tight { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

.strip { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 53px); z-index: 5; background: var(--bg); padding-block: 8px; display: grid; gap: 8px; }
.timer-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.clock { font-family: var(--f-mono); font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1; }
.clock.over { color: var(--warn); }
.stages { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.stage-pill { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 0.85rem; display: grid; gap: 0; cursor: pointer; text-align: left; }
.stage-pill .t { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.stage-pill[aria-current="step"] { border-color: var(--accent); background: var(--accent-soft); }
.stage-pill.done .t { color: var(--good); }

.stage { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stage.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.stage-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.notes { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; white-space: pre-line; }

.exhibit { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; background: var(--surface); min-width: 0; }
.exhibit.hiddenx { opacity: 0.75; border-style: dashed; }
.ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.8rem; }
th.n { font-family: var(--f-body); white-space: normal; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.85rem; white-space: nowrap; }
.chart { width: 100%; height: auto; max-width: 100%; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-body); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.score-grid { display: grid; gap: 12px; }
.score-row { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr); gap: 10px; align-items: start; }
.dots { display: flex; gap: 6px; }
.dots button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--f-mono); }
.dots button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gg { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.bigstat { font-family: var(--f-mono); font-size: 1.6rem; }
.statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; }
.bar-mini { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar-mini > span { display: block; height: 100%; background: var(--accent); }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.watch-q { font-size: 1.15rem; white-space: pre-line; }

@media (max-width: 560px) {
  h1 { font-size: 1.35rem; }
  .score-row { grid-template-columns: minmax(0, 1fr); }
  .clock { font-size: 1.4rem; }
  .strip { top: calc(env(safe-area-inset-top, 0px) + 92px); }
}
body.present .topbar { display: none; }
body.present main { font-size: 1.1rem; }
body.present .wrap { max-width: 1100px; }
.io { display: grid; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script type="application/json" id="case-data">{"cases":[{"id":"cooking-oil-market-sizing","title":"Dapur Nusa Group: cooking oil","client":"Dapur Nusa Group, an Indonesian restaurant chain with 400 outlets across Java, Sumatra and Sulawesi","country":"Indonesia","type":"procurement","difficulty":"Beginner","format":"Interviewer-led","minutes":30,"summary":"How much cooking oil do we and the market buy, and is a national tender with an index-linked price worth it?","prompt":"Our client is Dapur Nusa Group, an Indonesian restaurant chain with fried-food menus. Each outlet buys cooking oil from local distributors, outlet by outlet. The new head of procurement asks three things. How much cooking oil do we buy, and how much does the whole market buy? Do we have any buying power? And is it worth running one national tender, with a price linked to a palm oil index? You meet her tomorrow. Let us start with the sizing.","clarifying":[{"q":"What do you mean by the market?","a":"Commercial food service: restaurants, street stalls, hotels and caterers. Not households and not food factories."},{"q":"How many outlets does the client have, and how much oil does one use?","a":"400 outlets. About 25 litres a day each. Open 360 days a year. Give this if asked."},{"q":"How many food service outlets are there in Indonesia, and how much does the average one use?","a":"About 1.2 million outlets. Most are small. The average uses about 5 litres a day. Give this if asked."},{"q":"What price does the client pay today?","a":"About IDR 16,500 per litre on average over the last two years, delivered. Give this if asked."},{"q":"How big are the oil suppliers?","a":"A large refiner sells about 250 million litres a year to food service. Give this if asked."},{"q":"What does the index price include?","a":"A reference price for packed cooking oil in IDR per litre, built from the palm oil price plus a fixed refining and packing margin. The market treats it as a fair price. The client has no formula today."}],"structure":{"notes":"Top-down sizing with explicit assumptions: outlets times litres per day times days. Then compare the client to the market and to one supplier. Then check price against an index.","branches":[{"name":"Size the volume","points":["Client: outlets x litres per day x days","Market: food service outlets x average litres x days","State assumptions and sanity-check"]},{"name":"Buying power","points":["Client share of the market","Client share of one supplier's volume","Who else is buying, how concentrated are suppliers"]},{"name":"Price and contract","points":["Price paid vs an index","How price follows up and down moves","Tender design: index formula, regional lots, term","Risks: supply, service, small share"]}]},"stages":[{"id":"s1","title":"Approach to the sizing","timer":"structure","minutes":4,"question":"How would you estimate how much oil the client buys and how much the market buys? What would you ask for?","notes":"Looking for top-down: outlets x litres per day x days. Candidate should ask for the numbers, not guess. Give the numbers from the clarifying list when asked. Weaker candidates start from population. That works as a cross-check, but it includes households. Note that the market definition matters.","exhibits":[],"hints":["What does one outlet use in a day?","Which market do we mean, households too?"],"solution":"I would size it bottom-up from outlets.\nVolume = number of outlets x litres per outlet per day x days open.\nFor the client I need the number of outlets and the average use per outlet. For the market I need the number of food service outlets and the average use. I would define the market as food service only, not households.\nThen I would sanity-check the answer against population: a national total of cooking oil per person."},{"id":"s2","title":"Size the client and the market","timer":"math","minutes":8,"question":"Please calculate the client's annual volume and spend, the market's annual volume, and the client's share of the market and of one large refiner. What does this say about buying power?","notes":"Numbers: client 400 outlets x 25 L x 360 days. Market 1.2m outlets x 5 L x 360. Price IDR 16,500. Refiner volume 250m L. The client share is tiny: 0.17% of the market, 1.4% of one refiner. So volume leverage is low. The value is in the price mechanism, not in volume discounts. Check units: litres vs million litres, IDR vs IDR billion.","exhibits":[],"hints":["Volume = outlets x litres a day x 360.","Share = client volume / market volume."],"solution":"Step 1. Client volume = 400 outlets x 25 litres x 360 days = 3,600,000 litres a year, 3.6 million litres.\nStep 2. Client spend = 3.6 million litres x IDR 16,500 = IDR 59.4 billion a year.\nStep 3. Market volume = 1,200,000 outlets x 5 litres x 360 days = 2,160,000,000 litres, 2.16 billion litres.\nStep 4. Market spend = 2.16 billion litres x IDR 16,500 = IDR 35.6 trillion.\nStep 5. Client share of market = 3.6 million / 2,160 million = 0.17%.\nStep 6. Client share of one large refiner = 3.6 million / 250 million = 1.4%.\nCheck: the client outlet uses 25 litres, 5 times the average of 5 litres. That fits a fried-food chain.\nSo-what: we are small. 0.17% of the market and 1.4% of one refiner. We will not get a volume discount that moves the price. Our leverage is a single clear contract for 400 outlets, a steady order, and a clean price formula, not size."},{"id":"s3","title":"Price against the index","timer":"exhibit","minutes":10,"question":"Here is the price the client paid over eight quarters next to the index reference price. What do you see? Estimate how much the client overpaid over the eight quarters and what the current yearly run-rate is.","notes":"Pattern: when the index goes up, the price paid goes up by the same amount. When the index goes down, the price paid falls by only half. From Q4 the client pays above the reference. Quarterly volume is a quarter of the annual volume, 0.9 million litres. Gap in Q4 is IDR 500 per litre, then IDR 1,000 from Q5. Overpayment total IDR 4.05 billion, 3.4% of spend. Run-rate IDR 1,000 per litre x 3.6m = IDR 3.6 billion a year, 5.6% of price. Candidate should say it is an estimate: assumes the reference is a fair price and that it was equal to the price paid in Q1 to Q3.","exhibits":["e1"],"hints":["Look at what happens to the price paid in a quarter when the reference falls.","Overpayment per quarter = gap per litre x litres in the quarter."],"solution":"Step 1. Pattern. Reference up 1,000 in Q2, Q3, Q7, Q8: price paid also up 1,000 each time. Reference down 1,000 in Q4 and Q5: price paid down only 500 each time. Pass-through is 100% up and 50% down.\nStep 2. Gap = price paid - reference. Q1 to Q3: 0. Q4: 500. Q5 to Q8: 1,000 each.\nStep 3. Quarterly volume = 3.6 million / 4 = 0.9 million litres.\nStep 4. Overpayment per quarter = gap x 0.9 million litres.\nQ4: 500 x 0.9m = IDR 450 million. Q5 to Q8: 1,000 x 0.9m = IDR 900 million each, 3,600 million for four quarters.\nTotal = IDR 4.05 billion over eight quarters.\nStep 5. Share of spend. Eight-quarter spend = IDR 118.35 billion (average price 16,437 x 7.2m litres). 4.05 / 118.35 = 3.4%.\nStep 6. Run-rate. Gap now IDR 1,000 per litre x 3.6 million litres = IDR 3.6 billion a year. That is 5.6% of the current price of 18,000.\nSo-what: the loss is not from a high margin but from the way the price moves. The client pays full price on the way up and half on the way down, and the gap grows each cycle. This is an estimate. It assumes the reference is fair and that prices were aligned in Q1 to Q3."},{"id":"s4","title":"Recommendation","timer":"recommendation","minutes":8,"question":"The head of procurement asks: is a national tender with an index-linked price worth it? What do you recommend, and how would you design it?","notes":"Look for: clear yes, with numbers (IDR 3.6 billion a year at stake, small cost of a tender), and an understanding that the lever is the formula and not volume. Design: index formula, two-way, quarterly reset, regional lots, two suppliers, 12 to 24 month term, service levels. Risks: small share, suppliers may not bid, distribution to remote outlets, index choice. Ask for a realistic capture: 50% to 100% of the gap.","exhibits":[],"hints":["What is the yearly prize?","What makes the formula fair to both sides?"],"solution":"Yes, run the tender, because of the price formula and not because of volume.\nThe prize: IDR 1,000 per litre x 3.6 million litres = IDR 3.6 billion a year. If we capture half, IDR 1.8 billion.\nDesign: price = index reference + a delivery adder per region, which suppliers bid for. Reset every quarter. Two-way, so it follows the index up and down at 100%. Two suppliers in two regional lots. Term 12 to 24 months."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Price paid and index reference price, last 8 quarters","chart":"line","columns":["Quarter","Index reference price (IDR per litre)","Price paid by client (IDR per litre)"],"rows":[["Q1",15000,15000],["Q2",16000,16000],["Q3",17000,17000],["Q4",16000,16500],["Q5",15000,16000],["Q6",15000,16000],["Q7",16000,17000],["Q8",17000,18000]],"note":"Reference price = palm oil based index for packed cooking oil, including a fixed refining and packing margin. Client volume is even through the year: one quarter of the annual volume. Prices delivered, quarterly averages."}],"recommendation":"My answer is yes: run a national tender with an index-linked price. The client buys about 3.6 million litres a year, IDR 59 billion. That is only 0.17% of the market and 1.4% of a large refiner, so size gives us little power. The value is in the price mechanism. Over eight quarters the client paid IDR 4.05 billion above the index, 3.4% of spend. The pattern is clear: full pass-through when the index rises, half when it falls. The gap is now IDR 1,000 per litre, about IDR 3.6 billion a year. I would design a quarterly two-way formula: index reference plus a delivery adder per region, which suppliers bid on, in two regional lots with a 12 to 24 month term. Even if we capture only half, that is IDR 1.8 billion a year. The risks are that suppliers may not bid for a small buyer, and remote outlets cost more to serve. So I would test the adder with two or three refiners before the tender. Next steps: confirm the index, check outlet volumes by region, and draft the tender.","good":["Sizes top-down with outlets, litres per day and days, and states assumptions","Gets 3.6 million litres and IDR 59.4 billion for the client, 2.16 billion litres for the market","Spots that the price follows the index up fully but down only partly","Estimates overpayment of IDR 4.05 billion over eight quarters with gap times volume"],"great":["Says the client's share is small (0.17% of the market, 1.4% of a refiner) and that the lever is the formula, not volume","Gives both the eight-quarter total and the current yearly run-rate (IDR 3.6 billion)","Flags that the estimate assumes the index is fair and prices were aligned early","Designs a two-way formula with regional lots and tests supplier appetite for a small buyer"],"mistakes":["Starting from population and including households in the market","Slipping on units: litres vs million litres, IDR vs IDR billion","Claiming big buying power from the 400 outlets","Using annual volume against a single-quarter gap, which overstates the overpayment fourfold","Recommending an index price that only moves up, not down"]},{"id":"indirect-tail-spend","title":"Tail spend at a bank (Dalisay Pacific Bank)","client":"Dalisay Pacific Bank, a mid-sized Philippine bank with about 180 branches.","country":"Philippines","type":"procurement","difficulty":"Beginner","format":"Interviewer-led","minutes":30,"summary":"The bank buys from 1,200 suppliers. Where are the savings in indirect spend, and how much cash can better payment terms release?","prompt":"Dalisay Pacific Bank spends about PHP 2 billion a year on indirect goods and services: branch maintenance, IT services, security, printing, office supplies and consulting. It buys from about 1,200 suppliers. Staff often buy outside the approved contracts, and many small suppliers are paid within a week. The new CPO wants a plan. You are on the Inverto team and the CPO meeting is tomorrow. We will go step by step. First, how would you structure the levers for indirect spend?","clarifying":[{"q":"How much of the spend is bought outside approved contracts?","a":"About 20% of spend is maverick buying. (Give if asked.)"},{"q":"What does it cost to process one purchase order?","a":"About PHP 2,500 per PO, covering requisition, approval, PO, receipt and invoice matching."},{"q":"How many purchase orders per year?","a":"About 60,000."},{"q":"What is the bank's payment term policy?","a":"Pay at 45 days, unless a contract says otherwise. Many suppliers are paid earlier than that today."},{"q":"What is the bank's cost of funds?","a":"About 6% a year. (Give if asked.)"}],"structure":{"notes":"A good structure for indirect spend: demand, specification, supplier base, process (P2P) and commercial terms. Better answers add which levers are quick and which take longer.","branches":[{"name":"Demand","points":["Do we need it","Policy and approval limits","Bundling requests"]},{"name":"Specification","points":["Standard items and service levels","Fewer variants"]},{"name":"Suppliers","points":["Consolidate the tail","Competitive tenders","Preferred supplier lists"]},{"name":"Process and terms","points":["Catalogues and purchase cards","Fewer, larger POs","Payment terms at policy","Reduce maverick buying"]}]},"stages":[{"id":"s1","title":"Lever structure","timer":"structure","minutes":5,"question":"How would you structure the levers to reduce the cost of indirect spend?","notes":"Accept demand, specification, supplier consolidation, process, payment terms. Do not worry about the exact names. If they miss process or payment terms, ask 'what about how we buy and pay?'. Then move to Exhibit 1.","exhibits":[],"hints":["Ask whether we need the item, what exactly we buy, from whom, and how.","Do not forget cost beyond price."],"solution":"I would use five levers.\nDemand: do we need it, and can we reduce it with policy and approval limits.\nSpecification: standard items and service levels instead of many variants.\nSuppliers: fewer suppliers, tenders, preferred lists, with more volume per supplier.\nProcess: catalogues, purchase cards, fewer POs, less maverick buying.\nPayment terms: pay at the policy date, not earlier.\nThe first three reduce price. The last two reduce process cost and release cash."},{"id":"s2","title":"Define the tail and size process savings","timer":"exhibit","minutes":9,"question":"Exhibit 1 shows suppliers grouped by spend. How would you define the tail? Then: if the bank halves the number of tail POs, at PHP 2,500 per PO, what does it save?","notes":"Hand over Exhibit 1. Expected tail: the last 900 suppliers, 75% of suppliers, 5% of spend (PHP 100m), 50% of POs. Saving: 30,000 x 50% = 15,000 POs x 2,500 = PHP 37.5m. So-what: tail PO cost PHP 75m is 75% of tail spend; average tail PO is PHP 3,333, barely above the cost of processing it (PHP 2,500). Accept other tail definitions if reasoned (e.g. bottom 5% of spend).","exhibits":["e1"],"hints":["Look at where the spend share reaches 95%.","Use POs x cost per PO. Mind the unit: PHP, then PHP m."],"solution":"Spend is 60% in the top 25 suppliers and 85% in the top 100. 95% is reached at 300 suppliers.\nTail = the last 900 suppliers. They are 75% of suppliers but only 5% of spend, PHP 100m.\nThey raise 30,000 of 60,000 POs, which is 50%.\nTail PO cost = 30,000 x PHP 2,500 = PHP 75m. That is 75% of tail spend.\nAverage tail PO = PHP 100m / 30,000 = PHP 3,333. It costs PHP 2,500 to process.\nHalving tail POs = 15,000 x PHP 2,500 = PHP 37.5m a year.\nThis is pure process cost, no price negotiation needed. Tools: catalogues, purchase cards, monthly consolidated orders, and moving tail suppliers to a few preferred suppliers."},{"id":"s3","title":"Payment terms","timer":"math","minutes":8,"question":"Exhibit 2 shows payment terms by group. If the bank pays every group at its 45-day policy, how much cash does it release? What is the risk?","notes":"Hand over Exhibit 2. Expected: spend / 365 x extra days by group: 49.3 + 20.5 + 16.4 + 10.4 = PHP 96.7m (round). Weighted DPO moves from 27.35 to 45 days: 2,000 / 365 x 17.65 = 96.7. Risk: small suppliers lose cash; tail suppliers at 7 days may be micro firms; relationships; early-pay discounts. Cash is one-off. Interest saved at 6% = PHP 5.8m a year.","exhibits":["e2"],"hints":["Cash released = spend per day x extra days.","Do it per group, then check with the weighted average."],"solution":"Spend per day = 2,000 / 365 = PHP 5.48m.\nTop 25: 1,200 / 365 x 15 days = PHP 49.3m.\nNext 75: 500 / 365 x 15 days = PHP 20.5m.\nNext 200: 200 / 365 x 30 days = PHP 16.4m.\nTail 900: 100 / 365 x 38 days = PHP 10.4m.\nTotal = PHP 96.7m.\nCheck: weighted DPO today = 27.35 days. Gap to 45 = 17.65 days. 5.48 x 17.65 = PHP 96.7m.\nThis is a one-off cash release, not a yearly saving. At 6% cost of funds it is worth about PHP 5.8m a year.\nRisk: small suppliers with 7 or 15 days will push back or raise prices. The tail is only PHP 10m of the cash, so I would not fight over it. Most cash is in the top 25 and next 75."},{"id":"s4","title":"Recommendation","timer":"recommendation","minutes":5,"question":"Give the CPO your recommendation: what to do first and what takes longer.","notes":"Looking for: quick wins vs longer levers, numbers, risk. Quick wins: terms to policy for top suppliers (PHP 70m), purchase card or catalogue for tail, ban new tail suppliers without approval. Longer: tenders and specification, demand policy, maverick control. Do not accept PHP 96.7m as a yearly saving.","exhibits":[],"hints":["Split by speed: what can the bank do in 3 months, what in 12 months?","Keep one-off cash and yearly saving apart."],"solution":"See the model recommendation."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Suppliers by spend rank","chart":"table","columns":["Supplier group (by spend rank)","Suppliers","Share of spend (%)","Spend (PHP m/year)","Purchase orders (per year)"],"rows":[["Top 25",25,60,1200,6000],["Next 75",75,25,500,10000],["Next 200",200,10,200,14000],["Last 900",900,5,100,30000],["Total",1200,100,2000,60000]],"note":"Indirect spend only. Processing cost is PHP 2,500 per purchase order."},{"id":"e2","title":"Exhibit 2: Payment terms by supplier group","chart":"table","columns":["Supplier group (by spend rank)","Spend (PHP m/year)","Current terms (days)","Policy terms (days)"],"rows":[["Top 25",1200,30,45],["Next 75",500,30,45],["Next 200",200,15,45],["Last 900",100,7,45]],"note":"Terms are the average days from invoice to payment. Use 365 days a year."}],"recommendation":"My answer is to start with process and payment terms, because they are fast, and run price levers in parallel. The bank spends PHP 2 billion with 1,200 suppliers. The last 900 are 5% of spend but half of the POs. Processing those POs costs PHP 75 million, which is 75% of what the bank spends with them. Halving them saves PHP 37.5 million a year. Moving all groups to the 45-day policy releases PHP 96.7 million once, and is worth about PHP 6 million a year at 6% cost of funds. I would move the top 100 suppliers first, since they hold PHP 70 million of that cash. Risk is pushback from small suppliers, so I would leave the tail on shorter terms until they are on a card or catalogue. Longer levers: tenders and standard specs for the top categories, approval rules, and stopping maverick buying, which is 20% of spend. Next steps: confirm the PO cost, list tail suppliers by category, and agree the policy with finance.","good":["Gives a clear lever structure: demand, specification, suppliers, process, terms.","Defines the tail with numbers: 900 suppliers, 5% of spend, 50% of POs.","Computes PHP 37.5m from POs x cost per PO.","Computes cash release per group: PHP 96.7m."],"great":["Compares tail PO cost (PHP 75m) with tail spend (PHP 100m) and the average PO value.","Says that cash release is one-off and converts it to about PHP 5.8m a year at 6%.","Splits quick wins (terms for large suppliers, cards, catalogues) from longer levers (tenders, specs, maverick control).","Flags the harm to small suppliers from shorter-to-longer terms."],"mistakes":["Treating PHP 96.7m as a yearly saving.","Calling the tail 'small suppliers' without a number.","Mixing PHP and PHP m in the PO calculation.","Applying 45 days to every group without checking who is already at policy.","Focusing only on price, ignoring process cost."]},{"id":"brake-supplier-selection","title":"Chao Phraya Auto: casting supplier choice","client":"Chao Phraya Auto Components Co., a Thai tier-1 maker of brake systems for passenger cars and pickups","country":"Thailand","type":"procurement","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"Pick the supplier or suppliers for a new cast brake caliper housing, 600,000 units a year.","prompt":"Our client is Chao Phraya Auto Components, a Thai maker of brake systems. It won a new platform from a car maker. Production starts in nine months. The platform needs a cast caliper housing, 600,000 units a year. Three foundries have sent quotes: one in Thailand, one in China and one in India. The head of purchasing wants a recommendation before the sourcing committee next week. The China quote is the lowest. She is not sure it is the right choice. How would you help her decide?","clarifying":[{"q":"Do all three suppliers meet our technical requirements?","a":"Yes. All three passed the technical review and the capacity check at the knock-out stage. Now we compare them."},{"q":"What is the annual volume, and is it stable?","a":"600,000 units a year, steady, for five years."},{"q":"Are the quotes on the same basis?","a":"No. Supplier A quotes delivered to our plant. Supplier B quotes FOB Shanghai. Supplier C quotes CIF Laem Chabang. Details are in the exhibit."},{"q":"What does a defective part cost us?","a":"USD 8 per defective part in rework and scrap. Give this if asked, it is also in the exhibit note."},{"q":"What is the cost of capital?","a":"About 12% a year, so 1% for each 30 days of payment time. Give this if asked, it is also in the exhibit note."},{"q":"Can one supplier deliver the whole volume?","a":"B and C could. Supplier A can supply at most 360,000 units a year, which is 60%."}],"structure":{"notes":"Good structure: knock-out criteria first (capability, capacity, certification), then total cost, then a weighted scorecard for non-cost criteria, then a portfolio decision (single or dual source).","branches":[{"name":"Knock-out criteria","points":["Technical capability and tooling","Capacity for 600,000 units","IATF 16949 certification","Financial stability"]},{"name":"Total landed cost","points":["Quote price by Incoterm","Freight and insurance","Duty on CIF value","Quality cost (defects times rework)","Payment terms"]},{"name":"Weighted scoring","points":["Quality","Delivery performance and lead time","Risk and ESG","Check that weights do what we intend"]},{"name":"Portfolio and risk","points":["Single vs dual source","Volume split","Country and logistics risk","Exit and switching cost"]}]},"stages":[{"id":"s1","title":"Structure the supplier selection","timer":"structure","minutes":7,"question":"How would you structure the supplier selection for the head of purchasing?","notes":"Listen for: knock-outs before scoring, cost as total cost not quote, non-cost criteria in a scorecard, and a final portfolio view. Give clarifying answers as asked. The statement that the knock-outs are passed comes from the first clarifying answer.","exhibits":[],"hints":["What must be true before we even compare prices?","Is the quote price the cost to us?"],"solution":"I would do it in four steps.\nStep 1, knock-outs. Can they make the part, do they have the capacity, are they IATF certified, are they financially stable? All three have passed.\nStep 2, total landed cost. Quote price plus freight, duty, quality cost and the cost of payment terms. This is the real cost to us.\nStep 3, a weighted scorecard for what cost does not show: quality, delivery, and risk and ESG. I would check that the weights really do what we intend.\nStep 4, the portfolio. One supplier or two, what split, and what the risks are.\nI would start with landed cost, because the quotes are on different Incoterms."},{"id":"s2","title":"Landed cost per unit","timer":"math","minutes":12,"question":"Here are the three quotes. Calculate the landed cost per unit for each supplier. Which is cheapest, and what does that mean for the decision?","notes":"Key traps: duty is charged on the CIF value, which for B is quote plus freight. A and C already include freight. Defect cost is defect rate times USD 8. Payment terms: baseline 60 days, each 30 days shorter costs 1% of the quote price. The cheapest quote (B) is the most expensive landed. Let the candidate do it on paper. A good candidate states the base before multiplying.","exhibits":["e1"],"hints":["Duty is a percent of CIF. What is CIF for B?","Compare terms to a 60-day baseline."],"solution":"Landed cost = quote + freight + duty + defect cost + payment terms cost.\nSupplier A (delivered, no duty):\nQuote 10.20. Freight 0. Duty 0. Defects 1% x USD 8 = 0.08. Terms 60 days = 0.\nLanded = 10.28 USD per unit.\nSupplier B (FOB, I pay freight and duty):\nQuote 9.00. Freight 0.60. CIF = 9.60. Duty 10% x 9.60 = 0.96. Defects 6% x 8 = 0.48. Terms 30 days, 30 days shorter than baseline = 1% x 9.00 = 0.09.\nLanded = 9.00 + 0.60 + 0.96 + 0.48 + 0.09 = 11.13 USD per unit.\nSupplier C (CIF, freight in the price):\nQuote 10.00. Duty 5% x 10.00 = 0.50. Defects 3% x 8 = 0.24. Terms 45 days, 15 days shorter = 0.5% x 10.00 = 0.05.\nLanded = 10.00 + 0.50 + 0.24 + 0.05 = 10.79 USD per unit.\nOrder by landed cost: A 10.28, C 10.79, B 11.13.\nB is the lowest quote at 9.00, but the highest landed cost. B is 0.85 per unit above A. At 600,000 units that is USD 510,000 a year.\nA is 1.20 above B on quote, but 0.85 below B landed.\nSo-what: the quote is the wrong measure. A is cheapest, C is 0.51 above A, B is out on cost."},{"id":"s3","title":"The scorecard","timer":"exhibit","minutes":13,"question":"The purchasing team scored the three suppliers on non-cost criteria. They agreed group weights of 40% cost, 25% quality, 20% delivery and 15% risk and ESG. Their sheet multiplies each criterion score by its group weight and adds up all rows. What do the totals say? Do you trust this scorecard?","notes":"The sheet applies the group weight to every criterion row, so groups with more criteria get more weight. Row weights add to 190, not 100. Effective weights: cost 40/190 = 21%, quality 50/190 = 26%, delivery 21%, risk and ESG 60/190 = 32%. Cost, the stated top priority, is only 21%. The sheet says C (430) beats A (415). With the intended weights A wins. The candidate must notice that the weights are wrong, and say so. Do not let them silently correct the sheet.","exhibits":["e2"],"hints":["Add up the weights of all the rows. Is it 100?","How many criteria sit in each group?"],"solution":"Step 1. Sheet totals = sum of weight x score over all rows.\nSupplier A: 40x3 + 25x3 + 25x2 + 20x1 + 20x3 + 15x1 + 15x3 + 15x1 + 15x1 = 120 + 75 + 50 + 20 + 60 + 15 + 45 + 15 + 15 = 415.\nSupplier B: 40 + 25 + 50 + 20 + 40 + 45 + 30 + 15 + 30 = 295.\nSupplier C: 80 + 50 + 75 + 40 + 20 + 45 + 30 + 45 + 45 = 430.\nThe sheet ranks C (430), A (415), B (295).\nStep 2. Check the weights. The row weights add to 40 + 25 + 25 + 20 + 20 + 15 + 15 + 15 + 15 = 190, not 100.\nCriteria per group: cost 1, quality 2, delivery 2, risk and ESG 4.\nEffective weight = group weight x number of criteria / 190.\nCost: 40 / 190 = 21%. Quality: 50 / 190 = 26%. Delivery: 40 / 190 = 21%. Risk and ESG: 60 / 190 = 32%.\nWe said cost matters most at 40%. The sheet gives it 21%. Risk and ESG was meant to be 15% but gets 32%.\nStep 3. Fix it. Average the criteria inside each group, then apply the group weight.\nGroup averages (cost, quality, delivery, risk) are A: 3.0, 2.5, 2.0, 1.5. B: 1.0, 1.5, 1.5, 2.0. C: 2.0, 2.5, 1.5, 2.75.\nA = 0.40x3.0 + 0.25x2.5 + 0.20x2.0 + 0.15x1.5 = 2.45.\nB = 1.375.\nC = 0.40x2.0 + 0.25x2.5 + 0.20x1.5 + 0.15x2.75 = 2.14.\nWith the intended weights the order is A (2.45), C (2.14), B (1.38).\nSo-what: the sheet flips A and C. The corrected score agrees with landed cost: A first, C second, B last. B loses on both. A is weak on risk (financial health, one site), which is why a second supplier matters."},{"id":"s4","title":"Recommendation","timer":"recommendation","minutes":13,"question":"Sourcing committee is next week. What do you recommend: one supplier or two? If two, what volume split, and what is the cost of that choice compared with the cheapest option? What are the risks?","notes":"Supplier A can supply at most 360,000 units (60%). Expected answer: dual source A and C, 60/40, exclude B. Candidate should compute the volume, the premium over single-sourcing A (0.51 x 240,000), and the saving vs B. Reasoning on risk: A is domestic and cheapest but has weak financial health and one site; C is a second country, ESG strong, but lead time is long. Listen for exit plan and a review of the split after year one.","exhibits":[],"hints":["How much can A supply at most?","What is the extra cost of moving 240,000 units from A to C?"],"solution":"Dual source, A and C. Exclude B.\nStep 1. Volume. A at its maximum 60% of 600,000 = 360,000 units. C takes 40% = 240,000 units.\nStep 2. Annual cost.\nA: 360,000 x 10.28 = USD 3,700,800.\nC: 240,000 x 10.79 = USD 2,589,600.\nTotal = USD 6,290,400.\nStep 3. Compare.\nAll A (not possible, 60% cap): 600,000 x 10.28 = USD 6,168,000. The dual source premium is USD 122,400 a year, 2.0%.\nAll B (cheapest quote): 600,000 x 11.13 = USD 6,678,000. The dual source is USD 387,600 a year cheaper than B.\nSo-what: for a 2% premium over the theoretical best we get a second source in a second country. A has weak financial health and one site. C has the best ESG and financial score. B is out on landed cost and a 6% defect rate."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Quotes for the caliper housing","chart":"table","columns":["Supplier (location)","Incoterm","Quote (USD per unit)","Freight to plant (USD per unit)","Import duty (% of CIF value)","Defect rate (%)","Payment terms (days)"],"rows":[["A (Thailand)","DDP plant",10.2,0.0,0,1,60],["B (China)","FOB Shanghai",9.0,0.6,10,6,30],["C (India)","CIF Laem Chabang",10.0,0.0,5,3,45]],"note":"CIF value = quote + freight and insurance to Thailand. For C the freight is already in the quote. Defect cost: USD 8 per defective part. Payment terms: baseline is 60 days; each 30 days shorter costs 1% of the quote price. Annual volume 600,000 units."},{"id":"e2","title":"Exhibit 2: Supplier scorecard (scores 1 to 3, 3 is best)","chart":"table","columns":["Criterion","Group","Group weight on each row (%)","A","B","C"],"rows":[["Landed cost","Cost",40,3,1,2],["Defect rate","Quality",25,3,1,2],["IATF 16949 status","Quality",25,2,2,3],["On-time delivery","Delivery",20,1,1,2],["Lead time","Delivery",20,3,2,1],["Financial health","Risk and ESG",15,1,3,3],["Country and logistics risk","Risk and ESG",15,3,2,2],["ESG audit","Risk and ESG",15,1,1,3],["Site concentration","Risk and ESG",15,1,2,3]],"note":"Group weights agreed by the team: cost 40%, quality 25%, delivery 20%, risk and ESG 15%. The team's sheet multiplies each score by the group weight shown on its row and adds up all rows. Score 2 for IATF means certified with open findings."}],"recommendation":"My recommendation is to dual source: Supplier A for 60% and Supplier C for 40%, and not use B. B has the lowest quote at USD 9.00 but the highest landed cost at 11.13. After freight, 10% duty, 6% defects and short payment terms, it costs 0.85 per unit more than A, USD 510,000 a year. A is cheapest at 10.28. C is 10.79. Note that the purchasing scorecard gives wrong weights: cost counts for 21%, not 40%, and it ranks C above A. With the intended weights, A leads. Because A can only supply 360,000 units, and has weak financials and one site, I would give C 240,000 units. That costs USD 122,400 a year more than an all-A case, about 2%. It is USD 387,600 cheaper than buying from B. The main risks are C's long lead time, so we hold safety stock for the first year, and A's financial health, so we check it every six months. Next steps: confirm A's capacity, agree C's quality plan, and review the split after year one.","good":["Puts knock-outs before scoring and separates quote from landed cost","Calculates duty on CIF value and quality cost as defect rate times USD 8","Finds that B has the lowest quote but the highest landed cost","Recommends a dual source with a volume split that respects A's 60% cap"],"great":["Notices the scorecard weights add to 190 and gives the effective weights (cost 21%, risk and ESG 32%)","Says the sheet flips A and C, and re-runs it with the intended weights instead of silently fixing it","Prices the dual-source premium (USD 122,400, about 2%) and compares it with the all-B case","Names risk reasoning per supplier: A financial health and single site, C lead time, B quality"],"mistakes":["Choosing B because it has the lowest quote","Applying duty to the FOB quote instead of the CIF value","Adding up the scorecard without checking that the weights make 100","Recommending A alone, ignoring its 60% capacity and its weak financial health","Giving a split with no cost number or risk reasoning"]},{"id":"packaging-cost-down","title":"Sari Nusantara Pangan: the 5% target","client":"PT Sari Nusantara Pangan, an Indonesian packaged-food company (biscuits, noodles, snacks) with five plants and IDR 1,200 bn of direct spend","country":"Indonesia","type":"procurement","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"The CPO wants 5% off direct spend in 12 months. Where do we look first, and is the target realistic?","prompt":"Our client is PT Sari Nusantara Pangan, an Indonesian food company. It makes biscuits, instant noodles and snacks in five plants. Direct spend is about IDR 1,200 billion a year. The new CPO has told the board she will cut direct spend by 5% in 12 months. She has asked the Inverto team to build the plan. You meet her tomorrow. We start with how you would approach this. Then we will look at the data.","clarifying":[{"q":"What is in direct spend?","a":"Raw materials, packaging, and co-packing. Everything that goes into the product. Indirect spend like logistics and IT is not in scope."},{"q":"Is the 5% measured against this year's prices or against a budget?","a":"Against this year's actual spend, at constant volume. Price increases the market forces on us do not count as savings."},{"q":"Do we have a spend cube already?","a":"Yes. Finance built one. I will show it when you ask for the data."},{"q":"Are specs the same across the five plants?","a":"For the main film, yes. Same grade, same supplier approval list. Prices are delivered prices, freight included."},{"q":"Can we change product specs, for example pack size or film thickness?","a":"Marketing has not agreed to any spec change. Treat it as a later option, not a base case."}],"structure":{"notes":"Break the 5% into levers and categories, not into functions. Good answers also separate what is addressable from what is locked, and ask how fast each lever pays.","branches":[{"name":"Size the prize","points":["Spend by category","Addressable share (contracts, regulated, single source)","Savings range per category","Gap to 5%"]},{"name":"Price levers","points":["Renegotiate and tender","Harmonise prices across plants","Bundle volume and consolidate suppliers","Index-linked terms for commodities"]},{"name":"Demand and spec levers","points":["Design to value (film gauge, carton grade)","Standardise SKUs and pack formats","Reduce waste and scrap"]},{"name":"Delivery and risk","points":["Timing of contracts, 12-month limit","Supplier risk and quality","Owner per category, tracking of savings"]}]},"stages":[{"id":"s1","title":"Structure the savings plan","timer":"structure","minutes":5,"question":"How would you structure the work to deliver a 5% reduction in direct spend in 12 months?","notes":"Give clarifying answers if asked. Listen for: split by category and lever, addressable vs non-addressable, and a view on time. Do not accept a list of generic ideas with no structure. Give the data in the next stage only when the candidate asks for spend by category.","exhibits":[],"hints":["Start from the number. What is 5% of the spend?","Which part of the spend can you actually influence in 12 months?"],"solution":"5% of IDR 1,200 bn is IDR 60 bn.\nI would build the plan in four blocks.\nFirst, size the prize. Spend by category, how much is addressable, and a savings range per category. This tells us the gap to 60 bn.\nSecond, price levers: renegotiation and tenders, price harmonisation across plants, bundling volume, and index terms for commodities.\nThird, demand and spec levers: design to value, fewer SKUs, less scrap.\nFourth, delivery: what can land in 12 months given contract dates, supplier risk, and who owns each category.\nI would start with the spend cube, because it tells us where to focus."},{"id":"s2","title":"Read the spend cube","timer":"exhibit","minutes":12,"question":"Here is the spend cube. First, what range of savings does it give in total, and how does that compare to the target? Second, which categories would you focus on first, and why?","notes":"Candidate must compute addressable spend per category, then low and high savings. The trap: wheat flour and sugar is the biggest category at 33% of spend, but it is not the biggest opportunity. Check that the candidate ranks by savings, not by spend. Savings percentages apply to the addressable spend, not to total spend. Listen for the point that price levers alone give 2.1% to 3.7%, below 5%.","exhibits":["e1"],"hints":["Multiply spend by the addressable share first. Then apply the savings range.","Rank the categories by savings in IDR, not by spend."],"solution":"Step 1. Addressable spend = spend x addressable share.\nFlour and sugar: 400 x 40% = 160 bn. Palm oil: 240 x 50% = 120 bn. Film: 200 x 90% = 180 bn. Cartons: 100 x 90% = 90 bn. Flavours: 100 x 70% = 70 bn. Co-packing: 80 x 75% = 60 bn. Labels and other: 80 x 50% = 40 bn.\nTotal addressable = 720 bn, which is 60% of 1,200 bn.\nStep 2. Savings = addressable x savings range.\nFlour and sugar: 1.6 to 4.8 bn. Palm oil: 2.4 to 4.8 bn. Film: 10.8 to 18.0 bn. Cartons: 4.5 to 7.2 bn. Flavours: 2.1 to 3.5 bn. Co-packing: 2.4 to 3.6 bn. Labels and other: 1.2 to 2.0 bn.\nStep 3. Total savings = 25.0 to 43.9 bn. Midpoint about 34.5 bn.\nAs a share of 1,200 bn: 2.1% to 3.7%.\nThe target is 60 bn. The gap is 16 to 35 bn.\nStep 4. Rank by savings. Film is first at 14.4 bn midpoint. Cartons are second at 5.9 bn. Then palm oil 3.6, flour and sugar 3.2, co-packing 3.0.\nFilm and cartons are 25% of spend (300 bn) but 59% of the midpoint savings (20.3 of 34.5 bn). Even in the low case they give 15.3 bn.\nFlour and sugar is one third of the spend but only 9% of the savings. It is mostly commodity and half locked into contracts.\nSo-what: start with film and cartons. And tell the CPO that price levers alone reach 2% to 4%, not 5%. The rest has to come from spec and demand levers."},{"id":"s3","title":"Price differences across plants","timer":"math","minutes":10,"question":"Film is the biggest lever. Here are prices for one film item, bought by five plants. How much can we save by harmonising prices? Give a best case and a median case. How would you use these numbers?","notes":"Same grade, same specs, delivered prices (already said in clarifying). Candidate should compute gap x volume per plant. Best case = everyone pays the lowest price. Median case = only plants above the median move down to the median price (IDR 46,000). Look for: units (IDR per kg times tonnes needs x1,000), and the point that the best case is an upper bound because of freight, supplier capacity and plant location. If asked, Makassar is far from the supplier hub; Cikarang is next to the supplier plant.","exhibits":["e2"],"hints":["Saving per plant = (price - target price) x volume. Watch tonnes and kg.","Which price is the median of five plants?"],"solution":"Step 1. Total spend on this item = 50.4 + 35.2 + 18.4 + 19.2 + 10.8 = 134.0 bn. Volume is 3,000 tonnes. This is 67% of the film category.\nStep 2. Best case, everyone pays IDR 42,000 per kg.\nSurabaya: 2,000 per kg x 800,000 kg = 1.6 bn. Semarang: 4,000 x 400,000 = 1.6 bn. Medan: 6,000 x 400,000 = 2.4 bn. Makassar: 12,000 x 200,000 = 2.4 bn.\nTotal = 8.0 bn per year, 6.0% of the item spend.\nStep 3. Median case. The median price is IDR 46,000 (Semarang). Only Medan and Makassar are above it.\nMedan: 2,000 x 400,000 = 0.8 bn. Makassar: 8,000 x 200,000 = 1.6 bn.\nTotal = 2.4 bn per year, 1.8% of the item spend.\nSo the range is 2.4 to 8.0 bn on this one item. It fits inside the 10.8 to 18.0 bn range for the film category.\nSo-what: use 2.4 bn as the floor and 8.0 bn as the opening ask. The best case is a ceiling, not a forecast. Makassar and Medan pay for freight, and Cikarang is next to the supplier. I would run one group-wide negotiation on this item, with a freight-adjusted price per plant."},{"id":"s4","title":"Recommendation for the CPO","timer":"recommendation","minutes":8,"question":"The CPO meeting is tomorrow. What do you tell her? Is 5% realistic, where do you start, and what are the main risks?","notes":"Look for a clear answer first, a number range, a focus on film and cartons, and an honest message on the gap. Good candidates propose a committed target and a stretch target. Do not accept 'we can do it all'.","exhibits":[],"hints":["What does the cube say about 5%?","What fills the gap if price levers do not?"],"solution":"Answer first: 5% is a stretch, about 3% is committed.\nPrice levers give 25.0 to 43.9 bn, which is 2.1% to 3.7% of 1,200 bn.\nFilm and cartons give 15.3 to 25.2 bn from 25% of the spend.\nFilm harmonisation on one item gives 2.4 bn (median) to 8.0 bn (best).\nThe rest of the gap, 16 to 35 bn, needs spec and demand levers.\nRisks: supplier capacity, freight to remote plants, contract end dates, Marketing sign-off on spec changes."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Direct spend cube by category","chart":"table","columns":["Category","Spend (IDR bn)","Addressable share (%)","Savings low (% of addressable)","Savings high (% of addressable)"],"rows":[["Wheat flour and sugar",400,40,1,3],["Palm oil and fats",240,50,2,4],["Flexible packaging film",200,90,6,10],["Corrugated cartons",100,90,5,8],["Flavours and ingredients",100,70,3,5],["Co-packing",80,75,4,6],["Labels, inks and other",80,50,3,5]],"note":"Source: client finance, last 12 months. Savings ranges apply to the addressable spend only. Total spend IDR 1,200 bn."},{"id":"e2","title":"Exhibit 2: One film item (BOPP 20 micron) by plant","chart":"table","columns":["Plant","Price paid (IDR per kg)","Volume (tonnes per year)"],"rows":[["Cikarang",42000,1200],["Surabaya",44000,800],["Semarang",46000,400],["Medan",48000,400],["Makassar",54000,200]],"note":"Delivered prices, freight included. Same specification and approved supplier list at all plants. 1 tonne = 1,000 kg."}],"recommendation":"My answer: 5% is not reachable by price levers alone. Price levers give IDR 25 to 44 billion, which is 2.1% to 3.7% of spend. The target is 60 billion. I would start with two categories, film and cartons. They are only 25% of spend, but 59% of the savings, 15 to 25 billion. Flour and sugar is the biggest category, but half of it is locked, so it comes later. On film, harmonising one item across the five plants is worth 2.4 billion at the median price and up to 8 billion at the best price. I would use 2.4 as the floor. The risks are supplier capacity if we move volume, freight in the remote plants, and contract dates. So I would tell the CPO to commit to about 3% inside 12 months, and set 5% as a stretch that needs design to value on film gauge and carton grade, which Marketing must agree. Next steps: launch the film negotiation, check contract end dates for all categories, and bring a spec proposal to Marketing within a month.","good":["Splits the 5% by category and lever, and asks what is addressable","Applies savings percentages to addressable spend, not total spend, and gets 25 to 44 bn","Ranks by savings and picks film and cartons, not flour and sugar","Computes harmonisation as gap times volume with correct units"],"great":["Says the 5% target is not reached by price levers (2.1% to 3.7%) and proposes a committed number plus a stretch","Treats the best-price case as a ceiling and explains why (freight, capacity, plant location)","Adds spec and demand levers to close the gap, and flags the Marketing dependency","Links the plan to contract end dates and the 12-month limit"],"mistakes":["Ranking categories by spend and starting with flour and sugar","Applying the savings percentage to total spend instead of addressable spend","Mixing tonnes and kg, so the plant saving is off by a factor of 1,000","Promising the full 5% without showing where the last IDR 16 to 35 bn comes from","Using the best price as the expected saving"]},{"id":"steel-price-increase","title":"Kessler-Rauh Maschinenbau: the 14% letter","client":"Kessler-Rauh Maschinenbau GmbH, a family-owned machinery maker in Baden-Wuerttemberg with about EUR 300m revenue","country":"Germany","type":"procurement","difficulty":"Advanced","format":"Interviewer-led","minutes":45,"summary":"A key supplier of machined steel parts announces a 14% price increase. How much is justified, and how do we respond?","prompt":"Our client is Kessler-Rauh Maschinenbau, a family-owned machinery maker in southern Germany. It buys machined steel parts from Lindner Praezisionsteile, a supplier near Stuttgart. Spend with Lindner is EUR 12 million a year. Last month Lindner sent a letter. It wants a 14% price increase from the next quarter, citing steel, energy and wages. The owner and the head of purchasing want to know if this is fair and what to do. Prices were last reset two years ago. We are on the Inverto team and meet them on Thursday.","clarifying":[{"q":"Is there a price clause in the contract?","a":"No. Prices are fixed, reset by negotiation. The last reset was two years ago. The contract runs another two years."},{"q":"Do we have a cost breakdown of Lindner's price?","a":"Yes, from the last negotiation. It is in the exhibit. Lindner's open-book audit right allows us to check it."},{"q":"How important are these parts for us?","a":"They go into three machine families, about 40% of our revenue. A stop in supply would stop assembly within three weeks."},{"q":"How big is Lindner, and how much do we matter to them?","a":"Lindner has about EUR 40m revenue. We are 30% of it. Give this if asked, it is also in the second exhibit."},{"q":"Are the drawings ours or theirs?","a":"Ours. We own the drawings. The tooling is partly Lindner's, partly ours."},{"q":"Is a works council involved?","a":"No. Not relevant for this decision."}],"structure":{"notes":"Three questions: is the increase justified (cost drivers vs indices), what are our alternatives (BATNA, switching), and how do we respond (negotiation plan, contract terms). Strong candidates start with facts before position.","branches":[{"name":"Is it justified?","points":["Cost breakdown of the price","Index movement per cost block since last reset","Compare computed increase with the 14% ask","Margin and open-book check"]},{"name":"What are our alternatives?","points":["Other suppliers, price and location","Switching cost and qualification time","How much we matter to Lindner","Dependency and risk of stopping assembly"]},{"name":"How do we respond?","points":["Accept the justified part, reject the rest","Index clause, two-way","What we can trade (volume, term, payment, forecast)","Timeline, who talks to whom"]}]},"stages":[{"id":"s1","title":"Structure the response","timer":"structure","minutes":5,"question":"How would you approach this for Thursday's meeting with the owner and the head of purchasing?","notes":"Listen for: check facts before negotiating, compare ask to cost drivers, understand leverage both ways, and think about contract terms, not only the price. Give clarifying answers as asked.","exhibits":[],"hints":["What would you want to know before you answer Lindner?","Who has more leverage, and does that change over time?"],"solution":"Three questions.\nFirst, is the increase justified? Take Lindner's cost structure, look at how steel, energy and labour moved since the last reset, and compute what the price should be. Compare with 14%.\nSecond, what are our alternatives? Other suppliers, their price, what it costs to switch and how long qualification takes. And how much we matter to Lindner, because that is our leverage.\nThird, the response. Accept what is justified, reject the rest, and fix the way prices change in the future with an index clause. And decide what we can offer in return.\nI would start with the cost facts."},{"id":"s2","title":"How much is justified?","timer":"math","minutes":12,"question":"Here is Lindner's price structure and the index moves since the last reset. How large is the justified increase in percent? What does the 14% ask cost us per year, and how big is the gap?","notes":"Justified increase = sum of (cost share x index change). Use the 'now' column, not the six-month-ago column. Look for: the candidate multiplies share by change and does not take a simple average of the four moves. The steel index fell from 115 six months ago to 108 now. Lindner's letter probably used the peak. Candidate should mention it and link it to a two-way clause. Overhead and margin only moves with general inflation.","exhibits":["e1"],"hints":["Weight each index move by its share in the price.","Convert the gap in percent to EUR using the EUR 12m spend."],"solution":"Step 1. Increase per block = share of price x index change since last reset.\nSteel: 40% x 8% = 3.2 points.\nEnergy: 10% x 10% = 1.0 point.\nLabour: 30% x 8% = 2.4 points.\nOverhead and margin: 20% x 2% = 0.4 points.\nStep 2. Justified increase = 3.2 + 1.0 + 2.4 + 0.4 = 7.0%.\nStep 3. In EUR on EUR 12m of spend.\nJustified: 12.0 x 7.0% = EUR 0.84m a year.\nAsk: 12.0 x 14% = EUR 1.68m a year.\nGap: 1.68 - 0.84 = EUR 0.84m a year, 7 points. The ask is twice what the cost drivers support.\nStep 4. Look at the trend. The steel index was 115 six months ago and is 108 now. At 115, steel would have added 6.0 points, not 3.2. If Lindner priced steel at the peak, that alone explains 2.8 points of the gap.\nSo-what: some increase is fair. About 7%, EUR 0.84m. The other half is not supported. And because steel is falling, we should not lock a fixed 7% for two years."},{"id":"s3","title":"Our alternatives","timer":"exhibit","minutes":13,"question":"Now the alternatives. For each, how long until we recover the switching cost if Lindner holds to 14%? And if we agree the justified increase? What does this tell you about our leverage?","notes":"The alternative price is relative to Lindner's price today. Saving = (Lindner new increase - alternative price premium) x EUR 12m. Payback in months = switching cost / annual saving x 12. At the ask all three pay back in about 6 to 8 months, at the justified increase only Poland and Czechia are reasonable (18 and 20 months), and Germany takes 50 months. Qualification is 6 to 12 months, so the threat is real but slow. The break-even increase for Poland at a 24-month payback is 5.75%: above that, switching pays within two years. Also point out that Lindner does 30% of its revenue with us. Give the Lindner revenue of EUR 40m if asked.","exhibits":["e2"],"hints":["Saving per year is the difference between Lindner's new price and the alternative, on EUR 12m.","Payback = switching cost divided by yearly saving."],"solution":"Step 1. Annual saving vs Lindner = (increase - alternative premium) x EUR 12m.\nPoland (+2%): at 14%: 12% x 12 = EUR 1.44m. At 7%: 5% x 12 = EUR 0.60m.\nCzechia (+4%): at 14%: 10% x 12 = EUR 1.20m. At 7%: 3% x 12 = EUR 0.36m.\nGermany (+6%): at 14%: 8% x 12 = EUR 0.96m. At 7%: 1% x 12 = EUR 0.12m.\nStep 2. Payback = switching cost / saving.\nIf Lindner holds to 14%:\nPoland: 0.9 / 1.44 = 0.63 years, 7.5 months.\nCzechia: 0.6 / 1.20 = 0.5 years, 6 months.\nGermany: 0.5 / 0.96 = 0.52 years, about 6 months.\nIf we accept 7%:\nPoland: 0.9 / 0.60 = 1.5 years, 18 months.\nCzechia: 0.6 / 0.36 = 1.7 years, 20 months.\nGermany: 0.5 / 0.12 = 4.2 years, 50 months.\nStep 3. Break-even for Poland at a 24-month payback: saving needed = 0.9 / 2 = EUR 0.45m a year = 3.75% of spend. So the increase must exceed 2% + 3.75% = 5.75%.\nStep 4. Leverage. We are 30% of Lindner's revenue: 12 / 40. Losing us would cost them EUR 12m of EUR 40m. Their ask would be a high-risk move.\nSo-what: at 14% the switch is a no-brainer, so the ask is not credible if we show we have a plan. At 7% the switch is marginal, 18 to 20 months. Qualification takes 9 to 12 months, so we cannot leave tomorrow. We should start qualifying one alternative now as insurance."},{"id":"s4","title":"Negotiation plan and recommendation","timer":"recommendation","minutes":15,"question":"Thursday's meeting: what do you recommend we do? What do we offer Lindner, what do we ask, and what is the fallback?","notes":"Look for: accept the justified part but through a formula, not a fixed number; two-way index clause (steel, energy, labour); trade volume and term; open-book check; start qualification of a second supplier in parallel; a clear walk-away. Check that the candidate quantifies the position (EUR 0.84m justified vs EUR 1.68m ask, EUR 0.84m gap). A good candidate also thinks about relationship, since Lindner is a local Mittelstand firm and a 30% customer.","exhibits":[],"hints":["What can you give Lindner that costs you little?","How do you make sure the price also falls when steel falls?"],"solution":"Position: accept about 7%, reject 14%, and change the mechanism.\nJustified: EUR 0.84m a year. Ask: EUR 1.68m. Gap: EUR 0.84m a year.\nWe offer: a 3-year volume commitment, a rolling 6-month forecast, and faster payment if we get a lower price.\nWe ask: price from a formula: 40% steel, 10% energy, 30% labour, 20% fixed, reviewed each quarter, up and down, with a collar so neither side moves more than a few points a year. Open-book check on the cost breakdown.\nFallback: qualify the Polish supplier now (EUR 0.9m, 12 months). It is insurance and a credible threat.\nWalk-away: if Lindner insists on more than the formula gives, we move part of the volume."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Lindner price structure and index moves","chart":"table","columns":["Cost block","Share of Lindner's price (%)","Index at last price reset","Index 6 months ago","Index now"],"rows":[["Steel (hot-rolled bar index)",40,100,115,108],["Energy (industrial electricity and gas)",10,100,108,110],["Labour (metalworking wage agreement)",30,100,105,108],["Overhead and margin (general inflation)",20,100,101,102]],"note":"Cost shares from the last open-book review two years ago. Indices are public. All blocks are indexed to 100 at the last price reset. Lindner's price today is the base."},{"id":"e2","title":"Exhibit 2: Alternative suppliers for the same parts","chart":"table","columns":["Supplier (location)","Landed price vs Lindner today (%)","One-off switching cost (EUR m)","Qualification time (months)","Capacity for our volume"],"rows":[["Kowalski Precision (Poland)",2,0.9,12,"Yes"],["Zlin Machining (Czechia)",4,0.6,9,"Yes"],["Mertens Zerspanung (Germany)",6,0.5,6,"Half of the volume"]],"note":"Landed price includes freight and no customs duty (EU). Switching cost = tooling transfer, first-article tests, and project time. Our annual spend with Lindner: EUR 12m. Lindner annual revenue: about EUR 40m."}],"recommendation":"My recommendation: accept about 7%, not 14%, and put the price on a formula. The cost drivers support 7.0%: steel 3.2 points, energy 1.0, labour 2.4, overhead 0.4. That is EUR 0.84 million a year. The 14% ask is EUR 1.68 million, so the gap is EUR 0.84 million a year. Our leverage is real. We are 30% of Lindner's revenue. At 14%, Poland pays back in 7.5 months. At 7% it is 18 months, so the switch is marginal, and Poland needs 12 months to qualify. So I would not threaten to leave. I would show we have a plan. We offer a three-year volume commitment and a rolling forecast. We ask for an index formula with steel, energy and labour, two-way, reviewed each quarter. That matters because steel is already down from 115 to 108, and a fixed 7% would not follow it down. Fallback: start qualifying the Polish supplier now, about EUR 0.9 million. Risks: supply stop for three weeks of assembly, and damage to a local relationship. Next steps: confirm the cost breakdown with an open-book check, draft the formula, and agree the walk-away with the owner before Thursday.","good":["Computes the justified increase as share times index change (7.0%) and compares it with 14%","Converts to EUR: EUR 0.84m justified, EUR 1.68m ask, EUR 0.84m gap per year","Calculates payback for each alternative at both price levels","Recommends accepting the justified part and rejecting the rest"],"great":["Notices steel fell from 115 to 108 and that a fixed increase will not follow it down, so proposes a two-way index clause","Uses the 30% share of Lindner's revenue as leverage but says qualification takes 9 to 12 months, so the BATNA is slow","Gives a break-even (Poland pays back in 24 months above a 5.75% increase)","Offers a trade (volume, term, forecast) instead of only pushing on price, and names a walk-away"],"mistakes":["Averaging the four index moves without weighting by cost share","Using the six-month-old steel index and getting 9.8% instead of 7.0%","Comparing the alternatives with today's price and not the new price","Threatening to leave with no word on qualification time and supply risk","Giving a flat 7% and forgetting the formula, so the client pays if steel falls"]},{"id":"pharma-inventory-cash","title":"Cash from inventory (Siam Medica)","client":"Siam Medica Distribution Co., Ltd., a Thai pharmaceutical distributor to hospitals and pharmacies.","country":"Thailand","type":"supply chain","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"The CFO wants THB cash released from inventory and supplier terms.","prompt":"Siam Medica distributes medicines and health products to hospitals and pharmacies in Thailand. Cost of goods sold is about THB 6 billion a year. Bank credit is getting more expensive. The CFO wants to release at least THB 300 million of cash within 12 months, without hurting service to hospitals. You are on the Inverto team and you meet the CFO tomorrow. We will go step by step. First, how would you structure the problem?","clarifying":[{"q":"Is the CFO's target a cash number or a profit number?","a":"Cash. THB 300 million within 12 months."},{"q":"What are annual purchases compared with cost of goods sold?","a":"About the same: THB 6 billion. Use purchases = COGS. (Give if asked.)"},{"q":"How are the DIO targets set?","a":"By product group, from a service-level study. They protect hospital fill rate. (Give if asked.)"},{"q":"What is the cost of funds?","a":"8% a year. All inventory costs including storage and expiry are 12% of inventory value a year. (Give if asked.)"},{"q":"Do we have any limits on shelf life or cold chain?","a":"Yes. Specialty products are cold chain with 18 to 24 months of shelf life. Over-stock risks expiry."}],"structure":{"notes":"A good structure uses cash conversion: DIO, DPO, DSO, with levers for each. It also asks what can be done without hurting service, and separates one-off cash from yearly profit.","branches":[{"name":"Inventory (DIO)","points":["Gap vs target by product group","Why stock is high: MOQ, lead time, forecast, slow SKUs","Levers: order policy, SKU cut, returns to supplier"]},{"name":"Payables (DPO)","points":["Current terms vs market","Which suppliers can move","Counter-risk: price increase, supply priority"]},{"name":"Receivables (DSO)","points":["Hospital payment delays","Collection and early-pay discounts"]},{"name":"Constraints","points":["Hospital fill rate","Expiry and cold chain","Supplier relationships"]}]},"stages":[{"id":"s1","title":"Structure the problem","timer":"structure","minutes":6,"question":"How would you structure the problem of releasing cash for the CFO?","notes":"Listen for working capital split into DIO, DPO, DSO with levers, plus constraints (service, expiry). Accept a clear structure that is not exactly this one. Mention that the first priority will be to size each lever. Then move to Exhibit 1.","exhibits":[],"hints":["Cash is tied up in three places. What are they?","Think about what the CFO cannot sacrifice."],"solution":"Cash tied up = inventory + receivables - payables.\nSo three levers: DIO (days of inventory), DSO (days of receivables), DPO (days of payables).\nFor each, I size the gap vs a target, then look at the causes and the levers.\nConstraints: hospital fill rate, expiry and cold chain, supplier relationships.\nI would start with inventory and payables, because Siam Medica is a distributor and the cost of goods is large. Receivables depend on hospitals and are harder to change."},{"id":"s2","title":"How much cash is in excess stock","timer":"exhibit","minutes":9,"question":"Here is DIO by product group against target. How much cash is tied up in stock above target? Show me the calculation.","notes":"Hand over Exhibit 1. Expected method: (DIO - target) x COGS / 365 per group, then sum. Total about THB 247m. Three groups give THB 65.75m each, which is a good check. If the candidate uses 360 days, accept it but ask them to state it. Watch for people using total COGS with an average DIO.","exhibits":["e1"],"hints":["One day of stock for a group costs its COGS divided by 365.","Do the calculation per group, then add."],"solution":"Cash per day of stock = COGS / 365.\nGenerics: 2,400 / 365 = THB 6.575m per day x 10 days over = THB 65.75m.\nBranded prescription: 1,800 / 365 = 4.932 x 10 = THB 49.32m.\nOTC and consumer health: 1,200 / 365 = 3.288 x 20 = THB 65.75m.\nSpecialty and imported: 600 / 365 = 1.644 x 40 = THB 65.75m.\nTotal excess stock = 65.75 + 49.32 + 65.75 + 65.75 = THB 246.6m.\nSo stock alone gets us to 82% of the CFO's THB 300m target. The gap is THB 53.4m.\nSpecialty is only 10% of COGS but a quarter of the excess cash."},{"id":"s3","title":"Why is stock high","timer":"exhibit","minutes":8,"question":"Here are supplier lead times and minimum order quantities for the slow-moving SKUs. What does it tell you about why stock is high, and which levers would you use?","notes":"Hand over Exhibit 2. Do not push a number first. Listen for: stock days track MOQ more than lead time for OTC and generics; specialty has both long lead time and large MOQ. Levers: renegotiate MOQ, share orders across SKUs, pool orders, consignment, SKU rationalisation, return or sell down. Counter-risk: expiry and fill rate. Optional math: cutting specialty MOQ from 90 to 45 days lowers average cycle stock by half the change, 22.5 days.","exhibits":["e2"],"hints":["Compare the MOQ column with the stock days column.","If the supplier forces a big order, what happens to average stock?"],"solution":"Stock days are close to MOQ plus a buffer. Average cycle stock is about half the MOQ, and the rest is safety stock and slow sales.\nOTC slow SKUs: lead time is only 14 days, but MOQ is 75 days. The order size, not the lead time, drives stock.\nGeneric slow SKUs: MOQ is 30 days, but stock is 70 days. Here the issue is forecasting and too many slow SKUs.\nSpecialty: lead time 75 days and MOQ 90 days. Both are high and the supplier is overseas.\nLevers: renegotiate MOQ or allow mixed orders, cut slow SKUs or sell them down, improve forecast for generics, consignment for specialty.\nExample: specialty MOQ 90 to 45 days cuts average cycle stock by 22.5 days. At THB 1.644m per day this is THB 37.0m, which is 56% of the specialty gap.\nRisk: expiry on specialty and fill rate if we cut too much."},{"id":"s4","title":"Payment terms lever","timer":"math","minutes":9,"question":"The CFO also asks about longer payment terms. Exhibit 3 shows suppliers by group. The plan is to move the top 30 local suppliers from 45 to 60 days. How much cash does that release, and what is the risk?","notes":"Hand over Exhibit 3. Expected: cash = spend / 365 x days = 3,000 / 365 x 15 = THB 123.3m. Brand owners are fixed by global contract. Small suppliers are already at 60 days. Then ask about the risk. Give if asked: cost of funds 8%, and a supplier could respond with a 1% price rise. Break-even price rise is 0.33%.","exhibits":["e3"],"hints":["Cash from extending terms = annual spend / 365 x extra days.","Only the groups that actually change count."],"solution":"Only the top 30 local suppliers change.\nSpend per day = 3,000 / 365 = THB 8.22m.\nExtra days = 60 - 45 = 15.\nCash released = 8.22 x 15 = THB 123.3m.\nCheck: weighted DPO goes from 42.5 to 50 days. 6,000 / 365 x 7.5 = THB 123.3m.\nThe value is one-off: the supplier funds this once. Interest saved at 8% is 123.3 x 8% = THB 9.9m a year.\nRisk: suppliers push back with a price rise. A 1% rise on THB 3,000m costs THB 30m a year, three times the benefit. The break-even is 9.9 / 3,000 = 0.33%. So extend terms only where we can hold price, and trade it for something such as faster payment on a fixed date or volume.\nAlso supply priority: in a shortage, we do not want to be the late payer."},{"id":"s5","title":"Recommendation","timer":"recommendation","minutes":6,"question":"The CFO asks: what will we release, and what will it do for profit? Give me your recommendation.","notes":"Looking for: one-off cash vs yearly profit kept separate. Holding cost saving at 12% of released stock = 29.6m. Combined cash 369.9m; yearly profit about 39.5m (29.6 + 9.9). Trap: saying THB 370m a year. Also expect phasing, service guard rails and what could fail.","exhibits":[],"hints":["Which numbers happen once, and which repeat every year?","The P&L effect uses the holding cost percentage, not the cash itself."],"solution":"One-off cash: excess stock THB 246.6m + payment terms THB 123.3m = THB 369.9m. This beats the THB 300m target.\nYearly profit: holding cost saving = 246.6 x 12% = THB 29.6m. Interest saved on longer terms = 123.3 x 8% = THB 9.9m. Total = THB 39.5m a year.\nThe cash is a one-off release. It is not a yearly saving."}],"exhibits":[{"id":"e1","title":"Exhibit 1: Days inventory outstanding by product group","chart":"table","columns":["Product group","COGS (THB m/year)","DIO today (days)","DIO target (days)"],"rows":[["Generics",2400,55,45],["Branded prescription",1800,60,50],["OTC and consumer health",1200,70,50],["Specialty and imported",600,100,60]],"note":"Targets come from a service-level study. Use 365 days a year."},{"id":"e2","title":"Exhibit 2: Supply terms for slow-moving SKUs","chart":"table","columns":["SKU family","Supplier origin","Lead time (days)","MOQ (days of demand)","Stock today (days of demand)"],"rows":[["Specialty imported (cold chain)","Europe and India",75,90,120],["OTC slow SKUs","Thailand and ASEAN",14,75,110],["Generic slow SKUs","Thailand",10,30,70]],"note":"Slow-moving SKUs only. MOQ is the minimum order quantity expressed as days of average demand."},{"id":"e3","title":"Exhibit 3: Supplier payment terms","chart":"table","columns":["Supplier group","Annual spend (THB m)","C
