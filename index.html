nge rate. I would start with the two-year P&L, because it shows quickly which line moved.","best":"I would start from profit equals revenue minus cost. Revenue splits into cups, price and mix. Cost splits into cost of sales, split further into beans, milk, cups and labour, and the fixed-type lines. Then I would separate external drivers, such as commodity prices, exchange rate and wages, from internal ones. My hypothesis is that price is flat and volume up, so the problem sits in cost per cup, likely imported inputs. I would first check one-offs, then the P&L, then cost per cup."},"probes":[{"ask":"Why start with the profit and loss and not with the stores?","listen":"Profit and loss shows which line moved. Stores did not change."},{"ask":"What is the difference between revenue and profit changing?","listen":"Revenue is sales. Profit is sales minus cost. Costs rose faster."},{"ask":"The CEO thinks the problem is the stores' management. Reply?","listen":"Test with data first: compare lines and check cost per cup before blaming stores."},{"ask":"What do you mean by what the client controls?","listen":"Price, recipe, supplier choice and contracts, not world prices or exchange rate."}]},{"id":"s2","title":"Where did margin go","timer":"exhibit","minutes":8,"question":"Here is the P&L for two years. What is going on? Quantify it in margin points, meaning percentage points of revenue.","notes":"Hand over Exhibit 1. Expected: revenue +10%, profit 112 to 86.8 (-22.5%), margin 14.0% to 9.9% (-4.1 points). Cost of sales rose from 40.0% to 46.5% of revenue (+6.5 points). Other lines gained 2.4 points from scale. Bonus: price flat and volume +10%, so the whole issue is cost per cup.","exhibits":["e1"],"hints":["Compute each cost line as a % of revenue for both years.","Which line moved most, in points?"],"solution":"Revenue: 800 to 880 = +10%.\nOperating profit: 112 to 86.8 = -25.2, or -22.5%.\nMargin: 112 / 800 = 14.0%. 86.8 / 880 = 9.9%. Change = -4.1 points.\nCost of sales: 320 / 800 = 40.0%. 409.2 / 880 = 46.5%. Change = +6.5 points.\nRent: 20.0% to 19.1% (-0.9 points). HQ and marketing: 15.0% to 14.1% (-0.9). Other store costs: 11.0% to 10.5% (-0.5).\nSo fixed-type costs gained 2.4 points from scale. Cost of sales lost 6.5 points. Net = -4.1 points.\nPrice was flat, so the cause is cost of sales per cup, not demand.","answers":{"standard":"Revenue grew 10% but profit fell 22.5%, from 112 to 86.8 billion dong. Margin fell from 14.0% to 9.9%, which is 4.1 points. Cost of sales went from 40.0% to 46.5% of revenue, a rise of 6.5 points. Other costs gained 2.4 points from scale.","great":"Margin fell 4.1 points, from 14.0% to 9.9%. The cause is cost of sales, up 6.5 points to 46.5% of revenue. Rent, head office and other store costs together improved by 2.4 points because they grew slower than revenue. Price was flat and cups rose 10%, so this is not a demand problem. It is cost per cup. Next I would break cost of sales into its components.","best":"Revenue is up 10%, profit down 22.5%. Margin lost 4.1 points: cost of sales added 6.5 points, partly offset by 2.4 points of scale on fixed-type lines. Price is flat, so the whole problem is cost per cup, not demand. Check: 6.5 minus 2.4 is 4.1 points. The scale benefit is real but it will not repeat if volume stops growing. I would next ask what is in cost of sales, and whether beans or milk are on a contract, because those are the lines a procurement team can act on."},"probes":[{"ask":"What does margin point mean, and what is the total change?","listen":"One percentage point of revenue. Down 4.1 points, from 14.0% to 9.9%."},{"ask":"Why did rent as a share of revenue fall?","listen":"Rent stayed about the same while revenue grew, so scale."},{"ask":"The CEO says revenue is growing, so profit will recover. Reply?","listen":"No: margin fell because cost per cup rose, and growth did not offset it."},{"ask":"Is it a demand problem or a cost problem? How do you know?","listen":"Cost. Price flat, cups up 10%, cost of sales up 6.5 points."},{"ask":"What is the one number you would highlight?","listen":"Cost of sales 40.0% to 46.5% of revenue, 6.5 points."}]},{"id":"s3","title":"Cost per cup","timer":"exhibit","minutes":9,"question":"Exhibit 2 shows the cost of one cup. Which component drives the increase, and how much profit did the increase cost in Year 2?","notes":"Hand over Exhibit 2. Expected: cost per cup 8,000 to 9,300 (+1,300, +16.3%). Beans +720 (55% of the rise, +30%), milk +400 (31%, +20%), cup +60, labour +120. Beans and milk are 86% of the rise. Profit effect: 44m cups x 1,300 = VND 57.2bn. Good candidates link this to the profit change: without it, profit would have been 144bn.","exhibits":["e2"],"hints":["Compute the change and the percentage for each component.","Multiply the change per cup by the cups sold in year 2."],"solution":"Cost per cup: 8,000 to 9,300 = +1,300 VND, or +16.3%.\nBeans: +720 (+30%). That is 720 / 1,300 = 55% of the rise.\nMilk: +400 (+20%). That is 31% of the rise.\nCups and packaging: +60 (+5%). Labour: +120 (+5%).\nBeans and milk together = 1,120 / 1,300 = 86% of the rise.\nProfit effect = 44 million cups x 1,300 = VND 57.2bn.\nThat is more than twice the VND 25.2bn fall in profit. Volume growth added VND 48bn of margin and fixed costs grew VND 16bn. Bridge: 112 + 48 - 16 - 57.2 = VND 86.8bn.\nSo input prices for beans and milk are the root cause.","answers":{"standard":"Cost per cup went from 8,000 to 9,300 dong, up 1,300 or 16%. Beans rose 720 and milk 400, together 86% of the rise. On 44 million cups, that costs 57.2 billion dong.","great":"Cost per cup is up 1,300, or 16.3%. Beans are up 720, 30% more, and are 55% of the rise. Milk is up 400, 20% more, 31% of the rise. Together they are 86%. The profit hit is 44 million cups times 1,300, which is 57.2 billion dong. That is more than twice the 25.2 billion fall in profit. Volume growth added 48 billion and fixed costs took away 16. So beans and milk are the root cause, and both are procurement topics.","best":"Cost per cup is up 16.3%. Beans and milk are 86% of that. The profit effect is 57.2 billion dong, and the bridge works: 112 plus 48 from volume, minus 16 from fixed costs, minus 57.2 from cost per cup gives 86.8. Without the cost rise, profit would have been 144 billion, up 29%. So the chain is growing well, and it lost the benefit through input cost. I would check whether the competition saw the same rise, and whether the contracts with the bean and milk suppliers have any protection. That points to procurement as the lever."},"probes":[{"ask":"Why multiply by 44 million cups and not 40 million?","listen":"Year 2 volume, since the cost rise applies to the cups actually sold."},{"ask":"Which two components matter, and why do they matter for purchasing?","listen":"Beans and milk, 86% of the rise. Both are bought from suppliers, so can be negotiated."},{"ask":"The operations head says labour is the real issue. Reply?","listen":"Labour is only +120, 9% of the rise. Beans and milk are 86%."},{"ask":"How does the 57.2 billion compare with the fall in profit of 25.2 billion?","listen":"More than twice. Growth masked it."},{"ask":"Could the cost rise be temporary?","listen":"Maybe: commodity prices may fall back, but contracts have no protection. Check market outlook."}]},{"id":"s4","title":"Beans: price or FX","timer":"math","minutes":8,"question":"Beans are imported and priced in USD. Exhibit 3 has the inputs. Split the VND 720 increase per cup into the part from the USD price and the part from the exchange rate. Tell me your method.","notes":"Hand over Exhibit 3. The method must add up exactly. Standard: price effect at old FX, then FX effect at the new price. Price effect = (6 - 5) x 24,000 x 0.02 = 480. FX effect = 6 x (26,000 - 24,000) x 0.02 = 240. Total 720. If the candidate uses price at new FX (6-5)x26,000x0.02 = 520 and FX at old price 5 x 2,000 x 0.02 = 200, also 720: accept it if they state the method. The mistake is mixing methods and leaving a cross term.","exhibits":["e3"],"hints":["Bean cost per cup = USD per kg x VND per USD x kg per cup.","Change one input at a time, and keep the order consistent."],"solution":"Bean cost per cup = USD price x FX x 0.02 kg.\nYear 1: 5.00 x 24,000 x 0.02 = VND 2,400. Year 2: 6.00 x 26,000 x 0.02 = VND 3,120. Change = VND 720.\nMethod: first change the USD price at the old exchange rate, then change the exchange rate at the new price.\nPrice effect = (6.00 - 5.00) x 24,000 x 0.02 = VND 480.\nFX effect = 6.00 x (26,000 - 24,000) x 0.02 = VND 240.\nCheck: 480 + 240 = 720.\nSo two thirds is the USD price (+20%), one third is the weak dong (+8.3%).\nIn money: 480 x 44m cups = VND 21.1bn and 240 x 44m = VND 10.6bn a year.\nThe contract has no index clause or cap, so the chain carries both fully.","answers":{"standard":"Bean cost per cup is price times exchange rate times 0.02 kilos. It rose from 2,400 to 3,120, which is 720. I change price first at the old exchange rate, which is 480. Then I change the exchange rate at the new price, which is 240. They add to 720.","great":"Bean cost per cup is dollar price times dong per dollar times 0.02 kilos. Year 1 is 2,400 and year 2 is 3,120. I change one input at a time in a fixed order. Price effect is 1 dollar times 24,000 times 0.02, which is 480. Exchange rate effect is 6 times 2,000 times 0.02, which is 240. So two thirds is the dollar price and one third the weaker dong. On 44 million cups that is 21 billion and 10.6 billion dong a year. The contract has no index and no cap.","best":"Method first: change price at the old exchange rate, then change the exchange rate at the new price. That gives 480 and 240, and it adds exactly to 720, with no leftover term. The other order gives 520 and 200, also fine if applied consistently. So price is 20% more in dollars and the dong is 8.3% weaker. On 44 million cups, 21.1 billion and 10.6 billion dong. The point for the client: the price part is a market issue, but the exchange rate part can be hedged, and the contract has no index clause or cap. I would ask whether a forward contract on dollars is possible, and what the supplier would accept in the next renewal."},"probes":[{"ask":"Why change one input at a time?","listen":"So the parts add up exactly to the total of 720."},{"ask":"What are the two effects and their sizes?","listen":"USD price 480 and exchange rate 240 dong per cup."},{"ask":"The CFO says the exchange rate is out of our hands. True?","listen":"Not fully: it can be hedged, or an index clause can share the risk."},{"ask":"What does a 480 per cup effect mean in billion dong a year?","listen":"About 21 billion, 480 times 44 million cups."},{"ask":"What would you ask the bean supplier?","listen":"An index clause with a cap, price review dates, and a hedge or fixed-rate option."}]},{"id":"s5","title":"Recommendation","timer":"recommendation","minutes":6,"question":"Give the CEO your recommendation. What should she do, in which order?","notes":"Looking for a mix: pricing, recipe and spec, procurement. Procurement: tender milk, index or hedge beans, renegotiate contract. Number: a VND 1,000 price rise (+5%) brings 44bn if volume holds, 77% of the VND 57.2bn cost hit. Good candidates mention elasticity and test in a few stores. Accept sensible numbers on other levers if stated as assumptions.","exhibits":[],"hints":["Think about price, product and purchasing.","Which lever is fastest and which needs more time?"],"solution":"See the model recommendation.","answers":{"standard":"The profit drop is a cost problem. I would do three things: raise price by about 1,000 dong, review the recipe, and fix purchasing of beans and milk. A 1,000 dong rise brings about 44 billion dong if volume holds.","great":"The drop is a cost problem, not demand. Three levers. Price: 1,000 dong, 5%, brings 44 billion, 77% of the 57 billion hit, if volume holds. Competitors went up 3% to 5%, so there is room, and I would test it in stores. Recipe: look at blend and milk portion without hurting taste. Procurement: tender milk across several dairies, and renegotiate beans with an index clause and a cap, and hedge part of the dollar need. Risks: customer loss and supplier push-back.","best":"The profit fall is entirely a cost-per-cup problem: 57 billion dong, against a 25 billion fall in profit. I would sequence the levers. First, within weeks: a test price rise of about 5% in a set of stores, since competitors moved 3% to 5%. At 5% it brings 44 billion if volume holds. Second, in one to three months: milk tender with at least two dairies, and a new bean contract with an index clause, a cap, and a partial hedge on the dollar. Third, recipe changes. Risks: price elasticity unknown, so the pilot sets the number. I would also check what share of the 57 billion is permanent: bean prices could fall back. Next step: price pilot and milk tender started this month."},"probes":[{"ask":"Why is price your first lever?","listen":"It is the fastest and biggest, 44 billion for 1,000 dong, if volume holds."},{"ask":"What is the risk of raising price?","listen":"Customers buy less. Elasticity unknown, so pilot in a few stores."},{"ask":"The CEO says no price rise, customers will leave. What do you say?","listen":"Competitors raised 3% to 5%. Do a pilot, use smaller rises on core drinks, and rely on procurement for the rest."},{"ask":"What would you do in the first month?","listen":"Price pilot, milk tender, bean contract talks."},{"ask":"What would change your plan?","listen":"Bean price falling back, high price sensitivity, supplier refusal."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Profit and loss, last two years","chart":"bar","columns":["Line","Year 1","Year 2"],"rows":[["Cups sold (million)",40,44],["Average price per cup (VND)",20000,20000],["Revenue (VND bn)",800,880],["Cost of sales (VND bn)",320,409.2],["Rent and utilities (VND bn)",160,168],["HQ and marketing (VND bn)",120,124],["Other store costs (VND bn)",88,92],["Operating profit (VND bn)",112,86.8]],"note":"Cost of sales includes beans, milk, cups and packaging, and barista labour.","series":[1,2],"rowsUsed":[2,3,4,5,6,7]},{"id":"e2","title":"Exhibit 2: Cost of sales per cup","chart":"stacked","columns":["Component","Year 1 (VND/cup)","Year 2 (VND/cup)"],"rows":[["Coffee beans",2400,3120],["Milk",2000,2400],["Cups and packaging",1200,1260],["Barista labour",2400,2520],["Total",8000,9300]],"note":"Average over all drinks. Mix is stable between the two years.","series":[1,2],"rowsUsed":[0,1,2,3],"transpose":true},{"id":"e3","title":"Exhibit 3: Coffee bean cost inputs","chart":"table","columns":["Input","Year 1","Year 2"],"rows":[["Bean price (USD/kg)",5.0,6.0],["Exchange rate (VND/USD)",24000,26000],["Beans used per cup (kg)",0.02,0.02]],"note":"Beans are bought in USD from one supplier. The contract has no index clause and no price cap."}],"recommendation":"My answer is that the profit drop is a cost problem, not a demand problem. Revenue grew 10% with flat prices, but cost of sales per cup rose 16%, from VND 8,000 to 9,300. That cost the chain VND 57 billion, more than the VND 25 billion fall in profit. Beans and milk are 86% of the rise. For beans, two thirds came from the USD price and one third from the weaker dong. I would act on three fronts. First, price: a VND 1,000 rise per cup, 5%, brings VND 44 billion if volume holds, so I would test it in a set of stores for elasticity, with smaller rises on core drinks. Second, recipe and spec: review bean blend and milk portion, and the cup size mix, without hurting taste. Third, procurement: tender the milk with at least two dairies, and renegotiate the bean contract with an index clause and a cap, and hedge part of the USD need. Risks are customer loss from price and supplier push-back. Next step: a two-week pilot on price and a milk tender.","good":["Structures profit as revenue - cost, and finds cost of sales as the driver in margin points (+6.5).","Computes cost per cup change and the 57.2bn effect.","Identifies beans and milk as 86% of the rise.","Gives a recommendation across price, spec and procurement."],"great":["Splits the bean increase into USD price (480) and FX (240) with a method that adds up exactly.","Links the bridge to profit: volume +48, fixed -16, cost per cup -57.2.","Points to the contract: no index clause, no cap, single supplier, and proposes index plus partial hedge.","Sizes the pricing lever (44bn, 77% of the hit) and names the elasticity risk."],"mistakes":["Blaming volume or price when price is flat and volume rose.","Splitting price and FX with two different bases so the parts do not add to 720.","Reporting cost of sales change in VND bn only, without margin points.","Recommending only a price rise.","Forgetting that labour and cups also rose, and ignoring the scale benefit on fixed costs."],"glossary":[{"term":"Cost of sales","meaning":"The direct cost of making what is sold: here beans, milk, cups and baristas."},{"term":"Margin points","meaning":"Percentage points of revenue. A fall from 14.0% to 9.9% is 4.1 points."},{"term":"Operating profit","meaning":"Revenue minus the running costs of the business, before interest and tax."},{"term":"Index clause","meaning":"A contract term that links the price to a published market price, so it moves up and down by a set rule."},{"term":"Hedge","meaning":"Fixing today the exchange rate or price for a future purchase, to remove the risk of change."},{"term":"Tender","meaning":"Asking several suppliers for offers and choosing among them."},{"term":"Elasticity","meaning":"How much sales fall when price rises."},{"term":"Bridge","meaning":"A step-by-step walk from last year's profit to this year's, one cause at a time."}]}]}</script>
<script>
(() => {
"use strict";
const CASES = JSON.parse(document.getElementById("case-data").textContent).cases;
const CASE = Object.fromEntries(CASES.map(c => [c.id, c]));
const DIMS = [
  ["structure", "Structure", "MECE, tailored to the client, prioritised"],
  ["math", "Math", "Set up first, correct, units, sanity check, so-what"],
  ["insight", "Insight", "Sees what the numbers mean; spots the trap"],
  ["communication", "Communication", "Answer first, signposted, concise"],
  ["client", "Client readiness", "Calm, defends with numbers, would face a CPO"]
];
const TIMER_LABEL = { structure: "Structure", math: "Math", exhibit: "Exhibit", brainstorm: "Brainstorm", recommendation: "Recommendation" };

      h("input", { type: "file", id: "imp-file", accept: "application/json,.json", hidden: true, onchange: e => { const f = e.target.files[0]; if (f) f.text().then(importHistory); } })),
    S.showRaw ? h("textarea", { id: "raw-export", readonly: true }, payload()) : null,
    h("div", { class: "field" }, h("label", { class: "label", for: "imp-text" }, "Or paste exported text"), h("textarea", { id: "imp-text", placeholder: "Paste here, then Import text" })),
    h("div", { class: "row" }, h("button", { class: "btn", onclick: () => importHistory($("#imp-text").value) }, "Import text"), msg)));

function importHistory(text) {
  let data; try { data = JSON.parse(text); } catch { S.ioMsg = "That is not a valid export. Paste the whole text, from { to }."; render(); return; }
  const list = Array.isArray(data) ? data : data && data.sessions;
  if (!Array.isArray(list)) { S.ioMsg = "No sessions found in that export."; render(); return; }
  let added = 0, skipped = 0;
  for (const s of list) {
    if (!s || typeof s.id !== "string" || !CASE[s.caseId] || !/^[A-Za-z0-9_-]{1,60}$/.test(s.id)) { skipped++; continue; }
    if (S.sessions.some(x => x.id === s.id)) { skipped++; continue; }
    createSession(Object.assign({ revealed: [], stageTimes: {}, scores: {}, comments: {} }, s)); added++;
  }
  S.sessions.sort((a, b) => b.createdAt - a.createdAt); localSave();

}
function trendChart(done) {
  const pts = done.map(s => sessionAvg(s)).map((v, i) => [i, v]).filter(p => p[1] != null);
  const W = 640, H = 200, L = 36, R = 16, T = 12, B = 28; const pw = W - L - R, ph = H - T - B;
  const x = i => L + (done.length === 1 ? pw / 2 : i / (done.length - 1) * pw); const y = v => T + ph - (v - 1) / 4 * ph;
  const ns = "http://www.w3.org/2000/svg"; const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("class", "chart"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Average score per session");
  const add = (tag, a, txt) => { const n = document.createElementNS(ns, tag); for (const k in a) n.setAttribute(k, a[k]); if (txt != null) n.textContent = txt; svg.append(n); return n; };
  [1, 2, 3, 4, 5].forEach(v => { add("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--line)" }); add("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end", "font-size": 11 }, v); });
  add("line", { x1: L, x2: W - R, y1: y(3), y2: y(3), stroke: "var(--muted)", "stroke-dasharray": "4 4" });
  if (pts.length > 1) add("polyline", { points: pts.map(p => x(p[0]) + "," + y(p[1])).join(" "), fill: "none", stroke: "var(--accent)", "stroke-width": 2.5 });
  pts.forEach((p, k) => add("circle", { cx: x(p[0]), cy: y(p[1]), r: k === pts.length - 1 ? 5 : 3.5, fill: "var(--accent)" }));
  add("text", { x: L, y: H - 6, "font-size": 11 }, "Session 1"); add("text", { x: W - R, y: H - 6, "font-size": 11, "text-anchor": "end" }, "Session " + done.length);
  return h("div", {}, svg, h("p", { class: "small muted" }, "Dashed line: 3, Consultant level."));
}

// ---------- ticking clocks (display only, no writes) ----------
function tick() {
  const r = route(); if (!["run", "watch", "show"].includes(r.name)) return;
  const s = S.sessions.find(x => x.id === r.id); if (!s) return;
  document.querySelectorAll("[data-tick]").forEach(el => {
    const k = el.dataset.tick;
    if (k === "stage") { const ms = stageElapsed(s, s.stageIdx); el.textContent = mmss(ms); el.classList.toggle("over", ms > Number(el.dataset.target)); }
    else if (k === "total") el.textContent = mmss(totalElapsed(s));
    else if (k === "pill") { const i = Number(el.dataset.i); el.textContent = mmss(stageElapsed(s, i)) + " / " + CASE[s.caseId].stages[i].minutes + ":00"; }
  });
}
setInterval(tick, 1000);

render();
initDb();
