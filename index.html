e costs USD 44,000 a year more, and gives the break-even FOB of 4.79","Answers the CFO with total cost, not landed cost: the landed view favours Shenzhen by USD 170,000, the total view favours the split by USD 132,000","Splits the ESG finding into critical and major, sets a deadline, a re-audit and a stop-order rule","Prices the second source for Basics: USD 8,800 for 20% of the volume"],"mistakes":["Comparing FOB prices only and choosing Shenzhen","Moving everything to Johor without checking the stable Basics segment","Counting lost margin on the wrong base, or forgetting that unmet demand is a lost sale, not a delay","Dropping the Shenzhen supplier at once on the audit, with no corrective plan or backup","Giving no break-even, so the CFO cannot see how sure the answer is"],"inspiredBy":{"title":"Inverto Case: FashionForward's Sourcing Shake-up","url":"https://www.preplounge.com/en/management-consulting-cases/interviewer-led/intermediate/inverto-case-fashionforwards-sourcing-shake-up-372","author":"Inverto (company case)","skills":"Landed cost per unit for a low-cost-country and a nearshore supplier including rework, the cost of forecast error (shortfall and excess), the nearshore break-even, a split by stable and volatile segment, stakeholder conflict, and ESG non-compliance at a supplier."},"glossary":[{"term":"FOB price","meaning":"The supplier's price for the goods, before shipping, duty or any other cost."},{"term":"Landed cost","meaning":"The full cost per unit once the goods have reached the client: price, freight, duty and rework."},{"term":"Nearshore","meaning":"Buying from a supplier in a nearby country, here Malaysia, instead of a far one."},{"term":"Minimum order quantity (MOQ)","meaning":"The smallest number of units a supplier will accept in one order."},{"term":"Forecast error","meaning":"The gap between what was predicted to sell and what really sold."},{"term":"Fulfilment accuracy","meaning":"The share of demand the client could actually serve from stock."},{"term":"Rework","meaning":"Fixing a defective unit before it can be sold."},{"term":"ESG","meaning":"Environmental, social and governance risk, such as unsafe or illegal work conditions at a supplier."}]},{"id":"packaging-cost-down","title":"Sari Nusantara Pangan: the 5% target","client":"PT Sari Nusantara Pangan, an Indonesian packaged-food company (biscuits, noodles, snacks) with five plants and IDR 1,200 bn of direct spend","country":"Indonesia","type":"procurement","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"The CPO wants 5% off direct spend in 12 months. Where do we look first, and is the target realistic?","prompt":"Our client is PT Sari Nusantara Pangan, an Indonesian food company. It makes biscuits, instant noodles and snacks in five plants. Direct spend is about IDR 1,200 billion a year. The new CPO has told the board she will cut direct spend by 5% in 12 months. She has asked the Inverto team to build the plan. You meet her tomorrow. We start with how you would approach this. Then we will look at the data.","clarifying":[{"q":"What is in direct spend?","a":"Raw materials, packaging, and co-packing. Everything that goes into the product. Indirect spend like logistics and IT is not in scope."},{"q":"Is the 5% measured against this year's prices or against a budget?","a":"Against this year's actual spend, at constant volume. Price increases the market forces on us do not count as savings."},{"q":"Do we have a spend cube already?","a":"Yes. Finance built one. I will show it when you ask for the data."},{"q":"Are specs the same across the five plants?","a":"For the main film, yes. Same grade, same supplier approval list. Prices are delivered prices, freight included."},{"q":"Can we change product specs, for example pack size or film thickness?","a":"Marketing has not agreed to any spec change. Treat it as a later option, not a base case."},{"q":"When do the contracts end?","a":"Most film and carton contracts end within nine months, so they can be renegotiated this year. Flour and sugar are mostly tied for two more years. (Give if asked.)"}],"structure":{"notes":"Break the 5% into levers and categories, not into functions. Good answers also separate what is addressable from what is locked, and ask how fast each lever pays.","branches":[{"name":"Size the prize","points":["Spend by category","Addressable share (contracts, regulated, single source)","Savings range per category","Gap to 5%"]},{"name":"Price levers","points":["Renegotiate and tender","Harmonise prices across plants","Bundle volume and consolidate suppliers","Index-linked terms for commodities"]},{"name":"Demand and spec levers","points":["Design to value (film gauge, carton grade)","Standardise SKUs and pack formats","Reduce waste and scrap"]},{"name":"Delivery and risk","points":["Timing of contracts, 12-month limit","Supplier risk and quality","Owner per category, tracking of savings"]}]},"stages":[{"id":"s1","title":"Structure the savings plan","timer":"structure","minutes":5,"question":"How would you structure the work to deliver a 5% reduction in direct spend in 12 months?","notes":"Give clarifying answers if asked. Listen for: split by category and lever, addressable vs non-addressable, and a view on time. Do not accept a list of generic ideas with no structure. Give the data in the next stage only when the candidate asks for spend by category.","exhibits":[],"hints":["Start from the number. What is 5% of the spend?","Which part of the spend can you actually influence in 12 months?"],"solution":"5% of IDR 1,200 bn is IDR 60 bn.\nI would build the plan in four blocks.\nFirst, size the prize. Spend by category, how much is addressable, and a savings range per category. This tells us the gap to 60 bn.\nSecond, price levers: renegotiation and tenders, price harmonisation across plants, bundling volume, and index terms for commodities.\nThird, demand and spec levers: design to value, fewer SKUs, less scrap.\nFourth, delivery: what can land in 12 months given contract dates, supplier risk, and who owns each category.\nI would start with the spend cube, because it tells us where to focus.","answers":{"standard":"Five percent of IDR 1,200 billion is IDR 60 billion. I would split the work by category and by lever. First I size the prize: spend by category, how much we can influence, and the savings range. Then price levers, then spec and demand levers, then what can land in 12 months. I would start with the spend data.","great":"The target is IDR 60 billion. I would start from the money, not the functions: spend by category, the addressable part, and a savings range for each. Then I list the levers: renegotiation, harmonising prices across plants, bundling, and design changes. I also need timing, because only contracts that end this year can move in 12 months. I would ask what is locked, since that limits the answer. Then I pick the categories with the largest savings, not the largest spend.","best":"My hypothesis is that price levers alone will not reach 60 billion, so the plan needs a second set of levers. I would size the prize in three steps: spend by category, addressable share, and a low and high saving. That gives a gap to the target. Then I rank the categories by saving, and for each give a lever, an owner and a date. The constraint is time: only contracts that expire this year can move. Another constraint is that Marketing must agree any change to the product or pack. I would also separate a number we can commit to from a stretch. I would start with the spend cube."},"probes":[{"ask":"Why start from the money and not from the departments?","listen":"Savings come from categories and levers, so spend by category shows where to look."},{"ask":"What is addressable spend?","listen":"Spend we can really change this year; not locked in contracts or regulated."},{"ask":"Why does the 12-month limit matter?","listen":"Only some contracts can be renegotiated in that time."},{"ask":"The CPO says: I promised 5%, so plan for 5%. Respond.","listen":"They agree to aim for it but say the data should show if it is reachable, and offer a commit and a stretch."}]},{"id":"s2","title":"Read the spend cube","timer":"exhibit","minutes":12,"question":"Here is the spend cube. First, what range of savings does it give in total, and how does that compare to the target? Second, which categories would you focus on first, and why?","notes":"Candidate must compute addressable spend per category, then low and high savings. The trap: wheat flour and sugar is the biggest category at 33% of spend, but it is not the biggest opportunity. Check that the candidate ranks by savings, not by spend. Savings percentages apply to the addressable spend, not to total spend. Listen for the point that price levers alone give 2.1% to 3.7%, below 5%.","exhibits":["e1"],"hints":["Multiply spend by the addressable share first. Then apply the savings range.","Rank the categories by savings in IDR, not by spend."],"solution":"Step 1. Addressable spend = spend x addressable share.\nFlour and sugar: 400 x 40% = 160 bn. Palm oil: 240 x 50% = 120 bn. Film: 200 x 90% = 180 bn. Cartons: 100 x 90% = 90 bn. Flavours: 100 x 70% = 70 bn. Co-packing: 80 x 75% = 60 bn. Labels and other: 80 x 50% = 40 bn.\nTotal addressable = 720 bn, which is 60% of 1,200 bn.\nStep 2. Savings = addressable x savings range.\nFlour and sugar: 1.6 to 4.8 bn. Palm oil: 2.4 to 4.8 bn. Film: 10.8 to 18.0 bn. Cartons: 4.5 to 7.2 bn. Flavours: 2.1 to 3.5 bn. Co-packing: 2.4 to 3.6 bn. Labels and other: 1.2 to 2.0 bn.\nStep 3. Total savings = 25.0 to 43.9 bn. Midpoint about 34.5 bn.\nAs a share of 1,200 bn: 2.1% to 3.7%.\nThe target is 60 bn. The gap is 16 to 35 bn.\nStep 4. Rank by savings. Film is first at 14.4 bn midpoint. Cartons are second at 5.9 bn. Then palm oil 3.6, flour and sugar 3.2, co-packing 3.0.\nFilm and cartons are 25% of spend (300 bn) but 59% of the midpoint savings (20.3 of 34.5 bn). Even in the low case they give 15.3 bn.\nFlour and sugar is one third of the spend but only 9% of the savings. It is mostly commodity and only 40% of it is open to renegotiation within the year.\nSo-what: start with film and cartons. And tell the CPO that price levers alone reach 2% to 4%, not 5%. The rest has to come from spec and demand levers.","answers":{"standard":"First I take the addressable spend: spend times addressable share. That totals IDR 720 billion. Then I apply the low and high savings. The total saving is IDR 25 to 44 billion, which is 2.1 to 3.7 percent of spend. The target is 60 billion, so there is a gap. Film and cartons are the biggest savings, so I start there.","great":"Savings apply only to the addressable spend, which is IDR 720 billion, 60 percent of the total. The saving is IDR 25 billion in the low case and 44 billion in the high case. That is 2.1 to 3.7 percent, short of 5 percent. Flour and sugar is the biggest category at a third of spend, but it is only 9 percent of the savings because only 40 percent is open. Film and cartons are 25 percent of spend but 59 percent of savings. So I start with film and cartons, and I tell the CPO that price levers alone will not reach 5 percent.","best":"The cube says price levers give IDR 25 to 44 billion, or 2.1 to 3.7 percent, against a 60 billion target. So the gap is 16 to 35 billion. Ranking by spend would send us to flour and sugar, but ranking by saving puts film first at about 14 billion at the midpoint, and cartons second at about 6. Together they give 15 billion even in the low case. I would check two things. First, the savings ranges are assumptions from Finance, so I would test film with a few supplier quotes. Second, the contract dates, since an addressable category is no use if the contract runs two more years. The rest of the gap must come from spec and demand levers, which Marketing must approve, so I would raise that now."},"probes":[{"ask":"Why do you not apply the savings percentage to the whole spend?","listen":"Part of the spend is locked, so the percentage only applies to the addressable part."},{"ask":"Why start with film and not flour and sugar, the biggest category?","listen":"Film has more addressable spend and a higher saving rate: biggest saving in IDR."},{"ask":"What does the 2.1 to 3.7 percent tell the CPO?","listen":"Price levers alone miss the 5 percent target."},{"ask":"The CFO disagrees: flour and sugar is a third of spend, so we must focus there. Respond.","listen":"Only 40 percent is open, savings rate is low: about 9 percent of the total savings."},{"ask":"Which of these numbers would you doubt first?","listen":"The savings ranges: they are estimates; test with quotes."}]},{"id":"s3","title":"Price differences across plants","timer":"math","minutes":10,"question":"Film is the biggest lever. Here are prices for one film item, bought by five plants. How much can we save by harmonising prices? Give a best case and a median case. How would you use these numbers?","notes":"Same grade, same specs, delivered prices (already said in clarifying). Candidate should compute gap x volume per plant. Best case = everyone pays the lowest price. Median case = only plants above the median move down to the median price (IDR 46,000). Look for: units (IDR per kg times tonnes needs x1,000), and the point that the best case is an upper bound because of freight, supplier capacity and plant location. If asked, Makassar is far from the supplier hub; Cikarang is next to the supplier plant.","exhibits":["e2"],"hints":["Saving per plant = (price - target price) x volume. Watch tonnes and kg.","Which price is the median of five plants?"],"solution":"Step 1. Total spend on this item = 50.4 + 35.2 + 18.4 + 19.2 + 10.8 = 134.0 bn. Volume is 3,000 tonnes. This is 67% of the film category.\nStep 2. Best case, everyone pays IDR 42,000 per kg.\nSurabaya: 2,000 per kg x 800,000 kg = 1.6 bn. Semarang: 4,000 x 400,000 = 1.6 bn. Medan: 6,000 x 400,000 = 2.4 bn. Makassar: 12,000 x 200,000 = 2.4 bn.\nTotal = 8.0 bn per year, 6.0% of the item spend.\nStep 3. Median case. The median price is IDR 46,000 (Semarang). Only Medan and Makassar are above it.\nMedan: 2,000 x 400,000 = 0.8 bn. Makassar: 8,000 x 200,000 = 1.6 bn.\nTotal = 2.4 bn per year, 1.8% of the item spend.\nSo the range is 2.4 to 8.0 bn on this one item. It fits inside the 10.8 to 18.0 bn range for the film category.\nSo-what: use 2.4 bn as the floor and 8.0 bn as the opening ask. The best case is a ceiling, not a forecast. Makassar and Medan pay for freight, and Cikarang is next to the supplier. I would run one group-wide negotiation on this item, with a freight-adjusted price per plant.","answers":{"standard":"For each plant I take the price gap times the volume. In the best case everyone pays IDR 42,000 per kg. That saves 8.0 billion a year. In the median case, only Medan and Makassar move down to 46,000. That saves 2.4 billion a year. I need to keep tonnes and kilos straight: 1 tonne is 1,000 kilos.","great":"This item costs IDR 134 billion a year, 67 percent of film. Best case, every plant pays Cikarang's price: Surabaya 1.6, Semarang 1.6, Medan 2.4, Makassar 2.4, so 8.0 billion or 6 percent of the item spend. Median case, only the two plants above 46,000 move: 0.8 plus 1.6, so 2.4 billion. The best case is a ceiling, since remote plants pay more freight. I would use 2.4 as the floor and 8.0 as the opening ask. I would run one group-wide negotiation.","best":"The range is IDR 2.4 to 8.0 billion on this one item, 1.8 to 6 percent of its spend. The best case assumes Makassar pays Cikarang's price, which ignores freight and the supplier's capacity, so I treat it as a ceiling. The right target is a freight-adjusted price per plant. The prices are delivered, so I would first split out freight to see how much of the gap is real. Because the same spec is used at all five plants, there is no technical reason for the gap. I would bundle the full 3,000 tonnes into one tender, which also gives us volume leverage. The risk is that moving volume to one supplier creates a dependency. So I would keep a second supplier for part of the volume."},"probes":[{"ask":"Why multiply by 1,000?","listen":"Prices are per kilo and volumes in tonnes."},{"ask":"Why is the best case not the expected saving?","listen":"Freight, supplier capacity and plant location mean the remote plants cannot get the lowest price."},{"ask":"Why is the median case smaller?","listen":"Only two plants pay above the median, and they move only to 46,000."},{"ask":"The CPO says: put 8 billion in the plan. Respond.","listen":"They resist: it is a ceiling; commit to the floor, 2.4, and use 8 as the opening ask."},{"ask":"What do you do about freight?","listen":"Ask for the freight cost per plant and negotiate a price net of freight."}]},{"id":"s4","title":"Recommendation for the CPO","timer":"recommendation","minutes":8,"question":"The CPO meeting is tomorrow. What do you tell her? Is 5% realistic, where do you start, and what are the main risks?","notes":"Look for a clear answer first, a number range, a focus on film and cartons, and an honest message on the gap. Good candidates propose a committed target and a stretch target. Do not accept 'we can do it all'.","exhibits":[],"hints":["What does the cube say about 5%?","What fills the gap if price levers do not?"],"solution":"Answer first: 5% is a stretch, about 3% is committed.\nPrice levers give 25.0 to 43.9 bn, which is 2.1% to 3.7% of 1,200 bn.\nFilm and cartons give 15.3 to 25.2 bn from 25% of the spend.\nFilm harmonisation on one item gives 2.4 bn (median) to 8.0 bn (best).\nThe rest of the gap, 16 to 35 bn, needs spec and demand levers.\nRisks: supplier capacity, freight to remote plants, contract end dates, Marketing sign-off on spec changes.","answers":{"standard":"My answer is that 5 percent is a stretch. Price levers give IDR 25 to 44 billion, which is 2.1 to 3.7 percent, against 60 billion. I would commit to about 3 percent and start with film and cartons. The risks are supplier capacity, freight for remote plants and contract dates.","great":"I would tell the CPO to commit to about 3 percent and keep 5 percent as a stretch. Price levers give IDR 25 to 44 billion. Film and cartons are 25 percent of spend but give 15 to 25 billion, so we start there. On film, harmonising one item is worth 2.4 billion at the median price, up to 8 billion at best. The remaining gap of 16 to 35 billion needs design changes that Marketing must approve. Risks are supplier capacity, freight and contract dates. Next, launch the film negotiation.","best":"Five percent is not reachable by price levers alone, so I recommend committing to about 3 percent, around IDR 36 billion, and setting 5 percent as a stretch. The honest range is 25 to 44 billion, so 3 percent sits inside it. I start with film and cartons, since they hold 59 percent of the saving and most contracts end within nine months. On film, I use 2.4 billion as the floor and 8.0 as the opening ask. To close the gap of 16 to 35 billion we need design to value on film gauge and carton grade, which Marketing has not agreed, so I would take a proposal to them within a month. The main risks are supplier capacity if we move volume, freight to remote plants and contract end dates. Next steps: launch the film negotiation, check all contract dates, and set an owner per category."},"probes":[{"ask":"In one sentence, is 5 percent realistic?","listen":"Not from price levers alone: 2.1 to 3.7 percent. It is a stretch needing spec changes."},{"ask":"Where do you start, and why?","listen":"Film and cartons: 25 percent of spend, 59 percent of savings."},{"ask":"What fills the gap if price levers fall short?","listen":"Spec and demand levers: thinner film, carton grade, fewer SKUs, less scrap. Marketing must agree."},{"ask":"The CPO says: I already told the board 5 percent. What now?","listen":"Offer a commit and a stretch, show the numbers, and agree how to report it to the board."},{"ask":"What is the biggest risk?","listen":"Any of supplier capacity, freight, contract dates, Marketing sign-off."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Direct spend cube by category","chart":"hbar","columns":["Category","Spend (IDR bn)","Addressable share (%)","Savings low (% of addressable)","Savings high (% of addressable)"],"rows":[["Wheat flour and sugar",400,40,1,3],["Palm oil and fats",240,50,2,4],["Flexible packaging film",200,90,6,10],["Corrugated cartons",100,90,5,8],["Flavours and ingredients",100,70,3,5],["Co-packing",80,75,4,6],["Labels, inks and other",80,50,3,5]],"note":"Source: client finance, last 12 months. Savings ranges apply to the addressable spend only. Total spend IDR 1,200 bn.","series":[1]},{"id":"e2","title":"Exhibit 2: One film item (BOPP 20 micron) by plant","chart":"bar","columns":["Plant","Price paid (IDR per kg)","Volume (tonnes per year)"],"rows":[["Cikarang",42000,1200],["Surabaya",44000,800],["Semarang",46000,400],["Medan",48000,400],["Makassar",54000,200]],"note":"Delivered prices, freight included. Same specification and approved supplier list at all plants. 1 tonne = 1,000 kg.","series":[1]}],"recommendation":"My answer: 5% is not reachable by price levers alone. Price levers give IDR 25 to 44 billion, which is 2.1% to 3.7% of spend. The target is 60 billion. I would start with two categories, film and cartons. They are only 25% of spend, but 59% of the savings, 15 to 25 billion. Flour and sugar is the biggest category, but only 40% of it is open this year, so it comes later. On film, harmonising one item across the five plants is worth 2.4 billion at the median price and up to 8 billion at the best price. I would use 2.4 as the floor. The risks are supplier capacity if we move volume, freight in the remote plants, and contract dates. So I would tell the CPO to commit to about 3% inside 12 months, and set 5% as a stretch that needs design to value on film gauge and carton grade, which Marketing must agree. Next steps: launch the film negotiation, check contract end dates for all categories, and bring a spec proposal to Marketing within a month.","good":["Splits the 5% by category and lever, and asks what is addressable","Applies savings percentages to addressable spend, not total spend, and gets 25 to 44 bn","Ranks by savings and picks film and cartons, not flour and sugar","Computes harmonisation as gap times volume with correct units"],"great":["Says the 5% target is not reached by price levers (2.1% to 3.7%) and proposes a committed number plus a stretch","Treats the best-price case as a ceiling and explains why (freight, capacity, plant location)","Adds spec and demand levers to close the gap, and flags the Marketing dependency","Links the plan to contract end dates and the 12-month limit"],"mistakes":["Ranking categories by spend and starting with flour and sugar","Applying the savings percentage to total spend instead of addressable spend","Mixing tonnes and kg, so the plant saving is off by a factor of 1,000","Promising the full 5% without showing where the last IDR 16 to 35 bn comes from","Using the best price as the expected saving"],"glossary":[{"term":"Direct spend","meaning":"Money spent on things that go into the product: raw materials, packaging and co-packing."},{"term":"Addressable spend","meaning":"The part of spend that can really be changed this year, not locked by contract or rules."},{"term":"Spend cube","meaning":"A table that shows spend by category, supplier and plant."},{"term":"Harmonising prices","meaning":"Getting all plants to pay the same price for the same item."},{"term":"BOPP film","meaning":"A plastic wrapping film used for biscuit and snack packs."},{"term":"Design to value","meaning":"Changing a product or pack, for example a thinner film, to cut cost without hurting what the customer values."},{"term":"Co-packing","meaning":"Paying an outside factory to make or pack some products for you."},{"term":"Delivered price","meaning":"A price that already includes freight to the plant."}]},{"id":"steel-price-increase","title":"Kessler-Rauh Maschinenbau: the 14% letter","client":"Kessler-Rauh Maschinenbau GmbH, a family-owned machinery maker in Baden-Wuerttemberg with about EUR 300m revenue","country":"Germany","type":"procurement","difficulty":"Advanced","format":"Interviewer-led","minutes":45,"summary":"A key supplier of machined steel parts announces a 14% price increase. How much is justified, and how do we respond?","prompt":"Our client is Kessler-Rauh Maschinenbau, a family-owned machinery maker in southern Germany. It buys machined steel parts from Lindner Praezisionsteile, a supplier near Stuttgart. Spend with Lindner is EUR 12 million a year. Last month Lindner sent a letter. It wants a 14% price increase from the next quarter, citing steel, energy and wages. The owner and the head of purchasing want to know if this is fair and what to do. Prices were last reset two years ago. We are on the Inverto team and meet them on Thursday.","clarifying":[{"q":"Is there a price clause in the contract?","a":"No. Prices are fixed, reset by negotiation. The last reset was two years ago. The contract runs another two years."},{"q":"Do we have a cost breakdown of Lindner's price?","a":"Yes, from the last negotiation. It is in the exhibit. Lindner's open-book audit right allows us to check it."},{"q":"How important are these parts for us?","a":"They go into three machine families, about 40% of our revenue. A stop in supply would stop assembly within three weeks."},{"q":"How big is Lindner, and how much do we matter to them?","a":"Lindner has about EUR 40m revenue. We are 30% of it. Give this if asked, it is also in the second exhibit."},{"q":"Are the drawings ours or theirs?","a":"Ours. We own the drawings. The tooling is partly Lindner's, partly ours."},{"q":"Is a works council involved?","a":"No. Not relevant for this decision."}],"structure":{"notes":"Three questions: is the increase justified (cost drivers vs indices), what are our alternatives (our best option if talks fail, and switching), and how do we respond (negotiation plan, contract terms). Strong candidates start with facts before position.","branches":[{"name":"Is it justified?","points":["Cost breakdown of the price","Index movement per cost block since last reset","Compare computed increase with the 14% ask","Margin and open-book check"]},{"name":"What are our alternatives?","points":["Other suppliers, price and location","Switching cost and qualification time","How much we matter to Lindner","Dependency and risk of stopping assembly"]},{"name":"How do we respond?","points":["Accept the justified part, reject the rest","Index clause, two-way","What we can trade (volume, term, payment, forecast)","Timeline, who talks to whom"]}]},"stages":[{"id":"s1","title":"Structure the response","timer":"structure","minutes":5,"question":"How would you approach this for Thursday's meeting with the owner and the head of purchasing?","notes":"Listen for: check facts before negotiating, compare ask to cost drivers, understand leverage both ways, and think about contract terms, not only the price. Give clarifying answers as asked.","exhibits":[],"hints":["What would you want to know before you answer Lindner?","Who has more leverage, and does that change over time?"],"solution":"Three questions.\nFirst, is the increase justified? Take Lindner's cost structure, look at how steel, energy and labour moved since the last reset, and compute what the price should be. Compare with 14%.\nSecond, what are our alternatives? Other suppliers, their price, what it costs to switch and how long qualification takes. And how much we matter to Lindner, because that is our leverage.\nThird, the response. Accept what is justified, reject the rest, and fix the way prices change in the future with an index clause. And decide what we can offer in return.\nI would start with the cost facts.","answers":{"standard":"I would ask three questions. First, is the 14 percent justified, based on Lindner's costs and how steel, energy and wages moved. Second, what are our alternatives and how much do we matter to Lindner. Third, how do we respond, including what to offer and how to set prices in future. I would start with the cost facts.","great":"Before we answer Lindner, we need to know if 14 percent is fair, so I would compute the increase from the cost structure and index moves. Then I would check leverage on both sides: other suppliers, switching cost and time, and our share of Lindner's revenue. The response is to accept what is justified, reject the rest and change how prices move in future. I would also check the contract, since it fixes prices, and ask how critical the parts are. I would start with the cost facts.","best":"The key point is to separate fact from position. First I test the claim against the cost drivers. Then I map leverage both ways, which means alternatives, switching time and our share of their revenue. Then I design the response, which is not just a number, but a mechanism such as an index formula and a trade. I would also check contract terms, because they decide whether Lindner has any right to raise prices at all. The parts matter a lot, since a stop would halt assembly in three weeks, so switching has to be planned, not a threat. I would ask for the cost breakdown and index data first."},"probes":[{"ask":"Why not just negotiate the number down?","listen":"Without facts you have no argument; compute what the costs justify first."},{"ask":"What does leverage mean here?","listen":"How much each side needs the other: our alternatives and their dependence on our orders."},{"ask":"What would you ask about the contract?","listen":"Whether prices are fixed and for how long; Lindner may have no right to raise them now."},{"ask":"The owner says: Lindner is a local partner, just pay. Respond.","listen":"They respect the relationship but check the numbers; paying double the justified amount is EUR 0.84 million a year too much."}]},{"id":"s2","title":"How much is justified?","timer":"math","minutes":12,"question":"Here is Lindner's price structure and the index moves since the last reset. How large is the justified increase in percent? What does the 14% ask cost us per year, and how big is the gap?","notes":"Justified increase = sum of (cost share x index change). Use the 'now' column, not the six-month-ago column. Look for: the candidate multiplies share by change and does not take a simple average of the four moves. The steel index fell from 115 six months ago to 108 now. Lindner's letter probably used the peak. Candidate should mention it and link it to a two-way clause. Overhead and margin only moves with general inflation.","exhibits":["e1"],"hints":["Weight each index move by its share in the price.","Convert the gap in percent to EUR using the EUR 12m spend."],"solution":"Step 1. Increase per block = share of price x index change since last reset.\nSteel: 40% x 8% = 3.2 points.\nEnergy: 10% x 10% = 1.0 point.\nLabour: 30% x 8% = 2.4 points.\nOverhead and margin: 20% x 2% = 0.4 points.\nStep 2. Justified increase = 3.2 + 1.0 + 2.4 + 0.4 = 7.0%.\nStep 3. In EUR on EUR 12m of spend.\nJustified: 12.0 x 7.0% = EUR 0.84m a year.\nAsk: 12.0 x 14% = EUR 1.68m a year.\nGap: 1.68 - 0.84 = EUR 0.84m a year, 7 points. The ask is twice what the cost drivers support.\nStep 4. Look at the trend. The steel index was 115 six months ago and is 108 now. At 115, steel would have added 6.0 points, not 3.2. If Lindner priced steel at the peak, that alone explains 2.8 points of the gap.\nSo-what: some increase is fair. About 7%, EUR 0.84m. The other half is not supported. And because steel is falling, we should not lock a fixed 7% for two years.","answers":{"standard":"I multiply each cost share by its index move. Steel is 40 percent times 8, so 3.2 points. Energy is 1.0, labour 2.4 and overhead 0.4. The total is 7.0 percent. On EUR 12 million that is EUR 0.84 million a year. The 14 percent ask is EUR 1.68 million, so the gap is EUR 0.84 million.","great":"The justified increase is 7.0 percent, the sum of share times change: 3.2 plus 1.0 plus 2.4 plus 0.4. That is EUR 0.84 million a year, and the ask is double at EUR 1.68 million. The gap is 0.84 million. I use the current index, not the peak. Steel was 115 six months ago and is 108 now. At the peak, steel would add 6.0 points instead of 3.2, so if Lindner priced steel at the peak, that explains 2.8 points of the gap. Some increase is fair, but half of the ask is not.","best":"Seven percent is justified, so the ask of 14 is twice the cost drivers, a gap of EUR 0.84 million a year. I weight by cost share and do not average the moves, since steel counts more than overhead. The steel index has fallen from 115 to 108, so a fixed 7 percent would lock in a price that steel is already moving below. Therefore, the right answer is a formula that moves both ways, not a flat percentage. Each point of increase is worth EUR 0.12 million a year, which is useful in the room. The cost shares are two years old, so I would use the open-book right to check them. If Lindner's labour share is higher now, the justified number moves."},"probes":[{"ask":"Why not average the four moves?","listen":"Steel is 40 percent of price and overhead only 20; averaging would give the wrong weight."},{"ask":"Why use the index now and not six months ago?","listen":"Steel has come down since the peak; the current cost is what counts."},{"ask":"What does the gap mean in money?","listen":"EUR 0.84 million a year: 1.68 minus 0.84."},{"ask":"The supplier says: steel was 115 when we calculated. Respond.","listen":"Then they priced at the peak; at today's 108 steel adds 3.2 points, not 6.0, so about 2.8 points of the ask come from the peak."},{"ask":"What would you check about the data?","listen":"The cost shares are two years old; use the open-book right."}]},{"id":"s3","title":"Our alternatives","timer":"exhibit","minutes":13,"question":"Now the alternatives. For each, how long until we recover the switching cost if Lindner holds to 14%? And if we agree the justified increase? What does this tell you about our leverage?","notes":"The alternative price is relative to Lindner's price today. Saving = (Lindner new increase - alternative price premium) x EUR 12m. Payback in months = switching cost / annual saving x 12. At the ask all three pay back in about 6 to 8 months, at the justified increase only Poland and Czechia are reasonable (18 and 20 months), and Germany takes 50 months. Qualification is 6 to 12 months, so the threat is real but slow. The break-even increase for Poland at a 24-month payback is 5.75%: above that, switching pays within two years. Mertens can take only half the volume, so the figures for Germany assume full volume and it is at best a partial fix. Also point out that Lindner does 30% of its revenue with us. Give the Lindner revenue of EUR 40m if asked.","exhibits":["e2"],"hints":["Saving per year is the difference between Lindner's new price and the alternative, on EUR 12m.","Payback = switching cost divided by yearly saving."],"solution":"Step 1. Annual saving vs Lindner = (increase - alternative premium) x EUR 12m.\nPoland (+2%): at 14%: 12% x 12 = EUR 1.44m. At 7%: 5% x 12 = EUR 0.60m.\nCzechia (+4%): at 14%: 10% x 12 = EUR 1.20m. At 7%: 3% x 12 = EUR 0.36m.\nGermany (+6%): at 14%: 8% x 12 = EUR 0.96m. At 7%: 1% x 12 = EUR 0.12m.\nStep 2. Payback = switching cost / saving.\nIf Lindner holds to 14%:\nPoland: 0.9 / 1.44 = 0.63 years, 7.5 months.\nCzechia: 0.6 / 1.20 = 0.5 years, 6 months.\nGermany: 0.5 / 0.96 = 0.52 years, about 6 months.\nIf we accept 7%:\nPoland: 0.9 / 0.60 = 1.5 years, 18 months.\nCzechia: 0.6 / 0.36 = 1.7 years, 20 months.\nGermany: 0.5 / 0.12 = 4.2 years, 50 months.\nStep 3. Break-even for Poland at a 24-month payback: saving needed = 0.9 / 2 = EUR 0.45m a year = 3.75% of spend. So the increase must exceed 2% + 3.75% = 5.75%.\nNote: Mertens has capacity for only half our volume, so its figures assume a full move and it can only be a partial fix.\nStep 4. Leverage. We are 30% of Lindner's revenue: 12 / 40. Losing us would cost them EUR 12m of EUR 40m. Their ask would be a high-risk move.\nSo-what: at 14% the switch clearly pays, so the ask is not credible if we show we have a plan. At 7% the switch is marginal, 18 to 20 months. Qualification takes 9 to 12 months, so we cannot leave tomorrow. We should start qualifying one alternative now as insurance.","answers":{"standard":"I take the saving as the new Lindner increase minus the alternative's premium, times EUR 12 million, and payback as switching cost over saving. At 14 percent, Poland pays back in 7.5 months, Czechia in 6 and Germany in about 6. At 7 percent, Poland takes 18 months, Czechia 20 and Germany 50. So switching is attractive at 14 but marginal at 7. Qualification takes 9 to 12 months.","great":"At 14 percent all three alternatives pay back in 6 to 8 months, so the ask is not credible if we have a plan. At 7 percent, Poland is 18 months and Czechia 20, so switching is marginal, and Germany at 50 months is not worth it. Qualification takes 9 to 12 months, so we cannot leave tomorrow. On the other side, we are 30 percent of Lindner's revenue, so losing us would cost them EUR 12 million of 40 million. So we have real leverage, but it works as insurance, not as a quick exit. I would start qualifying Poland now.","best":"The break-even helps: Poland pays back within 24 months whenever Lindner's increase is above 5.75 percent. So 7 percent is just above the line, and 14 is far above. That is why the 7 percent is the natural settlement. Our leverage is two-sided: Lindner needs us for 30 percent of revenue, but we cannot switch for 9 to 12 months and a stop would halt assembly in three weeks. So I would not threaten to leave. I would show a credible qualification plan. Germany is quick to qualify but has capacity for half the volume, so I would treat it as a partial backup. I would check Poland's capacity, quality record and the currency exposure."},"probes":[{"ask":"What does payback tell us about leverage?","listen":"At 14 percent switching pays in under a year, so Lindner's ask is risky for Lindner."},{"ask":"Why do we not just leave if it pays back so quickly?","listen":"Qualification takes 9 to 12 months and a supply stop halts assembly in three weeks."},{"ask":"What does 30 percent of Lindner's revenue mean for us?","listen":"They depend on us: losing us costs EUR 12 million of 40; strong leverage."},{"ask":"The head of purchasing says: Germany is quickest, so go there. Respond.","listen":"Germany has capacity for half the volume only, and at 7 percent pays back in 50 months."},{"ask":"At what increase does Poland pay back within two years?","listen":"Above 5.75 percent."}]},{"id":"s4","title":"Negotiation plan and recommendation","timer":"recommendation","minutes":15,"question":"Thursday's meeting: what do you recommend we do? What do we offer Lindner, what do we ask, and what is the fallback?","notes":"Look for: accept the justified part but through a formula, not a fixed number; two-way index clause (steel, energy, labour); trade volume and term; open-book check; start qualification of a second supplier in parallel; a clear walk-away. Check that the candidate quantifies the position (EUR 0.84m justified vs EUR 1.68m ask, EUR 0.84m gap). A good candidate also thinks about relationship, since Lindner is a local mid-size firm and we are 30% of its revenue. Also listen for the contract: prices are fixed for two more years with no clause, so Lindner has no right to raise the price now. Any increase is a deal we choose to give in return for something.","exhibits":[],"hints":["What can you give Lindner that costs you little?","How do you make sure the price also falls when steel falls?"],"solution":"Position: accept about 7%, reject 14%, and change the mechanism. The contract fixes prices for two more years and has no price clause, so Lindner has no right to raise the price. We give a fair step as a trade, not because we must.\nJustified: EUR 0.84m a year. Ask: EUR 1.68m. Gap: EUR 0.84m a year.\nWe offer: a 3-year volume commitment, a rolling 6-month forecast, and faster payment if we get a lower price.\nWe ask: price from a formula: 40% steel, 10% energy, 30% labour, 20% fixed, reviewed each quarter, up and down, with a collar so neither side moves more than a few points a year. Open-book check on the cost breakdown.\nFallback: qualify the Polish supplier now (EUR 0.9m, 12 months). It is insurance and a credible threat.\nWalk-away: if Lindner insists on more than the formula gives, we move part of the volume.","answers":{"standard":"I would accept about 7 percent, not 14. That is EUR 0.84 million a year against 1.68. We offer a longer volume commitment and a rolling forecast. We ask for a price formula that follows steel, energy and labour both up and down. As a fallback, we start qualifying the Polish supplier now.","great":"I recommend accepting about 7 percent, EUR 0.84 million, and rejecting the other 0.84 million. The contract fixes prices for two more years, so we owe nothing, but a fair step in exchange for a formula is worth it. We offer a three-year volume commitment and a rolling forecast. We ask for a quarterly formula on steel, energy and labour, two-way, with an open-book check. Steel has fallen from 115 to 108, so a flat 7 percent would not follow it down. Fallback: qualify Poland now for EUR 0.9 million. Risks are a supply stop and the relationship.","best":"My position is to accept about 7 percent through a formula, not as a fixed number. The contract gives us the right to hold prices for two more years, so the increase is a trade: we give a fair step and volume, they give a two-way formula, an open-book check and a cap on yearly moves. Each point is EUR 0.12 million a year, so I can show the value of every concession. The fallback is the Polish supplier, which costs EUR 0.9 million and takes 12 months, so it is insurance rather than a threat. I would agree the walk-away with the owner before Thursday: for example, if Lindner insists on more than the formula gives, we move part of the volume once Poland is qualified. I would also keep the tone fair. Lindner is a local firm and we are 30 percent of its revenue, so a fair deal lasts longer."},"probes":[{"ask":"In one sentence, what do you tell Lindner?","listen":"We accept about 7 percent through a two-way formula, not 14."},{"ask":"What do we offer and what do we ask?","listen":"Offer volume commitment, forecast, faster payment; ask for formula and open-book check."},{"ask":"Why a formula and not a fixed 7 percent?","listen":"Steel is already falling; a fixed price would not follow it down."},{"ask":"The owner asks: what if Lindner refuses and stops delivering? Respond.","listen":"Supply risk is real: assembly stops in three weeks, so start Poland qualification now and plan safety stock."},{"ask":"What is the fallback?","listen":"Qualify the Polish supplier, EUR 0.9 million, 12 months; move part of volume if needed."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Lindner price structure and index moves","chart":"bar","columns":["Cost block","Share of Lindner's price (%)","Index at last price reset","Index 6 months ago","Index now"],"rows":[["Steel (hot-rolled bar index)",40,100,115,108],["Energy (industrial electricity and gas)",10,100,108,110],["Labour (metalworking wage agreement)",30,100,105,108],["Overhead and margin (general inflation)",20,100,101,102]],"note":"Cost shares from the last open-book review two years ago. Indices are public. All blocks are indexed to 100 at the last price reset. Lindner's price today is the base.","series":[2,3,4],"yMin":90},{"id":"e2","title":"Exhibit 2: Alternative suppliers for the same parts","chart":"table","columns":["Supplier (location)","Landed price vs Lindner today (%)","One-off switching cost (EUR m)","Qualification time (months)","Capacity for our volume"],"rows":[["Kowalski Precision (Poland)",2,0.9,12,"Yes"],["Zlin Machining (Czechia)",4,0.6,9,"Yes"],["Mertens Zerspanung (Germany)",6,0.5,6,"Half of the volume"]],"note":"Landed price includes freight and no customs duty (EU). Switching cost = tooling transfer, first-article tests, and project time. Our annual spend with Lindner: EUR 12m. Lindner annual revenue: about EUR 40m."}],"recommendation":"My recommendation: accept about 7%, not 14%, and put the price on a formula. The contract fixes prices for two more years, so we owe nothing, but a fair step in return for a formula is worth it. The cost drivers support 7.0%: steel 3.2 points, energy 1.0, labour 2.4, overhead 0.4. That is EUR 0.84 million a year. The 14% ask is EUR 1.68 million, so the gap is EUR 0.84 million a year. Our leverage is real. We are 30% of Lindner's revenue. At 14%, Poland pays back in 7.5 months. At 7% it is 18 months, so the switch is marginal, and Poland needs 12 months to qualify. So I would not threaten to leave. I would show we have a plan. We offer a three-year volume commitment and a rolling forecast. We ask for an index formula with steel, energy and labour, two-way, reviewed each quarter. That matters because steel is already down from 115 to 108, and a fixed 7% would not follow it down. Fallback: start qualifying the Polish supplier now, about EUR 0.9 million. Risks: supply stop for three weeks of assembly, and damage to a local relationship. Next steps: confirm the cost breakdown with an open-book check, draft the formula, and agree the walk-away with the owner before Thursday.","good":["Computes the justified increase as share times index change (7.0%) and compares it with 14%","Converts to EUR: EUR 0.84m justified, EUR 1.68m ask, EUR 0.84m gap per year","Calculates payback for each alternative at both price levels","Recommends accepting the justified part and rejecting the rest"],"great":["Notices steel fell from 115 to 108 and that a fixed increase will not follow it down, so proposes a two-way index clause","Uses the 30% share of Lindner's revenue as leverage but says qualification takes 9 to 12 months, so the BATNA is slow","Gives a break-even (Poland pays back in 24 months above a 5.75% increase)","Offers a trade (volume, term, forecast) instead of only pushing on price, and names a walk-away"],"mistakes":["Averaging the four index moves without weighting by cost share","Using the six-month-old steel index and getting 9.8% instead of 7.0%","Comparing the alternatives with today's price and not the new price","Threatening to leave with no word on qualification time and supply risk","Giving a flat 7% and forgetting the formula, so the client pays if steel falls"],"glossary":[{"term":"Index (price index)","meaning":"A published number that tracks a market price over time, set to 100 at a starting date."},{"term":"Index clause","meaning":"A contract term that moves the price up and down with agreed indices, in a set formula."},{"term":"Open-book check","meaning":"The right to look at the supplier's real cost breakdown to test its price."},{"term":"Landed price","meaning":"The price including freight and any duty, delivered to our plant."},{"term":"Switching cost","meaning":"One-off cost of moving production to another supplier, such as tooling transfer and tests."},{"term":"Payback","meaning":"The months of saving needed to earn back the switching cost."},{"term":"Qualification","meaning":"The testing and approval a new supplier must pass before it can ship parts."},{"term":"Collar","meaning":"A cap and a floor on how far a price formula can move in a period."}]},{"id":"delivery-cost-tiers","title":"Chilled yoghurt delivery cost (Doi Fresh Dairy)","client":"Doi Fresh Dairy Co., Ltd., a Thai maker of chilled yoghurt that delivers from one plant to three retail distribution centres.","country":"Thailand","type":"supply chain","difficulty":"Beginner","format":"Interviewer-led","minutes":30,"summary":"How much can a dairy cut its delivery cost to three customer centres by changing frequency and truck type?","prompt":"Doi Fresh Dairy makes chilled yoghurt in Saraburi, Thailand. It delivers to three retailer distribution centres: Bangkok, Chonburi and Khon Kaen. A third-party carrier does all deliveries and charges a fixed fee per delivery plus a rate per pallet. Distribution cost has risen, and the supply chain director wants to know how much she can save. Volumes are higher for ten weeks a year around festivals. You are on the Inverto team and she wants a first answer tomorrow. Let's start with how you would structure this.","clarifying":[{"q":"How is the carrier's price built?","a":"A fixed fee per delivery that depends on the destination, plus a rate per pallet that depends on how many pallets are on that delivery. Exhibit 1 has the numbers."},{"q":"How many pallets fit on a truck?","a":"Twenty pallets. (Give if asked.)"},{"q":"How long is the yoghurt's shelf life?","a":"21 days. Retailers reject anything with fewer than 14 days left on arrival. Plant to door takes less than two days, so this is not a constraint on frequency. The constraint is cold-room space at the customer. (Give if asked.)"},{"q":"Do we have our own trucks?","a":"No. Doi Fresh has an offer to lease one truck with a driver. Show Exhibit 4 only when the candidate asks about owning or leasing."},{"q":"Can the customers accept fewer, bigger deliveries?","a":"Yes, within the cold-room limit. Show Exhibit 3 only if the candidate asks about customer constraints."}],"structure":{"notes":"A good candidate splits cost into the number of deliveries and the cost per delivery, and then looks at frequency, load size, truck type and seasonality, with the customer's storage limit as a constraint.","branches":[{"name":"Current cost","points":["Fixed fee per delivery","Rate per pallet by tier","Normal weeks vs peak weeks"]},{"name":"Frequency and load","points":["Fewer, fuller deliveries","Truck capacity","Customer cold-room limit"]},{"name":"Truck type","points":["Third-party vs leased truck","Fixed vs variable cost","Use across the year"]},{"name":"Constraints","points":["Shelf life","Service level at customers","Peaks"]}]},"stages":[{"id":"s1","title":"Structure the question","timer":"structure","minutes":4,"question":"How would you structure the work to find savings on delivery cost? What do you want to know?","notes":"Interviewer-led. Listen for: cost = number of deliveries x cost per delivery; levers on frequency, load and truck; seasonality; constraints. Do not give numbers yet.","exhibits":[],"hints":["How is the carrier's price built?","Which levers change the number of deliveries?"],"solution":"I would split cost into the number of deliveries and the cost per delivery.\nFirst, the baseline: what we pay today in normal weeks and in the ten peak weeks.\nSecond, levers: fewer and fuller deliveries, which moves us into cheaper pallet tiers and saves fixed fees.\nThird, truck type: third-party against a leased truck, which is a fixed cost.\nFourth, constraints: shelf life, how much the customer can store, and truck capacity, especially at the peak.","answers":{"standard":"I would split cost into number of deliveries times cost per delivery. I need today's cost in normal and peak weeks. Then I look at fewer, fuller deliveries and a leased truck, within the limits on shelf life and customer storage.","great":"Cost is deliveries times cost per delivery, and each delivery has a fixed fee plus a rate per pallet. So fewer, fuller deliveries should save fixed fees and may reach a cheaper rate tier. I would first get the baseline for normal and peak weeks. Then I test frequency, then a leased truck, which is a fixed cost. The limits are shelf life, customer cold-room space and truck size, especially in the peak.","best":"I would build the baseline first: price structure, volumes and deliveries, for normal and peak weeks, because peaks are ten of fifty-two weeks. The levers are frequency, load size to reach cheaper pallet rates, and truck type. I expect most of the saving from the first one. The limits I want to know early: the customers' storage, shelf life and truck capacity. I would also ask how the carrier would react if we cut its delivery count, since that may change the tariff."},"probes":[{"ask":"Why start with how the price is built?","listen":"The price has a fixed part per delivery and a rate per pallet, so the number of deliveries and loads matter."},{"ask":"What are the main ways to cut the cost?","listen":"Fewer fuller deliveries, truck type, handling peaks differently."},{"ask":"The director says just ask the carrier for a discount. Reply?","listen":"A discount helps but is small; delivery frequency and load size are in our control."},{"ask":"Which limits do you want to check?","listen":"Customer storage, shelf life, truck size."}]},{"id":"s2","title":"Current distribution cost","timer":"math","minutes":7,"question":"Here are the carrier's prices and the current volumes and deliveries. What does Doi Fresh pay in a normal week, in a peak week, and in a year?","notes":"Hand over Exhibits 1 and 2. Expected: per delivery = fixed fee + rate x pallets. Bangkok 60 pallets / 6 = 10 per delivery, rate 420: 1,500 + 4,200 = 5,700 x 6 = 34,200. Chonburi 30 / 3 = 10, rate 420: 2,500 + 4,200 = 6,700 x 3 = 20,100. Khon Kaen 18 / 3 = 6, rate 500: 4,000 + 3,000 = 7,000 x 3 = 21,000. Normal week = THB 75,300. Peak week (+50%, same deliveries): Bangkok 15 pallets, rate 360: 6,900 x 6 = 41,400. Chonburi 15 pallets: 7,900 x 3 = 23,700. Khon Kaen 9 pallets, rate 420: 7,780 x 3 = 23,340. Peak week = THB 88,440. Annual = 42 x 75,300 + 10 x 88,440 = THB 4.047m. Rate is for all pallets on the delivery, not just the pallets above a tier.","exhibits":["e1","e2"],"hints":["Find the pallets per delivery first, then the tier rate.","The rate applies to every pallet on that delivery."],"solution":"Cost per delivery = fixed fee + rate x pallets on that delivery.\nNormal week:\nBangkok: 60 / 6 = 10 pallets, rate 420. 1,500 + 4,200 = THB 5,700 x 6 = THB 34,200.\nChonburi: 30 / 3 = 10 pallets, rate 420. 2,500 + 4,200 = THB 6,700 x 3 = THB 20,100.\nKhon Kaen: 18 / 3 = 6 pallets, rate 500. 4,000 + 3,000 = THB 7,000 x 3 = THB 21,000.\nNormal week = 34,200 + 20,100 + 21,000 = THB 75,300.\nPeak week, same deliveries: pallets rise 50%. Bangkok 15 pallets, rate 360: 6,900 x 6 = 41,400. Chonburi 15 pallets: 7,900 x 3 = 23,700. Khon Kaen 9 pallets, rate 420: 7,780 x 3 = 23,340. Peak week = THB 88,440.\nAnnual = 42 x 75,300 + 10 x 88,440 = 3,162,600 + 884,400 = THB 4.047m.\nSo today's cost is about THB 4.05m a year. Note that pallets rise 50% in peak weeks, but cost rises only 17%, because loads are fuller.","answers":{"standard":"Each delivery costs fixed fee plus rate times pallets. A normal week is 75,300 baht and a peak week is 88,440. A year is 42 normal weeks plus 10 peak weeks, which is about 4.05 million baht.","great":"Per delivery: fixed fee plus rate times all pallets on it. Bangkok has 10 pallets a delivery at 420, so 5,700, times 6 is 34,200. Chonburi is 6,700 times 3, 20,100. Khon Kaen has 6 pallets at 500, so 7,000 times 3, 21,000. Normal week 75,300. Peak week has 50% more pallets and fuller loads, so 88,440, only 17% more. Annual is 42 times 75,300 plus 10 times 88,440, 4.047 million baht.","best":"Normal week 75,300 baht, peak week 88,440, year 4.047 million baht. The rate applies to every pallet on the delivery, so it is fixed fee plus rate times pallets, not a step-up above a threshold. Volume rises 50% in peaks, but cost only 17%, as loads fill and reach a cheaper tier. Sanity check: 108 pallets a normal week gives about 700 baht per pallet. That already says fuller loads are cheaper per pallet, which is where I would look for savings."},"probes":[{"ask":"What is the cost of one delivery to Bangkok, and how do you get it?","listen":"5,700 baht: 1,500 plus 10 pallets times 420."},{"ask":"Does the rate apply to all pallets or only the extra ones?","listen":"All pallets on the delivery."},{"ask":"Why does cost rise only 17% when pallets rise 50% in the peak?","listen":"Fuller loads reach cheaper rates, and fixed fees stay the same."},{"ask":"The director says peak weeks do not matter, only 10 weeks. Reply?","listen":"They are about 22% of annual cost: 884,400 of 4.047 million."},{"ask":"How would you check your yearly number?","listen":"Normal 42 weeks times 75,300 plus peak 10 weeks times 88,440."}]},{"id":"s3","title":"Fewer, fuller deliveries","timer":"math","minutes":8,"question":"Which frequency would you use at each location in a normal week? Work out the new weekly cost and the saving.","notes":"Hand over Exhibit 3 when they ask about customer limits; otherwise give it after two minutes. Minimum deliveries per week = 7 / days of cover, rounded up: Bangkok 7 / 2 = 3.5 so 4; Chonburi 7 / 4 = 1.75 so 2; Khon Kaen 2. Trap: cutting Bangkok to 2 deliveries, which would be 30 pallets, above a 20-pallet truck, and breaks the 2-day cover. New normal week: Bangkok 4 x 15 pallets, 6,900 x 4 = 27,600. Chonburi 2 x 15, 7,900 x 2 = 15,800. Khon Kaen 2 x 9, 7,780 x 2 = 15,560. Total 58,960. Saving = 75,300 - 58,960 = THB 16,340 a week = 21.7%.","exhibits":["e3"],"hints":["How many deliveries a week does each customer's cold room allow at minimum?","Check the new load per delivery against the 20-pallet truck."],"solution":"Minimum deliveries a week = 7 days / days of cover, rounded up.\nBangkok: 7 / 2 = 3.5, so 4. Chonburi: 7 / 4 = 1.75, so 2. Khon Kaen: 2.\nNew normal week:\nBangkok: 4 deliveries x 15 pallets, rate 360. 1,500 + 5,400 = 6,900 x 4 = THB 27,600.\nChonburi: 2 x 15 pallets, rate 360. 2,500 + 5,400 = 7,900 x 2 = THB 15,800.\nKhon Kaen: 2 x 9 pallets, rate 420. 4,000 + 3,780 = 7,780 x 2 = THB 15,560.\nTotal = THB 58,960 against 75,300.\nSaving = THB 16,340 a week, or 21.7%.\nTwo things drive it: fewer fixed fees, and fuller loads that reach the 360 tier. Bangkok cannot go below 4 a week: two deliveries would be 30 pallets, more than a truck holds.","answers":{"standard":"Minimum deliveries are Bangkok 4, Chonburi 2 and Khon Kaen 2, set by customer storage. The new normal week costs 58,960 baht against 75,300. The saving is 16,340 a week, about 22%.","great":"Seven days divided by days of cover, rounded up: Bangkok 4, Chonburi 2, Khon Kaen 2. Bangkok cannot go to 2, because that would be 30 pallets, more than a 20-pallet truck, and over its 2-day storage. New cost is 27,600 plus 15,800 plus 15,560, which is 58,960. Saving is 16,340 a week, 21.7%. It comes from fewer fixed fees and from reaching the 360 baht rate.","best":"The storage limit sets the minimum: 4, 2 and 2 deliveries. Going below breaks storage, and for Bangkok the truck as well. At those frequencies each load reaches the cheapest rate tier at Bangkok and Chonburi, so I do not need to check more options. New weekly cost 58,960, saving 16,340, 21.7%. Weekly saving over 42 weeks is about 686,000 baht. Before committing I would confirm the cold-room cover with each customer, since the whole saving depends on it, and ask whether the carrier will keep the tariff at the lower delivery count."},"probes":[{"ask":"Why can Bangkok not go to two deliveries a week?","listen":"Thirty pallets a delivery is over a 20-pallet truck, and over its two days of storage."},{"ask":"How do you get the minimum deliveries per week?","listen":"7 days divided by days of cover, rounded up."},{"ask":"The retailer says it could stretch storage. What would that change?","listen":"Fewer deliveries possible, more saving, but must be confirmed in writing."},{"ask":"Where does the saving come from?","listen":"Fewer fixed fees and cheaper rate tier."},{"ask":"What is the weekly saving and the percentage?","listen":"16,340 baht, 21.7%."}]},{"id":"s4","title":"Peaks and a leased truck","timer":"exhibit","minutes":8,"question":"Now look at the ten peak weeks and at the leased truck offer. What do you do in the peak, and does the lease pay?","notes":"Hand over Exhibit 4. Peak plan: Bangkok 90 pallets; 4 deliveries would be 22.5 per truck, too many, so 5 x 18 pallets: 1,500 + 6,480 = 7,980 x 5 = 39,900. Chonburi 45 pallets; 2 would be 22.5, too many, so 3 x 15: 7,900 x 3 = 23,700. Khon Kaen 27 pallets, 2 x 13.5 (14 and 13), rate 360: 4,000 + 4,860 = 8,860 x 2 = 17,720. Peak week = 81,320 against 88,440 today. Annual new plan = 42 x 58,960 + 10 x 81,320 = 2,476,320 + 813,200 = THB 3.290m. Saving = THB 757,480, 18.7%. Lease on Bangkok only: third party Bangkok costs 27,600 normal, 39,900 peak = 1,558,200 a year. Leased: 24,000 + 1,000 x 4 = 28,000 normal; 24,000 + 1,000 x 5 = 29,000 peak = 1,466,000. Saving THB 92,200 a year. It loses THB 400 a week in normal weeks and wins THB 10,900 in peak weeks. Total saving = 757,480 + 92,200 = THB 849,680 = 21.0% of 4.047m.","exhibits":["e4"],"hints":["Check pallets per truck at the peak: do they stay under 20?","A leased truck is a fixed cost. Compare it with the third-party cost of the same deliveries."],"solution":"Peak week, pallets are 50% higher, so the truck limit matters.\nBangkok: 90 pallets. Four deliveries would be 22.5 each, too many. So 5 x 18 pallets: 1,500 + 6,480 = 7,980 x 5 = THB 39,900.\nChonburi: 45 pallets. Two would be 22.5, so 3 x 15: 7,900 x 3 = THB 23,700.\nKhon Kaen: 27 pallets, 2 x 13.5 pallets, rate 360: 4,000 + 4,860 = 8,860 x 2 = THB 17,720.\nPeak week = THB 81,320 against 88,440 today.\nAnnual cost with the new frequencies = 42 x 58,960 + 10 x 81,320 = 2,476,320 + 813,200 = THB 3.290m.\nSaving = 4.047m - 3.290m = THB 757,480, or 18.7%.\nLeased truck on Bangkok: leased = 24,000 + 1,000 per delivery. Normal week 28,000 against 27,600 third-party, so it loses THB 400. Peak week 29,000 against 39,900, so it wins THB 10,900.\nAnnual: third-party 1,558,200 against leased 1,466,000. Saving THB 92,200.\nTotal saving = 757,480 + 92,200 = THB 849,680, which is 21.0% of current cost.\nThe lease only pays because of the peak. In normal weeks it is a break-even at about four deliveries a week.","answers":{"standard":"In the peak, trucks would be over 20 pallets at the normal frequency, so Bangkok needs 5 deliveries and Chonburi 3. Peak week then costs 81,320. The yearly saving is 757,480 baht. The leased truck adds 92,200, so 849,680 in total, 21%.","great":"Peak plan: Bangkok 5 deliveries of 18, Chonburi 3 of 15, Khon Kaen 2 of 13.5. Peak week is 81,320 against 88,440. Annual cost is 3.29 million, saving 757,480. The lease on Bangkok loses 400 in a normal week but wins 10,900 in a peak week. Over a year it saves 92,200 baht. So the total saving is 849,680, 21% of today's cost. The lease pays only because of the peak.","best":"Peak: 5, 3 and 2 deliveries, weekly cost 81,320, annual 3.29 million, saving 757,480 or 18.7%. Lease: 24,000 a week plus 1,000 a delivery. Normal week 28,000 against 27,600 carrier, so a small loss. Peak 29,000 against 39,900. Annual saving 92,200 baht. Break-even is about four deliveries a week, so it is a thin case in normal weeks, and it rests on the peak. Risks: the 52-week lease term and driver availability. Next step: ask the carrier for a counter-offer at five Bangkok deliveries a week in the peak, which might beat the lease."},"probes":[{"ask":"Why do peak weeks need more deliveries than normal weeks?","listen":"Truck holds 20 pallets. Four Bangkok deliveries would be 22.5 pallets each."},{"ask":"Why does the lease only pay in the peak?","listen":"It is a fixed weekly cost, so it loses a little when volume is normal and wins when volume is high."},{"ask":"The CFO says leasing is a risk for 92,200 baht a year. Is it worth it?","listen":"Thin case, fixed 52-week commitment. A counter-offer from the carrier may beat it."},{"ask":"What is the total saving and how is it built?","listen":"849,680 baht, 21%: 757,480 plus 92,200."},{"ask":"What would you check about the lease before signing?","listen":"Term, driver and backup, what if volume falls."}]},{"id":"s5","title":"Recommendation","timer":"recommendation","minutes":3,"question":"Give the director your recommendation in under a minute.","notes":"Look for: the saving as a number and a percentage of current cost, what drives it, the constraint, and next steps. Good risks: customers' cold-room limit, service level, truck lease lock-in, carrier reaction.","exhibits":[],"hints":["Lead with the percentage saving.","Name the one thing that limits how far you can go."],"solution":"We can cut distribution cost by about 21%, or THB 0.85m a year from THB 4.05m.\nMost of it, THB 0.76m, comes from fewer and fuller deliveries: Bangkok from 6 to 4 a week, Chonburi and Khon Kaen from 3 to 2. This saves fixed fees and moves us into the 360 rate tier.\nThe rest, THB 0.09m, comes from leasing one truck for Bangkok, which pays only because of the ten peak weeks.\nThe limit is the customers' cold rooms: Bangkok holds two days of stock, so it cannot go below four deliveries a week.\nNext steps: confirm the cold-room limits with each retailer, check the truck lease term, and ask the carrier for a new tariff based on the lower delivery count.","answers":{"standard":"We can cut delivery cost about 21%, or 0.85 million baht a year from 4.05 million. Most comes from fewer, fuller deliveries. The rest comes from leasing a truck for Bangkok. Customer storage limits how far we can go.","great":"Cut about 21%, 0.85 million baht a year. 0.76 million comes from fewer, fuller deliveries: Bangkok six to four a week, the others three to two. 0.09 million from leasing one Bangkok truck, which pays only because of the ten peak weeks. The limit is the cold rooms: Bangkok holds two days. Next: confirm limits with retailers, check the lease terms, and ask the carrier for a new tariff.","best":"My answer is 21% off, 0.85 million baht a year out of 4.05 million. Fewer, fuller deliveries give 0.76 million, with the lease adding only 0.09 million, and that part is thin: it breaks even in normal weeks, so I treat it as optional. The main risk is customers' cold rooms and service: a late delivery costs more than the saving. Also the carrier may change its tariff. Next steps this week: call the three retailers about storage, ask the carrier for a quote at the new frequencies, and decide on the lease once I see that quote."},"probes":[{"ask":"What is your answer in one sentence?","listen":"About 21% saving, 0.85 million baht a year."},{"ask":"What limits the saving?","listen":"Customers' cold-room storage, Bangkok at two days."},{"ask":"The retailers refuse fewer deliveries. What is left?","listen":"Peak plan, lease, tariff talks. The saving would be much lower."},{"ask":"What are your next steps?","listen":"Check storage with retailers, check lease, ask the carrier for a new tariff."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Carrier tariff","chart":"table","columns":["Charge","Destination or pallets on the delivery","THB"],"rows":[["Fixed fee per delivery","Bangkok",1500],["Fixed fee per delivery","Chonburi",2500],["Fixed fee per delivery","Khon Kaen",4000],["Rate per pallet","1 to 6 pallets",500],["Rate per pallet","7 to 12 pallets",420],["Rate per pallet","13 to 20 pallets",360]],"note":"The fixed fee depends on the destination. The pallet rate depends on the number of pallets on the delivery and applies to all pallets on it. It is the same for every destination. Maximum 20 pallets per truck."},{"id":"e2","title":"Exhibit 2: Weekly volume and current deliveries","chart":"bar","columns":["Destination","Normal week (pallets)","Peak week (pallets)","Deliveries per week today"],"rows":[["Bangkok",60,90,6],["Chonburi",30,45,3],["Khon Kaen",18,27,3]],"note":"A year has 42 normal weeks and 10 peak weeks. Deliveries per week are the same in peak weeks today.","series":[1,2]},{"id":"e3","title":"Exhibit 3: Customer cold-room limits","chart":"table","columns":["Destination","Cold-room cover (days of sales)"],"rows":[["Bangkok",2],["Chonburi",4],["Khon Kaen",4]],"note":"Maximum stock a customer can hold. Sales happen seven days a week. Deliveries should be spaced so stock does not exceed cover."},{"id":"e4","title":"Exhibit 4: Leased truck offer","chart":"table","columns":["Item","Value"],"rows":[["Fixed cost per week, truck and driver (THB)",24000],["Variable cost per delivery, fuel and tolls (THB)",1000],["Capacity (pallets)",20],["Lease term","52 weeks a year"]],"note":"One truck can make up to five Bangkok deliveries a week. The truck is used on Bangkok only. All other deliveries stay with the carrier."}],"recommendation":"We can cut distribution cost by about 21%, or THB 0.85m a year from THB 4.05m. THB 0.76m comes from fewer, fuller deliveries: Bangkok from six to four a week, Chonburi and Khon Kaen from three to two. That saves fixed fees and moves loads into the 360 rate tier. THB 0.09m comes from leasing one truck for Bangkok, which only pays because of the ten peak weeks. The limit is the customers' cold rooms: Bangkok holds two days of stock, so it cannot go below four a week. Risks are service level and lease lock-in. Next steps: confirm cold-room limits with each retailer, check the lease term, and ask the carrier for a new tariff.","good":["Builds cost as fixed fee plus rate times pallets, and gets THB 75,300 for a normal week","Uses fewer, fuller deliveries and gets a saving near 21% in a normal week","Respects the customer storage limit and the 20-pallet truck limit","Handles the peak weeks separately"],"great":["Annualises with 42 normal and 10 peak weeks and states the saving as a percentage of current cost","Shows the lease is a fixed cost that only pays because of the peak","Names the trap: Bangkok at two deliveries a week breaks both the truck and the cold room","Suggests next steps: check cold rooms, lease term, new tariff"],"mistakes":["Applying the tier rate only to pallets above the tier threshold","Cutting Bangkok to two deliveries a week without checking truck size or cold-room cover","Using normal-week volumes for the whole year and ignoring the peak","Comparing the lease with the carrier on one week only","Giving a saving in THB without a percentage of current cost"],"inspiredBy":{"title":"Disguise distribution","url":"https://www.preplounge.com/en/management-consulting-cases/candidate-led/beginner/disguise-distribution-15","author":"PrepLounge","skills":"Outbound delivery cost with a fixed fee per delivery and volume tiers, leased vs third-party trucks, seasonal peaks, delivery frequency and load consolidation, savings as % of current cost, storage and shelf-life constraint."},"glossary":[{"term":"Fixed fee per delivery","meaning":"A set charge for each delivery, whatever the load."},{"term":"Rate per pallet (tier)","meaning":"A price per pallet that falls as more pallets are on the delivery. It applies to all pallets on it."},{"term":"Pallet","meaning":"A standard platform with goods stacked on it, the unit for moving goods."},{"term":"Chilled","meaning":"Kept cold during storage and transport, here yoghurt."},{"term":"Cold-room cover","meaning":"How many days of sales a customer's cold store can hold."},{"term":"Third-party carrier","meaning":"An outside transport company that delivers for the client."},{"term":"Lease","meaning":"Renting a truck with driver for a fixed weekly fee."},{"term":"Peak weeks","meaning":"The ten weeks a year around festivals when volume is higher."}]},{"id":"pharma-inventory-cash","title":"Cash from inventory (Siam Medica)","client":"Siam Medica Distribution Co., Ltd., a Thai pharmaceutical distributor to hospitals and pharmacies.","country":"Thailand","type":"supply chain","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"The CFO wants THB cash released from inventory and supplier terms.","prompt":"Siam Medica distributes medicines and health products to hospitals and pharmacies in Thailand. Cost of goods sold is about THB 6 billion a year. Bank credit is getting more expensive. The CFO wants to release at least THB 300 million of cash within 12 months, without hurting service to hospitals. You are on the Inverto team and you meet the CFO tomorrow. We will go step by step. First, how would you structure the problem?","clarifying":[{"q":"Is the CFO's target a cash number or a profit number?","a":"Cash. THB 300 million within 12 months."},{"q":"What are annual purchases compared with cost of goods sold?","a":"About the same: THB 6 billion. Use purchases = COGS. (Give if asked.)"},{"q":"How are the DIO targets set?","a":"By product group, from a service-level study. They protect hospital fill rate. (Give if asked.)"},{"q":"What is the cost of funds?","a":"8% a year. All inventory costs including storage and expiry are 12% of inventory value a year. (Give if asked.)"},{"q":"Do we have any limits on shelf life or cold chain?","a":"Yes. Specialty products are cold chain with 18 to 24 months of shelf life. Over-stock risks expiry."},{"q":"What about money owed to us by hospitals?","a":"Hospitals pay in about 60 days and the CFO wants receivables left out of this plan. (Give if asked.)"},{"q":"How would suppliers react if we ask for longer payment terms?","a":"Some may ask for a price rise to compensate, around 1%. (Give if asked.)"}],"structure":{"notes":"A good structure uses cash conversion: DIO, DPO, DSO, with levers for each. It also asks what can be done without hurting service, and separates one-off cash from yearly profit.","branches":[{"name":"Inventory (DIO)","points":["Gap vs target by product group","Why stock is high: MOQ, lead time, forecast, slow SKUs","Levers: order policy, SKU cut, returns to supplier"]},{"name":"Payables (DPO)","points":["Current terms vs market","Which suppliers can move","Counter-risk: price increase, supply priority"]},{"name":"Receivables (DSO)","points":["Hospital payment delays","Collection and early-pay discounts"]},{"name":"Constraints","points":["Hospital fill rate","Expiry and cold chain","Supplier relationships"]}]},"stages":[{"id":"s1","title":"Structure the problem","timer":"structure","minutes":6,"question":"How would you structure the problem of releasing cash for the CFO?","notes":"Listen for working capital split into DIO, DPO, DSO with levers, plus constraints (service, expiry). Accept a clear structure that is not exactly this one. Mention that the first priority will be to size each lever. Then move to Exhibit 1.","exhibits":[],"hints":["Cash is tied up in three places. What are they?","Think about what the CFO cannot sacrifice."],"solution":"Cash tied up = inventory + receivables - payables.\nSo three levers: DIO (days of inventory), DSO (days of receivables), DPO (days of payables).\nFor each, I size the gap vs a target, then look at the causes and the levers.\nConstraints: hospital fill rate, expiry and cold chain, supplier relationships.\nI would start with inventory and payables, because Siam Medica is a distributor and the cost of goods is large. Receivables depend on hospitals and are harder to change.","answers":{"standard":"Cash is tied up in three places: stock, money owed to us, and money we owe suppliers. So I would look at days of inventory, days of receivables and days of payables. For each I size the gap to a target, find the cause and list levers. The limits are hospital service, expiry and supplier relations. I would start with stock and payables.","great":"The CFO wants THB 300 million of cash, so I would use the working capital view: inventory plus receivables minus payables. I would size each part, starting with inventory and supplier terms, since we are a distributor with large purchases. Receivables depend on hospitals and are harder to move. I would keep one-off cash separate from yearly profit, since the CFO's goal is cash. The constraints are the hospital fill rate and expiry on cold chain products.","best":"There are three levers, stock, payables and receivables, and one hard constraint: service to hospitals. I want to size each one against a target and rank them by cash and by risk. Stock is probably the largest, payables the fastest, and receivables the hardest. I would then separate one-off cash from yearly profit, because lower stock also cuts storage and expiry cost. A cash target of 300 million in 12 months is a big share of annual purchases, so I want to check the plan has some buffer above 300. I would ask whether the stock targets are fixed, since they set how much is excess. I would begin with stock by product group."},"probes":[{"ask":"What does the CFO's cash come from?","listen":"Less stock, longer supplier payment terms, or faster collection from customers."},{"ask":"What must the CFO not sacrifice?","listen":"Service to hospitals: stock must be there when ordered."},{"ask":"Is the cash a yearly saving?","listen":"No. It is released once; only the cost of holding it repeats."},{"ask":"The CFO says: just cut stock everywhere by 10 percent. Respond.","listen":"They resist: cut where it is above target and where service allows; products differ in expiry and fill rate."}]},{"id":"s2","title":"How much cash is in excess stock","timer":"exhibit","minutes":9,"question":"Here is DIO by product group against target. How much cash is tied up in stock above target? Show me the calculation.","notes":"Hand over Exhibit 1. Expected method: (DIO - target) x COGS / 365 per group, then sum. Total about THB 247m. Three groups give THB 65.75m each, which is a good check. If the candidate uses 360 days, accept it but ask them to state it. Watch for people using total COGS with an average DIO.","exhibits":["e1"],"hints":["One day of stock for a group costs its COGS divided by 365.","Do the calculation per group, then add."],"solution":"Cash per day of stock = COGS / 365.\nGenerics: 2,400 / 365 = THB 6.575m per day x 10 days over = THB 65.75m.\nBranded prescription: 1,800 / 365 = 4.932 x 10 = THB 49.32m.\nOTC and consumer health: 1,200 / 365 = 3.288 x 20 = THB 65.75m.\nSpecialty and imported: 600 / 365 = 1.644 x 40 = THB 65.75m.\nTotal excess stock = 65.75 + 49.32 + 65.75 + 65.75 = THB 246.6m.\nSo stock alone gets us to 82% of the CFO's THB 300m target. The gap is THB 53.4m.\nSpecialty is only 10% of COGS but a quarter of the excess cash.","answers":{"standard":"For each group I take days above target times COGS divided by 365. Generics is 10 days times 6.575, so 65.75 million. Branded is 49.3 million, OTC 65.75 million and specialty 65.75 million. The total is about THB 247 million. That is around 82 percent of the CFO's target.","great":"One day of stock costs COGS divided by 365. For generics that is 2,400 over 365, about 6.6 million, times 10 days over target, so 65.75 million. Branded is 49.3. OTC is 3.29 times 20, which is 65.75. Specialty is 1.64 times 40, again 65.75. Total THB 246.6 million. Specialty is only 10 percent of COGS but over a quarter of the excess. Stock alone reaches 82 percent of the target, so we need about THB 53 million more.","best":"Excess stock is THB 246.6 million, so 82 percent of the target, and I would work out the gap of 53 million that has to come from elsewhere. I do the calculation by group, because a single average days figure would hide that specialty is 40 days over. Specialty and OTC are the priorities: they hold 40 and 20 days of excess on small COGS. I would check that the targets are right, since they come from a service study, and I would not release stock in specialty faster than expiry and fill rate allow. Next I want to know why stock is high, so I would look at supplier terms."},"probes":[{"ask":"Why do you calculate by group and not once for the whole company?","listen":"Groups have different COGS and different excess days; an average hides it."},{"ask":"What does one day of stock mean in money?","listen":"COGS divided by 365: for generics about THB 6.6 million."},{"ask":"Which group stands out?","listen":"Specialty: only 10 percent of COGS but a quarter of the excess, because it is 40 days over."},{"ask":"The CFO says: THB 247 million in 12 months is
