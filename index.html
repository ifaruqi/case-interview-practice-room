 easy, just sell the stock. Respond.","listen":"Selling down must respect fill rate and expiry; it takes time and has a limit."}]},{"id":"s3","title":"Why is stock high","timer":"exhibit","minutes":8,"question":"Here are supplier lead times and minimum order quantities for the slow-moving SKUs. What does it tell you about why stock is high, and which levers would you use?","notes":"Hand over Exhibit 2. Do not push a number first. Listen for: for OTC, order size (MOQ) drives stock more than lead time; for generics the MOQ is small, so the issue is forecasting and too many slow SKUs; specialty has both a long lead time and a large MOQ. Levers: renegotiate MOQ, share orders across SKUs, pool orders, consignment, SKU rationalisation, return or sell down. Counter-risk: expiry and fill rate. Optional math: cutting specialty MOQ from 90 to 45 days lowers average cycle stock by half the change, 22.5 days.","exhibits":["e2"],"hints":["Compare the MOQ column with the stock days column.","If the supplier forces a big order, what happens to average stock?"],"solution":"Stock days are close to MOQ plus a buffer. Average cycle stock is about half the MOQ, and the rest is safety stock and slow sales.\nOTC slow SKUs: lead time is only 14 days, but MOQ is 75 days. The order size, not the lead time, drives stock.\nGeneric slow SKUs: MOQ is 30 days, but stock is 70 days. Here the issue is forecasting and too many slow SKUs.\nSpecialty: lead time 75 days and MOQ 90 days. Both are high and the supplier is overseas.\nLevers: renegotiate MOQ or allow mixed orders, cut slow SKUs or sell them down, improve forecast for generics, consignment for specialty.\nExample: specialty MOQ 90 to 45 days cuts average cycle stock by 22.5 days. At THB 1.644m per day this is THB 37.0m, which is 56% of the specialty gap.\nRisk: expiry on specialty and fill rate if we cut too much.","answers":{"standard":"For OTC the lead time is only 14 days but the minimum order is 75 days, so order size drives stock. For generic slow items the minimum is 30 days but stock is 70, so forecast and too many slow items are the problem. Specialty has a long lead time and a big minimum order. I would renegotiate minimum orders and cut slow items.","great":"The stock in each family is higher than the minimum order, so I look at what drives the extra. For OTC the lead time is short, so the 75-day minimum order is the cause. For generics the minimum order is small, so the issue is forecasting and too many slow items. For specialty both are high and the supplier is overseas. Levers are mixed orders, a lower minimum, consignment for specialty and selling down the slow items. Cutting specialty minimum from 90 to 45 days saves 22.5 days, about THB 37 million. The risk is expiry on cold chain products.","best":"Different families have different causes, so they need different levers. OTC is a minimum order problem, generics a forecast and range problem, and specialty both. For specialty, halving the minimum order from 90 to 45 days cuts about 22.5 days of average stock, worth THB 37 million, which is 56 percent of its excess. That is the biggest single lever I can see. The trade-off is the supplier will want a higher unit price or a fee for smaller orders. I would check that against the saving. I would also check expiry: with 18 to 24 months of shelf life and 120 days of stock, we are not close to expiry, but we should not go up in volume. I would test each lever against fill rate before committing."},"probes":[{"ask":"Why does it matter whether stock follows minimum order or lead time?","listen":"It points to a different lever: order size versus planning."},{"ask":"What would you do about generics?","listen":"Better forecasting and cut slow items; the minimum order is already small."},{"ask":"What is the risk of cutting minimum orders?","listen":"Supplier may charge more, or fill rate may drop."},{"ask":"The procurement head disagrees: suppliers will never accept smaller orders. Respond.","listen":"Trade something: pooled orders, longer contract, firm forecast, or consignment."},{"ask":"Why is specialty special?","listen":"Overseas, long lead time, large minimum order, cold chain with limited shelf life."}]},{"id":"s4","title":"Payment terms lever","timer":"math","minutes":9,"question":"The CFO also asks about longer payment terms. Exhibit 3 shows suppliers by group. The plan is to move the top 30 local suppliers from 45 to 60 days. How much cash does that release, and what is the risk?","notes":"Hand over Exhibit 3. Expected: cash = spend / 365 x days = 3,000 / 365 x 15 = THB 123.3m. Brand owners are fixed by global contract. Small suppliers are already at 60 days. Then ask about the risk. Give if asked: cost of funds 8%, and a supplier could respond with a 1% price rise. Break-even price rise is 0.33%.","exhibits":["e3"],"hints":["Cash from extending terms = annual spend / 365 x extra days.","Only the groups that actually change count."],"solution":"Only the top 30 local suppliers change.\nSpend per day = 3,000 / 365 = THB 8.22m.\nExtra days = 60 - 45 = 15.\nCash released = 8.22 x 15 = THB 123.3m.\nCheck: weighted DPO goes from 42.5 to 50 days. 6,000 / 365 x 7.5 = THB 123.3m.\nThe value is one-off: the supplier funds this once. Interest saved at 8% is 123.3 x 8% = THB 9.9m a year.\nRisk: suppliers push back with a price rise. A 1% rise on THB 3,000m costs THB 30m a year, three times the benefit. The break-even is 9.9 / 3,000 = 0.33%. So extend terms only where we can hold price, and trade it for something such as faster payment on a fixed date or volume.\nAlso supply priority: in a shortage, we do not want to be the late payer.","answers":{"standard":"Only the top 30 local suppliers change, from 45 to 60 days. That is 3,000 divided by 365, about 8.2 million a day, times 15 days. So we release about THB 123 million. The risk is that suppliers ask for a higher price.","great":"The top 30 local suppliers spend THB 3,000 million a year, so 8.2 million a day, and 15 more days releases THB 123 million. Brand owners are fixed by global contracts and small suppliers are already at 60 days, so nothing changes there. As a check, average payment days go from 42.5 to 50, and 7.5 days of THB 6,000 million purchases is the same 123. The interest saved at 8 percent is about THB 10 million a year. If suppliers push a 1 percent price rise, that costs THB 30 million, so we must not give up price for terms.","best":"The cash is THB 123 million, one-off, and the yearly benefit is only about THB 10 million of interest at 8 percent. That sets a break-even: a price rise of more than 0.33 percent on those suppliers wipes out the benefit. So I would only extend terms where we can hold price, and I would offer something in exchange, such as paying on a fixed date. The second risk is supply priority: if we pay late, we may be last in line in a shortage. I would also check the legal limit for payment terms. I would start with the largest suppliers by spend and with the ones where we already have a strong position."},"probes":[{"ask":"Why do only some suppliers count?","listen":"Brand owners are fixed by contract; small suppliers are already at 60 days."},{"ask":"Why is the cash a one-off?","listen":"Longer terms release money once; after that payments simply move later by the same days."},{"ask":"What is the break-even price rise?","listen":"0.33 percent: interest saving of 9.9 over spend of 3,000."},{"ask":"The CFO disagrees: suppliers will accept, just do it. Respond.","listen":"Price rises or lower supply priority can cost more than the interest saved; test it supplier by supplier."},{"ask":"How do you check your 123 million?","listen":"Weighted days go from 42.5 to 50; 7.5 days of 6,000 gives the same."}]},{"id":"s5","title":"Recommendation","timer":"recommendation","minutes":6,"question":"The CFO asks: what will we release, and what will it do for profit? Give me your recommendation.","notes":"Looking for: one-off cash vs yearly profit kept separate. Holding cost saving at 12% of released stock = 29.6m. Combined cash 369.9m; yearly profit about 39.5m (29.6 + 9.9). Trap: saying THB 370m a year. Also expect phasing, service guard rails and what could fail.","exhibits":[],"hints":["Which numbers happen once, and which repeat every year?","The P&L effect uses the holding cost percentage, not the cash itself."],"solution":"One-off cash: excess stock THB 246.6m + payment terms THB 123.3m = THB 369.9m. This beats the THB 300m target.\nYearly profit: holding cost saving = 246.6 x 12% = THB 29.6m. Interest saved on longer terms = 123.3 x 8% = THB 9.9m. Total = THB 39.5m a year.\nThe cash is a one-off release. It is not a yearly saving.\nReceivables are not in this plan; the CFO has left them for a later phase.","answers":{"standard":"We can release about THB 370 million in cash in 12 months, which is above the CFO's 300 million target. That is 247 million from stock and 123 million from payment terms. It is a one-off, not a yearly saving. The yearly profit effect is about THB 40 million.","great":"My answer is THB 370 million of cash in 12 months, above the 300 million target. Stock gives 247 million and longer terms give 123 million. The cash is a one-off. The yearly profit is about THB 40 million: 30 million of holding cost saved at 12 percent, and 10 million of interest at 8 percent. Risks are expiry and fill rate on specialty, and suppliers asking for higher prices. Next steps: start with minimum order talks on OTC and specialty, set service guard rails and trade terms for firm payment dates.","best":"We can release THB 370 million in 12 months against a 300 million target, which gives about 70 million of buffer. Stock gives 247 million and supplier terms 123. Without terms, stock alone leaves a 53 million gap, so the terms lever matters. The cash is one-off. The repeating benefit is about THB 40 million a year: 30 million holding cost and 10 million interest. The terms lever breaks even at a price rise of 0.33 percent, so I would watch price on every supplier. I would phase it, starting with the big specialty and OTC orders where one talk moves a lot of cash, and with a fill-rate limit that stops the programme if service drops. Receivables are not in this plan and could be a second phase."},"probes":[{"ask":"What is the one thing the CFO should remember?","listen":"About THB 370 million of one-off cash, which is more than 300; yearly profit effect only about 40 million."},{"ask":"Is THB 370 million a yearly saving?","listen":"No. It is released once."},{"ask":"How do you get from cash to yearly profit?","listen":"Holding cost 12 percent on stock released and 8 percent interest on terms cash: 29.6 plus 9.9."},{"ask":"What could make you miss the target?","listen":"Service limits on stock, suppliers refusing or raising prices, expiry."},{"ask":"What would you do first?","listen":"Minimum order talks for OTC and specialty, and set fill-rate guard rails."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Days inventory outstanding by product group","chart":"bar","columns":["Product group","COGS (THB m/year)","DIO today (days)","DIO target (days)"],"rows":[["Generics",2400,55,45],["Branded prescription",1800,60,50],["OTC and consumer health",1200,70,50],["Specialty and imported",600,100,60]],"note":"Targets come from a service-level study. Use 365 days a year.","series":[2,3]},{"id":"e2","title":"Exhibit 2: Supply terms for slow-moving SKUs","chart":"table","columns":["SKU family","Supplier origin","Lead time (days)","MOQ (days of demand)","Stock today (days of demand)"],"rows":[["Specialty imported (cold chain)","Europe and India",75,90,120],["OTC slow SKUs","Thailand and ASEAN",14,75,110],["Generic slow SKUs","Thailand",10,30,70]],"note":"Slow-moving SKUs only. MOQ is the minimum order quantity expressed as days of average demand."},{"id":"e3","title":"Exhibit 3: Supplier payment terms","chart":"bar","columns":["Supplier group","Annual spend (THB m)","Current terms (days)","Proposed terms (days)"],"rows":[["Top 30 local suppliers",3000,45,60],["Brand owners and multinationals",2000,30,30],["Small local suppliers",1000,60,60]],"note":"Brand owner terms are fixed by global contracts. Small suppliers already have 60 days.","series":[2,3]}],"recommendation":"My answer is that we can release about THB 370 million in cash in 12 months, above the CFO's THB 300 million, but it is a one-off. Stock above target is worth THB 247 million. Stock is the biggest block, and order size is the main driver: MOQ is pushing up OTC and specialty stock. Extending terms for the top 30 local suppliers from 45 to 60 days adds THB 123 million. For profit, the effect is much smaller: holding cost at 12% on THB 247 million is THB 30 million a year, plus THB 10 million of interest on the longer terms, so about THB 40 million a year. The cash does not repeat. Risks are expiry and fill rate on specialty, and suppliers asking for higher prices. I would break-even test every extension: a price rise above 0.33% kills the payables lever. Next steps: start with MOQ talks on OTC and specialty, set fill-rate guard rails, and trade terms for firm payment dates.","good":["Builds the cash conversion structure: DIO, DPO, DSO, with levers.","Calculates excess stock per group as days over target x COGS / 365 and gets THB 247m.","Uses MOQ and lead time to explain why stock is high.","Computes DPO cash as spend / 365 x days = THB 123m."],"great":["Notes that the cash is one-off and converts it to yearly profit using the holding cost percentage (THB 30m + THB 10m).","Names the break-even price rise (0.33%) that kills the payment terms lever.","Links levers to risk: expiry on cold chain, fill rate, supplier priority in shortages.","Checks DPO with the weighted average: 42.5 to 50 days."],"mistakes":["Calling THB 370m a yearly saving.","Using total COGS with the weighted average DIO and missing group differences.","Extending terms for all suppliers, including those fixed by global contract.","Using months or 12 where the exhibit is in days, or mixing 360 and 365 without saying.","Cutting stock without checking fill rate and expiry."],"inspiredBy":{"title":"Working Capital & Cash Flow Interview Questions Set","url":"https://www.preplounge.com/en/management-consulting-cases/interviewer-led/intermediate/working-capital-cash-flow-interview-questions-set-399","author":"PrepLounge","skills":"Working capital: DIO, DPO and the cash conversion cycle, cash released vs yearly P&L effect, and the supplier cost of longer terms."},"glossary":[{"term":"COGS","meaning":"Cost of goods sold: what the company paid for the products it sold in the year."},{"term":"DIO, DPO, DSO","meaning":"Days of stock held, days we take to pay suppliers, and days customers take to pay us."},{"term":"Working capital","meaning":"Cash tied up in stock and money owed to us, less money we owe suppliers."},{"term":"MOQ","meaning":"Minimum order quantity: the smallest order a supplier accepts."},{"term":"SKU","meaning":"One distinct product item, for example one pack size of one medicine."},{"term":"Fill rate","meaning":"The share of hospital orders delivered complete and on time."},{"term":"Consignment","meaning":"Stock sits at our warehouse but belongs to the supplier until we sell it."},{"term":"Cold chain","meaning":"Products that must be kept cold all the way, which limits shelf life and stock size."}]},{"id":"dc-network-consolidation","title":"Closing a DC (Selatan Minuman)","client":"Selatan Minuman Sdn Bhd, a Malaysian beverage distributor with three distribution centres.","country":"Malaysia","type":"supply chain","difficulty":"Intermediate","format":"Candidate-led","minutes":45,"summary":"Should the distributor close its Penang DC, given a 3-year payback hurdle?","prompt":"Selatan Minuman is a beverage distributor in Malaysia. It runs three distribution centres: Klang Valley, Penang and Johor. The CFO thinks the network is too big and wants to close one DC. The board will only approve a closure that pays back within 3 years. You are on the Inverto team and the steering committee is next week. Your job is to tell the client whether to close a DC, and which one. You lead the case. Tell me how you want to approach it and what you need from me.","clarifying":[{"q":"What does the client sell and to whom?","a":"Bottled and canned drinks, delivered to supermarkets, convenience chains and restaurants across Peninsular Malaysia."},{"q":"Which DC does the client want to look at?","a":"Penang is the weakest on paper. It is the smallest and the oldest. But do not assume it is the right answer."},{"q":"What is the board's hurdle?","a":"A closure must pay back its one-off cost in 3 years or less."},{"q":"Is there spare space in the other DCs?","a":"Klang Valley can take extra volume if it adds racking and some lease space. Johor is nearly full. (Give if asked.)"},{"q":"What do we lose if deliveries get slower?","a":"Some Penang customers may leave. Contribution is MYR 50 per pallet, after handling and delivery. (Give if asked.)"},{"q":"How much of transport cost is fuel?","a":"About 40% on long routes. Diesel prices are volatile. (Give if asked.)"},{"q":"Why not close Klang Valley or Johor instead?","a":"Klang Valley is the biggest and no other DC could absorb its volume. Johor is nearly full, so it could not take Penang's volume either. Closing Johor would need Klang Valley to take 80,000 pallets and has not been costed. For this case, look only at Penang. (Give if asked.)"}],"structure":{"notes":"A good candidate sets up the economics first: fixed, handling and transport cost per DC, then what moves where. Then service and capacity. Then risks. They also say what data they need.","branches":[{"name":"Cost today","points":["Fixed cost per DC (lease, staff, equipment)","Handling cost per pallet","Outbound transport per pallet","Volume per DC"]},{"name":"Closure scenario","points":["Which DC closes, where volume goes","Extra transport cost for longer routes","Extra fixed cost at the receiving DC","One-off closure cost and payback vs hurdle"]},{"name":"Service and customers","points":["Delivery lead time","Customers at risk of leaving","Peak season capacity"]},{"name":"Risk","points":["Fuel price","Single-DC dependency (flood, strike)","Execution during transition"]}]},"stages":[{"id":"s1","title":"Set the approach","timer":"structure","minutes":5,"question":"How would you decide whether to close a DC, and which one? Walk me through your approach and say what data you would ask for first.","notes":"Candidate-led. Do not hand over any data until they ask. Listen for: cost per DC split fixed and variable, volume movement, one-off cost, hurdle, service impact. If they jump to Penang, ask why. If they ask for data, give Exhibit 1 in the next stage. If they do not ask for one-off cost and capacity, push once.","exhibits":[],"hints":["Think about what changes if a DC closes: which costs go away and which costs appear elsewhere.","What would you compare the result against?"],"solution":"I would compare the network today with the network after a closure.\nStep 1: cost per DC today. Fixed cost, handling per pallet, outbound transport per pallet, and volume.\nStep 2: the closure scenario. Which volume moves, to which DC, at what handling and transport cost, and what extra fixed cost the receiving DC needs.\nStep 3: annual saving = fixed cost saved + handling saved - extra transport - extra fixed cost.\nStep 4: payback = one-off closure cost / annual saving. Compare with the 3-year hurdle.\nStep 5: what would change the answer: fuel, service loss, capacity.\nSo the first data I need is cost and volume by DC, the closure scenario inputs, and the one-off cost.","answers":{"standard":"I would compare the network today with the network after a closure. I need fixed cost, handling and transport cost and volume for each DC. Then I work out the annual saving and divide the one-off cost by it to get payback against the 3-year hurdle.","great":"I would build the saving as fixed cost saved plus handling saved, minus extra transport, minus any extra fixed cost at the DC that takes the volume. Payback is the one-off cost divided by that saving, compared with 3 years. I need cost and volume by DC, where the volume would go, and capacity there. I would then test service loss and fuel, because the saving may be thin.","best":"I would compare today's network with the closure scenario for each DC, not only Penang, because the CFO's view of Penang is from the size, not from cost. I need fixed, handling and transport cost per DC, where volume moves and the extra cost there, plus the one-off cost. Annual saving is fixed saved plus handling saved minus extra transport minus extra fixed cost. Payback is one-off divided by saving, against 3 years. Then I would ask what would flip the answer: fuel, lost customers, capacity. Because payback hurdles can be tight, I would find the break-even early."},"probes":[{"ask":"Why do you not just close the smallest DC?","listen":"Size is not cost. Need to see fixed and per-pallet cost and where the volume goes."},{"ask":"What data would you ask for first?","listen":"Volume, fixed cost, handling and transport cost per DC, plus one-off cost."},{"ask":"The CFO says Penang is old and small, so close it. Reply?","listen":"Maybe, but test it with numbers: extra transport may eat the saving."},{"ask":"How would you judge if a closure is good?","listen":"Payback of the one-off cost within 3 years, plus service and risk."}]},{"id":"s2","title":"Closure economics","timer":"math","minutes":12,"question":"Here is the data. Take the Penang closure case and tell me the annual saving and the payback. You decide how to structure the calculation.","notes":"Hand over Exhibit 1 and Exhibit 2 together. Let the candidate decide the steps. Steer only if they apply the new transport rate to all volume, or forget the extra fixed cost at Klang Valley. Check that they state units (MYR m per year). Expected: saving MYR 2.18m, payback 2.75 years. Do not say it is a knife edge. Wait to see if they notice.","exhibits":["e1","e2"],"hints":["Only the Penang volume moves. Work out what it costs at Penang today and what it costs at Klang Valley.","Fixed cost saved is Penang fixed cost minus the extra fixed cost at Klang Valley."],"solution":"Penang volume = 60,000 pallets per year.\nFixed cost saved = 4.5 - 1.0 extra at Klang Valley = MYR 3.5m per year.\nHandling saved = 60,000 x (20 - 18) = MYR 0.12m per year.\nExtra transport = 60,000 x (62 - 38) = 60,000 x 24 = MYR 1.44m per year.\nAnnual saving = 3.5 + 0.12 - 1.44 = MYR 2.18m per year.\nCheck: Penang volume costs 7.98m today (4.5 + 1.2 + 2.28) and 5.8m at Klang Valley (1.0 + 1.08 + 3.72). 7.98 - 5.8 = 2.18.\nPayback = 6.0 / 2.18 = 2.75 years.\nSo it passes the 3-year hurdle, but only just. The saving is 6.4% of the MYR 34.32m network cost, and almost all of it comes from the fixed cost.","answers":{"standard":"Only Penang's 60,000 pallets move. Fixed cost saved is 4.5 minus 1.0 extra at Klang Valley, so 3.5 million ringgit. Handling saves 0.12 million. Extra transport costs 1.44 million. Annual saving is 2.18 million. Payback is 6.0 over 2.18, which is 2.75 years.","great":"Penang volume is 60,000 pallets. Fixed saved is 3.5 million after Klang Valley's extra 1.0. Handling saved is 60,000 times 2, so 0.12 million. Extra transport is 60,000 times 24, which is 1.44 million. Saving is 2.18 million, 6.4% of network cost. Payback is 2.75 years, so it passes the 3-year hurdle, but only just. Almost all the saving is fixed cost, so the case rests on the transport rate.","best":"Annual saving is 2.18 million ringgit. Fixed 3.5, handling 0.12, less extra transport 1.44. Cross-check: Penang volume costs 7.98 million today and 5.8 million at Klang Valley, a difference of 2.18. Payback is 6.0 over 2.18, 2.75 years. That passes, but the saving has to be at least 2.0 million to meet the hurdle, so the margin is only 0.18 million, less than 10%. So I would not call it a clear pass. I would test transport rate, fuel, lost customers and the Klang Valley cost next."},"probes":[{"ask":"Why do you apply the new transport rate only to Penang volume?","listen":"Only Penang pallets change route. Other pallets stay the same."},{"ask":"What fixed cost do we really save?","listen":"4.5 minus 1.0 extra at Klang Valley: 3.5 million."},{"ask":"Why does the 62 ringgit rate matter so much?","listen":"It is 24 above today. On 60,000 pallets that is 1.44 million, nearly half the fixed saving."},{"ask":"The CFO says 2.75 is under 3, so approve. Do you agree?","listen":"Not yet: only 0.18 million headroom. Test sensitivity."},{"ask":"How do you check your answer?","listen":"Compare Penang volume cost today, 7.98, with at Klang Valley, 5.8. Difference 2.18."}]},{"id":"s3","title":"Test the result","timer":"brainstorm","minutes":10,"question":"You have a payback of 2.75 years. What do you do next before you take it to the steering committee? Pick the next step yourself.","notes":"Candidate-led. The aim is that they see the knife edge. Good next steps: sensitivity on the transport rate, fuel, lost customers, Klang Valley extra fixed cost, one-off cost. If they ask, give: fuel is 40% of the MYR 62 rate; contribution MYR 50 per pallet; Klang Valley capacity is the open question. Ask for the break-even value if they only say 'sensitivity'. Expected: saving must stay at or above MYR 2.0m, headroom MYR 0.18m, break-even rate MYR 65 per pallet (+4.8%), fuel +12%, or 3,600 pallets lost (6% of Penang volume). Also accept: Klang Valley extra fixed cost above MYR 1.18m.","exhibits":[],"hints":["The hurdle is 3 years. What annual saving gives exactly 3 years?","How much room is there between your saving and that number?"],"solution":"Break-even annual saving = 6.0 / 3 = MYR 2.0m per year.\nHeadroom = 2.18 - 2.0 = MYR 0.18m per year.\nTransport rate: 0.18m / 60,000 pallets = MYR 3 per pallet. Break-even rate = 62 + 3 = MYR 65 per pallet, which is +4.8%.\nFuel: fuel is 40% of 62 = MYR 24.8 per pallet. A rise of 3 / 24.8 = 12% in fuel price takes the payback to 3.0 years.\nService loss: 0.18m / MYR 50 contribution = 3,600 pallets, which is 6% of Penang volume.\nKlang Valley extra fixed cost: break-even at MYR 1.18m, only MYR 0.18m above the estimate.\nSo this is a knife edge. A small move in diesel, a few lost customers or a higher racking bill flips the answer. I would not present 2.75 years as a clear pass.","answers":{"standard":"The hurdle needs a saving of at least 2.0 million a year, 6.0 divided by 3. We have 2.18, so only 0.18 million of room. That is a knife edge, so I would test the biggest risks: transport rate, fuel and lost customers.","great":"Break-even saving is 2.0 million, so headroom is 0.18 million. That is 3 ringgit per pallet on the 60,000 pallets. So the break-even transport rate is 65, up 4.8% from 62. For fuel at 40% of the rate, which is 24.8 per pallet, fuel up 12% breaks it. For customers, 0.18 million over 50 ringgit contribution is 3,600 pallets, 6% of Penang. So small moves flip the answer. I would not present 2.75 years as a pass.","best":"Headroom is 0.18 million a year, and each break-even is close: rate 65 against 62, 4.8% up; fuel up 12%; 3,600 pallets lost, 6% of Penang; or Klang Valley extra fixed cost of 1.18 million against 1.0. Several of these could easily happen, and some together. Discounting would also lengthen the payback beyond 2.75. So I would take it to the committee as a conditional case. To remove the uncertainty: a fixed-price or fuel-indexed transport contract, firm quotes for Klang Valley space, and calls with the top Penang customers."},"probes":[{"ask":"What annual saving gives exactly 3 years?","listen":"2.0 million: 6.0 divided by 3."},{"ask":"How many pallets could we lose before it fails?","listen":"3,600, 6% of Penang volume. From 0.18 million over 50 ringgit."},{"ask":"Operations says diesel prices will fall, ignore fuel. Reply?","listen":"Prices are volatile and a 12% rise breaks it. Lock the contract instead of guessing."},{"ask":"Which risk worries you most and why?","listen":"Reasoned choice: transport rate or customer loss, because the headroom is small."},{"ask":"What would you do to reduce the uncertainty before the committee?","listen":"Firm transport quotes, customer calls, Klang Valley costing."}]},{"id":"s4","title":"Recommendation","timer":"recommendation","minutes":5,"question":"The CFO walks in. What do you tell her?","notes":"Looking for: answer first, honest about the knife edge, break-even stated, conditions and next steps. Good extras: compare closing Johor, reduce risk by locking a transport contract, test with Penang customers, phase the closure.","exhibits":[],"hints":["Say the answer first, then say what has to be true.","Name one next step that reduces the biggest uncertainty."],"solution":"See the model recommendation.","answers":{"standard":"I would say yes, but only on conditions. Closing Penang saves 2.18 million ringgit a year and pays back in 2.75 years, just inside the 3-year hurdle. The margin is thin, so I would lock the transport rate and check Penang customers first.","great":"Penang can be closed, but as a conditional yes. Saving is 2.18 million a year, payback 2.75 years against 3. The saving can fall only 0.18 million: rate to 65, diesel up 12%, or 3,600 pallets lost. So the conditions are a fixed or fuel-indexed transport contract and a check that Penang customers will stay. Next steps: firm Klang Valley capacity cost and firm transport quotes.","best":"My answer is a conditional yes to closing Penang. It saves 2.18 million ringgit a year, 6.4% of network cost, with a 2.75-year payback against 3. It is a knife edge: 0.18 million of headroom, which equals a rate of 65, diesel up 12%, or 6% of Penang volume lost. So I would go ahead only with a locked transport rate and customer checks, and phase the closure so I can stop if volume is lost. The alternatives are Klang Valley and Johor, which cannot take the volume, so Penang is the only real option today. Next steps: firm quotes, Klang Valley racking cost, customer calls, and a Johor costing if the board asks."},"probes":[{"ask":"What is your answer in one sentence?","listen":"Conditional yes: saves 2.18 million, payback 2.75 years, thin margin."},{"ask":"Why not a clear yes?","listen":"Headroom is only 0.18 million. Small changes flip it."},{"ask":"The CFO asks: can we skip the customer calls? Reply?","listen":"No, 6% volume loss breaks it. Calls are cheap."},{"ask":"What conditions would make you say no?","listen":"Transport above 65, volume loss of 3,600 pallets, Klang Valley cost above 1.18 million."},{"ask":"What would you do in the first month?","listen":"Quotes, customer calls, capacity costing, maybe phasing."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Distribution centres today","chart":"table","columns":["DC","Volume (pallets/year)","Warehouse fixed cost (MYR m/year)","Handling cost (MYR/pallet)","Outbound transport (MYR/pallet)"],"rows":[["Klang Valley",120000,9.0,18,40],["Penang",60000,4.5,20,38],["Johor",80000,5.5,19,42]],"note":"Fixed cost covers lease, staff and equipment. Transport is the average cost to deliver one pallet to the customers each DC serves today."},{"id":"e2","title":"Exhibit 2: Penang closure scenario inputs","chart":"table","columns":["Item","Value","Unit"],"rows":[["Penang volume moves to Klang Valley",60000,"pallets/year"],["Extra fixed cost at Klang Valley (racking, lease)",1.0,"MYR m/year"],["Handling cost at Klang Valley",18,"MYR/pallet"],["Transport, Klang Valley to Penang customers",62,"MYR/pallet"],["One-off closure cost (lease exit, severance, move)",6.0,"MYR m"],["Board payback hurdle",3,"years"]],"note":"Johor volume and cost do not change in this scenario."}],"recommendation":"My answer is that Penang can be closed, but only as a conditional yes. The closure saves about MYR 2.18m a year, 6.4% of network cost. The one-off cost is MYR 6.0m, so payback is 2.75 years against a 3-year hurdle. That is a knife edge. The saving can only fall by MYR 0.18m before we fail. That happens if the Klang Valley to Penang rate goes from MYR 62 to MYR 65 per pallet, if diesel rises about 12%, or if we lose 3,600 pallets, 6% of Penang volume. I recommend we go ahead only if the client locks the long-haul transport rate with a fixed-price or fuel-indexed contract, and checks with its top Penang customers that service will hold. Next steps: confirm the Klang Valley capacity cost, get firm transport quotes, and, if the board asks, cost a Johor closure so it sees the alternative.","good":["Builds the calculation as fixed saved + handling saved - extra transport - extra fixed cost, with units.","Computes annual saving MYR 2.18m and payback 2.75 years.","Compares payback with the 3-year hurdle and mentions service and capacity risk."],"great":["Spots the knife edge unprompted and names the break-even: MYR 65 per pallet, fuel +12%, or 6% of Penang volume.","Proposes a mitigation that removes the biggest uncertainty, such as a fixed transport contract.","Suggests testing other closure options (Johor) and phasing, and says discounting would worsen a 2.75-year payback."],"mistakes":["Applying the MYR 62 rate to all network volume, not just the Penang volume.","Forgetting the extra fixed cost at Klang Valley.","Saying 'it passes, so close it' without noting the margin is MYR 0.18m.","Mixing MYR m and MYR per pallet without converting.","Asking for no data and giving a view based only on size of the DC."],"inspiredBy":{"title":"Spirits distribution","url":"https://www.preplounge.com/en/management-consulting-cases/candidate-led/beginner/spirits-distribution-18","author":"PrepLounge","skills":"Distribution network choice: one-off investment against recurring cost, break-even or payback against the client's horizon, and service trade-offs."},"glossary":[{"term":"Distribution centre (DC)","meaning":"A warehouse that stores goods and sends them to customers."},{"term":"Pallet","meaning":"A standard wooden platform with goods stacked on it, the unit for moving and pricing."},{"term":"One-off cost","meaning":"A cost paid once, here to close the site and move the volume."},{"term":"Payback","meaning":"Years needed for the savings to repay the one-off cost: one-off cost divided by yearly saving."},{"term":"Hurdle","meaning":"The minimum standard a project must meet to be approved. Here, payback within 3 years."},{"term":"Contribution","meaning":"The money left from each pallet after handling and delivery cost."},{"term":"Racking","meaning":"The metal shelves that hold pallets in a warehouse."},{"term":"Knife edge","meaning":"A result that only just passes, so a small change flips the decision."}]},{"id":"chip-supply-disruption","title":"Sao Mai Electronics: the sensor fire","client":"Sao Mai Electronics JSC, a contract assembler of consumer and industrial electronics near Hanoi","country":"Vietnam","type":"supply chain","difficulty":"Intermediate","format":"Interviewer-led","minutes":30,"summary":"Fire stops the only sensor supplier for 8 weeks. Which products do we protect, and what do we buy to limit lost margin?","prompt":"Our client is Sao Mai Electronics, an electronics assembler near Hanoi. It builds three product lines that all use one sensor chip. A single supplier makes that chip. Yesterday a fire damaged the supplier's plant. The supplier says it cannot ship for about eight weeks. The COO has called an emergency meeting in two hours. He wants to know how bad it is, what we can do now, and what we should change so this does not happen again. You are the Inverto person on the call.","clarifying":[{"q":"Is the supplier sure about eight weeks?","a":"They say eight weeks. Plan on eight. Treat any extension as a risk, not the base case."},{"q":"Can the sensors be shared across product lines?","a":"Yes. It is the same part. Stock sits in one warehouse and can be moved between lines."},{"q":"Do we have contract penalties if we miss delivery?","a":"Some, but ignore them for the first calculation. Mention them as a risk."},{"q":"What does a sensor normally cost?","a":"USD 5 per sensor. Annual use is 9,000 a week for 50 weeks. Give this if asked, it is also in the stage 4 question."},{"q":"Is there a second supplier?","a":"There is one we know and have not qualified. It needs four weeks to qualify. Details in the options table."},{"q":"Are there sensors in transit, or finished goods we can sell?","a":"No sensors are in transit. The stock in Exhibit 1 is everything. Finished goods are small, so ignore them. (Give if asked.)"}],"structure":{"notes":"Three time horizons: immediate (hours to days), short term (the eight weeks), structural (so it does not repeat). Strong answers start with facts: stock, usage, margin per line.","branches":[{"name":"Immediate (first days)","points":["Confirm stock on hand and in transit","Get the supplier's real recovery date","Freeze orders, tell customers early","Set up a crisis team"]},{"name":"Short term (eight weeks)","points":["Weeks of cover by product line","Reallocate stock to highest-margin lines","Spot buy at a premium","Second supplier (qualification time)","Customer talks, delivery dates, penalties"]},{"name":"Structural","points":["Dual sourcing","Safety stock by criticality","Design for second-source parts","Supplier risk monitoring"]}]},"stages":[{"id":"s1","title":"Structure the response","timer":"structure","minutes":4,"question":"The call starts in two hours. How would you structure the response?","notes":"Listen for time horizons and a first fact step: how much stock, how fast it is used. Give clarifying answers as asked.","exhibits":[],"hints":["What do you need to know in the first hour?","What is the difference between now, the eight weeks, and after?"],"solution":"I would split it into three horizons.\nImmediate: confirm what stock we hold, what is in transit, and how firm the eight weeks are. Warn customers early.\nShort term, the eight weeks: work out how long stock lasts for each product line, then decide where each sensor creates the most margin. Then look at ways to get more sensors: spot buy, a second supplier, or both.\nStructural: a second source and safety stock, sized to what the disruption costs us.\nI would start with stock and margin by line.","answers":{"standard":"I would split the response into three: right now, the eight weeks, and afterwards. First I need the facts: how much stock we hold, how fast we use it, and the margin on each line. Then I decide where each sensor is best used.","great":"Three horizons. Immediate: confirm stock, anything in transit, and how firm the eight weeks are, and warn customers early. The eight weeks: weeks of cover per product line, then give sensors to the lines with the highest margin per sensor, and look for extra sensors. Afterwards: a second source and safety stock sized to what this event costs. I would start with stock and margin by line because everything else depends on it.","best":"I would use three time horizons and start with numbers. In the first hour: stock by line, weekly use, margin per sensor, and how reliable the eight weeks are. In the eight weeks: reallocate stock, then compare ways to get more sensors by net margin, premium against the margin earned. Afterwards: dual source and safety stock, priced against the cost of one event. I would also treat the eight weeks as a base case and plan what to do if it becomes twelve. And I would warn the customers before the penalties become a topic."},"probes":[{"ask":"Why start with stock and margin and not with the supplier?","listen":"Numbers decide which lines to protect. The supplier date is fixed for now."},{"ask":"What is the difference between the three time horizons?","listen":"Immediate actions, the eight weeks, and the long-term fix so it does not repeat."},{"ask":"The COO says we have no time for analysis, just buy everything we can. Reply?","listen":"Buying blindly costs money. Quick numbers on cover and margin take minutes and decide where to buy."},{"ask":"What could make the eight weeks wrong?","listen":"Supplier delay, damage worse than said. Plan for a longer outage as a risk."}]},{"id":"s2","title":"How bad is it?","timer":"math","minutes":7,"question":"Here is stock and usage by product line. Calculate the weeks of cover for each line and the margin at risk per week. If we do nothing, with each line running only on its own stock, how much margin do we lose over eight weeks? Then, if we move stock to where it earns most, how much do we lose?","notes":"Margin per sensor = margin per unit / sensors per unit. Controllers use 2 sensors per unit, so USD 60 margin is USD 30 per sensor. Ranking by margin per unit would put controllers first, which is wrong. Order by margin per sensor: car modules 35, controllers 30, cameras 20. Total stock 28,000.","exhibits":["e1"],"hints":["Weeks of cover = stock / sensors needed per week.","Which line earns the most per sensor, not per unit?"],"solution":"Step 1. Sensors needed per week = units per week x sensors per unit.\nCameras: 4,000 x 1 = 4,000. Controllers: 1,500 x 2 = 3,000. Car modules: 2,000 x 1 = 2,000. Total = 9,000 per week.\nStep 2. Weeks of cover = stock / need per week.\nCameras: 12,000 / 4,000 = 3.0 weeks. Controllers: 12,000 / 3,000 = 4.0 weeks. Car modules: 4,000 / 2,000 = 2.0 weeks. Total stock 28,000 / 9,000 = 3.1 weeks.\nStep 3. Margin at risk per week = units x margin per unit.\nCameras: 4,000 x 20 = USD 80,000. Controllers: 1,500 x 60 = USD 90,000. Car modules: 2,000 x 35 = USD 70,000. Total = USD 240,000 per week, USD 1.92m over eight weeks.\nStep 4. Do nothing, each line on its own stock. Weeks without sensors = 8 - cover.\nCameras: 5 weeks x 80,000 = USD 400,000. Controllers: 4 x 90,000 = USD 360,000. Car modules: 6 x 70,000 = USD 420,000.\nLost margin = USD 1.18m.\nStep 5. Margin per sensor = margin per unit / sensors per unit.\nCar modules: 35. Controllers: 60 / 2 = 30. Cameras: 20.\nGive stock to the highest first. Car modules need 2,000 x 8 = 16,000 sensors. That protects 16,000 x 35 = USD 560,000. Controllers get the remaining 12,000. That protects 12,000 x 30 = USD 360,000. Cameras get none.\nProtected = USD 920,000. Lost = 1,920,000 - 920,000 = USD 1.0m.\nSo-what: just moving stock to the right lines saves USD 180,000, from 1.18m to 1.0m, at no cost. But USD 1.0m is still lost. We need more sensors.","answers":{"standard":"Total need is 9,000 sensors a week and stock is 28,000, so cover is about 3.1 weeks. Doing nothing, each line on its own stock, we lose 1.18 million dollars of margin. If we move stock to the highest-margin lines, we lose 1.0 million.","great":"Cover is 3 weeks for cameras, 4 for controllers and 2 for car modules. Margin at risk is 240,000 dollars a week, 1.92 million over eight weeks. On own stock we lose 1.18 million. But I should rank by margin per sensor, not per unit. Controllers use two sensors, so 60 per unit is 30 per sensor. Car modules are 35, controllers 30, cameras 20. If car modules get 16,000 sensors and controllers 12,000, we lose 1.0 million. Moving stock saves 180,000 at no cost, but 1.0 million is still lost.","best":"Weeks of cover are 3, 4 and 2 for cameras, controllers and car modules, 3.1 overall. Margin at risk is 240,000 dollars a week. With no action we lose 1.18 million. The trap is ranking by margin per unit, which favours controllers. Per sensor, car modules earn 35, controllers 30 and cameras 20. Giving car modules 16,000 and controllers 12,000 protects 920,000, so we lose 1.0 million. Check: 1.92 million at risk minus 920,000 protected is 1.0 million. Cameras stop completely, so I would call those customers now. Next I would look for more sensors, since 28,000 covers only 28,000 of the 72,000 we need."},"probes":[{"ask":"Why rank lines by margin per sensor and not per unit?","listen":"A sensor is the scarce thing. Controllers use two sensors, so per sensor they earn 30, below car modules at 35."},{"ask":"How many weeks does each line last on its own stock?","listen":"Cameras 3, controllers 4, car modules 2."},{"ask":"The sales head says controllers are our most profitable product, protect them first. Reply?","listen":"Per unit yes, per sensor no: 30 against 35 for car modules. Both get covered later anyway."},{"ask":"What does it cost to move the stock between lines?","listen":"Almost nothing, same part, same warehouse. Saves 180,000."},{"ask":"Which line stops first if we do nothing, and which stops longest?","listen":"Car modules stop first, after 2 weeks, and for 6 weeks. Controllers stop last, for 4 weeks."}]},{"id":"s3","title":"Options to get more sensors","timer":"exhibit","minutes":11,"question":"Here are the two ways to get sensors. Which should we use, and for which lines? What is the lowest lost margin we can reach, and is any of the choices close?","notes":"Air from the second supplier: 3,000 a week for weeks 5 to 8 = 12,000 sensors, premium USD 6, so cost USD 72,000. Each sensor goes to controllers (margin 30 per sensor), so protects 360,000. Net 288,000. After stock and air, car modules and controllers are fully covered (40,000 needed = 28,000 + 12,000). Remaining line: cameras. Spot buy: 2,000 a week for 8 weeks = 16,000 sensors, premium USD 20, equal to the camera margin per sensor (USD 20). The net gain is exactly zero. This is the knife edge. Say so. Decision rests on non-margin factors: customer penalties and relationship, cash (USD 320,000 extra), and the risk that second-supplier qualification slips. Break-even spot premium is USD 20: below that, buy; above, do not. Also timing check: stock covers weeks 1 to 4 for car modules and controllers; air starts in week 5.","exhibits":["e2"],"hints":["Add the second supplier's sensors to stock, then allocate again by margin per sensor.","Compare the spot premium with the margin per sensor of the line that would use it."],"solution":"Step 1. Second supplier by air. Weeks 5 to 8 is four weeks. 4 x 3,000 = 12,000 sensors. Premium 12,000 x USD 6 = USD 72,000.\nStep 2. Allocate. Stock 28,000 + air 12,000 = 40,000 sensors. Car modules and controllers need 16,000 + 24,000 = 40,000. So both are fully covered for eight weeks.\nThe 12,000 air sensors protect controllers: 12,000 x 30 = USD 360,000. Net of the premium: 360,000 - 72,000 = USD 288,000.\nLost margin = 1,000,000 - 360,000 + 72,000 = USD 712,000.\nThat is the cameras: 4,000 x 20 x 8 weeks = USD 640,000, plus the premium USD 72,000.\nStep 3. Spot buy. Up to 2,000 a week x 8 weeks = 16,000 sensors. Premium USD 20 per sensor, so USD 320,000.\nOnly the cameras could use them. Margin per camera sensor is USD 20. Margin recovered = 16,000 x 20 = USD 320,000.\nNet = 320,000 - 320,000 = 0. Lost margin stays at USD 712,000.\nThis is a knife edge. At a premium of USD 20 the spot buy neither gains nor loses margin. Below USD 20 it pays. Above, it loses.\nStep 4. Decide. I would use the second supplier and reallocate. For the spot buy, margin is neutral, so it comes down to other things: the camera customers, possible penalties, and USD 320,000 more cash out. I would buy only a part, as insurance in case the second supplier is late.\nSo-what: the lowest lost margin is USD 712,000, down from 1.18m.","answers":{"standard":"I would qualify the second supplier and fly in 3,000 sensors a week from week 5. That is 12,000 sensors for 72,000 dollars of premium, and they keep controllers running. Lost margin falls to 712,000 dollars. The spot buy breaks even, so it is optional.","great":"Second supplier by air: 12,000 sensors, premium 72,000, and they protect controllers at 30 each, so 360,000. Net 288,000. Now car modules and controllers are fully covered, and only cameras stop. Spot buy: premium 20 per sensor equals the 20 margin per camera sensor, so the gain is zero. Lost margin is 712,000 either way. I would not pick on margin. I would look at camera customers' penalties, the 320,000 cash, and the risk of the second supplier being late. Maybe buy a part as insurance.","best":"Plan: stock plus 12,000 air sensors gives 40,000, exactly what car modules and controllers need. Air premium is 72,000 against 360,000 protected, so net 288,000. Lost margin is 712,000, which is the cameras' 640,000 plus the premium. Spot buy is a knife edge: break-even premium is 20, equal to the camera margin per sensor. At 15 it gains 80,000, at 25 it loses 80,000. So I decide on other factors: penalties, 320,000 extra cash, and insurance if the second supplier slips past week 5. I would buy part of the spot volume, and ask the brokers for a firm price. Also, I would check that air freight capacity and qualification really finish in four weeks."},"probes":[{"ask":"Why do you compare the spot premium with 20?","listen":"20 is the margin per camera sensor. Paying more than that for a sensor loses money."},{"ask":"Which sensors do the air shipments go to, and why?","listen":"Controllers, because stock covers car modules and controllers early, and air comes from week 5."},{"ask":"The sales head says spot buy keeps cameras alive, so do it. Reply?","listen":"It keeps the cameras going but at break-even margin, 320,000 more cash, so only for other reasons."},{"ask":"What would change your choice between the options?","listen":"Premium below 20 favours buying, above 20 not. Penalties, cash, qualification delays."},{"ask":"What if the second supplier needs six weeks instead of four?","listen":"Fewer air sensors, only 6,000, so more lost margin, and spot buy becomes more useful."}]},{"id":"s4","title":"Recommendation and structural fix","timer":"recommendation","minutes":8,"question":"Give the COO your recommendation for the eight weeks. Then propose a structural fix and estimate its yearly cost. Assume: sensor price USD 5, use 9,000 a week for 50 weeks, a second supplier would take 30% of volume at 8% higher price, safety stock of four weeks of use, and 15% yearly cost of holding stock.","notes":"Check the candidate gives the answer first, names the USD 712,000 residual, and states the knife edge on spot buy. Structural cost: second source premium = 450,000 x 30% x USD 5 x 8% = USD 54,000. Safety stock = 9,000 x 4 = 36,000 sensors x USD 5 = USD 180,000, holding cost 15% = USD 27,000. Total about USD 81,000 a year. Compare with USD 712,000 for one event: the fix pays if such an event happens more often than about once in nine years. Ask for other exposure: single-source parts elsewhere.","exhibits":[],"hints":["What does the second source cost per year?","How do you compare a yearly cost with a one-off loss?"],"solution":"Short term: reallocate stock to car modules and controllers, qualify the second supplier now and fly in 3,000 a week from week 5, and accept that cameras stop. Lost margin about USD 712,000. The spot buy is margin-neutral, so buy a part of it only as insurance.\nStructural, yearly cost.\nAnnual volume = 9,000 x 50 = 450,000 sensors, spend USD 2.25m.\nDual source: 450,000 x 30% x USD 5 x 8% = USD 54,000 a year.\nSafety stock: 9,000 x 4 weeks = 36,000 sensors x USD 5 = USD 180,000 of stock. Holding cost 15% = USD 27,000 a year.\nTotal = about USD 81,000 a year.\nCompare: one event like this costs USD 712,000 even with a good response. The fix costs 11% of that each year. It pays back if an event like this happens once in nine years or less.","answers":{"standard":"For the eight weeks: protect car modules and controllers, stop cameras, and use the second supplier. Lost margin is about 712,000 dollars. For the long term, a second source and four weeks of safety stock cost about 81,000 dollars a year.","great":"Short term, reallocate stock, qualify the second supplier now and fly sensors from week 5, and accept that cameras stop. Lost margin is 712,000. The spot buy is neutral, so only buy some as insurance. Structural: the second source at 30% of 450,000 sensors with an 8% premium costs 54,000 a year. Safety stock of 36,000 sensors is 180,000 dollars, 27,000 a year to hold. Total 81,000, which is 11% of one event. It pays if an event like this happens once in nine years.","best":"My answer: protect car modules and controllers, let cameras stop, start qualification today. Residual loss 712,000 dollars, and the spot buy is margin-neutral so it is insurance only. The structural fix costs 54,000 for the second source plus 27,000 for holding the safety stock, about 81,000 a year, 11% of one event. It pays back if such an event happens about once in nine years or more often. Also, a second source helps in normal price talks. Risks: the second supplier late, the outage longer than eight weeks, penalties. I would also check which other parts are single-sourced, because this fire is probably not our only exposure, and call the camera customers this week."},"probes":[{"ask":"Why is the structural fix worth it?","listen":"81,000 a year against a 712,000 loss from one event. Pays if once in nine years."},{"ask":"Where does the 54,000 come from?","listen":"450,000 sensors, 30%, 5 dollars, 8%."},{"ask":"The CFO says this fire is a one-off, so spend nothing. Reply?","listen":"Even rare events pay back: one event costs about nine years of the fix. Other single sources may exist."},{"ask":"What are the main risks of your short-term plan?","listen":"Second supplier late, outage longer than eight weeks, camera customers' penalties."},{"ask":"What would you do in the first week?","listen":"Start qualification, call camera customers, confirm stock, check other single-source parts."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Sensor stock and usage by product line","chart":"table","columns":["Product line","Sensors per unit","Output (units per week)","Sensor stock on hand (units)","Margin per unit (USD)"],"rows":[["Home cameras",1,4000,12000,20],["Industrial controllers",2,1500,12000,60],["Car modules",1,2000,4000,35]],"note":"Stock is in one warehouse and can be moved between lines. Outage: 8 weeks, no sensors from the current supplier. Lost margin = margin of units not built."},{"id":"e2","title":"Exhibit 2: Options for extra sensors","chart":"table","columns":["Option","Available (sensors per week)","From week","Price premium over normal USD 5 (USD per sensor)","Note"],"rows":[["Spot buy from brokers",2000,1,20,"Available all 8 weeks"],["Second supplier, air freight",3000,5,6,"Needs 4 weeks to qualify, then ships by air"]],"note":"Premium is the extra cost per sensor above the normal price of USD 5, including air freight where relevant. Weeks are numbered 1 to 8 from the fire."}],"recommendation":"My recommendation: protect car modules and controllers, accept that home cameras stop for eight weeks, and fix the single source after. Stock covers 3.1 weeks across all lines. Do nothing and we lose USD 1.18 million of margin. Moving the stock to the lines with the highest margin per sensor cuts that to USD 1.0 million. Qualifying the second supplier now and flying in 3,000 sensors a week from week 5 brings it down to USD 712,000, after paying USD 72,000 in premium. The spot buy is a knife edge. At USD 20 premium it recovers exactly what it costs, so it adds no margin. I would buy only a part as insurance, and decide on customer penalties and cash. For the long term, a second source at 30% of volume and four weeks of safety stock cost about USD 81,000 a year. One event like this costs USD 712,000. The risks are the second supplier missing its qualification date, and the outage running past eight weeks. Next steps: start qualification today, call the camera customers this week, and check which other parts are single-sourced.","good":["Splits the response into immediate, short term and structural","Computes weeks of cover and margin at risk by line with correct units","Ranks lines by margin per sensor, not per unit, and reallocates stock","Compares options by net margin, premium against margin earned"],"great":["Finds the knife edge: spot premium of USD 20 equals camera margin per sensor, and says so instead of picking a winner","Gives the break-even premium and says what else decides it (penalties, cash, qualification slip)","Prices the structural fix (about USD 81,000 a year) and compares it with the USD 712,000 event loss","Flags the risk that the outage runs past eight weeks and asks about other single-source parts"],"mistakes":["Ranking lines by margin per unit and favouring controllers over car modules","Forgetting that controllers use two sensors per unit","Buying all spot sensors without comparing the premium with the margin per sensor","Ignoring the four-week qualification time of the second supplier","Recommending dual source with no cost number"],"glossary":[{"term":"Sensor chip","meaning":"A small electronic part that detects things, used in all three product lines."},{"term":"Weeks of cover","meaning":"How many weeks stock lasts at the current usage rate."},{"term":"Margin","meaning":"Selling price minus the cost of making the product."},{"term":"Spot buy","meaning":"Buying from a broker at a high price for quick delivery, outside a contract."},{"term":"Qualifying a supplier","meaning":"Testing a new supplier's part until the client approves it for use. Here it takes four weeks."},{"term":"Single source / dual source","meaning":"One supplier for a part versus two suppliers."},{"term":"Safety stock","meaning":"Extra stock kept to cover a supply stop."},{"term":"Knife edge","meaning":"A choice where the gain and the cost are exactly equal."}]},{"id":"insource-maintenance-payback","title":"Insourcing equipment maintenance (Ruampat Hospitals)","client":"Ruampat Hospitals, a Thai private hospital group with 8 hospitals and a contractor that maintains its imaging and lab equipment.","country":"Thailand","type":"operations","difficulty":"Beginner","format":"Interviewer-led","minutes":30,"summary":"Should a hospital group take equipment maintenance in-house, and if so, buy or rent a workshop?","prompt":"Ruampat Hospitals is a private hospital group in Thailand. An outside contractor maintains its scanners and lab machines for THB 30 million a year. Service is poor: engineers arrive late, repairs take several visits and machines are down too long. The COO is thinking of building an in-house maintenance team and workshop. The board will approve any investment that pays back in three years or less. You are on the Inverto team and the COO meets you tomorrow. Let's start with how you would structure this.","clarifying":[{"q":"What does the current contract cover?","a":"Labour and spare parts for all machines. THB 30m a year, fixed for the next five years."},{"q":"Can we leave the contract?","a":"Yes, with six months' notice and no penalty. (Give if asked.)"},{"q":"What does poor quality cost the hospitals?","a":"Machine downtime costs about THB 4m a year in lost scans. The COO expects in-house service to cut it by half. (Give if asked.)"},{"q":"Do we need a workshop?","a":"Yes. There is no space in the hospitals. Two options: buy a building near the main hospital, or rent one. Costs are in Exhibit 2."},{"q":"How is payback defined?","a":"Investment divided by annual saving. No discounting. The hurdle is three years. (Give if asked.)"}],"structure":{"notes":"A good candidate frames this as cost, quality and risk, and asks what an in-house team would cost versus the THB 30m contract, plus the investment needed.","branches":[{"name":"Cost","points":["Contract cost today","In-house staff, parts, tools","Workshop: buy or rent"]},{"name":"Quality","points":["Response time and repeat visits","Downtime cost","Safety and compliance"]},{"name":"Investment","points":["Upfront cost by option","Payback vs hurdle","Incremental return of the dearer option"]},{"name":"Risk","points":["Hiring and keeping technicians","Skills on new machines","Falling back on a contractor"]}]},"stages":[{"id":"s1","title":"Structure the question","timer":"structure","minutes":4,"question":"How would you structure the decision on insourcing maintenance? What do you want to know?","notes":"Interviewer-led. Listen for cost, quality, investment and risk. Do not give numbers yet. If they only compare annual cost, ask: 'What does the group have to spend up front?'","exhibits":[],"hints":["Think about the annual cost and the one-off cost separately.","Why does the COO want to change?"],"solution":"I would look at four things.\nFirst, cost: what we pay the contractor today against what an in-house team would cost each year.\nSecond, quality: response time, repeat visits and the cost of machine downtime.\nThird, investment: the workshop and equipment, and whether it pays back within three years.\nFourth, risk: can we hire and keep technicians, and what if we need a contractor again.\nI would start with the annual cost comparison.","answers":{"standard":"I would look at cost, quality, investment and risk. Cost is what we pay the contractor against what an in-house team would cost. Investment is the workshop and whether it pays back in three years. Risk is hiring and keeping technicians. I would start with the yearly cost comparison.","great":"The goal is better service at a lower cost, so I would split the question in four: cost, quality, investment and risk. Cost first, because if in-house is not cheaper, the rest matters less. Then the one-off spend for the workshop against the board's three-year payback rule. Quality matters too, because poor service is why the COO is asking. I would also ask whether the contract can be ended and at what notice.","best":"There are two questions: should we insource at all, and if yes, how do we house the team. I would split into yearly cost, quality, one-off investment and risk. Yearly cost decides the first question. Investment against the three-year rule decides the second. Quality is the reason the COO wants this, so I want the cost of downtime as an upside, not as the main case. The key risk is that technicians are scarce, so I would test how sensitive the answer is to pay. I would ask for the cost of an in-house team and for the workshop options, and I would check the contract exit terms before we promise anything."},"probes":[{"ask":"What would you want to know about the money, besides the yearly cost?","listen":"They separate yearly cost from one-off up-front spend, and mention the workshop or equipment."},{"ask":"Why does the COO want to change at all?","listen":"Poor service: late engineers, repeat visits, long downtime. Not only cost."},{"ask":"Why would you not just compare the contract fee with the in-house cost and stop?","listen":"The workshop needs money up front and has its own yearly cost, and the board has a payback rule."},{"ask":"The COO says: cost is all that matters, skip quality. Do you agree?","listen":"They push back politely: quality is why we are here, and downtime has a money value. They may still agree to start with cost."}]},{"id":"s2","title":"Annual cost: contract vs in-house","timer":"math","minutes":6,"question":"Here is the cost of running an in-house team, before any workshop cost. How much would the group save each year?","notes":"Hand over Exhibit 1. Expected: in-house running cost = 8 + 7 + 2 = THB 17m. Contract = 30. Saving before workshop = THB 13m, or 43% of the contract. If asked, there is no hidden cost in Exhibit 1. Remind them the workshop is not in yet.","exhibits":["e1"],"hints":["Add the three lines in the in-house column.","Subtract from the THB 30m contract."],"solution":"In-house running cost = 8 + 7 + 2 = THB 17m a year.\nContract = THB 30m a year.\nSaving before the workshop = 30 - 17 = THB 13m a year. That is 43% of the contract.\nSo insourcing is cheaper on running cost alone. The workshop will use up part of this saving.","answers":{"standard":"The in-house team costs 8 plus 7 plus 2, so THB 17 million a year. The contract is THB 30 million. So we save THB 13 million a year before the workshop. That is about 43 percent of the contract.","great":"In-house running cost is THB 17 million: technicians 8, parts 7, tools and training 2. Against the THB 30 million contract, that saves THB 13 million, or 43 percent. That is a big gap, so insourcing looks attractive on running cost. But the workshop is not in yet, and it will eat part of that saving. I would also check that the in-house numbers cover everything the contractor does today.","best":"In-house is THB 17 million a year against THB 30 million, so the saving is THB 13 million, about 43 percent. A saving this large makes me ask what the contractor does that is not in our list, for example emergency cover or special machine skills. I would test the 8 million for 20 technicians, because pay is the biggest line and the hardest to hire. The workshop will reduce the saving, so this is the ceiling, not the final number. Next I would look at the two workshop options and the up-front cost."},"probes":[{"ask":"In your own words, what is the 13 you got?","listen":"The yearly saving in THB million: 30 minus 17, before any workshop cost."},{"ask":"Why is 13 not the final saving?","listen":"The workshop is not included yet; it has its own running cost."},{"ask":"Does 43 percent look too good to be true? What would you check?","listen":"They question the in-house numbers: missing items, pay levels, hiring, what the contractor covers today."},{"ask":"The CFO says: we can book THB 13 million a year straight away. Do you agree?","listen":"No. The workshop cost comes off, and the team must be hired first, so the saving starts later."}]},{"id":"s3","title":"Payback of buying vs renting","timer":"math","minutes":8,"question":"The workshop can be bought or rented. Work out the annual saving and the payback of each option. Do they meet the three-year hurdle?","notes":"Hand over Exhibit 2. Expected: Buy: saving = 13 - 3 = 10; payback = 28 / 10 = 2.8 years. Rent: saving = 13 - 6 = 7; payback = 10 / 7 = 1.4 years. Both pass 3 years. Common error: forgetting workshop running cost in the saving, or using total cost instead of saving. If they ask about downtime, give THB 4m, halved: +THB 2m a year to either option. Then buy 28 / 12 = 2.3 years, rent 10 / 9 = 1.1 years.","exhibits":["e2"],"hints":["Annual saving = 13m less the workshop's yearly cost.","Payback = investment / annual saving."],"solution":"Buy: workshop cost = THB 3m a year (upkeep, utilities, property tax). Saving = 13 - 3 = THB 10m a year.\nPayback = 28 / 10 = 2.8 years.\nRent: workshop cost = THB 6m a year (rent and utilities). Saving = 13 - 6 = THB 7m a year.\nPayback = 10 / 7 = 1.4 years.\nBoth pass the three-year hurdle. Renting pays back faster; buying saves THB 3m more a year.\nIf we count the THB 2m a year downtime gain, payback is 2.3 years for buy and 1.1 years for rent. Same ranking.","answers":{"standard":"Buying: the workshop costs 3 a year, so the saving is 13 minus 3, THB 10 million. Payback is 28 divided by 10, so 2.8 years. Renting: the workshop costs 6 a year, so the saving is 7. Payback is 10 divided by 7, so 1.4 years. Both are under three years, so both pass.","great":"Buy saves THB 10 million a year and pays back in 2.8 years. Rent saves THB 7 million and pays back in 1.4 years. Both pass the three-year rule, but buying only just. Renting pays back faster and ties up much less cash. Buying saves THB 3 million more a year. If I add the downtime gain of THB 2 million, buy is 2.3 years and rent is 1.1, so the ranking does not change. I would not put the downtime gain in the base case.","best":"Buy saves 10 million a year and pays back in 2.8 years. Rent saves 7 million and pays back in 1.4 years. Both pass, so payback alone does not choose between them. Payback is also blind to what happens after year three, so I would look at the longer run. Over three years buying leaves 2 million after the investment and renting leaves 11. Over five years it is 22 for buy and 25 for rent, so renting is still ahead. Downtime adds 2 million to both and does not change the order. Next I would ask what the extra 18 million for buying buys us."},"probes":[{"ask":"Which saving did you divide by, and why that one?","listen":"The yearly saving after the workshop cost, not the contract fee or total cost."},{"ask":"Why does renting pay back faster although it saves less each year?","listen":"It needs much less money up front: 10 against 28."},{"ask":"Both options pass. Is that enough to say either is fine?","listen":"No. They should compare the two, which leads to the extra investment question."},{"ask":"The COO says: the downtime benefit is real, so add it to the saving. Do you?","listen":"They can show it as an upside: payback is 2.3 for buy, 1.1 for rent. They prefer not to rely on it, since it is an estimate."},{"ask":"Does the downtime gain change which option is better?","listen":"No. It adds THB 2 million to both, so the order stays the same."}]},{"id":"s4","title":"Is the extra investment worth it?","timer":"math","minutes":7,"question":"Both options pass. So which one, and why? Look at what you get for the extra money.","notes":"Expected: incremental investment = 28 - 10 = THB 18m. Incremental saving = 10 - 7 = THB 3m. Incremental payback = 18 / 3 = 6 years, which fails the three-year hurdle. So rent, unless there is a strategic reason to own. Risks: technicians are scarce and may leave; if technician pay (THB 8m) rises 25%, which is THB 2m, buy saving falls to 8 and payback becomes 3.5 years, which fails the hurdle, while rent is 10 / 5 = 2.0 years and still passes. Property price risk, quality of the in-house team on new machines, falling back on a contractor.","exhibits":[],"hints":["Compare the two options: how much more do you spend, and how much more do you save?","Does that extra spend meet the three-year hurdle?"],"solution":"Extra investment for buying = 28 - 10 = THB 18m.\nExtra annual saving = 10 - 7 = THB 3m.\nIncremental payback = 18 / 3 = 6 years. That fails the three-year hurdle.\nSo the extra THB 18m of buying does not earn its keep. Renting is the better choice.\nA risk test: if technician pay (THB 8m) rises 25%, that is THB 2m more a year. Buying then saves 8 and pays back in 3.5 years, which fails. Renting saves 5 and pays back in 2.0 years, which still passes.\nOther risks: hiring and keeping skilled technicians, training on new machines, and having no contractor to fall back on. I would keep the contract's six-month notice in mind and phase the move.","answers":{"standard":"Buying costs THB 18 million more up front than renting, and saves THB 3 million more a year. That is a six-year payback on the extra money, which fails the three-year rule. So I would rent.","great":"Buying needs 18 million more and gives only 3 million more a year. That is a payback of 6 years on the extra money, double the board's limit. So the extra spend does not earn its keep, and I recommend renting. I would test pay risk. If technician pay rises 25 percent, that is 2 million more a year. Buy then saves 8 and pays back in 3.5 years, which fails. Rent saves 5 and pays back in 2.0 years, which passes. Renting is the safer choice.","best":"The question is whether the extra 18 million is worth it. It gives 3 million a year more, so 6 years to pay back. That fails the three-year rule, so rent. The pay test shows the same thing: with 25 percent higher technician pay, buying fails at 3.5 years and renting still passes at 2.0. The one case for buying is a strategic reason to own the property, for example if rents rise sharply. Property price and rent risk are things I would check. The other risks are hiring technicians, skills on new machines, and having no contractor to fall back on. Next step: recruit, sign a flexible lease, and keep the six-month notice on the contract until the team works."},"probes":[{"ask":"What is the extra money, and what does it buy you?","listen":"18 million extra up front for 3 million extra saving a year."},{"ask":"Why is six years a problem?","listen":"The board only approves up to three years."},{"ask":"Why not buy anyway? Buildings keep their value.","listen":"They may accept a strategic reason, but the numbers do not support it on the board's rule, and resale value is not in the case data."},{"ask":"The CFO disagrees: buying saves THB 10 million a year, more than renting. Why not buy?","listen":"The extra yearly saving is only 3 million for 18 million more cash."},{"ask":"What could make the answer change?","listen":"Pay rises, which hurts buy more; or a much higher rent, which would favour buy."}]},{"id":"s5","title":"Recommendation","timer":"recommendation","minutes":5,"question":"The COO asks for your recommendation. Give it in under a minute.","notes":"Look for: answer first (insource, rent), numbers, risk, next steps. A split is also fine: insource the busiest hospitals first.","exhibits":[],"hints":["Lead with the answer.","Name two risks and one next step."],"solution":"Insource, and rent the workshop. In-house running cost is THB 17m against THB 30m for the contract, so saving before a workshop is THB 13m. Renting saves THB 7m a year and pays back in 1.4 years. Buying saves THB 10m but costs THB 18m more upfront, a six-year payback on the extra, so it fails the three-year hurdle. Insourcing should also cut downtime, worth about THB 2m a year. The main risks are hiring technicians and rising staff cost. Next steps: recruit the team, rent the workshop on a flexible lease, and give the contractor six months' notice once the team is ready.","answers":{"standard":"I recommend we insource and rent the workshop. It saves THB 7 million a year and pays back in 1.4 years. Buying costs 18 million more for only 3 million more a year, so it fails. The main risk is hiring technicians. Next step is to recruit the team.","great":"I recommend we insource and rent the workshop. Running in-house costs 17 million against 30 million for the contract. After the rent, we save 7 million a year and pay back in 1.4 years. Buying fails on the extra money: 18 million for 3 million a year is six years. Quality should also improve, with about 2 million a year from less downtime. The main risks are hiring technicians and higher pay. Even with 25 percent higher pay, renting still pays back in 2.0 years. Next steps: recruit, rent on a flexible lease, then give the contractor notice.","best":"I recommend we insource and rent the workshop. In-house costs 17 million against 30 million, and after rent we save 7 million a year with a 1.4 year payback. Buying looks better on yearly saving, but the extra 18 million earns 3 million a year, a six year payback that fails the board's rule. The recommendation holds if pay rises 25 percent. Downtime is an upside of about 2 million and I would not count on it. The two risks are hiring and keeping technicians, and having no fall-back. So I would move in phases, starting with the busiest hospitals. We keep the contractor until the team runs, using the six months' notice. Before the board, I would confirm the in-house costs with real quotes and check lease terms."},"probes":[{"ask":"In one sentence, what should the COO do?","listen":"Insource and rent the workshop."},{"ask":"What is the strongest reason?","listen":"Renting saves THB 7 million a year, pays back in 1.4 years; buying's extra spend fails."},{"ask":"What could go wrong?","listen":"Hiring or keeping technicians, pay rises, skills on new machines, no fall-back."},{"ask":"The COO says: I am nervous about ending the contractor all at once. What do you suggest?","listen":"Phase the move, keep the contractor until the team works, use the six months' notice."},{"ask":"What would you do next week?","listen":"Concrete steps: start recruiting, check lease options, confirm costs."}]}],"exhibits":[{"id":"e1","title":"Exhibit 1: Annual maintenance cost","chart":"pie","columns":["Item","Outside contract (THB m per year)","In-house (THB m per year)"],"rows":[["Technicians and supervisors","included",8],["Spare parts","included",7],["Tools, software and training","included",2],["Contract fee",30,0]],"note":"Workshop cost is not included. In-house team of 20 technicians.","series":[2],"rowsUsed":[0,1,2]},{"id":"e2","title":"Exhibit 2: Workshop options","chart":"table","columns":["Item","Buy a building","Rent a building"],"rows":[["Upfront investment (THB m)",28,10],["Workshop running cost (THB m per year)",3,6],["Covers","Land, building, fit-out","Fit-out only"],["Running cost includes","Upkeep, utilities, property tax","Rent and utilities"]],"note":"Payback = investment / annual saving, no discounting. Board hurdle: three years."}],"recommendation":"Insource, and rent the workshop. The in-house team costs THB 17m a year against THB 30m for the contract, so we save THB 13m before the workshop. Renting leaves THB 7m a year and pays back in 1.4 years. Buying leaves THB 10m a year and pays back in 2.8 years. Both pass the three-year hurdle, but buying needs THB 18m more for THB 3m more a year. That is a six-year payback, so it fails. The main risks are hiring technicians and pay going up. If technician pay rises 25%, buying fails the hurdle and renting still passes. Next steps: recruit, rent on a flexible lease, then give the contractor notice.","good":["Compares annual cost correctly and gets THB 13m saving before the workshop","Calculates payback for both options and checks them against the three-year hurdle","Notices that both options pass and asks which one to choose","Names a clear recommendation"],"great":["Computes the incremental payback of the dearer option (6 years) and uses it to choose","Includes the downtime benefit as an upside, not a base-case saving","Stress-tests staff cost and shows that buying is the one that breaks","Mentions skills, hiring and contractor fall-back as risks, with a next step"],"mistakes":["Dividing investment by the contract fee or by total running cost instead of by saving","Forgetting the workshop running cost when computing the saving","Picking buy because it has the higher annual saving","Saying both pass, so either is fine","Stopping at cost and not discussing risk or quality"],"inspiredBy":{"title":"Bus maintenance","url":"https://www.preplounge.com/en/management-consulting-cases/candidate-led/beginner/bus-maintenance-21","author":"PrepLounge","skills":"Insource vs keep outsourcing a poor-quality service, annual cost comparison, two insourcing options with payback against a hurdle, incremental payback of the dearer option, qualitative risks."},"glossary":[{"term":"Insourcing","meaning":"Doing a job with your own staff instead of paying an outside company."},{"term":"Payback","meaning":"How many years of saving it takes to earn back the money spent up front."},{"term":"Hurdle","meaning":"The minimum test a project must pass for the board to approve it, here payback in three years or less."},{"term":"Incremental payback","meaning":"The payback of only the extra money spent on the dearer option, using only the extra saving it gives."},{"term":"Fit-out","meaning":"Work to make an empty building ready for use, such as walls, power and benches."},{"term":"Downtime","meaning":"Time a machine is broken and cannot be used, so scans are lost."}]},{"id":"warehouse-capacity-capex","title":"Laem Chabang Contract Logistics: full warehouse","client":"Laem Chabang Contract Logistics Co., a Thai third-party logistics provider with one 20,000-pallet warehouse near the port, serving four customer groups","country":"Thailand","type":"operations","difficulty":"Intermediate","format":"Interviewer-led","minutes":45,"summary":"A full warehouse is hurting service. Decide between an extension and dropping a low-value activity, and show the numbers.","prompt":"Our client is Laem Chabang Contract Logistics, a Thai third-party logistics company. Its main warehouse has 20,000 pallet positions and is 98% full. Service is slipping: late shipments and errors are up, and two customers have complained. The managing director has a proposal on his desk for an
